		#LOC_OPM_Planets_Eeloo_description = Plock과 같은 시기에 발견되었으나, 천문학적 발견을 목록화하던 고지식한 담당자들이 두 천체의 기록을 뒤섞는 바람에 수년 동안 서로 혼동되었습니다. 일루의 표면은 갈색 긁힌 자국으로 덮여 있는데, 이는 빙화산 활동의 결과일 수 있습니다. 이는 이 위성이 얼어붙은 지각 아래에 액체 바다를 품고 있을지도 모른다는 뜻입니다.
		#LOC_OPM_Planets_Hale_description = Sarnus의 고리 속을 공전하는 이 작은 소위성은 은하를 확실한 파멸로부터 구해 낸 커벌 신화 속 여성 양치기 Hale의 이름을 따서 명명되었습니다. Sarnus의 고리 안에 자리한 덕분에 커볼계에서 손꼽히는 절경을 감상할 수 있습니다.
		#LOC_OPM_Planets_Karen_description = Karen은 Plock의 위성이지만, 동시에 어떤 면에서는 위성이 아니기도 합니다. 두 천체의 상대적인 질량 때문에, 이 둘은 태양계의 다른 어떤 두 천체와도 다른 방식으로 서로의 주위를 맴돌며 춤을 춥니다.
		#LOC_OPM_Planets_Neidon_description = 커빈에서 멀리 떨어져 있기 때문에, 커벌들은 비교적 최근에야 커볼계에서 가장 먼 행성을 발견했습니다. 처음에 과학자들은 Neidon이 이브처럼 보라색 암석 행성일 것이라 생각했지만, 곧 자신들이 실제로는 Urlum과 비슷한 얼음 거대 행성을 보고 있다는 사실을 깨달았습니다.
		#LOC_OPM_Planets_Nissee_description = Neidon 주위를 경사가 크고 이심률이 높은 궤도로 도는 작은 위성입니다. 표면이 묘하게도 대리석과 닮았습니다. 그 덕분에 커빈의 모든 조각가들이 선망하는 대상이 되었습니다.
		#LOC_OPM_Planets_Ovok_description = Ovok 특유의 매끈한 달걀 모양은 Sarnus의 조석력과 Ovok 자체의 중력 때문에 생겨났습니다. 이 때문에 과학자들은 이 위성이 쉽게 수축하고 팽창하는 푹신한 얼음으로 이루어져 있어 깊은 충돌 크레이터가 없는 지형이 형성되었을 것이라고 믿게 되었습니다. 이 위성의 이름은 부드러운 털과 면도날 같은 발톱으로 유명한 신화 속 짐승 Ovok에서 따왔습니다.
		#LOC_OPM_Planets_Plock_description = Plock을 제대로 된 행성으로 볼지, 아니면 그저 태양 주위를 도는 얼음 덩어리로 볼지를 두고 상당한 논란이 있었습니다. 이 문제를 다루기 위해 열린 학술 회의 대부분이 좋은 날에는 유치한 욕설 공방으로, 나쁜 날에는 전면적인 난투극으로 번지는 바람에 논쟁은 아직도 계속되고 있습니다.
		#LOC_OPM_Planets_Polta_description = Polta의 민트색 외관을 본 천문학자들은 곧바로 민무스를 떠올렸지만, 민무스는 여전히 커빈 궤도에 있었으므로 이것은 다른 천체일 수밖에 없다는 사실을 금세 깨달았습니다. Polta의 표면은 매끄럽게 소용돌이치는 지형으로 이루어져 있는데, 이는 가까운 Urlum이 일으키는 조석 가열의 결과일 가능성이 높습니다.
		#LOC_OPM_Planets_Priax_description = Priax는 더 큰 사촌인 Polta와 궤도를 공유하는 공궤도 배치를 이룹니다. 이 기묘한 궤도는 Priax가 더 큰 Polta의 칭동점에 위치하기 때문에 안정적으로 유지됩니다. Priax는 크레이터로 뒤덮인 표면이 특징인데, 그 모습이 마치 치즈 덩어리 같습니다. 표면을 먹을 수 있는지는 아직 확인되지 않았습니다.
		#LOC_OPM_Planets_Sarnus_description = 초기 천문학자들은 Sarnus가 사실 서로 가깝게 공전하는 여러 개의 행성이라고 믿었습니다. 망원경을 닦고 나서야 그 추가 행성들이 실은 Sarnus 주위를 도는 얇은 고리였다는 사실을 깨달았습니다. 그 이후로 망원경 렌즈를 정기적으로 닦는 것이 의무화되었습니다.
		#LOC_OPM_Planets_Slate_description = 증거에 따르면 Slate에는 불과 수백만 년 전까지만 해도 대기가 있었으나, 알 수 없는 대재앙으로 대기가 벗겨져 메마른 껍데기만 남았습니다. 발견 이후 노란색과 갈색이 어우러진 이 천체는 저명한 Vincent Van Kerman을 비롯한 수많은 화가들에게 영감을 주었습니다.
		#LOC_OPM_Planets_Tal_description = Tal은 천문학자들이 아위성이라고 부르는 천체입니다. 일반적으로 이러한 위성의 위성은 중력권이 너무 작아 존재할 수 없지만, Wal이 얼음 거대 행성 Urlum으로부터 멀리 떨어진 궤도를 돌고 있는 덕분에 Tal은 안정적인 궤도를 유지할 수 있었습니다. Tal의 반사율을 보면 금속이나 얼음, 또는 둘 다로 이루어져 있는 것으로 보입니다.
		#LOC_OPM_Planets_Tekto_description = 이 위성은 크기에 비해 매우 밀도 높은 대기를 가지고 있습니다. 낮은 중력과 맞물려, 팔에 날개를 단 커벌이라면 자신의 힘만으로 위성 표면에서 날아오를 수 있을 정도입니다. 다만 Tekto의 대기는 매우 거센 것으로 보이므로, 그 날개는 꽤 튼튼한 재료로 만들어야 할 것입니다.
		#LOC_OPM_Planets_Thatmo_description = 이 얼음 위성에는 공기역학적 비행이 겨우 가능할 만큼 매우 희박한 대기가 있는 것으로 밝혀졌습니다. 그 이후로 이곳은 모든 무모한 비행사들의 버킷 리스트 1순위 목적지가 되었습니다. 아, 그리고 이 위성은 다른 모든 위성과 반대 방향으로 행성 주위를 돕니다. 참으로 기묘한 위성입니다.
		#LOC_OPM_Planets_Urlum_description = 커벌 천문학자들이 Urlum이 멀리 있는 항성이 아니라 또 하나의 행성이라는 사실을 깨닫기까지는 꽤 오랜 시간이 걸렸습니다. 그 이후로 과학자들은 또다시 틀릴까 봐 Urlum에 대한 주장을 하는 데 몹시 신중해졌습니다. 이 얼음 거대 행성은 다른 행성들의 반시계 방향 자전과 달리 시계 방향으로 자전한다는 점에서 특이합니다.
