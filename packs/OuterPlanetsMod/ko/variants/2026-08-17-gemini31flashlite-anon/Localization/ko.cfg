		#LOC_OPM_Planets_Eeloo_description = Plock과 동시에 발견된 Eeloo는 천문학적 발견을 기록하던 담당자들이 두 천체의 기록을 혼동하는 바람에 수년간 서로 다른 천체로 오인되었습니다. Eeloo의 표면은 갈색 흠집으로 덮여 있는데, 이는 극저온 화산 활동의 결과일 수 있습니다. 이는 이 위성이 얼어붙은 지각 아래에 액체 상태의 바다를 품고 있을 가능성을 시사합니다.
		#LOC_OPM_Planets_Hale_description = Sarnus의 고리를 공전하는 이 작은 위성은 커벌 신화에서 은하계를 확실한 멸망으로부터 구한 여성 양치기 Hale의 이름을 따서 명명되었습니다. Sarnus의 고리 속에 위치한 덕분에 커볼 시스템에서 가장 아름다운 경치를 자랑하는 곳 중 하나입니다.
		#LOC_OPM_Planets_Karen_description = Karen은 Plock의 위성이지만, 동시에 위성이라고 하기도 애매합니다. 두 천체의 상대적인 질량 때문에, 이 둘은 태양계의 다른 어떤 천체들과도 비교할 수 없는 방식으로 서로의 주위를 춤추듯 공전합니다.
		#LOC_OPM_Planets_Neidon_description = 커빈에서 너무 멀리 떨어져 있었기에, 커벌 인류가 커볼 시스템의 가장 먼 행성을 발견한 것은 비교적 최근의 일입니다. 처음에 과학자들은 Neidon이 Eve와 같은 보라색 암석 행성일 것이라 생각했지만, 곧 그들이 Urlum과 유사한 얼음 거대 행성을 보고 있다는 사실을 깨달았습니다.
		#LOC_OPM_Planets_Nissee_description = Neidon 주위를 높은 경사각과 이심률을 가진 궤도로 공전하는 작은 위성입니다. 표면이 기이하게도 대리석과 비슷하게 생겼습니다. 그 결과 커빈의 모든 조각가들이 탐내는 대상이 되었습니다.
		#LOC_OPM_Planets_Ovok_description = Ovok의 특징인 매끄러운 달걀 모양은 Sarnus와 Ovok의 중력이 가하는 기조력 때문입니다. 이로 인해 과학자들은 이 위성이 쉽게 수축하고 팽창하는 얼음 솜 같은 물질로 구성되어 있어 깊은 충돌구가 없는 지형을 형성한다고 믿게 되었습니다. 이 위성은 부드러운 털과 면도날 같은 발톱으로 유명한 신화 속 짐승 Ovok의 이름을 따서 명명되었습니다.
		#LOC_OPM_Planets_Plock_description = Plock을 정식 행성으로 볼 것인지, 아니면 태양 주위를 도는 얼음 덩어리에 불과한 것인지에 대해서는 상당한 논란이 있었습니다. 이 문제를 해결하기 위해 열린 대부분의 학술 회의가 좋은 날에는 유치한 비난전으로, 나쁜 날에는 전면적인 난투극으로 변질되면서 논쟁은 여전히 진행 중입니다.
		#LOC_OPM_Planets_Polta_description = Polta의 민트색 외관은 천문학자들에게 즉시 민무스를 떠올리게 했지만, 민무스는 여전히 커빈의 궤도를 돌고 있었기에 이것은 다른 천체임이 곧 밝혀졌습니다. Polta의 표면은 매끄럽고 소용돌이치는 지형으로 이루어져 있는데, 이는 아마도 근처의 Urlum에 의한 기조 가열의 결과일 것입니다.
		#LOC_OPM_Planets_Priax_description = Priax는 더 큰 사촌 격인 Polta와 궤도를 공유하며 공궤도 구성을 이루고 있습니다. 이 기이한 궤도가 안정적인 이유는 Priax가 더 큰 Polta의 라그랑주 점에 위치하기 때문입니다. Priax는 또한 표면에 충돌구가 많아 마치 치즈 덩어리처럼 보이는 것이 특징입니다. 표면을 먹을 수 있는지는 아직 확인되지 않았습니다.
		#LOC_OPM_Planets_Sarnus_description = 초기 천문학자들은 Sarnus가 사실은 여러 행성이 서로 가깝게 공전하는 것이라고 믿었습니다. 망원경을 닦고 나서야 그 추가적인 행성들이 사실은 Sarnus 주위를 도는 얇은 고리라는 것을 깨달았습니다. 그 이후로 망원경 렌즈를 정기적으로 닦는 것이 의무화되었습니다.
		#LOC_OPM_Planets_Slate_description = 증거에 따르면 Slate는 불과 수백만 년 전까지만 해도 대기를 가지고 있었으나, 알 수 없는 대격변으로 인해 대기가 사라지고 건조한 껍데기만 남게 되었습니다. 발견 이후 노란색과 갈색의 색채는 저명한 Vincent Van Kerman을 포함한 많은 화가들에게 영감을 주었습니다.
		#LOC_OPM_Planets_Tal_description = Tal은 천문학자들이 위성의 위성이라고 부르는 천체입니다. 일반적으로 위성의 위성은 영향권이 너무 작아 존재하기 불가능하지만, 얼음 거대 행성 Urlum으로부터 멀리 떨어진 Wal의 궤도 덕분에 Tal은 안정적인 궤도를 유지할 수 있었습니다. Tal의 알베도는 이 위성이 금속, 얼음 또는 둘 다로 구성되어 있음을 나타냅니다.
		#LOC_OPM_Planets_Tekto_description = 이 위성은 크기에 비해 매우 밀도가 높은 대기를 가지고 있습니다. 낮은 중력과 결합하여, 팔에 날개를 단 커벌이라면 자신의 힘으로 위성 표면에서 이륙할 수 있을 정도입니다. 다만 Tekto의 대기가 매우 격렬해 보이므로 날개는 튼튼한 재질로 만들어야 할 것입니다.
		#LOC_OPM_Planets_Thatmo_description = 이 얼음 위성은 공기역학적 비행을 지원할 만큼 충분히 두꺼운 매우 얇은 대기를 가지고 있는 것으로 밝혀졌습니다. 그 이후로 모든 무모한 비행사들의 버킷 리스트 1순위가 되었습니다. 아, 그리고 이 위성은 다른 모든 위성과 반대 방향으로 행성 주위를 공전합니다. 참으로 기이한 위성입니다.
		#LOC_OPM_Planets_Urlum_description = 커벌 천문학자들이 Urlum이 멀리 떨어진 별이 아니라 사실은 또 다른 행성이라는 것을 깨닫는 데는 시간이 좀 걸렸습니다. 그 이후로 과학자들은 또다시 틀릴까 봐 Urlum에 대한 주장을 내놓기를 꺼려왔습니다. 이 얼음 거대 행성은 다른 행성들의 반시계 방향 자전과 달리 시계 방향으로 자전한다는 점에서 특이합니다.
