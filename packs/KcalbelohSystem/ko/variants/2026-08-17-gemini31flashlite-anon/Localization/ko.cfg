		#LOC_KS_SciDef_barometerScan_Dipuc_SrfLanded_CraterEast = "대기가 전혀 없는 작은 자연 위성인 Dipuc에서 도대체 왜 기압계 스캔을 실행하는 건가? Mortimer, 커보넛 센터에 연락하게. 이번 Dipuc 표면 탐사 임무 대원들이 돌아오면 정신 분석가가 필요할 걸세. 또 말도 안 되는 과학 실험 사례가 하나 추가됐군." -Gene
		#LOC_KS_SciDef_barometerScan_Dipuc_SrfLanded_CraterSouth = 지나치게 깐깐한 과학 실험 수행에 대해 사과드립니다만, 진공 상태에서 도대체 왜 기압계 스캔을 실행하는지 잠시 멈춰서 생각해 보신 적 있습니까? 우주선에 동료 대원들이 타고 있다면, 이 행동으로 인해 비웃음을 살 준비가 되어 있기를 바랍니다.
		#LOC_KS_SciDef_barometerScan_Dipuc_SrfLanded_CraterWest = "나는 무식한 자가 되었고, 지성을 파괴하는 자가 되었다. 모든 천재들은 내 앞에서 겁에 질려 발밑에 엎드린다!" Dipuc에서 기압계를 작동시키려 헛수고를 하던 한 이상한 커벌이 말했습니다. Gene은 자신의 짜증 때문에 임무 팀과의 무선 통신 연결을 간헐적으로 끊어버리고 싶어 했습니다. 하지만 그는 그렇게 할 수 없었습니다. 지속적인 상황 파악과 데이터 전송은 임무 목표 달성을 보장하고, 그가 현재 지휘를 맡고 있는 것과 같은 유인 임무의 경우 승무원의 안전을 보장하는 데 가장 중요했기 때문입니다.\n\n하지만 Gene은 그러한 지식으로도 전혀 위안을 얻지 못했습니다. 진공 상태에서 기압 측정을 시도한 커벌이 스스로 자연 선택의 희생양이 될 이유를 제공했다는 사실을 알고 있었기 때문입니다.
		#LOC_KS_SciDef_barometerScan_Dipuc_SrfLanded_DoubleCrater = "기압계 실험이 수행될 것으로 예상되는 환경과는 정반대인 곳에서 현장 기압계 실험을 시도함으로써, 귀하는 스스로를 전문적인 얼간이로 인증하였으며 이제 임무가 종료될 때까지 보호 관찰 대상이 됩니다. 형 집행에 저항하지 마십시오. 저항은 형량을 가중시키고 보호 관찰 기간을 연장할 뿐입니다. 추가적인 불복종 시 진공 노출을 통해 즉시 해고될 것입니다." -Mortimer\n\n커벌 우주센터 커보넛 콤플렉스는 귀하의 손실을 개의치 않을 것입니다. 결국 커보넛은 Kraken이 들끓는 우주를 성공적으로 횡단하기 위해 커벌 인류의 정점에 서 있어야 하기 때문입니다.\n\n귀하가 현재 임무의 유일한 승무원이라 하더라도 임무 관제소 역시 귀하의 손실을 개의치 않을 것입니다.
		#LOC_KS_SciDef_barometerScan_Dipuc_SrfLanded_Highlands = 추가 과학 점수를 얻기 위해 특별히 이 작업을 수행하는 것이라면 계속하십시오. 하지만 진공 환경에서 대기에 의존하는 과학 실험을 수행하는 논리적 모순에 대해 유념해 주시기 바랍니다.
		#LOC_KS_SciDef_barometerScan_Dipuc_SrfLanded_Lowlands = 도대체 왜 하필이면 진공 상태인 행성에서 기압계 스캔을 수행하셨는지 여쭤봐도 되겠습니까? 진공 환경에 노출되어 이미 수리 불가능하고 작동하지 않는 상태가 되지 않았더라도, 논리적으로 볼 때 데이터를 수집하려는 시도 자체가 기기를 고장 낼 것이 분명합니다.\n\n\n<color=#000000>[Kerbalism 같은 모드에서 비슷한 메커니즘을 구현할 수 있을지 궁금하군요...]</color>
		#LOC_KS_SciDef_barometerScan_Dipuc_SrfLanded_Midlands = 당신이 커벌치고는 멍청하거나, 아니면 모든 곳에 착륙 가능한 단일 스테이지(SSTO)나 다목적 착륙선에서 실험을 수행 중이겠군요. 후자라면 계속 진행하여 노력을 보상받으십시오. 물론 중력 이상 웜홀을 통해 Kcalbeloh 시스템에 도착했다는 가정하에, 그 보상은 그리 크지 않을 것입니다.
