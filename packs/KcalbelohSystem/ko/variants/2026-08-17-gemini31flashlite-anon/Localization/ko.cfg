		#LOC_KS_Maelg_description = Maelg는 Kcalbeloh 시스템에서 질량이 가장 작고 가장 차가운 항성이며, 그 결과 다른 항성보다 빛을 훨씬 적게 방출합니다. L형 갈색 왜성으로 분류됩니다.
		#LOC_KS_Mehtna_description = Mehtna는 Maelg에 조석 고정된 매우 추운 행성입니다. 행성 표면 대부분은 두꺼운 얼음층으로 덮여 있으나, 항성 직하점 근처 지역은 '따뜻한 극지'라고 불립니다. 행성의 낮은 대기압 때문에 식수는 실온보다 훨씬 낮은 온도에서 끓으며, 결과적으로 식수는 주로 얼음이나 수증기 형태로 존재합니다.
		#LOC_KS_Meiuqer_description = Meiuqer는 궤도 이심률이 매우 큰 작은 행성입니다. 표면 온도는 Maelg와의 거리에 따라 크게 변동합니다.
		#LOC_KS_Noi_description = Noi는 Sunorc와 Simeht-Simetra 시스템 사이의 L4 라그랑주 점 주위를 공전하는 트로이 소행성으로, 이중 행성계의 질량 중심보다 궤도상 60° 앞서 존재합니다.
		#LOC_KS_Noira_description = Noira는 Simetra-Simeht 이중 행성계의 질량 중심에 가장 가까운 궤도를 도는 위성이며, Kcalbeloh 시스템에서 역행 궤도를 도는 유일한 천체입니다. 표면에는 거대한 분화구가 있어 과거에 비교적 큰 천체와 크게 충돌했음을 시사합니다.
		#LOC_KS_Norihc_description = Norihc는 이중 가스 거대 행성의 질량 중심을 공전하는 매우 추운 위성입니다. 얼음으로 덮인 외관에도 불구하고 지질학적으로 활동적이며, 두꺼운 얼음층에 수많은 깊은 균열이 있습니다.
		#LOC_KS_Noyreg_description = Noyreg는 매우 밀도가 높은 대기를 가진 암석 위성으로, 두꺼운 구름층 아래로 표면이 가려져 있습니다. 대기는 매혹적인 녹색을 띠지만, 공기 중에 부식성과 독성 성분이 고농도로 포함되어 있어 이 위성에 착륙하는 것은 매우 위험합니다.
		#LOC_KS_Onrefni_description = 왜행성인 Onrefni는 Kcalbeloh에 매우 가까운 궤도를 돌고 있으며, 강력한 조석력으로 인해 표면이 찢겨 나갔습니다.
		#LOC_KS_Rouqea_description = Rouqea는 완전히 식수로 덮인 매혹적인 해양 행성입니다. Laythe와 달리 그 바다는 독특하고 구별되며, 엄청난 압력으로 인해 이국적인 얼음으로 이루어진 맨틀을 생성할 수 있을 만큼 깊습니다. 신비롭고 매혹적인 심해는 계속해서 연구자와 과학자들의 관심을 사로잡고 있습니다.
		#LOC_KS_SciDef_Anneheg_surfaceSample_SrfLanded = Anneheg의 표면은 화산 유리와 열에 강한 무거운 금속이 섞여 있는 것으로 보입니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Ahtpan_FlyingHigh = 상층 대기를 분석한 결과 탄화수소 증기가 낮은 농도로 검출되었습니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Ahtpan_FlyingLow = 하층 대기를 분석한 결과 탄화수소 증기가 낮은 농도로 검출되었습니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Ahtpan_FlyingLow_NaphthanOceans = 대기 분석기의 측정값은 높은 농도의 탄화수소 증기를 나타내는데, 이는 아마도 우리 아래에 말 그대로 기름 바다가 있기 때문일 것입니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Ahtpan_SrfLanded = 대기 분석기는 적당한 농도의 탄화수소 증기를 읽어 들였는데, 이것이 아마도 이곳에서 좀약 냄새가 나는 이유일 것입니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Ahtpan_SrfLanded_Coast = 대기 분석기는 대기 중 높은 농도의 탄화수소 증기를 읽어 들였는데, 이는 아마도 바로 옆에 말 그대로 탄화수소 바다가 있기 때문일 것입니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Ahtpan_SrfLanded_Islands = 대기 분석기는 대기 중 높은 농도의 탄화수소 증기를 읽어 들였는데, 이는 아마도 바로 옆에 말 그대로 탄화수소 바다가 있기 때문일 것입니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Anehta_FlyingHigh = 예상되는 수소와 헬륨 외에도 이곳에는 수증기가 매우 풍부합니다. 이로 인해 Anehta는 Sudarskerb 시스템 분류상 II등급 가스 거대 행성이 됩니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Anehta_FlyingLow = 대기가 두꺼워짐에 따라 하층 구름층에서는 수증기가 덜 흔해졌습니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Arorua_FlyingHigh = Aralc-B에서 쏟아지는 하전 입자의 지속적인 흐름으로 인해 대기 분석기가 엉뚱한 측정값을 내뱉습니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Arorua_FlyingLow = 대기 분석기는 하층 대기에서 더 정확한 측정을 수행할 수 있습니다. 대기는 두껍고 이국적인 화합물로 구성되어 있는데, 이는 아마도 쌍둥이 태양에 의해 끊임없이 구워진 결과일 것입니다.
