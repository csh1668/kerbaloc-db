		#LOC_KS_SciDef_dmSoilMoisture_Dipuc_InSpaceLow = 극지방에서 미약한 마이크로파 방출이 감지되지만, 다른 곳에서는 감지되지 않습니다. 예상대로 Dipuc은 매우 건조합니다.
		#LOC_KS_SciDef_dmSoilMoisture_EfilHome_InSpaceLow = 마이크로파 방출을 통해 Efil의 표면이 사실상 식수로 흠뻑 젖어 있다는 사실이 더욱 분명해졌습니다. 이는 이미 알려진 사실이지만, 장비를 보정하는 데 유용하며 과거 Laythe가 얼마나 거짓된 낙원이었는지 상기시켜 줍니다.
