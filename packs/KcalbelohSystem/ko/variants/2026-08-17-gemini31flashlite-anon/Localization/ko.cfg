		#LOC_KS_Ahtpan_description = Ahtpan은 주로 나프타로 구성된 바다가 있는 암석 사막 행성입니다. 행성 표면에 석유화학 공장을 건설하는 것이 좋은 생각처럼 보일 수 있지만, 커벌 우주 센터(KSC)는 모든 커벌 우주비행사들에게 행성을 탐사하는 동안 헬멧을 착용할 것을 권고합니다. 행성의 대기에서 나프탈렌 냄새가 강하게 나기 때문입니다!
		#LOC_KS_Anehta_description = Anehta는 멋진 행성 고리 시스템을 자랑하는 가스 거대 행성입니다. 이 행성은 밝은 색의 구역과 어두운 색의 띠로 나뉘어 끊임없이 구름으로 덮여 있는 것이 특징입니다. 이러한 구역과 띠의 상충하는 순환 패턴으로 인해 행성에는 격렬한 폭풍과 난기류가 발생합니다.
		#LOC_KS_Anneheg_description = Anneheg는 Aralc-A 주위를 밀접하게 공전하는 어둡고 석탄 같은 외관의 행성입니다. 항성에 근접해 있어 강렬한 열과 빛으로 인해 표면 대부분이 녹아 용암 강과 바다가 형성되었으며, 증발한 금속 폭풍이 자주 발생합니다. 거주하기 힘든 환경 때문에 Anneheg는 지금까지 발견된 가장 지옥 같은 행성 중 하나로 여겨집니다.
		#LOC_KS_AralcA_description = Aralc-A는 Kcalbeloh 시스템의 쌍성계 중 첫 번째 항성이며, 시스템에서 가장 밝고 질량이 큰 항성으로 간주됩니다. 높은 온도와 청백색은 이 항성이 A형 주계열성임을 시사합니다.
		#LOC_KS_AralcB_description = 쌍성계의 두 번째 항성인 Aralc-B는 적색 왜성으로도 알려진 M형 주계열성으로 분류되는 작고 질량이 낮은 항성입니다.
		#LOC_KS_AralcSystem_description = 이곳은 쌍성계의 질량 중심입니다.
		#LOC_KS_Arorua_description = Arorua는 Aralc-B에 의해 조석 고정된 거대한 암석 행성입니다. Aralc-B에서 방출되는 강한 태양풍의 결과로, Aralc-B를 향한 반구 전체에서 오로라를 관측할 수 있습니다. 동시에 대기는 적색 왜성에서 불어오는 태양풍에 의해 점차 날아가고 있습니다.
