		#LOC_KS_SciDef_dmSoilMoisture_AralcA_InSpaceLow = 안테나가 이 별보다 식수와 훨씬 더 비슷해지기 시작했습니다.
		#LOC_KS_SciDef_dmSoilMoisture_AralcB_InSpaceLow = 장치가 열을 견디지 못하고 화학적 구성을 이루는 고급 폴리머가 분해되기 시작했습니다. 다시 말해, 우주 식수 탐지기가 고장 났습니다.
