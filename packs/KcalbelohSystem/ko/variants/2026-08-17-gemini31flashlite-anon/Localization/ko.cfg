		#LOC_KS_Dipuc_description = Dipuc은 Sera의 유일한 위성으로, 표면에는 거대한 분화구들이 가득합니다. 이는 Sera에 충돌했을지도 모를 수많은 치명적인 운석들을 대신 흡수했음을 보여줍니다. 또한 이 위성은 지질학적으로 활발하여 표면에 다수의 활성 화산이 존재하며, Sera 근처에서도 육안으로 식별 가능한 거대한 산들이 솟아 있습니다.
		#LOC_KS_Efil_description = 멀리서 바라본 Efil은 Anehta 근처에 자리 잡은 사파이어처럼 보입니다. 매력적인 대기와 아름다운 해변은 이곳을 이상적인 휴양지로 보이게 합니다. 어쩌면 미래에 커벌 우주 센터(KSC)가 이곳에 리조트를 건설할지도 모릅니다. 하지만 이 먼 행성까지 방문할 티켓값을 감당할 수 있는 사람이 누가 있을지는 의문입니다.
		#LOC_KS_Elad_description = Elad는 Anehta의 가장 큰 위성이자 가장 먼저 발견된 위성입니다. 과거에는 대기가 존재했고 표면에 액체 상태의 식수가 있었을 것으로 추정되지만, 왜 시간이 지나면서 이러한 특징들을 잃게 되었는지는 여전히 미스터리로 남아 있습니다.
		#LOC_KS_Enots_description = Enots는 Anehta의 고리 시스템 내부에 박혀 있는 작은 소행성 위성이며, Anehta의 위성 중 가장 작은 것으로 알려져 있습니다.
		#LOC_KS_Eulb_description = Eulb는... 푸른 위성입니다.
		#LOC_KS_Iomena_description = Iomena는 거대한 분화구와 바다가 특징인 암석 행성입니다. 과학적 연구에 따르면 대기와 바다에 고농도의 암모니아가 존재하여 생명체가 존재할 가능성은 극히 희박합니다. 그럼에도 불구하고 과학자들은 이러한 극한 환경에서 생명체를 발견할 가능성을 포기하지 않고 있습니다.
		#LOC_KS_Kcalbeloh_description = Kcalbeloh는 초대질량 블랙홀이며 Kcalbeloh 시스템의 중심입니다. 제트나 초고온의 푸른 강착 원반이 없는 것으로 보아, 수백만 년 동안 별을 집어삼키지 않은 것으로 보입니다.
