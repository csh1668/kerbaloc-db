		#LOC_KS_SciDef_dmseismicHammer_Elad_SrfLanded = Elad 내부 깊은 곳에서 반사되는 지진파는 핵이 여전히 완전히 용융된 상태이며 맨틀이 매우 활동적임을 확인시켜 줍니다.
		#LOC_KS_SciDef_dmseismicHammer_Elad_SrfLandedCraterGiant = 이 거대한 충돌구에 대한 지진 스캔은 밀도가 높은 중금속이 대량으로 매장되어 있음을 명확히 보여줍니다. 이는 이 충돌구를 만든 소행성이 아마도 금속성이었으며, 두꺼운 대기조차 뚫고 들어올 만큼 거대했음을 나타냅니다.
