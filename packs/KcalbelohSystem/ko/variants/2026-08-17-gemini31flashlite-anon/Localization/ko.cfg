		#LOC_KS_SciDef_temperatureScan_WH3141B_InSpaceHigh = 우주선 바로 옆에 시공간을 뒤흔드는 이상 현상이 있음에도 불구하고, 온도계는 아무런 이상 징후도 감지하지 못한 것으로 보입니다.
		#LOC_KS_SciDef_temperatureScan_WH3141B_InSpaceLow = 우주선 바로 옆에 시공간을 뒤흔드는 이상 현상이 있음에도 불구하고, 온도계는 아무런 이상 징후도 감지하지 못한 것으로 보입니다.
		#LOC_KS_Sedah_description = Sedah는 Sunorc에 매우 가깝게 궤도를 도는 뜨거운 가스 거인입니다. 대기 온도가 높아 약간의 빛을 냅니다. Jool과 크기는 비슷하지만 질량은 Jool의 7분의 1 정도에 불과하여, 밀도가 낮고 더 '푹신한' 대기를 가지고 있습니다.
		#LOC_KS_Sera_description = Sera는 눈에 띄는 고리 시스템과 여러 개의 큰 호수가 있는 황량한 암석 행성입니다. 안타깝게도 호수는 독성이 있으며, Sera에 생명체가 존재한다는 증거는 발견되지 않았습니다.
		#LOC_KS_SimeSystem_description = 이곳은 이중 가스 거인 시스템의 질량 중심입니다.
		#LOC_KS_Simeht_description = 이중 가스 거인 시스템에서 더 작은 행성인 Simeht는 얼음 거인으로도 분류됩니다. 하지만 Simetra와 달리 구름 띠와 폭풍을 가시광선으로 관측하기는 어렵습니다.
		#LOC_KS_Simetra_description = Simetra는 Simetra-Simeht 이중 가스 거인 시스템에서 더 큰 얼음 거인입니다. 푸른색을 띠는 것은 가장 바깥쪽 영역에서 발견되는 메탄 흔적 때문이며, 행성의 다른 영역은 알려지지 않은 화합물로 인해 녹색과 노란색을 띠는 것으로 추정됩니다.
		#LOC_KS_Suluco_description = Suluco는 Sunorc에 조석 고정된 커빈과 유사한 행성으로, 행성의 한쪽 면은 항상 항성을 향하고 반대쪽 면은 영원한 어둠 속에 있습니다. 이 행성은 두 반구 사이의 극명한 대비를 보이는 이분화된 세계입니다. 한쪽은 끝없는 낮이 이어지고 다른 쪽은 영원한 밤에 덮여 있습니다. 두 반구 사이의 경계는 영원한 황혼의 좁은 고리이며, 이 행성에서 생명체가 살 수 있는 유일한 지역입니다.
		#LOC_KS_Sunorc_description = Sunorc는 오렌지색 왜성으로도 알려진 K형 주계열성입니다. Kerbol보다 작고 온도가 낮아 외계 생명체 탐사에서 특히 주목받고 있습니다. Sunorc는 수명이 길고 방출하는 자외선이 적어 시스템 내에 거주 가능한 행성이 존재할 가능성이 높습니다.
		#LOC_KS_Tot_description = Suluco 주위를 도는 소행성 위성입니다.
		#LOC_KS_Uleg_description = Uleg은 Kcalbeloh에서 멀리 떨어진 궤도를 도는 매우 추운 행성입니다. 표면은 대부분 얼음으로 덮여 있습니다. 궤도 경사각이 크고 이심률이 높은 것으로 보아 Kcalbeloh에 포획되었을 가능성이 큽니다.
		#LOC_KS_WH_description = 웜홀은 Kerbol 시스템과 Kcalbeloh 시스템을 연결하는 기묘한 시공간 왜곡 현상입니다. 웜홀을 통과하려면 우주선의 근점을 30 km 미만으로 낮추어야 하며, 웜홀 중심부에 너무 가까이 가지 않도록 주의해야 합니다.
		#LOC_KS_WormholeEntry = <color=#ff0000>[경고: 강력한 시공간 왜곡으로 인해 우주선 제어 불능!]
