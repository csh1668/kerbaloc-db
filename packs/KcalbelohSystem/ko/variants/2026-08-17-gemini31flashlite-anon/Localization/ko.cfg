		#LOC_KS_SciDef_atmosphereAnalysis_Noyreg_FlyingLow = 분석 결과 Noyreg의 이산화탄소 대기는 이 고도에서 상당히 두꺼워지며, 이산화염소와 같은 더 무거운 가스들이 발견되는 곳이기도 합니다.
