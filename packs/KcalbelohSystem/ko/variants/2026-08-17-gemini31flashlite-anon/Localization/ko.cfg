		#LOC_KS_SciDef_crewReport_WH3141B_InSpaceLow2 = 이상 현상 너머로 Kerbol로 보이는 점을 볼 수 있는 것 같지만, 확신할 수는 없습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Ahtpan_InSpaceHigh = Ahtpan의 대기는 대부분 이산화탄소로 이루어져 있지만, 많은 지역에 매우 높은 농도의 탄화수소 증기도 존재합니다.
		#LOC_KS_SciDef_dmImagingPlatform_Ahtpan_InSpaceLow = 분광 분석 결과는 명확합니다. 저것은 나프타의 바다입니다. 귀중한 '폭발물'의 바다가 ISRU를 위해서든 이익을 위해서든 착취당하기를 기다리고 있습니다!
		#LOC_KS_SciDef_dmImagingPlatform_Anehta_InSpaceHigh = Anehta에 대한 스캔 결과, Sudarskerb 분류 체계에 따라 II등급 가스 거대 행성으로 나타났습니다. 밝은 청백색의 상층 구름층은 가시광선을 많이 반사하며, 강한 자외선 흡수 현상으로 보아 식수 증기로 이루어져 있음을 알 수 있습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Anehta_InSpaceLow = Anehta의 상층 구름에 대한 종합적인 스캔 결과, 주로 수소, 헬륨, 식수 증기로 구성되어 있음이 확인되었습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Anneheg_InSpaceHigh = 행성의 극도로 낮은 알베도에도 불구하고, 표면에 쏟아지는 사실상의 죽음의 광선으로 인해 Anneheg의 절대 복사 조도는 여전히 높습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Anneheg_InSpaceLow = Anneheg 표면 스캔 결과, 금속 함량이 매우 높은 화산 유리로 확인되었습니다. 이 행성은 한때 훨씬 더 컸던 행성의 핵을 덮고 있는 얇은 지각일 가능성이 높습니다.
		#LOC_KS_SciDef_dmImagingPlatform_AralcA_InSpace = 이미징 플랫폼이 정밀 기기 노출을 완전히 거부합니다. 이런 종류의 작업을 수행하려면 더 전문화된 도구가 필요합니다.
		#LOC_KS_SciDef_dmImagingPlatform_AralcB_InSpace = 이미징 플랫폼이 Aralc-B에서 나오는 빛을 감지하자마자 스스로 종료됩니다. 적색 왜성조차도 이 장비가 연구하기에는 너무 밝습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Arorua_InSpaceHigh = Arorua 대기에 대한 분광 분석 결과, 주로 이산화탄소로 구성되어 있으며 다른 성분은 거의 없는 것으로 밝혀졌습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Arorua_InSpaceLow = Arorua 표면에 대한 적외선 스캔 결과, 쌍둥이 태양에 의해 행성이 가열되는 방식에 대한 복잡한 지도를 제공합니다.
		#LOC_KS_SciDef_dmImagingPlatform_Dipuc_InSpaceHigh = 열화상 촬영 결과 Dipuc 전역의 온도가 크게 변하며, 이는 화산 활동과 밀접한 관련이 있음을 보여줍니다.
		#LOC_KS_SciDef_dmImagingPlatform_Dipuc_InSpaceLow = 자외선 스캔 결과, 달 표면 낮게 떠 있는 유황이 풍부한 매우 얇은 대기가 확인되었으며, 이는 화산 활동으로 인해 활발히 생성되는 것으로 보입니다.
		#LOC_KS_SciDef_dmImagingPlatform_EfilHome_InSpaceLow = Efil의 매우 다양한 지질과 생물학적 특성은 복잡한 모습을 형성하며, 생명의 품에 안긴 달의 풍부한 역사를 보여줍니다. 솟아오른 산부터 완만한 평원, 울창한 정글부터 깊은 해구까지, Efil은 많은 것을 보여줍니다.
		#LOC_KS_SciDef_dmImagingPlatform_Efil_InSpaceHigh = Efil의 넓은 색채 태피스트리는 가시광선 영역을 넘어 확장되어 우리 과학자들이 연구할 수 있는 방대한 데이터의 캔버스를 채우고 있습니다. 확실한 것은 커빈과 마찬가지로 대기가 주로 질소와 산소로 구성되어 있다는 점이며, 이는 가시광선으로 촬영한 Efil의 이미지와 결합했을 때 생명체의 명확한 징후를 나타냅니다.
		#LOC_KS_SciDef_dmImagingPlatform_Efil_InSpaceLow = Efil의 매우 다양한 지질과 생물학적 특성은 복잡한 모습을 형성하며, 생명의 품에 안긴 달의 풍부한 역사를 보여줍니다. 솟아오른 산부터 완만한 평원, 울창한 정글부터 깊은 해구까지, Efil은 많은 것을 보여줍니다. 관광객들이 이곳을 정말 좋아할 겁니다! 여행 안내 책자에 넣어야겠군요.
		#LOC_KS_SciDef_dmImagingPlatform_Elad_InSpaceHigh = 열 방출을 통해 Elad 내부 가열 징후가 드러났으며, 이는 현재 지질 활동이 있음을 나타냅니다.
		#LOC_KS_SciDef_dmImagingPlatform_Elad_InSpaceLow = 분광 분석 결과, 표면은 규산염과 금속이 풍부하여 커빈과 유사한 구성을 가지고 있음이 확인되었습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Enots_InSpace = 다중 분광 분석 결과, Enots는 주로 어두운 규산염 광물로 이루어져 있음이 나타났습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Eulb_InSpaceHigh = Eulb 표면에는 매우 희박한 대기가 붙어 있습니다. 기압계로 감지하기에는 너무 얇습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Eulb_InSpaceLow = Eulb 표면에 대해 수행된 분광 스캔 결과, 달 표면 거의 모든 곳에서 강한 적외선 흡수가 나타났습니다. 이는 눈에 띄는 푸른색의 원인이 청색 강옥, 즉 사파이어임을 시사합니다.
		#LOC_KS_SciDef_dmImagingPlatform_Iomena_InSpaceHigh = Iomena의 얇은 대기에는 주로 암모니아가 포함되어 있으며, 메탄과 이산화탄소의 흔적도 감지되었습니다. 이러한 흔적은 생체 신호일 수 있으므로 추가 연구가 필요합니다!
		#LOC_KS_SciDef_dmImagingPlatform_Iomena_InSpaceLowGeneric = 다중 분광 분석으로 판단하건대, Iomena의 청회색 표면은 다양한 규산염 광물과 암모니아가 꽤 표준적으로 섞여 있는 것으로 보입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Iomena_InSpaceLowMountainsAll = 적외선 신호는 Iomena의 산을 덮고 있는 밝은 물질이 아마도 암모니아 얼음일 것임을 나타냅니다.
		#LOC_KS_SciDef_dmImagingPlatform_Iomena_InSpaceLowWater = 적외선 판독 결과에 따르면, 이 액체는 암모니아일 가능성이 높은 온도입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Kcalbeloh_InSpaceHigh = 다중 분광 분석 결과, 강착 원반의 양쪽 끝이 미세하게 적색 편이와 청색 편이를 보임이 확인되었습니다. 한편 원반의 구성 성분은 주로 수소와 헬륨으로 보이며, 이는 수백만 년 전 Kcalbeloh가 집어삼킨 최소 하나 이상의 별에서 나온 질량으로 구성되어 있음을 확인해 줍니다.
		#LOC_KS_SciDef_dmImagingPlatform_Kcalbeloh_InSpaceLow = 이론적으로는 센서가 이 거리에서 빛으로 인한 손상 없이 강착 원반을 분석할 수 있어야 하지만, 작용하는 강력한 힘에 의해 희망 없이 왜곡되어 분석이 불가능합니다.
		#LOC_KS_SciDef_dmImagingPlatform_Maelg_InSpace = Maelg에 대한 분광 분석은 이전의 L형 천체 분류를 뒷받침하며, 중수소와 리튬이 각각 헬륨-3과 헬륨-4로 융합되고 있다는 명확한 증거를 보여줍니다.
		#LOC_KS_SciDef_dmImagingPlatform_Mehtna_InSpaceHigh = 분광 분석 결과, Mehtna의 대기는 주로 이산화탄소와 식수 증기로 이루어져 있음이 밝혀졌습니다. 후자는 낮 쪽에서 승화하는 얼음에 의해 생성되었을 가능성이 높습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Mehtna_InSpaceLowDayGrandCrater = Mehtna의 더 어두운 표면에 대한 다중 분광 스캔 결과, 대부분 표준적인 규산염 표면임이 나타났습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Mehtna_InSpaceLowIce = 이 흰색 물질은 행성의 온도와 대기에 대한 이전 분석에서 예측한 대로 식수 얼음으로 보입니다. 낮은 기압으로 인해 식수가 기체로 직접 승화하기 때문에 액체 상태는 존재하지 않습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Mehtna_InSpaceLowNight = 적외선 스캔 결과, Mehtna의 "차가운 극" 지역은 황량한 표면을 보이며, 분화구로 덮여 있고 가시적인 면에서 보이는 균열은 거의 없습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Meiuqer_InSpace = 그냥 돌입니다! 돌인 거 압니다! 제가 돌을 보면 돌인 줄 모를 것 같습니까? 저는 돌 사진을 보면서 많은 시간을 보낸다고요!
		#LOC_KS_SciDef_dmImagingPlatform_Noi_InSpaceHigh = 열화상 촬영 결과 Noi가 실제로 얼마나 추운지 드러났습니다. 스캔 결과 탄소질로 나타났지만, Sunorc에서 이 정도 거리라면 쉽게 얼음으로 덮여 있을 수도 있었습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Noi_InSpaceLow = Noi 표면에 대한 정밀 스캔 결과, 탄소가 풍부한 암석과 더 많은 돌 성분의 규산염 물질이 감지되었습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Noira_InSpaceHigh = 높은 궤도에서 Noira를 분석한 결과, 분화구로 곰보가 되고 함몰 지대로 덮인 혼란스러운 표면이 나타났습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Noira_InSpaceLow = Noira의 레골리스는 문과 유사한 구성을 보이며, 규산염과 알루미늄 농도가 높습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Norihc_InSpaceHigh = Norihc의 대기는 주로 질소로 이루어져 있으며, 일산화탄소와 기타 가스가 미량 포함되어 있습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Norihc_InSpaceLow = 표면 분광 분석 결과, 대부분이 식수 얼음으로 이루어져 있으며 저지대에는 부분적으로 서리가 낀 톨린 화합물이 존재함이 확인되었습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Noyreg_InSpaceHigh = 분광 분석 결과 대기는 주로 이산화탄소로 구성되어 있으며, 나머지는 질소, 이산화염소 및 미량의 가스로 이루어져 있습니다. 초기 분석으로는 녹색을 띠는 원인이 명확하지 않습니다. 이산화염소 때문일 수도 있고, 전례 없는 종류의 산란 효과일 수도 있습니다. 추가 연구가 필요합니다.
		#LOC_KS_SciDef_dmImagingPlatform_Noyreg_InSpaceLow = 두꺼운 구름층 너머를 관찰한 결과, 탄소가 매우 풍부한 표면의 징후가 나타났습니다. Noyreg이 대부분 탄소로 이루어졌을 가능성이 있는데, 그렇다면 정말 보기 드문 발견이 될 것입니다!
		#LOC_KS_SciDef_dmImagingPlatform_Onrefni_dmImagingPlatform_Onrefni_InSpaceHigh = 열화상 촬영 결과, Onrefni는 조석 고정 상태임에도 불구하고 양쪽 면 모두 뜨겁게 달궈져 있습니다. 낮 쪽은 빛에 의해 크게 데워지는 것이 아닐 가능성이 높으며, Kcalbeloh의 중력이 그 역할을 하고 있습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Onrefni_dmImagingPlatform_Onrefni_InSpaceLow = 다중 분광 분석 결과 대기의 흔적은 없으며, 금속이 풍부한 규산염이 표면을 지배하고 있습니다. 아마도 그 표면은 밀도가 높은 금속 핵으로만 이루어진 행성 위의 얇은 층일 것입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Rouqea_InSpaceHigh = Rouqea 대기의 다중 분광 분석 결과 대부분이 질소로 확인되었지만, 산소도 상당히 많이 포함되어 있습니다. 흥미롭군요, Rouqea에 생명체가 있을까요?
		#LOC_KS_SciDef_dmImagingPlatform_Rouqea_InSpaceLow = 대부분의 스펙트럼으로 Rouqea의 표면을 조사해도 표면 아래는 잘 드러나지 않습니다. 식수가 상당히 깊은 것으로 보입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Rouqea_InSpaceLowHighlands = Rouqea 바다의 이 지역을 분석한 결과 놀라운 사실이 밝혀졌습니다. 일부 지역의 식수 깊이가 100m 정도로 얕은 곳이 있습니다!
		#LOC_KS_SciDef_dmImagingPlatform_Sedah_InSpaceHigh = Sedah는 열을 매우 강하게 방출하여, 일반적인 가스 행성보다 훨씬 많은 적외선을 내뿜습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Sedah_InSpaceLow = 대기 구성으로 보아 이 행성은 원래 크림색을 띠었을 가능성이 있지만, 극심한 열 때문에 탁한 붉은색으로 빛나고 있습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Sera_InSpaceHigh = Sera 고리에 대한 분광 분석 결과, 모행성처럼 금속성이 아닌 규산염 성분임을 나타냅니다. 이러한 차이에 대한 한 가지 가능한 설명은 이 고리를 형성한 천체가 포획된 소행성이라는 것입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Sera_InSpaceLow = 분광 스캔 결과 Sera의 표면에는 중금속, 특히 철, 알루미늄, 티타늄이 상당히 많이 포함되어 있습니다. 이는 분홍빛을 띠는 갈색을 설명하는 데 도움이 됩니다.
		#LOC_KS_SciDef_dmImagingPlatform_Sera_InSpaceLowLakes = 이 액체의 흡수 스펙트럼을 보면 이것이 다른 유체가 아닌 식수임이 분명합니다.
		#LOC_KS_SciDef_dmImagingPlatform_SimeSystem_InSpaceHigh = 두 천체에 대한 분광 분석 결과 두 대기 모두에서 많은 양의 메탄이 발견되었습니다. Simetra의 녹색 및 파란색 띠에 대한 설명은 여전히 찾기 어렵습니다...
		#LOC_KS_SciDef_dmImagingPlatform_Simeht_InSpace = Simeht의 수소-헬륨 대기에는 메탄도 많이 포함되어 있어 연한 청록색을 띠는 이유를 설명해 줍니다.
		#LOC_KS_SciDef_dmImagingPlatform_Simetra_InSpace = 상층 대기는 주로 메탄으로 구성된 것으로 보이며, 하층은 주로 수소, 헬륨, 메탄으로 구성되어 있고 황과 이산화염소가 미량 포함되어 있습니다. 이 이산화염소는 메탄과 결합하여 녹색 띠를 설명할 수 있을 것입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Suluco_InSpaceHigh = 자외선 및 적외선 스펙트럼으로 Suluco의 대기를 종합적으로 스캔한 결과, 예상대로 주로 질소와 산소로 구성되어 있음이 밝혀졌습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Suluco_InSpaceLowDay = Suluco의 낮 쪽은 Sunorc를 향해 빛을 바로 반사하며, 자외선과 적외선 스펙트럼 모두에서 많은 빛을 반사합니다.
		#LOC_KS_SciDef_dmImagingPlatform_Suluco_InSpaceLowDayPole = 항성 직하점은 단연코 가장 많은 햇빛을 반사하고 있으며, 이로 인해 적외선 수치에서 눈에 띄는 급증이 나타납니다.
		#LOC_KS_SciDef_dmImagingPlatform_Suluco_InSpaceLowNight = 적외선 촬영을 통해 Suluco의 밤 쪽을 더 명확하게 볼 수 있습니다. 재미있게도 지형은 낮 쪽과 대체로 비슷하며, 언덕과 산이 지배적입니다. 흥미로운 점은 Suluco의 밤 쪽도 분화구로 덮여 있다는 것입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Suluco_InSpaceLowTwilight = 분석 중 감지된 미량 가스는 황혼 지대에서 생물학적 활동이 진행 중임을 명확히 보여주지만, 낮이나 밤 쪽으로 더 들어갈수록 시간이 지남에 따라 사라집니다.
		#LOC_KS_SciDef_dmImagingPlatform_Suluco_InSpaceLowWater = 열화상 촬영을 통해 Suluco 바다의 수중 지형이 드러났습니다. 독특한 지리적 특성을 고려할 때, 이곳에서 연구할 것이 많을 것입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Sunorc_InSpaceHigh = 음, 좋지 않은 생각이었습니다. 민감한 장비들이 Sunorc를 향하자마자 자동으로 종료되었으며, 손상되었을 수도 있습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Sunorc_InSpaceLow = 보증이 무효화되었습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Tot_InSpace = 다중 분광 분석에 따르면 Tot은 주로 돌로 된 소행성인 것 같습니다. 자, 이제 다 끝난 건가요?
		#LOC_KS_SciDef_dmImagingPlatform_Uleg_InSpaceHigh = 광범위한 스펙트럼 분석에 따르면 Uleg의 얇은 대기는 주로 질소로 구성되어 있으며, 상당한 양의 메탄과 이산화탄소도 포함되어 있습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Uleg_InSpaceLow = 표면 분석 결과 Uleg의 표면은 주로 식수 얼음으로 구성되어 있음이 나타났습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Uleg_InSpaceLowMountains = Uleg의 더 어두운 산을 촬영한 데이터에 따르면 표면은 여전히 식수 얼음입니다. 다른 결정 구조가 더 어두운 색을 설명할 가능성이 높습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Wormholes_InSpace = 다중 분광 분석 결과는... '결정적이지 않다'고 해두죠. 웜홀에서 나오는 빛이 너무 심하게 왜곡되어 측정값이 정확한지 확인하기 어렵습니다.
		#LOC_KS_SciDef_dmMagScan_Ahtpan_SrfLanded = 종합적인 분석 결과, Ahtpan의 자기장은 비교적 약하지만 태양풍을 막아내기에 충분할 정도로 강하다고 추측됩니다.
		#LOC_KS_SciDef_dmMagScan_Anneheg_SrfLanded = 이곳의 엄청난 방사선량으로 인해 불쌍한 붐 장치가 작동 불능 상태가 되었지만, 적어도... -대체로- 곧게 펴져는 있습니다.
		#LOC_KS_SciDef_dmMagScan_Arorua_SrfLanded = 표면에서 측정한 결과, Arorua는 자체적으로 꽤 강한 자기장을 가지고 있는 것으로 보입니다. 이 자기장이 하전 입자의 흐름을 어느 정도 막아 대기의 수명을 연장하고 있을 가능성이 있습니다.
		#LOC_KS_SciDef_dmMagScan_Dipuc_SrfLanded = 자기력선이 표면에서는 보이지 않는 지형적 특징을 따라가는 것으로 보입니다. 이는 지하 깊은 곳에 자성을 띤 용융 암석이 흐르고 있기 때문일 수 있습니다.
		#LOC_KS_SciDef_dmMagScan_Efil_SrfLanded = 자기계가 표면에서 Efil의 강한 자기장을 포착했습니다. 자기력선이 마치 완벽한 호흡을 맞추는 두 무용수처럼 위성의 자전축과 정확히 정렬되어 있습니다.
		#LOC_KS_SciDef_dmMagScan_Elad_SrfLanded = 자기력선이 이상한 방향으로 흐르고 있으며, 자전축에서 약 40도 기울어진 한 쌍의 자기극을 가리키는 것으로 보입니다.
		#LOC_KS_SciDef_dmMagScan_Enots_SrfLanded = Enots는 자기장을 생성하지 않는 것으로 보입니다. 정말 놀랍지도 않군요...
		#LOC_KS_SciDef_dmMagScan_Eulb_SrfLanded = Eulb의 자기장은 꽤 약하지만, 표면에서 장비로 감지하기는 어렵지 않습니다. 또한 근처에 더 작고 강한 국지적 자기장이 여러 개 존재합니다.
		#LOC_KS_SciDef_dmMagScan_Iomena_SrfLanded = Iomena는 위치에 따라 강하게 왜곡되는 상당한 표면 자기장을 가지고 있지만, 가장 조용한 곳에서도 여전히 일정한 활동 흐름이 남아 있습니다. 이는 아마도 지오다이나모 효과에 의해 생성된 적절한 자기장일 것입니다.
		#LOC_KS_SciDef_dmMagScan_Iomena_SrfLandedCanyonsAll = 일부 자기력선이 협곡 벽을 따라 흐르고 있어, 자성 활성 물질이 존재함을 확인했습니다.
		#LOC_KS_SciDef_dmMagScan_Iomena_SrfLandedCraters = 강렬한 자기 활동이 고립된 지역에서 나타나는 것으로 보아, 충돌체가 착륙할 때 자성 광석을 흩뿌렸을 가능성이 있습니다.
		#LOC_KS_SciDef_dmMagScan_Iomena_SrfLandedHighlands = 이 위치의 자기 활동은 실제로는 약간 더 약한데, 아마도 융기된 지형으로 인해 지각 내 자성 광석의 밀도가 낮아졌기 때문일 수 있습니다.
		#LOC_KS_SciDef_dmMagScan_Iomena_SrfLandedMountainsAll = 이곳에서는 자기장이 강해지는데, 아마도 Iomena 깊은 곳에서 자성을 띤 물질이 지각으로 올라왔기 때문일 것입니다.
		#LOC_KS_SciDef_dmMagScan_Kcalbeloh_InSpaceHigh = Kcalbeloh에서 이 정도 거리가 되면 언급할 만한 활동이 거의 없습니다. 행성 간 공간이나 성간 공간과 매우 비슷합니다.
		#LOC_KS_SciDef_dmMagScan_Kcalbeloh_SrfLanded = 붐(boom)이 스파게티가 되었습니다. 당신도 스파게티가 되었습니다. 모든 것이 스파게티입니다! 대체 무슨 일이 일어나고 있는 거죠?!?! 왜 이렇게 파스타가 많은 거죠?!?
		#LOC_KS_SciDef_dmMagScan_Mehtna_SrfLanded = Mehtna의 자기장은 표면에서 쉽게 감지할 수 있지만 여전히 약한 상태입니다.
		#LOC_KS_SciDef_dmMagScan_Meiuqer_SrfLanded = 원칙에 따라 자기계를 확인했습니다. 아무것도 없습니다. 금속 퇴적물에 의해 생성된 국지적 자기장조차 없습니다.
		#LOC_KS_SciDef_dmMagScan_Noi_SrfLanded = 흠. 아니요, 여전히 자기장은 없습니다.
		#LOC_KS_SciDef_dmMagScan_Noira_SrfLanded = 표면에서 작은 국지적 자기장이 감지될 수 있지만, 위성 자체의 더 큰 자기장은 없는 것으로 보입니다. 아니면 쌍둥이 행성에 비해 감지하기 어려울 정도로 미미한 것일 수 있으니, 더 정밀한 데이터 분석이 필요합니다.
		#LOC_KS_SciDef_dmMagScan_Norihc_SrfLanded = Norihc의 표면에서 약한 자기장을 측정할 수 있지만, 특별히 인상적인 수준은 아닙니다.
		#LOC_KS_SciDef_dmMagScan_Noyreg_SrfLanded = Noyreg의 자기장은 표면에서 크게 변하지 않는 것으로 보입니다.
		#LOC_KS_SciDef_dmMagScan_Onrefni_SrfLanded = Onrefni의 표면 자기장은 이렇게 작은 천체치고는 꽤 강합니다. 핵이 비례적으로 거대할 가능성이 높으며, Kcalbeloh의 엄청난 중력에 의해 강하게 휘저어지고, 심지어 반죽되고 있습니다.
		#LOC_KS_SciDef_dmMagScan_Onrefni_SrfSplashed = 초대질량 블랙홀을 가깝게 궤도 비행하는 행성에서 자기계가 용암에 녹아내리며 '오 안 돼, 또 시작이야!'라는 메시지를 보낸 이유를 알 수 있다면, 현재보다 우주의 본질에 대해 훨씬 더 많은 것을 알게 될 것이라고 많은 이들이 추측해 왔습니다.
		#LOC_KS_SciDef_dmMagScan_Rouqea_SrfLanded = 붐(boom)은 분명 이런 종류의 압력을 견디도록 설계되지 않았으며, 일부가 찌그러진 것으로 보입니다.
		#LOC_KS_SciDef_dmMagScan_Rouqea_SrfSplashed = Rouqea 표면의 자기장은 궤도에서보다 약간 더 강하지만 여전히 약합니다. Kcalbeloh와의 근접성을 고려하면 조석력이 핵을 휘저어야 합니다. 어쩌면 금속 핵 자체가 없는 것일까요?
		#LOC_KS_SciDef_dmMagScan_Sera_InSpaceHigh = 이 고도에서도 강한 자기 수치가 측정되는 것으로 보아, Sera 주변에 강력한 자기권이 형성되어 있습니다. Dipuc의 조석력이 Sera의 핵을 활성 상태로 유지하는 데 도움을 주었을 가능성이 있지만, 정말 그 정도로 가까운 것일까요?
		#LOC_KS_SciDef_dmMagScan_Sera_SrfLanded = Sera 표면의 자기력선은 사방으로 뻗어 있으며, 이는 주변에 강력한 국지적 자기장이 많이 존재함을 명확히 보여줍니다.
		#LOC_KS_SciDef_dmMagScan_Suluco_InSpaceHigh = 이 거리에서 Suluco의 자기장은 매우 희미합니다. 표면 위로 멀리 뻗어 있지 않은 것으로 보입니다.
		#LOC_KS_SciDef_dmMagScan_Suluco_SrfLanded = Suluco는 표면에서 약한 자기장을 가지고 있는 것으로 보이며, 이는 태양풍으로부터 이상적인 수준의 보호를 제공하지 못함을 의미합니다. 하지만 황혼 지대의 생명체는 태양 노출이 어차피 제한적이기 때문에 상관없이 생존합니다.
		#LOC_KS_SciDef_dmMagScan_Sunorc_InSpaceLow = 붐(boom)이 현재 액체로 변하고 있어 구조적 무결성을 유지하는 데 어려움을 겪고 있는 것으로 보입니다.
		#LOC_KS_SciDef_dmMagScan_Tot_SrfLanded = Suluco를 제외하고는 여전히 언급할 만한 자기 활동이 없습니다.
		#LOC_KS_SciDef_dmMagScan_Uleg_InSpaceHigh = 이 고도에서는 자기장이 감지되지 않습니다. Uleg의 극단적인 궤도를 고려하면 상당한 조석력을 경험할 것이므로, 철-니켈 핵이 없을 가능성이 큽니다.
		#LOC_KS_SciDef_dmMagScan_Uleg_SrfLanded = 표면에서도 Uleg의 자기장은 거의 감지되지 않을 정도로 약합니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Ahtpan_SrfLanded = 지상에서도 센서가 많은 수소 퇴적물을 포착합니다. 땅조차도 수소가 풍부합니다!
		#LOC_KS_SciDef_dmNAlbedoScan_Ahtpan_SrfSplashed = 매우 강한 수소 신호는 Ahtpan의 표면이 나프타 바다로 덮여 있다는 우리의 가장 큰 희망을 확인시켜 줍니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Anneheg_SrfLanded = 표면의 수소 수치는 확실히 터무니없는 태양풍이 표면에 수소를 퇴적시킨 결과일 뿐입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Arorua_SrfLanded = Aralc-B 덕분에 배경 중성자 수치가 꽤 높습니다. 두꺼운 대기에도 불구하고 이런 현상이 나타나 정확한 수치를 측정하기 어렵습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Dipuc_SrfLanded = 중성자 스캔 결과, Dipuc의 표면은 수소가 매우 부족한 것으로 보입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Dipuc_SrfLandedPoles = 여기서 수소 흔적이 나타나는데, 아마도 지하에 소량 존재하는 식수 얼음에서 기인한 것일 것입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Efil_SrfLandedArcticBiomes = 얼음과 눈으로 뒤덮인 북극의 토양은 기꺼이 식수를 제공합니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Efil_SrfLandedBeach = 이곳의 젖은 모래는 직접 와서 즐길 수 있다면 발가락에 달라붙었을 것입니다. 수소 함량을 보면 카메라 피드로 이미 명확히 알 수 있듯이, 이 해변은 생명을 주는 수정 같은 식수가 정기적으로 닿는 곳입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Efil_SrfLandedMountains = Efil의 산악 지대는 비교적 건조하며, 높은 고도로 인해 Efil조차 거주민을 부양할 수 없어 생명체가 거의 없습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Efil_SrfLandedRainforestsGrassland = Efil의 습하고 비옥한 토양은 식수 분자의 수소 원자가 풍부하여 거대한 숲과 광활한 초원에 생명을 불어넣습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Efil_SrfLandedSnowMountains = 눈 덮인 봉우리는 멋진 경치를 제공하지만, 생명체가 뿌리내리기에는 척박한 토양입니다. 식수는 풍부하지만 마실 것은 하나도 없습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Efil_SrfLandedTropicalDesert = 이곳의 모래는 건조하지만, 미량의 식수가 사막의 거주자들에게 꼭 필요한 활력을 계속해서 제공합니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Elad_SrfLanded = 희미한 수소 신호가 감지되지만, 거리가 멀어서인지 농도가 낮아서인지 판단하기 어렵습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Elad_SrfLandedLowlands = 높은 수소 수치가 감지되지만, 많은 암석을 통과한 후라 신호가 약합니다. 이는 지하 깊은 곳에 액체 상태의 바다가 존재할 가능성을 시사합니다!
		#LOC_KS_SciDef_dmNAlbedoScan_Enots_SrfLanded = 약한 수소 신호는 이 작은 위성이 휩쓸고 지나간 Anehta 외기권의 흔적일 수 있습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Eulb_SrfLanded = 스캔 결과 Eulb의 지하에는 유의미한 양의 수소가 존재하지 않는 것으로 밝혀졌습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Eulb_SrfLandedPolarCrater = 이곳에서 꽤 강한 수소 신호가 감지되는데, 아마도 극지 분화구 지역의 상당 부분이 영구적인 그늘에 가려져 있기 때문일 것입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Eulb_SrfLandedPoles = 이곳의 낮은 수소 수치는 흩어져 있는 식수 얼음 퇴적물로 설명될 수 있습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Iomena_SrfLanded = Iomena의 표면은 전반적으로 수소로 포화되어 있지만, 그 대부분이 식수일 가능성은 낮습니다. 암모니아나 일부 유기 화합물일 가능성이 더 높습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Mehtna_SrfLandedIce = 이곳의 얼어붙은 표면은 강한 저에너지 중성자 신호를 생성하며, 이것이 식수 얼음임을 확인시켜 줍니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Mehtna_SrfLandedRock = 의외로 Mehtna의 어두운 지역은 대부분 식수 퇴적물이 없습니다. 이는 아마도 이러한 온도와 압력 조건에서는 식수가 액체가 되지 않고 바로 기체로 승화하기 때문일 것입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Meiuqer_SrfLanded = 있잖아요, 우주 임무를 감독하겠다고 지원했을 때는 폭발하는 장면을 많이 볼 수 있을 줄 알았거든요. 하루 종일 지루한 원격 측정 데이터만 쳐다보고 싶지는 않았습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Noi_SrfLanded = 주변 중성자가 거의 없는 이런 고요한 환경에서는 고정밀 측정이 가능합니다. Sunorc로부터의 거리를 고려할 때, Noi는 얼음이 매우 부족합니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Noira_SrfLanded = Noira 전역에서 지하 수소가 감지되며, 이는 식수 퇴적물의 증거일 가능성이 높습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Norihc_SrfLanded = 이 지역의 수소 신호는 두꺼운 식수 얼음 층의 존재를 확인시켜 주며, 훨씬 아래쪽에 액체 식수 바다가 있을 가능성도 있습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Noyreg_SrfLanded = Noyreg의 표면은 수소가 풍부한 것으로 보입니다. 하지만 이 온도와 압력에서는 식수보다는 긴 사슬 탄화수소일 가능성이 가장 높습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Onrefni_SrfLanded = 중성자가 사방으로 튀어 정확한 수치를 얻기는 어렵지만, Onrefni의 표면은 수소 원자로 덮여 있습니다. 이것은 확실히 식수가 아니라 강렬한 'holar wind'와 강착 원반과의 직접적인 접촉으로 인한 퇴적물입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Rouqea_SrfLanded = 불행히도 장비가 엄청난 식수 압력을 견디지 못하고 찌그러진 것 같습니다. Rouqea에 식수가 있는지 영영 알 수 없을지도 모릅니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Rouqea_SrfSplashed = ...네, 식수가 맞습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Sera_SrfLandedLakes = 고에너지 중성자가 명확한 반응을 보이며, 온도와 압력을 고려할 때 이 액체는 식수임이 분명합니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Sera_SrfLandedLowlandsIslands = 이곳의 토양은 습하며, 지하 식수 퇴적물을 나타내는 일정한 신호를 생성합니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Sera_SrfLandedRock = 이곳의 암석은 상당히 건조하며, 장비는 표면 아래에서 미량의 수소만을 감지합니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Suluco_SrfLandedDay = 지하 수소의 흔적은 이곳에서 거의 찾아볼 수 없습니다. 영구적인 그늘이 진 곳에만 아주 미량 존재합니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Suluco_SrfLandedDayPole = 항성 직하점의 표면은 완전히 건조하지는 않지만, 적어도 그곳에는 약간의 식수가 있습니다. 이곳의 유일한 수소는 지속적인 태양풍에 의해 퇴적된 흔적으로 보입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Suluco_SrfLandedDesert = 이 지역에는 약간의 수소가 존재하며, 이는 표면 아래에 식수가 묻혀 있음을 나타냅니다. 건조하지만 생존은 가능합니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Suluco_SrfLandedNight = 수소 스캔에 따르면... 아니, 시각적 스캔에 따르면, 밤 쪽의 모든 표면은 고체 식수 얼음으로 덮여 있습니다. 빛 없는 황무지에서 차가운 눈이 모래처럼 날리고 흐릅니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Suluco_SrfLandedTwilight = 황혼 지대 토양에서 매우 높은 농도의 수소가 발견되는데, 물론 대부분 식수입니다. 행성 액체 식수의 대부분은 이곳에서 찾을 수 있습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Suluco_SrfLandedWater = 이곳의 매우 젖은 표면은 자연스럽게 많은 수소를 포함하고 있으며, 대부분의 중성자를 흡수합니다. 바다를 오염시키지 않기를 바랄 뿐입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Tot_SrfLanded = 이곳의 표면 스캔에서는 특이 사항이 감지되지 않았습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Uleg_SrfLanded = 깨끗한 저에너지 중성자 신호는 Uleg 표면의 대부분이 식수 얼음으로 이루어져 있음을 확인시켜 줍니다. 아주 차갑군요!
		#LOC_KS_SciDef_dmRadiometerScan_Ahtpan_InSpaceHigh = Ahtpan의 대기는 자외선과 단파 적외선 주파수를 많이 흡수하며, 이는 대기 대부분이 이산화탄소임을 나타냅니다. 표면의 알베도가 상당히 높아 온실 효과를 어느 정도 상쇄하는 데 도움이 됩니다.
		#LOC_KS_SciDef_dmRadiometerScan_Anehta_InSpaceHigh = Anehta는 기분 좋은 청백색을 띠고 있어 알베도가 상당히 높습니다. 어두운 면에서도 강한 열 방출이 감지되는 것으로 보아 내부 가열이 활발함을 알 수 있습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Anneheg_InSpaceHigh = Anneheg는 Aralc-A와의 근접성 덕분에 표면이 매우 어두움에도 불구하고 절대 복사 조도가 매우 높습니다.
		#LOC_KS_SciDef_dmRadiometerScan_AralcA_InSpaceHigh = Aralc-A는 대부분의 작고 차가운 별들보다 훨씬 더 많은 자외선을 방출합니다. 이 항성계에 사는 생명체라면 무엇이든 꽤 잘 보호받아야 할 것이며, 진화할 시간도 그리 많지 않았을 것입니다. 하지만, 흔히들 말하듯이... "Efil"은, 어, 방법을 찾아내죠.
		#LOC_KS_SciDef_dmRadiometerScan_AralcB_InSpaceHigh = 적색 왜성인 Aralc-B는 많은 적외선을 방출하며, 가시광선 및 자외선 스펙트럼에서는 다소 희미합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Arorua_InSpaceHigh = Arorua의 두꺼운 이산화탄소 대기에도 불구하고, 두 개의 별과 가깝기 때문에 절대 복사 조도는 상당히 높습니다. 거대하고 일렁이는 오로라들도 아마 한몫할 것입니다.
		#LOC_KS_SciDef_dmRadiometerScan_Dipuc_InSpaceHigh = Dipuc의 다소 어둡고 화산 활동이 있는 표면은 적외선 파장을 제외한 비가시광선 스펙트럼에서 놀라울 정도로 높은 알베도를 보입니다.
		#LOC_KS_SciDef_dmRadiometerScan_Efil_InSpaceHigh = Efil의 밝은 표면은 대부분의 자외선과 근적외선을 흡수하는 두꺼운 대기에 의해 아름다운 청록색으로 강하게 물들어 있습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Elad_InSpaceHigh = Elad의 밝은 표면은 전반적으로 꽤 높은 알베도를 가지고 있으며, 이 위성에 대기가 없다는 미스터리한 사실이 이를 뒷받침합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Enots_InSpaceHigh = Enots는 매우 낮은 알베도를 가지고 있지만, 분광 분석 결과 탄소의 존재는 나타나지 않았습니다. 이는 이 검은색의 다른 기원을 시사합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Eulb_InSpaceHigh = Eulb는 꽤 높은 알베도를 가지고 있습니다. 그 밝은 표면은 빨간색과 적외선을 제외한 모든 기록된 파장에서 많은 빛을 반사합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Iomena_InSpaceHigh = Iomena의 대부분 회색인 표면은 전반적으로 낮은 알베도를 나타내며, 대기는 다량의 암모니아 가스를 나타내는 패턴으로 대부분의 가시광선 파장을 흡수합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Kcalbeloh_InSpaceHigh = 물론 사건의 지평선 자체의 알베도는 정확히 0이지만, 강착 원반은 별처럼 기록된 모든 파장에서 빛을 방출합니다. 하지만 대부분의 별보다는 상당히 희미합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Maelg_InSpaceHigh = Maelg는 가시광선 스펙트럼에서 비교적 적은 빛을 방출하지만, 적외선 영역에서는 훨씬 더 잘 보입니다. 어쨌든 이 거리에서는 관측하기 어렵지 않습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Mehtna_InSpaceHigh = Mehtna의 거대한 검은 반점과 자외선 흡수 특성은 이곳이 식수로 덮여 있음을 확인시켜 주며, 대기 스펙트럼은 이산화탄소와 수증기가 주성분임을 시사합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Meiuqer_InSpaceHigh = Meiuqer는 어두운 표면으로 인해 매우 낮은 알베도를 가지고 있으며, Maelg에서 오는 빛이 극도로 희미하다는 사실이 이를 악화시킵니다.
		#LOC_KS_SciDef_dmRadiometerScan_Noi_InSpaceHigh = 정말 어두운 소행성이군요. Noi는 거의 모든 스펙트럼에서 빛을 강하게 흡수하며, C형 소행성치고는 자외선 흡수율도 높습니다. 그 결과, 특히 별에서 너무 멀리 떨어져 있어 거의 보이지 않는 천체가 되었습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Noira_InSpaceHigh = Noira의 전체적인 알베도는 문과 상당히 비슷하지만, Sunorc로부터의 엄청난 거리 때문에 절대 복사 조도는 매우 낮습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Norihc_InSpaceHigh = Norihc의 얇은 대기는 빛을 많이 흡수하지 않아, 밝은 표면이 자외선을 제외한 대부분의 파장에서 많은 빛을 반사할 수 있게 합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Noyreg_InSpaceHigh = Noyreg의 밀도 높은 대기는 많은 자외선과 적외선을 흡수하며, 가시광선 스펙트럼도 많이 흡수합니다. 이것이 이 행성이 녹색으로 보이는 이유일 수 있습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Onrefni_InSpaceHigh = 어두운 표면으로 인해 Onrefni는 매우 낮은 알베도를 가지며 모든 파장에서 빛을 거의 반사하지 않습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Rouqea_InSpaceHigh = 가시광선 스펙트럼에서는 아름답지만, Rouqea의 해양 표면은 다소 낮은 알베도를 가지고 있으며, 밀도 높은 대기는 대부분의 비가시광선 파장을 흡수합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Sedah_InSpaceHigh = Sedah 스캔에서 밤 쪽에서도 강렬한 열 판독값이 기록되었습니다. 이는 분명히 이 거대 행성의 터무니없이 높은 온도 때문입니다.
		#LOC_KS_SciDef_dmRadiometerScan_Sera_InSpaceHigh = Sera의 표면과 호수는 많은 자외선과 심지어 단파 적외선까지 흡수하는 것으로 보이며, 이는 금속이 풍부한 표면과 이산화탄소로 가득 찬 대기를 시사합니다.
		#LOC_KS_SciDef_dmRadiometerScan_SimeSystem_InSpaceHigh = 종합적으로 볼 때, 두 천체 모두 꽤 높은 결합 알베도를 가지고 있습니다. 특히 Simeht는 상당히 밝습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Simeht_InSpaceHigh = Simeht는 가시광선 스펙트럼에서 많은 빛을 반사하여 높은 알베도를 나타냅니다.
		#LOC_KS_SciDef_dmRadiometerScan_Simetra_InSpaceHigh = 적외선 스펙트럼에서 Simetra는 Simeht보다 꽤 더 많은 빛을 방출하는데, 이는 더 높은 온도와 더 강력한 내부 가열 과정을 나타냅니다.
		#LOC_KS_SciDef_dmRadiometerScan_Suluco_InSpaceHigh = 알베도는 센서가 낮 쪽 반구와 황혼 지대 중 어디를 더 많이 보느냐에 따라 극적으로 변하며, 대부분의 천체보다 훨씬 더 심합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Sunorc_InSpaceHigh = Sunorc는 기록된 대부분의 파장에서 많은 빛을 방출하지만, K형 별(또는 오렌지색 왜성)로서 Kerbol과 같은 G형 별(또는 노란색 왜성)보다 청색광과 자외선을 상당히 적게 방출합니다. 온도가 낮기 때문에 이러한 유형의 별들은 노란색 왜성보다 수십억 년 더 오래 살 수 있습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Tot_InSpaceHigh = Tot의 표면 대부분은 어둡고 가시광선과 적외선을 모두 흡수하지만, 가장 낮은 지역은 약간 더 반사율이 높습니다. 흥미롭군요...
		#LOC_KS_SciDef_dmRadiometerScan_Uleg_InSpaceHigh = Uleg의 표면은 가시광선 및 적외선 스펙트럼 전반에 걸쳐 꽤 높은 알베도를 가지고 있지만, 자외선은 강하게 흡수하는 것으로 보입니다. 이는 표면에 다량의 식수가 있음을 나타냅니다.
		#LOC_KS_SciDef_dmRadiometerScan_Wormholes_InSpaceHigh = 아주 작은 움직임만으로도 웜홀을 통해 보이는 물체의 초점이 흐려지기 때문에 이 장비를 사용하기가 어렵습니다. 그냥 참고 통과하는 게 어떨까요?
		#LOC_KS_SciDef_dmSIGINT_Ahtpan_InSpaceLow = Ahtpan을 스캔하는 동안 무선 감시 결과 잡음 외에는 아무것도 나오지 않았습니다. 완벽하군요. 외계인의 석유 채굴 작업이 없으니 이 행성은 우리 차지입니다! 선착순이죠, ET?
		#LOC_KS_SciDef_dmSIGINT_Anehta_InSpaceLow = Anehta는 하층 대기가 소용돌이치고 폭풍이 몰아칠 때 무선 신호의 교향곡을 내뿜으며, 자기권을 통과한 태양풍은 심층 대기를 무용지물로 강타합니다.
		#LOC_KS_SciDef_dmSIGINT_Anneheg_InSpaceLow = 여기서는 Aralc-A에서 나오는 강렬한 무선 활동만 감지할 수 있습니다.
		#LOC_KS_SciDef_dmSIGINT_AralcA_InSpaceLow = Aralc-A는 대부분의 스펙트럼에서, 특히 이 장비가 감지할 수 없는 스펙트럼에서 엄청난 양의 방사선을 방출합니다. 하지만 우리는 푸른 별이 어떤지 알죠, 그렇죠? 이 무거운 물건을 여기까지 가져올 필요는 정말 없었잖아요, 안 그래요?
