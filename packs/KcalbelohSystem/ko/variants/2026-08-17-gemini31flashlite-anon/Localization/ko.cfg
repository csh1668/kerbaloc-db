		#LOC_KS_SciDef_atmosphereAnalysis_Iomena_SrfLanded = Iomena에 착륙하여 수행한 대기 분석에 따르면, 이 행성의 대기는 주로 암모니아와 미량의 메탄 및 이산화탄소로 구성된 것으로 보입니다. 또한 대기에는 지질 활동으로 인한 것으로 추정되는 소량의 다양한 탄화수소가 포함되어 있습니다.
