		#LOC_KS_SciDef_gravityScan_Arorua_InSpace = 중력 센서는 Arorua가 행성 주위를 돌고 Arorua가 Aralc-B 주위를 이동함에 따라 발생하는 Arorua의 국지적 중력 변화를 감지합니다.
		#LOC_KS_SciDef_gravityScan_Arorua_SrfLanded = 열기 때문에 중력 센서의 측정값이 부정확해집니다.
		#LOC_KS_SciDef_gravityScan_Dipuc_InSpaceHigh = Dipuc의 약한 중력은 이 거리에서는 상당히 균일하지만, 데이터에는 여전히 미세한 변동이 있습니다.
		#LOC_KS_SciDef_gravityScan_Dipuc_InSpaceLow = Dipuc의 표면을 지나갈 때, 중력 측정값이 지하 마그마의 흐름을 나타낼 수 있는 패턴으로 변동합니다.
		#LOC_KS_SciDef_gravityScan_Dipuc_SrfLanded = 중력은 0.15g로, 문(Mun)과 비슷합니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_InSpace_Beach = 해변 위를 지나갈 때 중력 센서 측정값이 평탄해집니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_InSpace_Desert = 사막 위를 지나갈 때 중력 센서가 평탄한 값을 나타냅니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_InSpace_Forests = 중력 센서가 의미 없는 값을 출력합니다. 아래에 있는 엄청난 양의 식물을 감당할 수 없는 것으로 보입니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_InSpace_Grassland = 평탄한 초원 위를 지나갈 때 중력 센서 측정값이 평탄해집니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_InSpace_Mountains = 중력 센서가 아래 산악 지형을 따라가면서, 국지적 중력 측정값에 작지만 매우 눈에 띄는 변화가 나타납니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_InSpace_Tundra = 아래의 툰드라 지형으로 인해 중력 센서 값이 아주 짧게 급상승합니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_InSpace_Water = 중력 센서는 Anehta와 시스템 내 다른 위성들의 영향으로 인해 바다 위에서 국지적 중력의 짧은 변화를 감지합니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_SrfLanded = 중력 센서가 예상보다 훨씬 높은 값을 읽어 들입니다. 재보정이 필요한 것 같습니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_SrfSplashed = 물기가 내부로 들어가면서 중력 센서가 합선되었습니다.
		#LOC_KS_SciDef_gravityScan_Efil_InSpaceHigh = 광활한 우주 공간 속에서, 우리 우주선은 매혹적인 Efil 행성 위 높은 고도로 모험을 떠나 중력의 천체 무도를 포착했습니다. 이 높은 관측 지점에서 우리는 Efil과 그 우주 동반자들 사이의 복잡한 상호 작용을 목격하며 시공간 구조의 곡선과 물결을 추적했습니다.
		#LOC_KS_SciDef_gravityScan_Efil_InSpaceLow = 광활한 우주 공간에서 우리 우주선은 Efil 위에서 중력 스캔을 시작하여 중력의 천체 안무를 포착했습니다. 무중력 상태에 떠서 우리는 Efil 중력장의 부드러운 당김과 끌림을 관찰하고 우주 구조를 형성하는 복잡한 패턴을 매핑했습니다.
		#LOC_KS_SciDef_gravityScan_Efil_SrfLanded = Efil의 매혹적인 해안에 발을 굳게 딛고, 행성의 중력적 포용 속에 담긴 신비를 밝히기 위해 중력 스캔을 시작했습니다. 장비가 중력의 미세한 변동을 정밀하게 측정함에 따라, 지표면 아래의 질량 분포와 행성 역학의 복잡한 상호작용, 그리고 푸른 장막 아래 숨겨진 보물에 대한 통찰을 얻었습니다.
		#LOC_KS_SciDef_gravityScan_Elad_InSpaceHigh = 이 거리에서 Elad의 중력은 꽤 일정해 보입니다. 표면의 불규칙성이 무게 중심을 이동시키지는 않는 것 같습니다.
		#LOC_KS_SciDef_gravityScan_Elad_InSpaceLow = 일부 불규칙성이 Elad의 중력 분포에 불규칙함을 유발하는 것으로 감지되는데, 이는 불규칙과는 거리가 멉니다.
		#LOC_KS_SciDef_gravityScan_Elad_SrfLanded = 이 우주선에 부착된 작은 상자가 지면을 향해 끌리는 것으로 보아 Elad가 생성하는 중력이 존재함을 증명할 수 있습니다. 이 효과는 질량이 주변 시공간을 휘게 하는 능력 때문에 발생합니다. 이를 중력이라 부르지만, 여기까지 올 정도라면 이미 알고 계셨겠죠? 그렇죠?
		#LOC_KS_SciDef_gravityScan_Enots_InSpaceHigh = 센서가 Enots와 Anehta 사이에서 요동칩니다. 그래도 Tot 탐사 때만큼 심각하지는 않군요.
		#LOC_KS_SciDef_gravityScan_Enots_InSpaceLow = 중력 스캐너가 이제 Enots에 더 집중하고 있습니다. 하지만 측정값으로는 여전히 Goo가 왜 날뛰는지 설명할 수 없습니다.
		#LOC_KS_SciDef_gravityScan_Enots_SrfLanded = 이곳의 표면 중력은 매우 낮습니다. 떨어지지 않도록, 아니, 뛰어오르지 않도록 주의하십시오.
		#LOC_KS_SciDef_gravityScan_Eulb_InSpace = 센서가 Eulb의 중력을 측정하여 이 푸른 달의 내부 구조에 대한 힌트를 제공합니다.
		#LOC_KS_SciDef_gravityScan_Eulb_SrfLanded = 센서가 표면에서 국지적 중력을 상세히 조사하여 내부 구조가 어떤지 추론할 수 있게 합니다.
		#LOC_KS_SciDef_gravityScan_Iomena_InSpaceHigh = 중력 측정값은 우주선의 고도와 Kcalbeloh의 중력에 따라 약간씩 변동합니다.
		#LOC_KS_SciDef_gravityScan_Iomena_InSpaceLow = Iomena 주변의 낮은 궤도에서 측정한 중력값은 행성 표면에서 측정한 값보다 비교적 안정적입니다. Iomena 주변 낮은 궤도에서 수행된 중력 스캔 결과, 이 행성은 커빈에 비해 비교적 약한 중력을 가진 것으로 관찰되었습니다.
		#LOC_KS_SciDef_gravityScan_Iomena_SrfLanded = Iomena의 중력 측정값은 측정 위치에 따라 눈에 띄게 변동합니다. 이는 행성의 고르지 않은 지형과 수많은 분화구 및 협곡이 내부 지질에 미치는 영향 때문일 가능성이 큽니다.
		#LOC_KS_SciDef_gravityScan_Kcalbeloh_InSpaceHigh = 멀리서 Kcalbeloh를 중력 스캔한 결과 데이터에서 미세한 불규칙성이 발견되었습니다. 이는 블랙홀 주위를 공전하는 행성, 즉 '블래닛(blanets)'일 가능성이 높습니다. 그중 일부는 꽤 가까이 있을 겁니다!
		#LOC_KS_SciDef_gravityScan_Kcalbeloh_InSpaceLow = 중력 스캔 결과 상당한 중력 왜곡이 나타났으며, 이는 향후 이 거대한 천체 주변에서 중력 도움(slingshot) 기동을 수행하는 데 도움이 될 수 있습니다.
		#LOC_KS_SciDef_gravityScan_Maelg_InSpaceHigh = 이 거리에서 Maelg의 중력 우물은 커볼(Kerbol)과 같은 실제 항성에 비하면 다소 희미하지만, 여전히 감지할 수 있는 수준이며 가장 거대한 행성들보다 훨씬 강력합니다.
		#LOC_KS_SciDef_gravityScan_Maelg_InSpaceLow = Maelg 표면에서 나타나는 중력은 Jool의 강력한 중력 우물보다 훨씬 극단적인 버전과 비교할 수 있습니다. 상대적으로 작은 크기임에도 불구하고, 이 실패한 항성은 다른 근처 시스템과 Kcalbeloh 자체의 간섭에도 불구하고 Mehtna와 Meiuqer를 매우 단단히 붙잡고 있습니다.
		#LOC_KS_SciDef_gravityScan_Mehtna_FlyingHigh = 우주선이 Mehtna 대기권에 진입하면서 발생한 섭동에도 불구하고, 표면 중력은 대략 0.5 G 정도로 추정됩니다.
		#LOC_KS_SciDef_gravityScan_Mehtna_FlyingLow = 희박한 대기가 우주선을 불안정하게 만들어 진동을 유발하고 기기 측정값을 방해하기 때문에, 이 고도에서는 아직 정밀한 중력 스캔이 불가능합니다. 하지만 그 덕분에 의도치 않게 대략적인 풍속(그리고 의도했던 대로 대략적인 중력 통계)을 얻을 수 있습니다!
		#LOC_KS_SciDef_gravityScan_Mehtna_InSpaceHigh = 아래쪽 중력은 커빈 중력의 절반 정도, 혹은 그보다 약간 더 강할 것으로 추정됩니다.
		#LOC_KS_SciDef_gravityScan_Mehtna_InSpaceLow = 아래쪽 중력은 커빈 중력의 절반 정도, 혹은 그보다 약간 더 강할 것으로 추정됩니다.
		#LOC_KS_SciDef_gravityScan_Mehtna_SrfLanded = 이 행성의 중력은 태양계 및 그 너머의 다른 목적지들과 비교했을 때 상당히 상당한 수준으로, 커빈 중력의 절반을 조금 넘습니다. 이 죽음의 세계를 탐험하기에 너무 무겁지도 않고, 한 걸음마다 너무 멀리 튕겨 나가지도 않는 적당한 환경입니다.
		#LOC_KS_SciDef_gravityScan_Meiuqer_InSpaceHigh = 중력 스캐너가 이 행성체의 중력장에 대해 보잘것없는 측정값을 반환하자, 왜 굳이 측정했는지 의문을 표합니다.
		#LOC_KS_SciDef_gravityScan_Meiuqer_InSpaceLow = 중력 스캐너가 무례하게 웃으며 무시할 만한 수치를 보고합니다.
		#LOC_KS_SciDef_gravityScan_Meiuqer_SrfLanded = Meiuqer의 중력을 측정하려고 시도합니다. 센서 디스플레이가 그 낮은 수치를 거의 표시하지 못하지만, 어쨌든 측정값을 얻었습니다.
		#LOC_KS_SciDef_gravityScan_Noi_InSpace = 중력 모니터가 잠들어 있어 측정하려면 깨워야 합니다. 이곳의 궤도 속도는 매우 낮으며, Noi의 어느 부분이 아래에 있느냐에 따라 중력이 거의 없는 상태에서 사실상 없는 상태까지 크게 변동합니다.
		#LOC_KS_SciDef_gravityScan_Noi_SrfLanded = Noi의 표면 중력은 궤도상보다 약간 더 강하지만, 여전히 사실상 없는 것과 마찬가지입니다. 여기서 선외 활동(EVA) 중에 점프하는 것은 끔찍한 생각이 될 것입니다.
		#LOC_KS_SciDef_gravityScan_Noira_InSpaceHigh = 이 고도에서는 Noira의 인력을 Simetra 및 Simeht와 구분하기 어렵습니다.
		#LOC_KS_SciDef_gravityScan_Noira_InSpaceLow = Noira의 중력은 꽤 낮아서 Simetra와 Simeht가 측정값의 큰 부분을 차지합니다.
		#LOC_KS_SciDef_gravityScan_Noira_SrfLanded = 쌍둥이 행성이 머리 위를 선회함에 따라 Noira의 중력 측정값이 주기적으로 감소합니다.
		#LOC_KS_SciDef_gravityScan_Norihc_InSpace = 주변에 수많은 거대 천체가 존재하여 탐지기가 연구하기에 매우 복잡한 중력 환경을 조성합니다.
		#LOC_KS_SciDef_gravityScan_Norihc_SrfLanded = Simetra나 Simeht가 머리 위를 지나갈 때 중력 측정값이 다소 감소하는데, 이는 Norihc의 지질에 미치는 조석력의 영향을 암시합니다.
		#LOC_KS_SciDef_gravityScan_Noyreg_InSpace = 중력 측정값은 아래의 지형지물에 따라 변동하지만, 안타깝게도 두꺼운 구름 덮개 때문에 가려져 있습니다.
		#LOC_KS_SciDef_gravityScan_Noyreg_SrfLanded = Simetra나 Simeht가 머리 위를 지나갈 때마다 측정값이 약간씩 증가하며, Noyreg이 상당한 조석력을 받고 있음을 보여줍니다.
		#LOC_KS_SciDef_gravityScan_Onrefni_InSpaceHigh = 이 거리에서는, 원래라면 분명히 드러났을 작은 행성의 상당한 중력 측정값이 Kcalbeloh의 압도적인 신호에 묻혀버립니다.
		#LOC_KS_SciDef_gravityScan_Onrefni_InSpaceLow = 센서가 블랙홀과 Onrefni 사이에서 벌어지는 행성 간 줄다리기를 정량화하는 데 어려움을 겪고 있습니다.
		#LOC_KS_SciDef_gravityScan_Onrefni_SrfLanded1 = Onrefni의 지형이 불안정하고 내부 지질 구조가 파괴된 탓인지, 측정 위치에 따라 중력값이 미세하게 변동합니다.
		#LOC_KS_SciDef_gravityScan_Onrefni_SrfLanded2 = Onrefni의 중력은 확실히 불안정하지만, 대개 Duna의 표면 중력과 비슷하거나 약간 높은 수준에서 안정됩니다. 이 사실은 이 작은 천체가 무거운 철 핵을 가지고 있을 것이라는 이전 과학적 측정의 가설을 뒷받침합니다. 보통 이렇게 작은 천체는 이 정도로 높은 중력을 가지지 않기 때문입니다.
		#LOC_KS_SciDef_gravityScan_Onrefni_SrfSplashed = Onrefni의 지옥 같은 열기 속에서 중력 센서가 녹아내리기 시작하며 의미 없는 데이터들을 쏟아냅니다.
		#LOC_KS_SciDef_gravityScan_Rouqea_InSpaceHigh = Kcalbeloh가 너무 가까워 Rouqea의 중력을 제대로 측정하기가 어렵습니다. 하지만 -65535와 같은 수많은 측정값 끝에, 마침내 Rouqea의 미세한 중력을 찾아냈습니다.
		#LOC_KS_SciDef_gravityScan_Rouqea_InSpaceLow = 중력 센서는 Rouqea가 지배적인 중력체임을 감지하지만, 몇 초마다 엄청난 크기의 값이 화면에 깜빡입니다. Kcalbeloh가 여전히 그곳에 있다는 것을 상기시켜 주는 것 같습니다.
		#LOC_KS_SciDef_gravityScan_Rouqea_SrfLanded = 이곳의 중력은 표면에서 측정했을 때보다 더 강하게 느껴집니다! 흥미롭군요!
		#LOC_KS_SciDef_gravityScan_Rouqea_SrfSplashed = 이곳의 중력은 커빈보다 약간 더 강하지만, 불편할 정도는 아닙니다. 마치 언덕을 계속해서 뛰어 올라가는 느낌이죠! 하지만 거대한 파도의 끝자락에서 기체를 타고 서핑을 하면 멋진 무중력 경험을 할 수 있습니다!
		#LOC_KS_SciDef_gravityScan_Sedah_InSpaceHigh1 = 측정 결과 Sedah의 중력은 Jool과 같은 거대 가스 행성에 비해 상당히 약한 것으로 나타났습니다. Sedah의 낮은 질량은 중력을 약하게 만들었으며, 이는 전체적인 구조와 구성에 영향을 줄 수 있습니다.
		#LOC_KS_SciDef_gravityScan_Sedah_InSpaceHigh2 = 센서가 이 크기의 행성치고는 비정상적으로 낮은 측정값을 표시합니다. 추가 조사가 필요할 것 같습니다.
		#LOC_KS_SciDef_gravityScan_Sedah_InSpaceLow1 = 중력 스캔 측정 결과 Sedah의 밝은 면과 어두운 면 사이에 눈에 띄는 차이가 나타났는데, 이는 온도 변화로 인한 밀도 차이 때문일 가능성이 있습니다.
		#LOC_KS_SciDef_gravityScan_Sedah_InSpaceLow2 = 센서 데이터는 Sedah가 엄청난 크기에도 불구하고, 크기에 비해 질량은 그리 크지 않다는 것을 확인시켜 줍니다.
		#LOC_KS_SciDef_gravityScan_Sera_Srf = 중력은 1.08 G로 커빈보다 아주 약간 높습니다.
		#LOC_KS_SciDef_gravityScan_SimeSystem_InSpaceHigh = 이 시스템 중심에 있는 두 개의 거대한 천체에도 불구하고, 센서는 거의 일정한 값을 표시합니다.
		#LOC_KS_SciDef_gravityScan_Simeht_InSpaceHigh = 중력 센서는 비슷한 크기의 다른 얼음 거대 행성이 가까이 있어 오작동하며, 시스템의 질량 중심을 가리킵니다.
		#LOC_KS_SciDef_gravityScan_Simeht_InSpaceLow = Simeht에 더 가까워지면 중력을 훨씬 더 정확하게 측정할 수 있습니다.
		#LOC_KS_SciDef_gravityScan_Simetra_InSpaceHigh = 중력 센서는 비슷한 크기의 다른 얼음 거대 행성이 가까이 있어 오작동하며, 시스템의 질량 중심을 가리킵니다.
		#LOC_KS_SciDef_gravityScan_Simetra_InSpaceLow = Simetra에 더 가까워지면 중력을 훨씬 더 정확하게 측정할 수 있습니다.
		#LOC_KS_SciDef_gravityScan_Suluco = Suluco의 전역 중력 스캔 결과, 행성 표면 전반에 걸쳐 큰 변화나 이상 없이 비교적 일관된 중력장이 나타났습니다. 중력 세기는 낮과 밤 반구 모두에서 비슷하며, 황혼 지대라고 알려진 두 지역 사이에서도 마찬가지입니다.
		#LOC_KS_SciDef_gravityScan_SulucoHome_InSpace = Suluco 상공에서 국지 중력을 측정합니다.
		#LOC_KS_SciDef_gravityScan_SulucoHome_InSpace_Day = 사막 쪽은 중력이 매우 안정적으로 보이며, 이는 지질 구성의 변동성이 매우 낮음을 시사합니다.
		#LOC_KS_SciDef_gravityScan_SulucoHome_InSpace_Night = 밤 쪽을 지날 때, 특히 얼어붙은 산봉우리 위를 지날 때 중력 센서의 측정값이 변동합니다.
		#LOC_KS_SciDef_gravityScan_SulucoHome_InSpace_Twilight = 황혼 지대를 지날 때 중력 센서는 국지 중력 측정값이 아주 약간 떨어지는 것을 감지하는데, 이는 행성의 이 부분이 비교적 낮은 고도에 있음을 시사합니다.
		#LOC_KS_SciDef_gravityScan_SulucoHome_SrfLanded = 중력 센서를 올바르게 보정한 후, Suluco 표면의 국지 중력을 측정합니다.
		#LOC_KS_SciDef_gravityScan_SulucoHome_SrfSplashed = 식수와 접촉하자 중력 센서가 타버립니다.
		#LOC_KS_SciDef_gravityScan_Sunorc_InSpace = 중력 센서의 데이터는 Sunorc의 크기와 구성에 대한 통찰을 제공합니다.
		#LOC_KS_SciDef_gravityScan_Tot_InSpaceHigh = 중력 센서는 이 작은 것보다 Suluco에 훨씬 더 관심이 많은 것 같습니다. Tot에 집중하게 하려는 시도는 헛수고가 될 것입니다.
		#LOC_KS_SciDef_gravityScan_Tot_InSpaceLow = 중력 센서는 여전히 Suluco를 가리킵니다. 좌절감을 느끼며 중력 센서를 강제로 재설정하지만, 센서는 다시 Suluco로 관심을 돌릴 뿐입니다.
		#LOC_KS_SciDef_gravityScan_Tot_SrfLanded = 마침내 이 작은 바위 바로 옆에 도달하자 중력 센서가 Tot에 집중합니다.
		#LOC_KS_SciDef_gravityScan_Uleg_InSpaceHigh = 높은 궤도에 있는 우주선에서 행성 Uleg에 대한 중력 스캔을 수행했습니다. 스캔 결과 행성의 중력장에서 상당한 변화가 발견되었으며, 이는 밀도가 낮은 지하 물질이 존재함을 나타냅니다.
		#LOC_KS_SciDef_gravityScan_Uleg_InSpaceLow = Uleg 상공 낮은 궤도에서 수행한 중력 스캔 실험 중, 우주선은 행성의 중력장을 측정할 수 있었습니다. 측정값은 예상보다 약한 중력을 보여주었으며, 이는 Uleg의 밀도가 낮고 내부가 부분적으로 비어 있을 수 있음을 나타냅니다.
		#LOC_KS_SciDef_gravityScan_Uleg_SrfLanded = 승무원들이 Uleg 표면에서 중력 스캔을 수행했습니다. 결과는 행성 중력장의 변화를 보여주었으며, 이는 얼음 표면 아래에 비교적 빈 영역이 존재함을 나타냅니다. 이러한 영역의 성질과 구성을 확인하려면 추가 분석이 필요합니다.
		#LOC_KS_SciDef_gravityScan_WH3141A_InSpaceHigh = 중력 센서의 측정값이 격렬하게 변동합니다. 이 기이한 중력장을 정량화하거나 처리조차 할 수 없는 것으로 보입니다.
		#LOC_KS_SciDef_gravityScan_WH3141A_InSpaceLow = 중력 센서의 측정값이 격렬하게 변동합니다. 이 기이한 중력장을 정량화하거나 처리조차 할 수 없는 것으로 보입니다.
		#LOC_KS_SciDef_gravityScan_WH3141B_InSpaceHigh = 중력 센서의 측정값이 격렬하게 변동합니다. 이 기이한 중력장을 정량화하거나 처리조차 할 수 없는 것으로 보입니다.
		#LOC_KS_SciDef_gravityScan_WH3141B_InSpaceLow = 중력 센서의 측정값이 격렬하게 변동합니다. 이 기이한 중력장을 정량화하거나 처리조차 할 수 없는 것으로 보입니다.
		#LOC_KS_SciDef_magnetometer_Ahtpan_InSpaceHigh = 붐(boom)이 자기장을 감지하지만, 이것이 아래 행성에서 오는 것인지 아니면 두 별에서 발생하는 노이즈인지 구분하기 어렵습니다.
		#LOC_KS_SciDef_magnetometer_Ahtpan_InSpaceLow = 붐(boom)이 적당히 강한 자기장을 읽어 들입니다. 나침반을 어느 정도 신뢰성 있게 사용할 수 있을 정도입니다. 이것이 두 별에서 나오는 항성풍에 침식되지 않고 대기가 유지될 수 있는 이유일 가능성이 있습니다.
		#LOC_KS_SciDef_magnetometer_Anehta_InSpaceHigh = 낮은 궤도에서 관측된 자기장의 난류 및 변동성과 달리, 고고도 영역의 자기장은 일정한 강도와 방향을 유지하며 비교적 안정적인 것으로 나타났습니다. 행성 고리 시스템 또한 이 영역에서 자기 변동이 최소화되어, 더욱 일관되고 조직적인 자기 환경임을 시사합니다.
		#LOC_KS_SciDef_magnetometer_Anehta_InSpaceLow = Anehta의 낮은 궤도에서 측정한 자기계 데이터는 복잡하고 역동적인 자기장 패턴을 보여주었습니다. 행성의 자기장은 강도와 방향에서 상당한 변화를 보였으며, 영구적인 구름 덮개의 더 어두운 띠와 구역에서 더 높은 자기 활동이 나타났습니다.
		#LOC_KS_SciDef_magnetometer_Anneheg_InSpaceHigh = Aralc-A에서 방출되는 강렬한 방사선이 자기계 붐(boom)을 태워버렸습니다.
		#LOC_KS_SciDef_magnetometer_Anneheg_InSpaceLow = 붐(boom)이 타버리기 직전, Anneheg의 희미한 자기장을 짧게 측정할 수 있었습니다. 하지만 이 측정값이 Aralc-A에서 발생하는 노이즈일 뿐인지는 아무도 알 수 없습니다.
		#LOC_KS_SciDef_magnetometer_AralcA_InSpaceHigh = 기기가 강한 자기장을 읽어 들이지만, 측정값을 신뢰할 수 없습니다.
		#LOC_KS_SciDef_magnetometer_AralcA_InSpaceLow = Aralc-A의 자기장이 정확히 얼마나 강력한지는 알 수 없지만, 기기를 태워버릴 만큼 강력하다는 사실은 확실합니다.
		#LOC_KS_SciDef_magnetometer_AralcB_InSpaceHigh = 기기가 매우 강한 자기장을 읽어 들이지만, 이는 근처 Aralc-A의 영향 때문일 수 있습니다.
		#LOC_KS_SciDef_magnetometer_AralcB_InSpaceLow = Aralc-B에 가까이 접근하여 자기장을 훨씬 더 정확하게 측정할 수 있습니다. 상당히 강한 편이지만, 주계열성이라면 예상할 수 있는 수준입니다.
		#LOC_KS_SciDef_magnetometer_AralcSystem_InSpaceHigh = 기기가 강력한 항성 자기장을 감지하지만, 이 측정값은 훨씬 더 거대한 Aralc-A의 영향이 지배적일 가능성이 높습니다.
		#LOC_KS_SciDef_magnetometer_Arorua_InSpace = 자기계가 Aralc-B에서 오는 다량의 하전 입자를 감지했으며, 이 입자들이 Arorua의 대기를 침식하고 있습니다.
		#LOC_KS_SciDef_magnetometer_EfilHome_InSpace = 자기계 붐(boom)이 강하고 매우 미세하게 변동하는 자기장을 감지합니다. 아마도 근처 Anehta의 영향 때문일 것입니다.
		#LOC_KS_SciDef_magnetometer_Efil_InSpace = 우주 공간에서 자기계는 Efil이라는 신비로운 세계를 둘러싼 자기장을 부지런히 탐사했습니다. 우리는 행성 자기의 미묘한 변동과 파동을 감지하여 작용하는 힘의 생생한 모습을 그려냈습니다. 자기계 스캔은 Efil의 자기장과 그 존재를 형성하는 천체 역학 사이의 복잡한 춤을 밝혀냈습니다.
		#LOC_KS_SciDef_magnetometer_Eulb_InSpaceHigh = 기기가 푸른 달에서 오는 미세한 자기장을 읽어 들이지만, 측정값은 Anehta의 자기장에서 발생하는 노이즈로 가득합니다.
		#LOC_KS_SciDef_magnetometer_Eulb_InSpaceLow = Eulb에 더 가까이 접근하여 자기장을 더 정밀하게 측정할 수 있습니다.
		#LOC_KS_SciDef_magnetometer_Iomena_InSpaceHigh = Iomena의 높은 궤도에서 측정한 자기계 데이터는 이 행성의 자기장이 약하다는 것을 보여줍니다. 이는 얇은 대기와 철이 풍부한 핵의 부재 때문일 가능성이 큽니다. 그러나 자기장의 국지적인 작은 변화들이 존재하며, 이는 추가 연구가 필요한 광물 매장지나 기타 지질학적 특징이 있음을 시사합니다.
		#LOC_KS_SciDef_magnetometer_Iomena_InSpaceLow = Iomena의 약한 자기장은 낮은 궤도에서도 감지될 수 있으며, 이는 행성 표면이나 내부에 자기 물질의 원천이 있을 가능성을 나타냅니다. 자기장 강도의 변화는 국지적인 광물 매장지나 추가 조사가 필요한 지질학적 특징의 존재를 시사하기도 합니다.
		#LOC_KS_SciDef_magnetometer_Kcalbeloh_InSpaceLow = 강착 원반의 입자에서 발생하는 강렬한 방사선이 측정값을 얻기도 전에 기기를 합선시켰습니다.
		#LOC_KS_SciDef_magnetometer_Maelg_InSpaceHigh = 여기서 감지되는 자기장은 Maelg의 다른 부분과 마찬가지로 꽤 온순합니다. 하지만 더 가까이 다가갈수록 갈색 왜성 내부의 격렬함은 당신과 당신의 작은 우주선에 비해 훨씬 더 강해질 것입니다.
		#LOC_KS_SciDef_magnetometer_Maelg_InSpaceLow = 자기계는 겉보기엔 희미하고 무력해 보이는 Maelg 내부에 소용돌이치는 분노를 드러냅니다. 격렬하게 강한 자기장과 그로 인한 방사선대를 포착한 것입니다. KSC는 이를 Jool의 자기장을 50배 강화한 것으로 생각하라고 조언합니다.
		#LOC_KS_SciDef_magnetometer_Mehtna_InSpaceHigh = 자기계 보고에 따르면 Mehtna는 다소 약하지만 분명히 감지 가능한 자기장을 가지고 있습니다! 하지만 이 자기장은 Maelg와 근처의 다른 모든 항성계에서 오는 태양/성간 방사선으로부터 표면의 그 무엇도 보호할 만큼 강하지는 않습니다.
		#LOC_KS_SciDef_magnetometer_Mehtna_InSpaceLow = 감지된 자기장은 Duna와 다소 유사하지만 더 증폭된 수준으로 볼 수 있습니다. 이는 두 행성이 여러 특성을 공유하지만 Mehtna가 훨씬 더 크기 때문일 가능성이 높습니다.
		#LOC_KS_SciDef_magnetometer_Meiuqer_InSpaceHigh = 작은 Mehtna에 자기장이 있는지 확인하는 것이 시간 낭비라는 것을 알지만, "과학적 성과를 극대화하지 않았다"는 등의 어처구니없는 이유로 연구원과 다시 문제를 일으키고 싶지는 않습니다.
		#LOC_KS_SciDef_magnetometer_Meiuqer_InSpaceLow = 자기계는 이 우주 감자 같은 행성이 사실상 완전히 죽어 있다는 것을 다시 한번 확인해 줍니다.
		#LOC_KS_SciDef_magnetometer_Noyreg_InSpace = 자기계 측정값은 복잡한 패턴과 변동을 드러냈으며, 이는 자기 이상 현상과 그 아래의 지질학적 현상이 존재함을 암시합니다. 위험한 대기와 매혹적인 신비를 간직한 Noyreg은 우주의 경이로움을 증명하는 증거로 서 있습니다.
		#LOC_KS_SciDef_magnetometer_Onrefni_InSpaceHigh = 이 거리에서도 Onrefni로부터 놀라울 정도로 풍부한 자기 신호가 방출됩니다. 자기장의 형태는 Kcalbeloh의 압도적인 자기장에 의해 교란되지만, 무언가가 존재합니다. 이 측정값을 확인하려면 더 가까이 다가가야 합니다.
		#LOC_KS_SciDef_magnetometer_Onrefni_InSpaceLow = 붐(boom)은 Onrefni가 크기에 비해 다소 강한 자기 신호를 포착함에 따라, 이 왜소행성이 거대하고 비례적으로 엄청난 금속 핵을 가지고 있다는 이론에 신빙성을 더해줍니다.
		#LOC_KS_SciDef_magnetometer_Rouqea_InSpaceHigh = Rouqea의 높은 궤도에서 자기계 실험을 수행하는 동안 자기장이 감지되지 않았습니다.
		#LOC_KS_SciDef_magnetometer_Rouqea_InSpaceLow = Rouqea 주변 낮은 궤도에서의 자기계 측정값은 약하지만 감지 가능한 자기장을 나타냅니다.
		#LOC_KS_SciDef_magnetometer_Sedah_InSpaceHigh = 자기계 측정 결과, Sedah는 더 큰 대응 천체인 Jool에 비해 질량이 낮아 상대적으로 약한 자기장을 가진 것으로 나타났습니다. 그러나 여전히 감지 가능한 자기 변동이 있어 Sedah의 대기에 어느 정도 자기 활동이 존재함을 시사합니다.
