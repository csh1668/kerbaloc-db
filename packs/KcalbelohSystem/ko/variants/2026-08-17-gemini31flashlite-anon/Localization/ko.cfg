		#LOC_KS_SciDef_atmosphereAnalysis_Mehtna_FlyingLow = 대기 분석기에 따르면 이 행성의 옅은 대기는 주로 이산화탄소와 수증기, 그리고 적절한 양의 미량 가스로 구성되어 있습니다. Mehtna는 대기 자원 채취를 위한 최적의 후보지입니다!
		#LOC_KS_SciDef_atmosphereAnalysis_Mehtna_SrfLanded = 대기 분석기에 따르면 이 행성의 옅은 대기는 주로 이산화탄소와 수증기, 그리고 적절한 양의 미량 가스로 구성되어 있습니다. Mehtna는 대기 자원 채취를 위한 최적의 후보지입니다!
