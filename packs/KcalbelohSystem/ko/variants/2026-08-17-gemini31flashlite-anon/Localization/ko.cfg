		#LOC_KS_SciDef_dmSoilMoisture_Suluco_InSpaceLow = L-대역 마이크로파 방출은 Suluco 표면 대부분에서 상당히 일정하지만, 안테나가 낮 반구 위를 지나갈 때 측정값은 항성 직하점 위에서 기본적으로 0으로 점차 떨어집니다.
