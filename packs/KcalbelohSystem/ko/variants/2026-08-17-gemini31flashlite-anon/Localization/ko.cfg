		#LOC_KS_SciDef_evaReport_Dipuc_InSpaceHigh1 = Kerbol과 유사한 항성 주위를 도는 차가운 사막 세계의 유일한 위성은 <color=#000000>[이미 알고 계시겠지만, 아인슈타인-로젠 다리는 포함되지 않습니다]</color> 멀리서 보기에는 다소 평범한 곳이지만, 자세히 관찰하면 더 많은 것을 발견할 수 있을지도 모릅니다. Dipuc의 영향권으로 이끄는 조우가 의도치 않았거나 비정상적인 데이터 <color=#000000>[읽기: SOI 글리치]</color>로 인해 발생한 경우가 아니라면, 더 자세히 조사하기 위해 Dipuc에 가까이 다가가는 것을 고려해 보십시오.
