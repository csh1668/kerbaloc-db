		#LOC_KS_SciDef_crewReport_Dipuc_InSpaceLow1 = Dipuc의 반죽 같은 위성은 적절하게 울퉁불퉁해 보이지만, 낮은 위도에는 활발한 화산 활동을 나타내는 여러 돌출부가 있습니다. 이러한 화산 구조의 원인과 작동 방식은 현재 알려지지 않았지만, 내부 조석 교란이 유력한 가능성입니다.
		#LOC_KS_SciDef_crewReport_Dipuc_InSpaceLow2 = 표면으로 더 하강하시겠습니까? 그렇다면 Dipuc 저궤도나 근처의 우주선으로 돌아갈 자원을 충분히 준비했기를 바랍니다. Dipuc에서 더 상승하시겠습니까? 이번 방문이 의도적인 것이고... 변칙적인 중력 상황의 결과가 아니라는 가정하에, 그 근처에서의 체류를 즐기셨기를 바랍니다. 이곳에 머물 생각이라면 의도된 것이라 추측하겠습니다. 그렇지 않다면 냉동 포드와 Glykerol 예비품을 갖추는 편이 좋을 것입니다. 그렇지 않으면 사용 가능한 재활용 모듈이 있더라도 생명 유지 자원이 꾸준히 고갈될 것입니다.\n\n\n...생명 유지 모드나 DeepFreeze를 설치하지 않으셨군요, 그렇죠?
		#LOC_KS_SciDef_crewReport_Dipuc_InSpaceLow3 = 이 위성은 [다시 칠한 Mun]보다 더 큰 권태를 유발합니다. [Ares]로 돌아갈 수 있을까요? 저는 거대한 반죽 덩어리 주위를 도는 것이 싫습니다. 심지어 먹을 수도 없는 것인데 말이죠.\n\n\n권고: 쉽게 상하는 재료나 달걀이 포함된 날 반죽이나 빵 반죽을 섭취하지 마십시오. 잠재적으로 위험한 물질이나 병원균이 포함되어 있을 수 있으며, 특히 달걀의 내부 성분이 반죽의 재료로 들어간 경우에는 더욱 그렇습니다. -Mortimer
		#LOC_KS_SciDef_crewReport_Dipuc_InSpaceLow4 = 저 산악 지대들은 우리에게 닿을 수 없겠지... 훌륭해, 내려가서 표면을 샘플링하고 구성 성분과 맛을 확인해보자! 오, 표면을 먹을 수 없다고? 그럼 우리는 왜 여기 있는 거지? Rouquea에서 트라우마를 겪은 커벌들을 고약한 유머 스타일의 노출 치료로 다시 트라우마를 겪게 하려는 건가?
		#LOC_KS_SciDef_crewReport_Dipuc_SrfLanded_CraterEast = 동쪽 분화구... 본초 자오선에서 동쪽으로 얼마나 떨어져 있습니까? 그리고 무엇이 특정 경도를 본초 자오선으로 정의합니까? 자연적이든 아니든, 어떤 정의적 특징이 특정 Dipuc 자오선을 본초 자오선으로 선택할 근거가 됩니까?\n\n\n아니요, Gene, 이건 게임 내 설정에 관한 겁니다. Dipuc의 색상 지도에서 가장 가운데에 있는 수직선을 사용하는 것은 게임 내에서 타당한 이유가 되지 않습니다. 그리고 그 후자의 시나리오가 가진 위선을 고려했을 때, 산맥에서 Rouquea의 영향을 받은 커벌을 위로하려고 시도하기 전입니까, 후입니까?
