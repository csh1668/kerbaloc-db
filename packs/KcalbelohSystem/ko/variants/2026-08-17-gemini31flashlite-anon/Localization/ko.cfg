		#LOC_KS_SciDef_temperatureScan_Suluco_FlyingHigh = Suluco 상층 대기에서 온도 스캔을 수행한 결과 흥미로운 온도 패턴이 밝혀졌습니다. Suluco는 Sunorc에 조석 고정되어 한쪽은 영원한 낮, 다른 쪽은 영원한 밤이 지속되므로, 상층 대기는 낮과 밤 반구 사이에 뚜렷한 온도 차이를 보입니다.
