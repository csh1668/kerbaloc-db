		#LOC_KS_SciDef_atmosphereAnalysis_Efil_FlyingHigh = Efil의 상층 대기로 상승하며 희박한 대기를 관측했습니다. 가스가 드물게 분포하고 빛을 산란시키는 미세 입자가 풍부하여 하늘에 신비로운 빛을 더합니다. 이온화된 입자의 존재는 전하를 띤 입자들의 천체 발레를 암시하며, 이 경외심을 불러일으키는 행성의 가장 높은 곳을 장식하는 영묘한 오로라를 형성합니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Efil_FlyingLow = Efil의 하층 대기에 진입하여 대기 분석을 수행한 결과, 산소 농도가 높고 질소와 미량 원소가 섬세하게 균형을 이룬 역동적인 가스 상호작용이 밝혀졌습니다. 공기 중에는 향기로운 화합물의 흔적이 있어 풍경을 수놓은 활기찬 꽃들의 향기를 연상시킵니다.
