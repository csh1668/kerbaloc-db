		#LOC_KS_SciDef_evaReport_Dipuc_InSpaceHigh4 = Dipuc은 움푹 파인 곳이 많은 멋진 장소입니다. 저위도 지역에는 융기된 구역과 붉은 중앙 봉우리가 있어 마치 피부의 여드름 같은 구조물들이 있는 것처럼 보입니다.\n\n오, 저게 화산 원뿔이라고요? 더 짙은 붉은색을 띠는 것을 보니 그 안에 담긴 용암은... 차가워 보입니다. 어쩌면 Dipuc은 과거에 지질학적으로 더 활발하고 격렬했을지도 모릅니다. Mun의 바다와 닮은 더 어두운 지역들이 보이고, 그중 일부는 더 큰 분화구 안에도 있군요. 이 행성은 오늘날보다 과거에 훨씬 더 흥미로웠을지도 모릅니다. 누가 알겠습니까?
		#LOC_KS_SciDef_evaReport_Dipuc_InSpaceLow_CraterEast = 동부 거대 분화구는 실망스러울 정도로 평평한 틈새로, 표면에서 보면 마치 매우 건조한 그랜드 캐니언에 서 있는 듯한 인상을 줍니다... 혹은 바위가 섞인 유체에 완전히 잠길 듯한 거대한 진흙 사태가 동심원 형태로 모여 있는 것 같기도 합니다. 시각적 스캔 결과, 주변의 고지대 및 산악 지역과 약간의 색상 차이가 나는 것을 제외하면 특별히 주목할 만한 점은 없습니다.
		#LOC_KS_SciDef_evaReport_Dipuc_InSpaceLow_CraterSouth = 아, 남쪽 거대 분화구군요! 광활하고... 평평한... 분지입니다. 특징이 뚜렷한 위성의 특징적인 분화구라는 점을 고려하면 꽤 직관적입니다. 중앙 봉우리가 있을 법도 하지만, 광학 및 중력 스캔 결과 침식된 중앙 봉우리의 흔적조차 발견되지 않았습니다.
		#LOC_KS_SciDef_evaReport_Dipuc_InSpaceLow_CraterWest = 서쪽 거대 분화구 위에서는 특별히 주목할 만한 점이 없습니다. 분화구를 감싸고 있는 고지대 및 중고지대보다 약간 어두운 표면 색조, 중앙 봉우리의 부재, 그리고 바닥 근처의 넓은 협곡 벽을 바라보는 것과 비슷할 수 있는 표면의 괜찮은 전망 외에는 별다른 것이 없습니다.
		#LOC_KS_SciDef_evaReport_Dipuc_InSpaceLow_DoubleCrater = 이중 크레이터 충돌 분지는 주로 두 개의 충돌 크레이터로 구성되어 있습니다. 작은 크레이터의 가장자리가 넓은 이웃 크레이터를 침범하고 있는 것으로 보아, 하나는 더 오래된 큰 크레이터이고 다른 하나는 더 젊은 작은 크레이터임을 알 수 있습니다. 눈썰미 좋은 커벌이라면 두 크레이터의 중심부와 이 복합체를 둘러싼 저지대 및 중고도 지역 사이의 미세한 색상 차이를 발견할 수 있을 것입니다. 굳어진 화성암이 더 어두운 색조를 띠는 경향을 고려할 때, 중심부는 과거에 광범위한 마그마 활동이 있었을 가능성이 있는 후보지이며, 이는 이곳과 Dipuc의 다른 주요 크레이터들에 중앙 봉우리가 없는 이유를 설명해 줄 수 있습니다.
		#LOC_KS_SciDef_evaReport_Dipuc_InSpaceLow_Highlands = 고지대는 전반적으로 고도가 높아 외관상 더 울퉁불퉁하고 우주선과 더 가까워 보입니다. 물론 우주선이 위험할 정도로 낮은 고도에서 궤도를 돌고 있다면, 충돌 위험이 크기 때문에 근접성에 대한 인식은 별 의미가 없을 것입니다.
		#LOC_KS_SciDef_evaReport_Dipuc_InSpaceLow_Lowlands = Dipuc의 저지대는 여기서 보기에 비교적 평평해 보이며, 간헐적으로 활동하는 화산과 함께 평원을 점점이 찍는 물결 모양의 '사구'가 있습니다. 현재 달의 조명이 비치는 쪽에 있다고 가정하면, 표면 색조는 빵 반죽과 매우 흡사합니다.
		#LOC_KS_SciDef_evaReport_Dipuc_InSpaceLow_Midlands = 저지대와 마찬가지로, 미들랜드는 색조가 갓 구운 빵 반죽과 비슷하지만, 이 지역 특유의 울퉁불퉁한 지형 때문에 더 덩어리져 보입니다.\n\nDipuc의 색조가 빵 반죽과 비슷하고 민무스(Minmus)가 민트 아이스크림과 비슷하다면, 스파게티나 피자를 닮은 행성도 있을까요?\n\n\n\n아니요, 이오(Io)는 제외입니다. 현재 추측은 게임 내 천체에 관한 것이니까요.
		#LOC_KS_SciDef_evaReport_Dipuc_InSpaceLow_Mountains = 우주선과 산맥의 근접성은... 눈부실 정도로 위협적입니다. 몇몇 산맥의 선형성은 파도처럼 보입니다. 대기가 없고 산맥이 크림색을 띤 갈색이 아니었다면, Rouquea를 정기적으로 순환하는 거대한 조류로 착각했을지도 모릅니다.\n\nDipuc의 중력 매개변수를 고려할 때, 민무스에서와 마찬가지로 산악 지대에 착륙한 뒤 EVA 추진제만 사용하여 저궤도 우주선으로 복귀하는 것이 가능합니다.
		#LOC_KS_SciDef_evaReport_Dipuc_InSpaceLow_Poles = 극지방에는 식수, 이산화탄소, 메탄, 암모니아 등 그 어떤 종류의 얼음도 존재하지 않으며, 민무스와 비슷한 크기와 질량을 가진 작은 진공 상태의 세계인 Dipuc의 상태를 고려할 때 존재할 것으로 예상되지도 않습니다. 극지방 자체는 저위도의 나머지 표면과 매우 유사해 보이지만, 이곳에는 화산 활동이 없습니다.
		#LOC_KS_SciDef_evaReport_Dipuc_InSpaceLow_Volcano = Dipuc처럼 작은 세계에서의 화산 활동은 이상하게 들립니다. 이곳의 화산은 외관상 성층화산 구조로 보입니다. 화산 원뿔은 Dipuc의 시간 척도로 볼 때 최근으로 간주되는 반복적인 분출로 인해 여러 화성암과 화산 분출물이 반복적으로 쌓인 층으로 구성되어 있습니다. 가파르고 경사진 지형 때문에 이곳에 착륙하는 것은 불가능해 보입니다.
		#LOC_KS_SciDef_evaReport_Dipuc_InSpaceLow_VolcanoVent = 화산 분출구의 내부가 백열을 띠며 녹아 있는 것으로 보아 활동 중인 것으로 보입니다. 열 감지 수치상 온도의 변화는 없습니다. 지금은 이곳이 안전합니다. 임무의 일원으로서 계속해서 살아 숨 쉬며 활동하려면 <color=#FF6A00>활성 화산 분출구 위로 더 이상 하강하지 마십시오.</color> 우주선에 조종석이 있다고 가정할 때, 대기가 순수 산소로만 이루어져 있지 않은지도 확인하십시오. 순수 산소 대기에서는 가연성이 높은 물질이 최대 작동 온도를 초과하는 온도에서 자연 발화할 가능성이 큽니다.
		#LOC_KS_SciDef_evaReport_Dipuc_SrfLanded_CraterEast = 동부 거대 크레이터는 Dipuc의 평범한 지형을 가로지르는 거대한 협곡처럼 보입니다. 고원과 산맥이 사방에서 이 크레이터를 둘러싸고 있기 때문입니다. 다른 크레이터들과 마찬가지로 이곳의 지표면 색상은 주변보다 눈에 띄게 어두우며, 특히 주변의 중부 지대 및 고원 지대와 비교했을 때 그 차이가 두드러집니다. 이곳의 암석은 상당히 변성된 것으로 보이며, 지표면은 이곳의 일반적인 생물 군계의 특징인 울퉁불퉁하고 바위가 많으며 먼지가 많은 지형보다 더 매끄럽고 단단합니다.
		#LOC_KS_SciDef_evaReport_Dipuc_SrfLanded_CraterSouth = 남부 거대 크레이터의 평탄한 지역은 주변을 둘러싼 대부분의 지형보다 고도가 낮습니다. 지표면의 암석들은 남부 거대 크레이터를 처음 생성한 충돌 사건으로 인한 이전의 변성 활동을 나타냅니다. 이곳의 암석 색조 또한 주변 지형보다 약간 어둡게 보이는데, 아마도 충돌 사건 때문일까요? Dipuc의 활발한 화산 분출구를 고려하면 변성암과 화성암이 섞여 크레이터 바닥을 구성하고 있다고 추측할 수 있지만, 현재 지표면의 모습은 그러한 가정과는 다르게 보입니다.
		#LOC_KS_SciDef_evaReport_Dipuc_SrfLanded_CraterWest = 서부 거대 크레이터의 평균 고도는 다른 크레이터들과 비슷하며, 주변 지형보다 눈에 띄게 낮습니다. 이곳의 암석은 다소 부서져 가루처럼 보이며 문(Mun)의 위험한 레골리스와 닮았지만, 마치 지형학적 과정이 일어나 작은 암석들이 지표면에 압축된 것처럼 지면에 완전히 고정되어 있습니다. 또한 크레이터의 전체적인 색조는 주변 지형보다 어둡습니다. 아마도 충돌 때문이거나, 충돌 당시와 직후의 조건으로 인해 발생한 지역 특유의 레골리스 때문일까요? 참고로 서부 거대 크레이터를 둘러싼 지형은 협곡처럼 보입니다.
		#LOC_KS_SciDef_evaReport_Dipuc_SrfLanded_DoubleCrater = 이중 분화구 지역의 평균 고도는 저지대보다 눈에 띄게 낮습니다. 표면 색상은 주변 지형보다 어둡고 암석 질감도 다릅니다. 이중 충돌로 인해 이 지역에 상당한 격렬한 환경 변화가 발생했음을 고려하면 예상대로 암석은 다소 변성된 것처럼 보입니다.
		#LOC_KS_SciDef_evaReport_Dipuc_SrfLanded_Highlands = 고지대는 Dipuc 표면의 다른 지역에 비해 예상대로 높은 고도를 보이며, 중지대 및 저지대와 유사한 구성을 가지고 있습니다. 이곳의 지형은 중지대보다 더 울퉁불퉁하고 가파릅니다. 가파른 경사면과 모래 언덕 같은 구조물 근처를 탐사할 때는 각별히 주의할 것을 권장합니다. 이곳의 입자, 아니 돌덩이들의 크기가 상당히 커서 소형 탐사 차량의 이동에 방해가 됩니다.
		#LOC_KS_SciDef_evaReport_Dipuc_SrfLanded_Lowlands = 저지대는 주변 지형에 비해 예상대로 낮은 고도를 보이며, 완만한 경사와 모래 언덕 같은 언덕들이 저지대 전체를 감싸고 있습니다. 표면 구성은 중지대나 고지대에서 발견되는 것과 비슷하지만, 다른 생물군계보다 더 미세한 입자들이 섞인 느슨한 레골리스처럼 보입니다. 전 지구를 덮는 바다가 없어 기준점으로 삼을 만한 곳이 없는데, 도대체 평균 '해수면' 표면 고도는 어떻게 측정하는 것인지 궁금합니다.
