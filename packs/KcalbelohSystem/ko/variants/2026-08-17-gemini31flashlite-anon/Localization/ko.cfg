		#autoLOC_RBodies_discovery_Ahtpan = 흠, 커볼처럼 노란색이군요. 하지만 그렇게 따뜻해 보이지는 않습니다. 밥은 우리가 이걸 점화해서 무슨 일이 일어나는지 확인해봐야 한다고 합니다.
		#autoLOC_RBodies_discovery_Anehta = 놀랍군요! 이 행성은 주변과 내부에 거대한 띠를 두르고 있습니다! 지표면에서 보면 어떤 모습일지 궁금하네요.
		#autoLOC_RBodies_discovery_Anneheg = 와, 정말 뜨거운 암석이군요! 빛까지 납니다!
		#autoLOC_RBodies_discovery_AralcA = 이 별은 너무 밝아서 젭이 거의 눈이 멀 뻔했습니다! 지금까지 이걸 발견하지 못했다는 게 믿기지 않습니다!
		#autoLOC_RBodies_discovery_AralcB = 이 별은 커볼에 비하면 보잘것없지만... 다른 별과 함께 춤을 추듯 움직이는 것 같습니다.
		#autoLOC_RBodies_discovery_Arorua = 이 행성은... 놀라운 패턴으로 반짝이며 빛나는 것 같습니다. 더 많은 사진이 필요합니다.
		#autoLOC_RBodies_discovery_Dipuc = 문(Mun)인가요?! 어떻게 저기에 있죠? 아, 잠시만요... 문이 아니네요, 잘못 봤습니다.
		#autoLOC_RBodies_discovery_Efil = 커빈과 거의 비슷하게 생겼군요! 갈 수만 있다면 정말 최고의 장소가 될 겁니다! 물론 갈 수 있다면 말이죠.
		#autoLOC_RBodies_discovery_Elad = 와, 이건 문과 비슷하지만 크기는 거의 커빈만 하군요! 젭은 항상 도전적인 일을 좋아했죠!
		#autoLOC_RBodies_discovery_Enots = 이건 좀 이상합니다... 소행성처럼 작지만, 모양은 기묘한 예술 작품 같군요.
		#autoLOC_RBodies_discovery_Eulb = 이건 문처럼 크지만... 민무스처럼 파란색이네요? 아이스크림이 기다리고 있습니다!
		#autoLOC_RBodies_discovery_Iomena = 이 분화구 가득한 행성에는 우리 이웃인 두나처럼 매우 옅은 대기가 있는 것 같습니다.
		#autoLOC_RBodies_discovery_Kcalbeloh = 빛조차 사라지는 우주의 한 지점을 발견했습니다. 젭의 농담조차 빠져나갈 수 없는 발견입니다! 다음에는 로켓을 잡아먹지 않기를 바랄 뿐입니다!
		#autoLOC_RBodies_discovery_Maelg = 밥은 우리가 좀 더 자세히 보기 전까지는 이 별을 렌즈에 묻은 먼지 정도로 치부할 뻔했습니다. 거대한 가스 행성 같지만, 정말... 정말 뜨겁습니다!
		#autoLOC_RBodies_discovery_Mehtna = 이상하군요, 이 행성은 한쪽 면이 다른 쪽보다 더 뜨거운 것 같습니다. 거기서라면 멋지게 태닝을 할 수 있을지도 모르겠네요.
		#autoLOC_RBodies_discovery_Meiuqer = 와... 이건 정말 작군요. 이렇게 먼 곳에서 무언가를 발견했다는 것 자체가 놀랍습니다.
		#autoLOC_RBodies_discovery_Noi = 이걸 문이라고 부를 수 있을지 모르겠군요, 차라리 소행성에 가깝습니다... 표면에 붙어 있을 수 있을까요, 아니면 그냥 떠다니게 될까요?
		#autoLOC_RBodies_discovery_Noira = 이 문은... 거꾸로 공전하고 있나요? 이상하군요. 표면에 있는 커다란 흠집과 관련이 있는 걸까요?
		#autoLOC_RBodies_discovery_Norihc = 이 거대한 암석은... 희미하고... 차갑다고밖에 표현할 수 없겠군요.
		#autoLOC_RBodies_discovery_Noyreg = 간식?! 대박을 터뜨렸습니다!!!! 아, 잠시만요... 독성이 있다고요? 그럼 간식은 없는 건가요?
		#autoLOC_RBodies_discovery_Onrefni = 이 행성은 조각들 사이에 녹아내린 용암이 빛나는 퍼즐 조각처럼 보입니다.
		#autoLOC_RBodies_discovery_Rouqea = 처음 봤을 때 우리 최고의 과학자들은 누군가 이미지에 식수를 쏟은 줄 알았습니다... 알고 보니 물의 행성이었더군요!
		#autoLOC_RBodies_discovery_Sedah = 새로운 종류의 아이스크림인가요?! 꽤 크군요... 아, 신경 쓰지 마세요. 쥴과 비슷하지만 분홍색이네요. 이상합니다.
		#autoLOC_RBodies_discovery_Sera = 이건 두나와 좀 비슷하군요! 매우 붉지만 더 큽니다. 젭은 이게 경주용 자동차를 떠올리게 해서 좋아합니다. 줄무늬까지 있거든요!
		#autoLOC_RBodies_discovery_Simeht = 아이스크림?! 아니네요, 아이스크림치고는 너무 큽니다. 민무스와 색깔은 매우 비슷하지만 훨씬 더 큽니다.
		#autoLOC_RBodies_discovery_Simetra = 와, 정말 큰 암석이군요! 아, 아니네요, 그냥 암석 색깔일 뿐이군요... 가스가 정말 많은 것 같은데, 무슨 냄새가 날지 궁금하네요.
		#autoLOC_RBodies_discovery_Suluco = 처음에는 이 암석이 황량한 줄 알았는데, 자세히 보니 얼어붙어 있더군요. 밥은 거기서 휴가를 보내고 싶다고 하던데, 우리가 보기엔 그가 미친 것 같습니다.
		#autoLOC_RBodies_discovery_Sunorc = 망원경을 통해 작은 빛의 점이 나타났습니다. 반사광인 줄 알았는데, 아니군요, 별입니다!
		#autoLOC_RBodies_discovery_Tot = 이건 작군요... 소행성 같아요! 민무스의 친구가 되어주게 커빈으로 끌고 올 수 있을까요?
		#autoLOC_RBodies_discovery_Uleg = 아이스크림?! 아니네요... 그냥 얼음인 것 같습니다. 뭐, 그래도 발견했을 때는 신났었죠.
		#autoLOC_RBodies_discovery_WH3141A = 우리는... 변칙 현상으로 보이는 것을 발견했습니다. 빛이 이 주변에서 제대로 작동하지 않습니다. 조사가 필요합니다!
		#autoLOC_RBodies_discovery_WH3141B = 이상하군요, 일종의 변칙 현상입니다... 이 물체가 무엇인지 정확히 파악할 수 없습니다. 임무를 수행해야 할까요? 하지만 너무 멀어서 여행에 필요한 간식을 충분히 챙길 수가 없겠군요.
