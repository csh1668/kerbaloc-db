		#LOC_KS_SciDef_dmseismicHammer_Tot_SrfLanded = 조심하십시오! 부서질 겁니다! 아니, 망치가 아니라 소행성 말입니다, 이 멍청아!
		#LOC_KS_SciDef_dmseismicHammer_Tot_SrfLandedLowlandsCraters = 충격이 예상보다 더 크게 공명하며 Tot의 내부 전체 모습을 명확하게 보여줍니다. 이 소행성은 한때 금속 소행성과 암석 충돌체, 두 개였던 것으로 보입니다. 이는 느슨하게 뭉쳐 공명이 잘 안 되는 암석부터 깊이 들어갈수록 흔해지는 단단한 철과 니켈이 풍부한 구역까지 매우 다양한 구성 성분을 설명하는 가장 쉬운 방법입니다. Tot의 밀도가 높은 이유가 바로 이것일 것입니다.
