		#LOC_KS_SciDef_dmseismicHammer_Eulb_SrfLandedCratersBig = Eulb 내부 분석 결과, 지표면과 마찬가지로 강옥과 같은 산화 알루미늄이 풍부한 밀도 높은 구성임이 밝혀졌습니다.
		#LOC_KS_SciDef_dmseismicHammer_Iomena_SrfLandedRocky = 이곳의 암석은 공명이 잘 되어 센서가 Iomena의 내부 구조를 명확하게 파악할 수 있게 해줍니다. 액체 암모니아 흐름에 의해 침식된 것으로 보이는 큰 지하 동굴이 있으며, 지각의 대부분은 암석으로 구성된 것으로 보입니다. 놀랍게도 식수 얼음은 거의 없습니다.
