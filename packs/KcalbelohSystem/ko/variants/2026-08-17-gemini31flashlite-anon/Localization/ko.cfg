		#LOC_KS_SciDef_evaReport_Dipuc_SrfLanded_Mountains = 해수면 대비 상당한 고도는 이곳의 경우처럼 대기가 있든 없든 상관없이 산맥과 코르디예라를 정의합니다. 고유한 표면 색조는 저지대, 중지대, 고지대와 유사하지만, 질감과 외관은 앞서 언급한 세 생물군계의 관례에서 벗어납니다. 이곳의 지표면 암석은 부분적인 변성 작용을 거친 것으로 보입니다. 또한, 분화된 천체의 핵에 풍부한 악티늄족 및 란타넘족 원소의 농도가 주변 생물군계에 비해 높습니다. 이곳의 변성되지 않은 암석은 소형 및 중형 탐사 차량에 상당한 위험을 초래하지만, 대형 차량은 괜찮을 수 있습니다.
		#LOC_KS_SciDef_evaReport_Dipuc_SrfLanded_Poles = Dipuc의 극지방은 화산 분출구를 제외하면 다른 곳과 마찬가지로 비슷한 색조, 구성, 온도 등 지루함을 유발하는 지형을 보여줍니다. 고위도에서 Sunorc의 복사 에너지가 더 많이 분포한다는 점을 고려하면 온도 수준은 다소 흥미롭지만, 비행 및 선외 활동 시 다른 곳과 마찬가지로 환경적 장애물은 거의 없을 것입니다.
		#LOC_KS_SciDef_evaReport_Dipuc_SrfLanded_Volcano = 화산 지역의 상대적 고도는 당연한 이유로 다른 지역보다 높습니다. 가파른 원뿔 모양과 그만큼 가파른 경사면으로 보아 이 화산은 성층 화산이거나 분석구 화산입니다. 평균 지표면 온도는 이곳이 더 높을 가능성이 크지만, 우리 슈트를 모두 착용한 상태에서는 지상 온도계 수치를 통해서만 감지할 수 있을 것입니다. 이곳에서는 미세 지진 활동도 예상되지만, 자세한 내용은 실제 지진계를 통해 확인하는 것이 좋습니다.
		#LOC_KS_SciDef_evaReport_Dipuc_SrfLanded_VolcanoVent = 매우, 매우 위태로운 상황입니다. 온도가 우주복을 뚫고 들어올 정도로 높고 분출구가 활성화되어 있으니, 분출구 안으로 들어가 연기처럼 사라지고 싶지 않다면 그 위를 떠다니는 것을 권장합니다. 그 점을 제외하면 분출구 벽면에는 화성암이 널려 있는 것으로 보이며, 아래쪽 벽면은 열기로 인해 녹아내린 듯하면서도 변성된 모습입니다. Sera가 이와 관련이 있는 것일까요, 아니면 Dipuc의 화산 활동이 모행성의 메커니즘과는 독립적인 것일까요?\n\n\nAcapello 1호 승무원들처럼 되고 싶지 않다면, 즉시 이 장소를 떠나십시오.
