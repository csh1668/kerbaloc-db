		#LOC_KS_SciDef_dmSIGINT_WH3141A_InSpaceLow = 이 물체에서 이상한 무선 신호가 발신되는 것으로 보입니다. 피드를 모니터링하던 중, 누군가 "안녕!"과 "안전하게 비행해"라고 말하는 소리를 분명히 들었습니다. 고마워요, 미지의 우주 목소리여. 우리는 안전하게 비행할 겁니다!
