		#LOC_KS_SciDef_crewReport_Dipuc_InSpaceHigh1 = 반죽 덩어리입니다. 그렇게 부르기로 했습니다. 민무스가 민트 아이스크림 위성이라면, Dipuc은 반죽 덩어리 위성입니다. 놀랍게도 국제천문연맹(IAU)은 그런 의견에 거의 만장일치로 동의했습니다. 고향에 있는 모두가 유머에 굶주려 있는 모양입니다.\n\n그리고 네, 이곳에도 IAU는 존재합니다. 주로 Dres라고 알려진, 혹은 유머러스하게 "존재하지 않는 왜소행성"이나 "색깔만 바꾼 문"이라고 불리는 그 지루한 왜소행성의 존재를 증명하는 역할을 합니다.
