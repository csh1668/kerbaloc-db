		#LOC_KS_SciDef_rpwsScan_Mehtna_InSpace = Mehtna의 대기는 매우 고요하고 행성에 강력한 자기장이 없으며, Maelg 또한 유의미한 태양풍을 내뿜지 않기 때문에 이곳에서는 감지할 만한 활동이 거의 없습니다.
		#LOC_KS_SciDef_rpwsScan_Meiuqer_InSpace = 이 우주의 작은 구석에는 RPWS 장비가 감지할 만한 것이 거의 정확히 아무것도 없습니다. 전파 활동도, 태양 플라즈마도, 아무것도 없습니다. 하지만 혹시 모르니 확인해 봅니다.
		#LOC_KS_SciDef_rpwsScan_Noi_InSpace = Sunorc에서 불어오는 태양풍은 이 거리에서는 극도로 희박하며, Noi는 마치 잔잔한 시냇물 속의 작은 돌멩이처럼 흐름을 가르는 것 외에는 아무런 영향을 주지 않는 것으로 보입니다.
		#LOC_KS_SciDef_rpwsScan_Noira_InSpace = Simetra와 Simeht에 의해 생성되는 전파 플라즈마 활동만이 감지됩니다. Noira가 하는 일은 그저 흐름을 가르는 것뿐입니다.
		#LOC_KS_SciDef_rpwsScan_Norihc_InSpace = Simetra와 Simeht의 자기권이 Norihc에 의해 왜곡되면서 희미한 교란이 발생합니다.
		#LOC_KS_SciDef_rpwsScan_Noyreg_InSpace = 태양 복사가 Noyreg의 두꺼운 대기에서 하전 입자를 방출하며, 이 입자들이 쌍둥이 거대 행성의 춤추는 자기장과 상호작용하면서 플라즈마 파동을 생성합니다.
		#LOC_KS_SciDef_rpwsScan_Onrefni_InSpaceHigh = Kcalbeloh의 '홀라풍'이 이곳에서 거세게 불어옵니다. 마치 울부짖는 소리가 들리는 것 같지만, 물론 우주에서는 그런 일이 일어나지 않죠. 하지만 그 정적이 오히려 이 광경을 더욱 불안하게 만듭니다...
		#LOC_KS_SciDef_rpwsScan_Onrefni_InSpaceLow = 강력한 자기권을 가지고 있음에도 불구하고, Onrefni는 이른바 '홀라풍'이 표면을 강타하는 것을 막기에는 역부족입니다.
		#LOC_KS_SciDef_rpwsScan_Rouqea_InSpaceHigh = Kcalbeloh의 강착 원반에서 불어오는 블랙홀풍이 Rouqea의 밀도 높은 대기와 흥미로운 상호작용을 일으키고 있지만, 이전에 보았던 것들과 비교하면 그리 특별하지는 않습니다.
		#LOC_KS_SciDef_rpwsScan_Rouqea_InSpaceLow = Rouqea의 두꺼운 대기와 습한 표면은 많은 흥미로운 전파 활동을 만들어냅니다. 이곳은 정말 외계 행성답군요!
		#LOC_KS_SciDef_rpwsScan_Sedah_InSpaceHigh = 에너지를 머금은 플라즈마가 Sedah를 강타하여 흥미로운 반복 패턴의 전파를 만들어내며, 이는 연구실 인력들에게 충분한 연구 데이터를 제공할 것입니다.
		#LOC_KS_SciDef_rpwsScan_Sedah_InSpaceLow = 태양풍이 Sedah의 부푼 대기를 세게 두드리며 행성 내부에서 이상한 신호를 만들어냅니다. 이는 행성 내부에 전류가 흐르고 있음을 시사하며, 이는 많은 내부 열을 발생시켜 행성의 거대한 크기를 설명하는 데 도움이 될 것입니다. 하지만 이 전류가 Jool에 비해 다소 약한 자기장만을 생성하는 것으로 보아, 예상만큼 강력하지는 않은 모양입니다.
		#LOC_KS_SciDef_rpwsScan_Sera_InSpaceHigh = Sera의 자기 꼬리를 통과할 때, 이미 약했던 태양풍이 상당히 줄어듭니다. 다른 측정값들은 Sera의 자기장이 꽤 강하다는 것을 시사합니다.
		#LOC_KS_SciDef_rpwsScan_Sera_InSpaceLow = 하전 입자 고리가 Sera의 낮은 궤도를 감싸고 있는 것으로 보입니다. 틀림없는 위험한 Van Kerman 벨트입니다.
		#LOC_KS_SciDef_rpwsScan_SimeBoth_InSpaceHigh = 두 행성의 자기권과 대기가 상호작용함에 따라, 이 두 행성 사이의 우주 공간에서 매우 복잡한 정전기 환경이 발견됩니다.
		#LOC_KS_SciDef_rpwsScan_SimeSystem_InSpaceHigh = 이 우주 공간은 태양풍을 거의 받지 않기 때문에, 이곳의 거의 모든 전파 활동은 두 개의 거대한 자기장이 서로 상호작용하고 다른 위성들의 대기와 상호작용하면서 생성됩니다.
		#LOC_KS_SciDef_rpwsScan_Simeht_InSpaceLow = Simeht의 다소 작은 대기는 그만큼 약한 전파 방출을 생성하는 것으로 보입니다.
		#LOC_KS_SciDef_rpwsScan_Simetra_InSpaceLow = 강력한 전파가 Simetra의 대기에서 방출되지만, 질량이 약간 작은 Simeht도 매우 근소한 차이로 뒤를 잇고 있습니다.
		#LOC_KS_SciDef_rpwsScan_Suluco_InSpaceHigh = Suluco의 비교적 약한 자기권은 Sunorc의 태양풍을 많이 굴절시키지는 못하지만, 표면의 생명체를 보호하기에는 충분해 보입니다.
		#LOC_KS_SciDef_rpwsScan_Suluco_InSpaceLow = 플라즈마 파동 분석 결과 Suluco의 적도 주변에 하전 입자로 이루어진 확산 고리가 있음이 나타났으며, 이는 희미한 Van Kerman 벨트의 징후입니다.
		#LOC_KS_SciDef_rpwsScan_Sunorc_InSpaceHigh = 대부분의 별이 그렇듯, 이 K형 별은 강력한 태양풍을 방출합니다. Sedah의 자기권과의 상호작용이 주목할 만한데, 행성에서 방출되는 전파가 그 크기에 비해 예상보다 약하기 때문입니다.
		#LOC_KS_SciDef_rpwsScan_Sunorc_InSpaceLow = 장비가 Sunorc 표면에서 방출되는 전파를 분석하는 동안 수많은 흑점이 감지됩니다.
		#LOC_KS_SciDef_rpwsScan_Tot_InSpace = Sunorc에서 불어오는 태양풍은 이곳에서 강하며, Suluco의 자기 꼬리나 Tot의 그림자를 통과할 때만 실제로 약해집니다.
		#LOC_KS_SciDef_rpwsScan_Uleg_InSpace = 전파 플라즈마 환경은 Uleg의 궤도상 위치에 따라 극적으로 변합니다. Apobeloh 근처에서는 매우 조용하지만, Peribeloh에서는 Kcalbeloh에서 불어오는 '홀라풍'을 아주 미세하게나마 느낄 수 있습니다.
		#LOC_KS_SciDef_rpwsScan_Wormholes_InSpace = 웜홀 양 끝의 태양풍에서 발생한 플라즈마가 이곳에서 상호작용하며, 이전에 본 적 없는 복잡한 태양풍 환경을 형성하고 있습니다.
		#LOC_KS_SciDef_scopeScan_Ahtpan_InSpaceHigh = 검은 황금의 바다로 뒤덮인 행성이라는 전망은 거부하기엔 너무나 매력적이었습니다. 그래서 망원경을 Ahtpan으로 돌리고 촬영을 시작합니다.
		#LOC_KS_SciDef_scopeScan_Ahtpan_InSpaceLowCraters = Ahtpan은 상당히 두꺼운 대기를 가지고 있어서, 이를 뚫고 들어오는 소수의 충돌체들은 규모가 클 수밖에 없습니다. 이 크레이터들의 크기가 바로 그 증거입니다.
		#LOC_KS_SciDef_scopeScan_Ahtpan_InSpaceLowGeneric = Ahtpan은 공상과학 영화에서나 나올 법한 사막 행성처럼 보입니다. 하지만 지금까지 어떤 공상과학 작가도 기름의 바다를 상상할 만큼 영감을 받지는 못했습니다! 현실이 소설보다 더 기묘하고, 어쩌면 더 멋지기까지 한 것 같습니다. 우주 공중전은 좀 덜하겠지만요...
		#LOC_KS_SciDef_scopeScan_Ahtpan_InSpaceLowIslands = 적절한 가격의 OOOIIIILLLLL만 있다면 무엇이든 사고팔 수 있습니다!
		#LOC_KS_SciDef_scopeScan_Ahtpan_InSpaceLowMountains = Ahtpan의 산맥은 더 붉은 색조를 띠고 있어, 베이지색 표면의 나머지 부분과 멋진 대조를 이룹니다.
		#LOC_KS_SciDef_scopeScan_Ahtpan_InSpaceLowNaphthaOceansCoast = 이 사진들은 석유 산업으로부터 충분한 자금을 확보하는 데 확실히 도움이 될 것입니다.
		#LOC_KS_SciDef_scopeScan_Anehta_InSpaceHigh = Anehta의 청백색 고리는 색상 면에서 가스 거인과 매우 흡사한데, 어떻게 이런 일이 가능할까요? Anehta는 항성의 결빙선 안쪽에 위치하므로 얼음일 리는 없습니다. 아마도 고리는 Eulb와 같은 물질로 이루어져 있을지도 모릅니다.
		#LOC_KS_SciDef_scopeScan_Anehta_InSpaceLow = 아래로 보이는 푸른 하늘은 꽤 아름다운 광경을 연출하며, 거대한 수증기 탑을 장관으로 포착합니다. 커빈 전체가 이 폭풍 중 일부에 들어갈 수 있을 것이라고 확신합니다.
		#LOC_KS_SciDef_scopeScan_Anneheg_InSpaceHigh = Anneheg는 눈부신 빛의 바다 속에서, 특히 화성암 표면이 어둡기 때문에 식별하기 어렵습니다.
		#LOC_KS_SciDef_scopeScan_Anneheg_InSpaceLow = Anneheg의 소용돌이치는 유리 같은 지형은 행성 표면이 얼마나 심하게 손상되었는지를 보여줍니다. Aralc-A로부터 이 거리에서 형성되었을 가능성은 낮으며, 그랬다면 오래전에 파괴되었을 것입니다.
		#LOC_KS_SciDef_scopeScan_Anneheg_InSpaceLowLava = Anneheg의 용암 바다는 열린 상처처럼 행성을 가로질러 뻗어 있습니다. Aralc-A가 이 행성을 산산조각 내고 있습니다.
		#LOC_KS_SciDef_scopeScan_AralcA_InSpace = 내 눈!!!
		#LOC_KS_SciDef_scopeScan_AralcB_InSpace = 적색 왜성일지라도 여전히 별입니다. 민감한 행성 관측 망원경을 그곳으로 향하는 것은 좋지 않은 결정입니다.
		#LOC_KS_SciDef_scopeScan_Arorua_InSpaceHigh = Arorua의 오로라가 아래에서 찬란하게 빛나고 있으며, 왜 더 불투명한 구름으로 덮여 있지 않은지 의문이 듭니다. 한때는 그랬을지도 모르지만, 강렬한 햇빛이 그것들마저 날려버린 것 같습니다.
		#LOC_KS_SciDef_scopeScan_Arorua_InSpaceLowCliffsAll = 이 절벽들은 꽤 날카롭습니다. 좋은 관광지가 될지도 모르겠습니다.
		#LOC_KS_SciDef_scopeScan_Arorua_InSpaceLowGeneric = Arorua의 표면은 대부분 언덕이 많고 어둡지만, 강렬한 햇빛 아래에서는 유리처럼 빛납니다. 어쩌면 그중 일부는 정말 유리일지도 모릅니다!
		#LOC_KS_SciDef_scopeScan_Arorua_InSpaceLowMountainsAll = Aralc의 산맥은 더 어두운 저지대를 배경으로 강조되며 하층 대기를 뚫고 빛납니다.
		#LOC_KS_SciDef_scopeScan_Arorua_InSpaceLowSubstellarPoint = Aralc-B를 마주 보는 지점은 별다른 특징이 없지만, 이곳이 모든 햇빛이 집중되는 지점이라는 것을 알면 그곳이 얼마나 뜨거울지 궁금해집니다.
		#LOC_KS_SciDef_scopeScan_Dipuc_InSpaceHigh = 이 위성은 잘 반죽된 반죽 덩어리를 조금 떠올리게 합니다. 화산 활동으로 미루어 볼 때, 스스로를 잘 굽고 있는 것으로 보입니다.
		#LOC_KS_SciDef_scopeScan_Dipuc_InSpaceLowCraterSouthCraterEast = 충돌 분출물이 이 크레이터에서 햇살처럼 뻗어 나옵니다. 와, 저 선들이 정말 멀리까지 뻗어 있네요! 이 크레이터를 만든 것은 엄청난 에너지를 가지고 있었던 게 분명합니다.
		#LOC_KS_SciDef_scopeScan_Dipuc_InSpaceLowCraterWest = 이 꽤 큰 크레이터는 가장 큰 두 개의 크레이터보다는 덜 극적이며, 충돌 분출물이 부족한 점이 이를 보여줍니다.
		#LOC_KS_SciDef_scopeScan_Dipuc_InSpaceLowDoubleCrater = 지질학적으로 말하자면, 이것은 전혀 드문 지형이 아닙니다. 하지만 이 두 크레이터의 가장자리가 서로 겹치는 모습을 보는 것은 여전히 흥미롭습니다.
		#LOC_KS_SciDef_scopeScan_Dipuc_InSpaceLowGeneric = Dipuc의 재난으로 뒤덮인 크레이터 표면은 지상에서 보면 멋진 광경을 연출할 것입니다. 이만큼 흥미로운 대기가 없는 위성은 흔치 않습니다. 왜냐하면, 적어도 Sera만큼이나 독특하니까요!
		#LOC_KS_SciDef_scopeScan_Dipuc_InSpaceLowMountains = 이 뚜렷한 산등성이는 망원경으로 아주 선명하게 보이며, 아래 표면에 드리운 그림자를 인상적인 이미지로 포착합니다.
		#LOC_KS_SciDef_scopeScan_Dipuc_InSpaceLowVolcano = Dipuc의 화산들은 모두 끊임없이 활동하며, 작은 분화가 꽤 규칙적으로 일어납니다. 망원경은 Dipuc에서 뿜어져 나와 아마도 Sera 궤도로 향하는 우산 모양의 가스와 먼지 기둥을 포착합니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceHigh = 완벽한 푸른 구슬처럼, Efil은 망원경 속에서 청록색 음영으로 빛납니다. 사진으로는 Efil의 아름다움을 온전히 담을 수 없지만, 적어도 그 일부라도 보존할 수는 있습니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceLowGrassland = Efil의 저지대에는 완만한 녹색 언덕이 펼쳐져 있으며, 꽃밭이 점점이 박혀 있고 마치 거장의 그림처럼 열대우림이 그 주위를 감싸고 있습니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceLowMountainsSnowMountains = Efil의 봉우리들은 마치 주변의 아름다운 풍경을 더 잘 보기 위해 구름 위로 고개를 내밀고 있습니다. 의심할 여지 없이 그곳에는 생명체가 별로 살지 않겠지만, 그곳에는 일종의 평화로움이 있지 않습니까? 그런 봉우리 꼭대기에 서 있다면, 분명 평온함만을 느낄 것입니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceLowNeedleleafForests = Efil의 북극 숲은 따뜻한 기후만큼이나 울창하고 생명력이 넘치며, 광활한 미개척 야생 지대가 눈으로 덮여 있습니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceLowRainforests = 청록색 잎을 가진 외계 나무들의 울창한 열대우림이 행성 표면의 대부분을 덮고 있어, 거대한 짐승들이 여전히 세상을 배회하던 낭만적인 고대 커빈의 이미지를 떠올리게 합니다. 하지만 그 버전의 커빈은 오래전에 사라졌음에도 불구하고, Efil은 이곳에 분명히 실재하며 떠 있습니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceLowTropicalDesert = Efil의 열대 사막은 행성의 다른 지역보다 살기 힘들지는 몰라도, 그만큼 아름답습니다. 모래 언덕은 다른 곳의 풀 언덕처럼 물결치며, 모래에 남겨진 긴 발자국들로 보아 강인한 사막 동물 무리가 배회하고 있음이 분명합니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceLowTundraColdDesert = Efil의 춥고 황량한 지역은 행성의 나머지 부분을 감싸고 있는 아름다움이 결여된 몇 안 되는 곳 중 하나입니다. 대신, 그곳은 황량하고 대부분 생명체가 없습니다. Efil이라는 생기 넘치는 세상에 남아 있는 몇 안 되는 황무지 조각들입니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceLowWater = Efil의 바다는 쌍둥이 태양의 빛을 받아 고전 공상과학 소설 표지에서 튀어나온 듯한 밝은 청록색으로 빛납니다.
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceHigh = 연구 개발팀에 따르면 이 기이한 지표면 특징은 Elad가 최근 두꺼운 대기와 아마도 바다까지 잃어버렸다는 사실로만 설명할 수 있다고 합니다. 너무나 황량해 보입니다... 정말 그럴까요?
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceLowCraterGiant = 이 거대한 분화구는 Elad의 대기 소실 원인이 되었을 만큼 크지만, 확실히 단정할 수는 없습니다.
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceLowCraterLarge = Elad에는 이런 거대한 분화구가 여러 개 흩어져 있으며, 모두 상당히 최근에 형성된 지형으로 보입니다.
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceLowCraters = 인근의 Eulb와 같은 다른 천체들에 비해 분화구가 드문드문하다는 점은 Elad가 비교적 최근까지 두꺼운 대기를 가지고 있었다는 가설에 큰 힘을 실어줍니다.
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceLowGeneric = Elad의 황무지는 Efil의 푸른 언덕과 수정 같은 바다와 극명한 대조를 이루며, 우주에서 생명이 얼마나 취약한지를 엄숙하게 상기시켜 줍니다.
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceLowGrandCanyon = 이 협곡은 너무 가파르고 깊어서 한때 해구였던 것이 분명합니다.
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceLowGrandCliff = 와. 저것이야말로 진정한 절벽이군요. 저렇게 거대한 능선이 생기려면 격렬한 판 구조 운동이 있었음이 틀림없습니다.
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceLowValleys = Elad는 과거에 활발한 판 구조 운동이 있었다는 명확한 증거인 깊은 협곡과 열곡으로 뒤덮여 있습니다.
		#LOC_KS_SciDef_scopeScan_Enots_InSpaceHigh = 잠시만 기다려 보십시오! 누군가 정말로 이 물건을 "enotS"라고 이름 지은 겁니까? 그게 무슨 이름입니까?
		#LOC_KS_SciDef_scopeScan_Enots_InSpaceLow = 이 작은 위성은 누군가 셰일 암석을 크게 떼어내 궤도에 던져놓은 것처럼 보입니다.
		#LOC_KS_SciDef_scopeScan_Eulb_InSpaceHigh = 푸른 달이라... 흠. Jeb, 이제 닭 옷을 꺼낼 시간이군요.
		#LOC_KS_SciDef_scopeScan_Eulb_InSpaceLowCratersBig = Eulb의 가장 큰 분화구들은 때때로 바다(maria)와 구분하기 어렵습니다. 풍화된 것처럼 보이지만, 그럴 수 있는 유일한 힘은 미세 운석 충돌뿐입니다. Eulb는 도대체 얼마나 오래된 걸까요?
		#LOC_KS_SciDef_scopeScan_Eulb_InSpaceLowCratersSmall = 이걸 보니 왠지 '데자 블루'가 느껴지는군요... 무슨 뜻인지 아시겠나요?
		#LOC_KS_SciDef_scopeScan_Eulb_InSpaceLowDoubleCrater = 오, 흥미로운 지형이 있군요. 두 개의 충돌 분화구가 겹쳐 있는 것으로 보입니다. 하나는 더 크고 하나는 더 작네요. 안쪽 분화구가 더 나중에 형성된 것으로 보입니다.
		#LOC_KS_SciDef_scopeScan_Eulb_InSpaceLowGeneric = 그런데 왜 파란색일까요? 우리가 이 문제를 다룬 적이 있나요? 누군가 연구하고 있나요? 누군가 좀 연구하게 하세요.
		#LOC_KS_SciDef_scopeScan_Iomena_InSpaceHigh = 멀리서 본 Iomena의 어두운 회색 지형은 과거와 현재의 액체 흐름 흔적을 뚜렷하게 보여줍니다. 하지만 Kcalbeloh에서 너무 멀리 떨어져 있어 액체 식수가 존재하기엔 너무 추울 것입니다.
		#LOC_KS_SciDef_scopeScan_Iomena_InSpaceLowCanyonsAll = 이 협곡들은 정말 극적으로 보입니다. 하지만 그 사이를 비행할 만큼 대기가 두꺼울까요? 당장 알아봐야 합니다!
		#LOC_KS_SciDef_scopeScan_Iomena_InSpaceLowCraters = Iomena의 침수된 분화구의 차가운 해안은 숨이 막힐 정도로 아름다울 것입니다. 우주에서 봐도 그곳에는 왠지 모를 고독한 아름다움이 있습니다.
		#LOC_KS_SciDef_scopeScan_Iomena_InSpaceLowGeneric = 청회색 암석으로 이루어진 황량한 들판은 놀라운 아름다움을 지니고 있습니다. 지표면에서 보는 풍경은 아마도 특히 배경에 Kcalbeloh가 있다면 매우 장관일 것입니다.
		#LOC_KS_SciDef_scopeScan_Iomena_InSpaceLowMountainsAll = Iomena의 봉우리들은 눈에 띄는데, 대부분 밝은 물질로 서리가 덮여 있기 때문입니다. 하지만 아마도 식수 얼음은 아닐 겁니다...
		#LOC_KS_SciDef_scopeScan_Iomena_InSpaceLowOceans = 이게 무엇이든 간에 식수는 아닐 겁니다. 지표면은 액체 암모니아가 존재하기 적합한 환경일 테니, 그곳에 착륙한다면 제발 마시지 않도록 주의하십시오.
		#LOC_KS_SciDef_scopeScan_Kcalbeloh_InSpaceHigh = Kcalbeloh의 강착 원반이 장비에 놀라운 세부 묘사로 포착되었으며, 정밀 분석 결과 원반의 가장자리가 약간 적색 편이와 청색 편이를 보이고 있습니다.
		#LOC_KS_SciDef_scopeScan_Kcalbeloh_InSpaceLow = 망원경 피드를 지켜보던 인턴은 소위 '특이점'을 발견하자 잠시 매우 흥분했지만, 알고 보니 강렬한 힘 때문에 렌즈에 금이 가서 중앙에 밝은 점이 생긴 것이었습니다.
		#LOC_KS_SciDef_scopeScan_Maelg_InSpaceHigh = 망원경은 Maelg의 매우 낮은 광도 덕분에 손상 없이 쉽게 초점을 맞출 수 있어, 이 항성 이하 천체의 매우 상세한 사진을 포착할 수 있습니다.
		#LOC_KS_SciDef_scopeScan_Maelg_InSpaceLow = 엄밀히 말해 별은 아니지만, Maelg는 이 거리에서도 꽤 밝습니다. 다행히 망원경에는 필터가 장착되어 있습니다. Maelg의 맹렬한 오렌지색 폭풍을 고해상도로 포착하는데, 마치 불로 만들어진 미친 버전의 Jool 같습니다!
		#LOC_KS_SciDef_scopeScan_Mehtna_InSpaceHigh = Mehtna의 '따뜻한 극지'는 마치 안구처럼 보여 항상 Maelg를 똑바로 쳐다보고 있는 것 같습니다. 사실 좀 섬뜩합니다.
		#LOC_KS_SciDef_scopeScan_Mehtna_InSpaceLowDay = Mehtna의 짙은 갈색 '홍채'에는 독특한 패턴을 형성하는 몇 가지 흥미로운 지형이 존재합니다.
		#LOC_KS_SciDef_scopeScan_Mehtna_InSpaceLowGrandCrater = 분화구가 거의 없는 Mehtna의 지표면에서 이 거대한 분화구는 매우 눈에 띄는 특징입니다!
		#LOC_KS_SciDef_scopeScan_Mehtna_InSpaceLowIce = Mehtna의 빛이 비치는 지역에는 복잡하고 아름다운 균열이 지표면을 가로질러 뻗어 있어 매혹적인 사진을 만들어냅니다.
		#LOC_KS_SciDef_scopeScan_Mehtna_InSpaceLowNight = 흠... 네, 확실히 어둡긴 하네요.
		#LOC_KS_SciDef_scopeScan_Meiuqer_InSpaceHigh = 음.... 우주 감자...
		#LOC_KS_SciDef_scopeScan_Meiuqer_InSpaceLow = 오, 이건 사실 꽤 사랑스러운 작은 암석이군요. 소용돌이치는 갈색 무늬가 갈색 설탕을 뿌린 도넛 구멍을 연상시킵니다.
		#LOC_KS_SciDef_scopeScan_Noi_InSpaceHigh = 좋아요, 포기할게요. 제가 뭘 보고 있는 거죠?
		#LOC_KS_SciDef_scopeScan_Noi_InSpaceLow = 별들은 다 어디 갔죠?! 아, 그냥 Noi였군요. 오해였네요...
		#LOC_KS_SciDef_scopeScan_Noira_InSpaceHigh = 이 작은 회색 공은 색깔과 지표면의 분화구 면에서 문(Mun)을 연상시킵니다. 달의 한쪽 끝에는 비례적으로 거대한 분화구가 보여, 행성을 파괴하는 특정 전투 정거장을 떠올리게 합니다.
		#LOC_KS_SciDef_scopeScan_Noira_InSpaceLowBasins = 이 넓고 어두운 분지는 우주 프로그램이 여전히 문(Mun)에 착륙하기 위해 고군분투하던 단순했던 시절을 떠올리게 합니다.
		#LOC_KS_SciDef_scopeScan_Noira_InSpaceLowCraters = 분화구들이 달 표면 전체에 고르게 분포되어 있는 것으로 보아 조석 고정은 되지 않은 상태입니다. 아마도 Simetra와 Simeht가 너무 많이 움직이기 때문일 것입니다.
		#LOC_KS_SciDef_scopeScan_Noira_InSpaceLowGeneric = Noira의 분화구로 뒤덮인 지표면은 기이한 것들로 가득 찬 이 시스템에서 반가운 광경입니다.
		#LOC_KS_SciDef_scopeScan_Noira_InSpaceLowGrandCrater = "행성을 파괴할 수 있는 능력은 크라켄의 힘에 비하면 아무것도 아닙니다."
		#LOC_KS_SciDef_scopeScan_Noira_InSpaceLowRiftValleys = 조석력이 불쌍한 Noira를 한계까지 잡아당겨 이 거대한 열곡을 만들어낸 것이 분명합니다.
		#LOC_KS_SciDef_scopeScan_Norihc_InSpaceHigh = 불쌍한 Norihc는 모행성들의 조석력에 의해 두들겨 맞고 멍이 든 것 같습니다.
		#LOC_KS_SciDef_scopeScan_Norihc_InSpaceLowCracks = 이 균열들은 Norihc의 두꺼운 전 지구적 만년설 깊숙이까지 이어져 있습니다. 아마 재미있는 경주 트랙이 될 것 같습니다!
		#LOC_KS_SciDef_scopeScan_Norihc_InSpaceLowCratersAll = Norihc는 크고 작은 분화구들로 뒤덮여 있어 표면이 얼마나 오래되었는지 의문이 듭니다. 두 행성에 의해 잡아당겨지고 있다면, 왜 표면이 이렇게 오랫동안 변하지 않은 것처럼 보일까요?
		#LOC_KS_SciDef_scopeScan_Norihc_InSpaceLowGeneric = Norihc의 갈라진 표면은 깊은 해구와 더 어두운 저지대가 있어 Eeloo를 상당히 연상시킵니다.
		#LOC_KS_SciDef_scopeScan_Noyreg_InSpaceHigh = 정말 매혹적인 색깔입니다! 분명 이것이 오래된 Jool의 색깔 논쟁을 다시 불러일으키지는 않겠지요...
		#LOC_KS_SciDef_scopeScan_Noyreg_InSpaceLow = 표면을 덮고 있는 빽빽한 구름 때문에 볼 수 있는 것이 별로 없습니다. 표면의 일부만 보이지만, 가장 낮은 구름 사이로 살짝 보이는 높은 산들만 겨우 알아볼 수 있습니다.
		#LOC_KS_SciDef_scopeScan_Onrefni_InSpaceHigh = 눈앞에 보이는 것은 황량함 속의 아름다움 그 자체입니다. Onrefni는 멸망 직전의 세계이며, 주위를 소용돌이치는 우주 허리케인 외에는 아무것도 없는 공기 없는 작은 암석임에도 불구하고, 이 행성의 종말론적인 표면은 완전히 매혹적입니다.
		#LOC_KS_SciDef_scopeScan_Onrefni_InSpaceLowCraters = Onrefni의 분화구 가장자리는 강착 원반의 불길한 빛 속에서 반짝입니다. 무엇이 이런 지형을 만들었는지 궁금해집니다. Kcalbeloh 가까이까지 내려갔던 것일까요, 아니면 Onrefni가 이미 이런 상처를 입은 채 과거에 이곳으로 던져진 것일까요?
		#LOC_KS_SciDef_scopeScan_Onrefni_InSpaceLowDay = 깊은 균열이 Onrefni의 표면, 특히 낮 쪽에 덮여 있습니다. 마치 거대한 우주 존재가 주먹으로 쳐서 표면 절반을 박살 낸 것 같습니다.
		#LOC_KS_SciDef_scopeScan_Onrefni_InSpaceLowLava = 밤처럼 검은 암석이 Onrefni 표면의 균열을 통해 흘러나오는 밝은 적오렌지색의 뜨거운 용암과 강렬한 대비를 이룹니다. 이것을 얼마나 더 견딜 수 있을지 궁금할 따름입니다.
		#LOC_KS_SciDef_scopeScan_Onrefni_InSpaceLowNight = 균열은 여전히 Onrefni의 밤 쪽을 가로질러 이어지며, Kcalbeloh의 밝게 빛나는 강착 원반을 배경으로 강조됩니다.
		#LOC_KS_SciDef_scopeScan_Rouqea_InSpaceHigh = 파랗고, 파랗습니다.
		#LOC_KS_SciDef_scopeScan_Rouqea_InSpaceLow = 어... 식수. 그리고... 저기에 식수가 좀 있고, 그리고... 오, 저것 좀 보세요! 식수입니다.
		#LOC_KS_SciDef_scopeScan_Sedah_InSpaceHigh = 이 행성은 대기의 엄청난 열기로 인해 빛을 발하며, 밤 쪽조차 희미하게 빛나게 합니다.
		#LOC_KS_SciDef_scopeScan_Sedah_InSpaceLow = 근접 촬영 사진을 보면 소용돌이치는 격렬한 구름과 행성 전체를 집어삼킬 만큼 거대한 허리케인이 드러납니다!
		#LOC_KS_SciDef_scopeScan_Sera_InSpaceHigh = Sera의 높은 곳에서 보면 고리가 선명하게 드러납니다. 고리의 색과 밝기로 보아 암석 성분인 것으로 보이며, 아마 얼음도 섞여 있을 것입니다. 아마도 한때 작은 위성이었다가 산산조각 났을 것입니다. 시간과 시뮬레이션을 통해 그 위성이 어떤 모습이었을지 알아낼 수 있을지도 모릅니다.
		#LOC_KS_SciDef_scopeScan_Sera_InSpaceLowGeneric = Sera의 복숭아색 언덕과 평원은 확실히 식욕을 돋웁니다. 과일이 너무 많이 생각나기 시작했습니다.
		#LOC_KS_SciDef_scopeScan_Sera_InSpaceLowIslands = 작은 섬들이 거대한 호수들 사이로 살짝 보입니다. 아니면 내해일까요? 저 외계 해안에서 보는 풍경은 어떤 모습일지 궁금합니다.
		#LOC_KS_SciDef_scopeScan_Sera_InSpaceLowLakes = 이 호수들은 대기와 비슷한 복숭아 갈색을 띠는 것 같습니다. 단순히 보는 것만으로는 식수인지 아닌지 알 방법이 없습니다.
		#LOC_KS_SciDef_scopeScan_Sera_InSpaceLowMountains = 거대한 산맥이 Sera 표면의 대부분을 가로지릅니다. 자세히 보면 봉우리 사이에 줄무늬 같은 계곡이 뻗어 있으며, 이는 프랙탈과 크게 다르지 않은 아름다운 패턴을 형성합니다.
		#LOC_KS_SciDef_scopeScan_Sera_InSpaceLowRiftValley = 이것은 일종의 열곡으로 보이며, 확장 지각 운동으로 인해 암석권이 잡아당겨지면서 형성된 계곡 유형입니다. 이는 적어도 수억 년 전까지는 Sera에서 지각 운동이 활발했다는 꽤 명확한 증거입니다.
		#LOC_KS_SciDef_scopeScan_SimeSystem_InSpaceHigh = 두 천체가 보여주는 복잡한 춤은 숨이 막힐 정도로 아름다우며, 사진 타임랩스가 이를 증명합니다. 마치 거대하고 멋진 천체 탱고를 추는 파트너들 같습니다.
		#LOC_KS_SciDef_scopeScan_Simeht_InSpace = Simeht은 먼 망원경 이미지에서는 거의 특징이 없어 보이지만, 이 근접 촬영은 더 밝은 적도 띠, 경계에서 소용돌이치는 희미한 하이퍼케인, 그리고 극지방 띠 사이의 미묘한 차이까지 드러냅니다.
		#LOC_KS_SciDef_scopeScan_Simetra_InSpace = Simetra의 다채로운 띠를 보면 적도 경도에 그 눈에 띄는 녹색과 노란색 색조를 부여하는 화합물이 무엇인지 궁금해집니다.
		#LOC_KS_SciDef_scopeScan_Suluco_InSpaceHigh = 눈알 행성이라고 불리지만, Suluco는 사실 눈처럼 보이지는 않습니다. 하지만 소위 '뜨거운 극'과 황혼 지대 사이의 극명한 대비는 인상적입니다.
		#LOC_KS_SciDef_scopeScan_Suluco_InSpaceLowDay = Suluco의 낮 쪽은 눈이 아플 정도로 밝으며, 뼈처럼 건조해 보입니다. 끝없이 펼쳐진 모래 언덕의 바다가 이 지역의 특징입니다.
		#LOC_KS_SciDef_scopeScan_Suluco_InSpaceLowDayPole = 항성 직하점은 눈이 멀 정도로 밝습니다. 빛을 많이 반사하고 있으며 계란을 구울 수 있을 정도로 뜨거워 보입니다. 구름조차 증발해 버린 것 같습니다.
		#LOC_KS_SciDef_scopeScan_Suluco_InSpaceLowNight = 아무것도 보이지 않습니다.
		#LOC_KS_SciDef_scopeScan_Suluco_InSpaceLowTwilight = Suluco의 좁은 온대 지역에는 완만한 녹색 언덕과 탁 트인 바다가 있습니다. 여러 장의 사진을 보면 구름이 행성의 자전축이 아닌 낮과 밤의 극을 중심으로 회전하고 있음을 알 수 있습니다.
		#LOC_KS_SciDef_scopeScan_Suluco_InSpaceLowWater = Suluco의 바다는 생명체와 마찬가지로 낮과 밤의 경계선을 따라 좁은 띠에 국한되어 있습니다. 이 지역의 해류는 커벌들이 이전에 본 적 없는 독특한 모습입니다.
		#LOC_KS_SciDef_scopeScan_Sunorc_InSpaceHigh = 이 미친 사람아! 망원경을 파괴하려고 하는 겁니까? 이 장치는 행성 촬영용으로 설계되었습니다!
		#LOC_KS_SciDef_scopeScan_Sunorc_InSpaceLow = 음, 돈 낭비였습니다. 방금 궤도 망원경을 망가뜨렸을지도 모릅니다.
		#LOC_KS_SciDef_scopeScan_Tot_InSpaceHigh = Tot에게 공정하게 말하자면, 꽤 귀여운 작은 감자입니다.
		#LOC_KS_SciDef_scopeScan_Tot_InSpaceLow = 망원경이 Tot 표면의 작은 암석과 분화구를 매우 상세하게 포착하지만, 이 작업에는 다소 과한 성능인 것 같습니다.
		#LOC_KS_SciDef_scopeScan_Uleg_InSpaceHigh = 이 희미한 행성은 어둠 속에서 거부할 수 없는 디저트 한 스쿱처럼 반짝이는 것 같습니다. 마치 더 가까이 다가오라고 유혹하는 것 같군요...
		#LOC_KS_SciDef_scopeScan_Uleg_InSpaceLowBasins = 넓고 탁 트인 분지는 지형이 매우 평탄해 보입니다. 마음이 내킨다면 기지를 건설하기에 좋은 장소가 될 수도 있겠군요. 하지만 Uleg의 터무니없는 궤도를 생각하면, 아마 더 나은 장소가 있을 겁니다.
		#LOC_KS_SciDef_scopeScan_Uleg_InSpaceLowCrater = 이건 정말 엄청난 분화구군요. 너무 침식되어 있어서 분화구라고 식별하는 데 시간이 좀 걸렸습니다.
		#LOC_KS_SciDef_scopeScan_Uleg_InSpaceLowGeneric = 곰보 자국이 가득한 Uleg의 표면은 쿠키 앤 크림 아이스크림을 너무 많이 닮았습니다. 대중이 이 사진을 보면 군침을 흘릴 게 분명합니다.
		#LOC_KS_SciDef_scopeScan_Uleg_InSpaceLowMountains = 작은 산들이 바닐라 아이스크림의 광활한 바다 위에 뿌려진 초콜릿 쿠키 부스러기처럼 Uleg의 표면에 점점이 박혀 있습니다. 젠장, 또 배가 고파지는군요!
		#LOC_KS_SciDef_scopeScan_Uleg_InSpaceLowRiftValleys = 이 거대한 협곡은 Uleg의 표면을 가로질러 북극까지 이어지는 거대한 회로를 형성합니다. 극도로 희박한 대기만 아니었다면 환상적인 에어 레이스 코스가 되었을 텐데 말이죠. 운명이여, 저주받아라! 뭐... 진정한 무모한 도전자들에게는 여전히 가능할지도 모릅니다. 지상 레이스도 가능하겠네요!
		#LOC_KS_SciDef_scopeScan_WH3141A_InSpace = 반대편에 다른 행성이 있는 것을 거의 볼 수 있습니다. 고리와 밝은 오렌지색 별, 그리고... 세상에, KRAKEN이여! 저건 당신을 쳐다보는 크고 검은 눈인가요?
		#LOC_KS_SciDef_scopeScan_WH3141B_InSpace = Jool의 친숙한 녹색 형체가 마치 유화처럼 우주 공간에 번져 있습니다. Laythe, Vall, Tylo의 흔적도 볼 수 있군요.
		#LOC_KS_SciDef_seismicScan_Ahtpan_SrfLanded = 지진계에 깊고 먼 울림이 포착되었습니다. Ahtpan의 내부는 여전히 활동 중인 것 같습니다!
		#LOC_KS_SciDef_seismicScan_Anneheg_SrfLanded = 가속도계가 열기로 인해 단락되어 더 이상 작동하지 않습니다.
		#LOC_KS_SciDef_seismicScan_Arorua_SrfLanded = 지진 센서가 열기로 인해 자동으로 꺼집니다. 장비를 안으로 들여놓는 것이 좋겠습니다.
		#LOC_KS_SciDef_seismicScan_Dipuc_SrfLanded = Dipuc 전역에서 지속적으로 발생하는 저주파 울림은 근처의 화산 활동과 일치하며, 이 위성이 얼마나 활동적인지를 명확히 보여줍니다.
		#LOC_KS_SciDef_seismicScan_Dipuc_SrfLandedVolcano = 커벌이 느낄 수 있을 정도로 지면이 흔들립니다. 여기서 나가는 게 좋겠는데요...
		#LOC_KS_SciDef_seismicScan_EfilHome_SrfLanded = 지진계가 Efil의 지진 활동에 대한 정보를 기록하여 우리 고향의 내부 구조를 파악할 수 있게 해줍니다.
		#LOC_KS_SciDef_seismicScan_Efil_SrfLanded = Efil의 숨 막힐 듯 아름다운 표면에 발을 내딛자, 지진 관측 장비가 행성의 지질과 복잡한 상호작용을 시작했습니다. 진동과 메아리가 지형을 타고 흐르며 푸른 아름다움 아래 숨겨진 비밀을 밝혀냈고, 지하 공동의 복잡한 네트워크와 Efil의 고대 핵이 내뿜는 부드러운 고동을 지도화했습니다. 각각의 지진파는 행성의 역사를 반영하며 지질학적 구조를 생생하게 그려냈고, 표면을 장식한 매혹적인 풍경만큼이나 활기차고 수수께끼 같은 세계를 드러냈습니다.
		#LOC_KS_SciDef_seismicScan_Elad_SrfLanded = 측정값은 Elad가 여전히 지진 활동을 하고 있음을 강력하게 시사합니다.
		#LOC_KS_SciDef_seismicScan_Enots_SrfLanded = 지진 스캐너는 아주 작은 미세 운석 충돌 외에는 아무런 활동도 감지하지 못합니다.
		#LOC_KS_SciDef_seismicScan_Eulb_SrfLanded = 지진 센서가 지표면 아래에서 매우 희미한 지진 활동을 감지합니다.
		#LOC_KS_SciDef_seismicScan_Iomena_SrfLanded = Iomena 표면에 착륙하여 수행한 지진 스캔 실험은 행성 내부 구조에 대한 귀중한 정보를 제공했습니다. 스캔 결과 행성 표면 아래에 복잡한 단층과 균열망이 있음이 밝혀졌으며, 이는 과거에 지각 활동이 있었음을 나타냅니다. 데이터는 또한 단단한 암석 맨틀과 금속 핵의 존재를 나타냅니다.
		#LOC_KS_SciDef_seismicScan_Mehtna_SrfLanded = 지진 스캔 결과, 이 외로운 행성에서 감지할 수 있는 유일한 활동은 가끔 발생하는 충돌뿐입니다.
		#LOC_KS_SciDef_seismicScan_Meiuqer_SrfLanded = Meiuqer에 대한 지진 스캔 결과는 예상대로 이 작은 세계가 완전히 죽어 있으며 우주 진공 속에 떠 있는 거대한 감자와 다를 바 없음을 보여줍니다.
		#LOC_KS_SciDef_seismicScan_Noi_SrfLanded = 죽음과 같은 정적입니다. Noi는 너무 작아서 정기적인 충돌조차 일어나지 않는 것 같습니다.
		#LOC_KS_SciDef_seismicScan_Noira_SrfLanded = 잦은 진동은 Noira가 근처의 두 행성이 춤을 추듯 움직임에 따라 조석력에 시달리는 위성임을 나타냅니다.
		#LOC_KS_SciDef_seismicScan_Norihc_SrfLanded = 지진계는 여러 번의 작은 지진을 기록하며, 행성이 머리 위를 직접 통과할 때 활동이 최고조에 달합니다.
		#LOC_KS_SciDef_seismicScan_Noyreg_SrfLanded = 근처를 도는 두 거대 행성에서 발생하는 조석력이 Noyreg의 지각에 눈에 띄는 영향을 미쳐, 두 행성이 근접할 때마다 지진 활동이 발생합니다.
		#LOC_KS_SciDef_seismicScan_Onrefni_SrfLanded = 지진 장비는 극심한 조석력과 근처 강착 원반 물질의 거의 지속적인 충돌로 인해 발생하는 데이터로 완전히 뒤덮였으며, 이는 Onrefni의 혼란스러운 특성을 잘 보여줍니다.
		#LOC_KS_SciDef_seismicScan_Rouqea_SrfLanded = Rouqea 해저 착륙 중 수집된 지진 데이터 분석 결과, 행성 지각의 지각 활동 징후가 밝혀졌습니다.
		#LOC_KS_SciDef_seismicScan_Sera_SrfLanded = Sera의 지각과 맨틀에서 수행된 지진 관측 결과, 이 행성은 지각 활동이 매우 활발하며 빈번한 지진이 발생하고 있음이 밝혀졌습니다. 행성의 지각은 파손되어 있으며, 행성의 고리 시스템이 유발하는 응력으로 인해 광범위한 단층과 균열 네트워크가 형성된 것으로 보입니다. 하지만 유기 화합물이나 기타 생명체의 징후가 전혀 감지되지 않는 것으로 보아, Sera는 우리가 아는 형태의 생명체를 유지하기에는 적합하지 않은 것으로 판단됩니다.
		#LOC_KS_SciDef_seismicScan_SulucoHome_SrfLanded = 지진 스캐너는 지진 활동을 거의 감지하지 못합니다. 우리 고향은 지질학적으로 매우 안정적인 것 같습니다.
		#LOC_KS_SciDef_seismicScan_Suluco_SrfLanded = 지진 관측 결과 Suluco는 지질학적으로 비교적 안정적인 상태입니다. 하지만 지속적으로 부는 강한 바람이 행성 표면에 마찰과 응력을 가해 지면 진동을 유발할 가능성이 있습니다. 또한 Suluco의 황혼 지대에서는 지속적인 바람으로 인한 마찰력과 낮과 밤 반구의 온도 차에 따른 가열 및 냉각 작용으로 인해 더 높은 수준의 지면 진동이 발생합니다.
		#LOC_KS_SciDef_seismicScan_Tot_SrfLanded = 지진 스캐너가 읽어들인 값은...... 아무것도 없습니다.
		#LOC_KS_SciDef_seismicScan_Uleg_SrfLanded = Uleg 표면에서 지진 스캔을 수행하는 동안 장비가 여러 번의 작은 진동을 기록했는데, 이는 표면이 대부분 얼어붙어 있음에도 불구하고 행성이 여전히 지질학적으로 활동 중일 수 있음을 나타냅니다. 이러한 진동의 원인과 행성 지질에 미치는 잠재적 영향을 확인하려면 데이터에 대한 추가 분석이 필요합니다.
		#LOC_KS_SciDef_surfaceSample_Ahtpan_SrfLanded = 지면은 꽤 모래가 많습니다. 커빈의 사막을 매우 연상시킵니다.
		#LOC_KS_SciDef_surfaceSample_Ahtpan_SrfLanded_Coast = 표면 샘플에는 등유와 유사한 물질의 흔적이 포함되어 있습니다.
		#LOC_KS_SciDef_surfaceSample_Ahtpan_SrfLanded_NaphthanOceans1 = 장갑이 등유와 유사한 물질로 뒤덮였습니다. 좋은 연료원이 될 수도 있겠군요.
		#LOC_KS_SciDef_surfaceSample_Ahtpan_SrfLanded_NaphthanOceans2 = Ahtpan의 바다는 검은 황금, 아니, 석유로 이루어진 것 같습니다.
		#LOC_KS_SciDef_surfaceSample_Ahtpan_SrfSplashed = 우주복이 Ahtpan의 바다를 구성하는 등유와 유사한 물질로 코팅되었습니다. 닦아내는 데 시간이 좀 걸리겠군요.
		#LOC_KS_SciDef_surfaceSample_Anneheg_SrfLanded_Lava = 용암 샘플을 채취하려고 하자 장갑이 녹기 시작합니다.
		#LOC_KS_SciDef_surfaceSample_Anneheg_SrfSplashed = 우주복이 녹기 시작하면서, 말 그대로 용암 샘플을 채취하는 것은 아마도 최선의 생각이 아니었음을 빠르게 깨닫게 됩니다.
		#LOC_KS_SciDef_surfaceSample_Arorua_SrfLanded = Arorua 표면의 샘플을 채취합니다. 두껍게 절연된 장갑을 통해서도 샘플의 열기가 느껴집니다.
		#LOC_KS_SciDef_surfaceSample_Dipuc_SrfLanded = 이 암석 샘플은 중금속이 풍부한 화산암으로 구성된 것으로 보입니다.
		#LOC_KS_SciDef_surfaceSample_Dipuc_SrfLandedLowlands = 지면에서 매우 반짝이는 화산 유리 조각을 발견하여 집어 들고 매끄럽고 반사되는 표면을 감상합니다. 안타깝게도 집에 돌아가면 과학자들에게 넘겨주어야 하니, 지금 즐길 수 있을 때 마음껏 즐기는 것이 좋습니다.
		#LOC_KS_SciDef_surfaceSample_Dipuc_SrfLandedVolcanoVent = 와! 뜨거운 감자다! 뜨거운 감자!!!
		#LOC_KS_SciDef_surfaceSample_EfilHome_SrfLanded = Efil의 지면에서 샘플을 채취합니다.
		#LOC_KS_SciDef_surfaceSample_EfilHome_SrfLanded_Beach = 해변에서 샘플을 집어 들었다가, 장갑 가득 모래게가 들어있는 것을 깨닫고 즉시 떨어뜨립니다!
