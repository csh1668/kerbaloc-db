		#LOC_KS_SciDef_atmosphereAnalysis_Iomena_FlyingHigh = Iomena의 상층 대기에서 분석한 결과, 암모니아 농도가 하층 대기보다 상당히 높게 나타났습니다. 이는 암모니아가 더 높은 고도에 집중되도록 만드는 지질학적 또는 대기적 과정이 존재할 가능성을 시사합니다.
