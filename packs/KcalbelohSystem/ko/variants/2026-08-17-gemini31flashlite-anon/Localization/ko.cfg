		#LOC_KS_SciDef_dmSoilMoisture_Kcalbeloh_InSpaceLow = 좋습니다. BLACK HOLE 임무에 마이크로파 방출을 통한 식수 탐지 센서를 추가한 코미디언이 누구입니까? 이름 좀 대보시죠!
