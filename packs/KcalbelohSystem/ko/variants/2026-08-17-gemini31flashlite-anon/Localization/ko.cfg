		#LOC_KS_SciDef_atmosphereAnalysis_Rouqea_FlyingHigh_Cracks = 고고도의 공기는 저고도의 공기와 대부분 비슷합니다. 단지 더 희박하고 덜 습하며, 블랙홀을 바라보는 실존적 공포가 더할 뿐입니다.
