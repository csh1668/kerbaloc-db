		#LOC_KS_SciDef_crewReport_Dipuc_SrfLanded_CraterWest = Western Crater에서의 체류를 즐기시기 바랍니다. 특히 이 편도 여행을 왕복 여행으로 바꿀 추진제가 부족하다면 더욱 그렇겠지요. 어쨌든, 무엇이 Western Crater를 방문할 가치가 있을 만큼 매력적으로 만들었을까요? 결국, 이런 거대한 분화구들은 충돌 구조가 표면에 정기적으로 흩어져 있는 진공 세계의 표면에 난 영광스러운 곰보 자국일 뿐입니다. 하지만 Dipuc은 예외인 것 같습니다. Western, Eastern, Southern, Double Crater Complex를 제외하면 이곳에서 충돌 분화구는 거의 찾아볼 수 없습니다. 아마도 내부 활동과 활발한 화산 활동이 Dipuc의 표면이 이와 유사한 다른 작은 진공 세계들과 차이를 보이는 이유와 관련이 있을 것입니다.
		#LOC_KS_SciDef_crewReport_Dipuc_SrfLanded_DoubleCrater = Double Crater Complex에 오신 것을 환영합니다. 이곳에서 여러분은 절대 이중 시야를 경험하고 있는 것이 아닙니다. 결국 우리는 그 안에 있으니까요. 내부적인 시각적 오류나 정신적 허구는 다른 커벌이 여러분의 변화된 정신 상태를 언급하지 않는 한 이렇게 오래 지속될 수 없습니다.\n\n여러분은 Dipuc의 진공 속에서 혼자 있는 것이 맞지요? 만약 아니라면, 고향의 많은 식견 있는 커벌들이 'Flat Kerbiners(평평한 커빈 신봉자)'나 'Nonexistent-Dressings(존재하지 않는 드레싱)'을 비웃는 것처럼 나머지 승무원들이 여러분을 비웃지 않도록 Double Crater의 존재에 대한 망상을 멈추십시오.
		#LOC_KS_SciDef_crewReport_Dipuc_SrfLanded_Highlands = Highlands는 Dipuc의 대부분 지역보다 높으며 주변을 바라보기에 경이로운 곳입니다. 하지만 전망의 화려함 면에서는 산맥이 이 지역을 능가합니다. 잠재적인 자원 채굴자들은 마음껏 발굴을 시작하거나, 점점 가팔라지는 지형을 정찰하거나, Rouquea의 거대한 조석 현상에 대한 악몽을 꾸지 않는 척할 수 있습니다.\n\n\n네, 이곳에는 짧은 시간 내에 빠르게 움직이지 않는 '진짜' 산들이 있으므로, 이상적으로는 이런 외로운 위성에서 죽을 가능성에 대해 걱정할 필요가 없습니다.\n\n...여러분이 침을 흘리는 멍청이거나, Danny나 Dennis처럼 Kraken에게 커벌들을 제물로 바치고 싶어 하는 경우가 아니라면 말입니다.
		#LOC_KS_SciDef_crewReport_Dipuc_SrfLanded_Lowlands = 고도 기반 지역을 어떻게 구분할 수 있을까요? 네, 주변의 더 높은 고도 지역과 비교하면 되지만, 저지대는... '해수면'에 비해 얼마나 '낮은' 걸까요? 그러고 보니, Dipuc처럼 건조한 진공 천체에서 평균 '해수면'은 무엇을 기준으로 할까요? 지각에서 화산 분출구가 아닌 가장 낮은 지점일까요, 아니면 어떤 위원회나 개인이 정한 임의의 깊이일까요? 표준화가 되어 있지 않으니, 답답한 마음에 신선한 공기를 마시려고 해치를 열고 싶어질 지경입니다.\n\n\n...잠시만요-
		#LOC_KS_SciDef_crewReport_Dipuc_SrfLanded_Midlands = 중지대, 정말... '중간'인 곳이군요. 혹시 현지 자원 활용을 위한 유용한 물질이 더 많이 농축되어 있을 가능성 때문에 이곳에 착륙하셨나요? 그렇지 않다면, 더 안전하고 온화하여 식민지 건설에 적합한 저지대로 이동하거나, 말 그대로 더 높은 곳에서의 도전을 위해 고지대나 산악 지대로 가시는 것을 추천합니다. 로버를 가져왔거나 로버 안에 탑승한 채로 파도를 타고 싶은 게 아니라면 이곳에는 별다른 것이 없습니다... 정적인 파도 말이죠.
		#LOC_KS_SciDef_crewReport_Dipuc_SrfLanded_Mountains = "저건 파도가 아니라 산이야." Gene Kerman이 공포에 질린 Rouquea 베테랑에게 말합니다. 그는 산은 '움직이지 않고, 정적이며, 크림색을 띠는' 것이지 '움직이고, 역동적이며, 울트라마린 색을 띠는' 것이 아니라고 설명합니다. 게다가 질량 분석기와 중력 스캔 결과, 여러 산악 지층에 무거운 규산염, 황산염, 탄산염, 산화물이 고농도로 포함되어 있음이 밝혀졌습니다. 이는 수많은 광물과 유기물이 용해된 불순한 액체 혼합물인 수 킬로미터 높이의 파도에서는 당연히 발견되지 않는 물질과 지하 구조입니다. "이제 Dipuc 표면의 나머지 부분을 탐사하고 토양을 채굴하십시오. 채굴 파편이 채굴 중인 커벌이나 장비에 위험할 수 있으니 곡괭이는 사용하지 않는 것이 좋습니다. 아니면 이곳에 식민지 건설을 시작하십시오. 그렇지 않으면 소모한 수 톤의 델타-V가 헛수고가 될 것입니다!"\n\n-Gene
		#LOC_KS_SciDef_crewReport_Dipuc_SrfLanded_Poles = 아, 극지방이라니. 눈이 가득하고 혹독한 추위가 일상인 곳이죠.\n\n잠깐, 아니군요. 그건 커빈 같은 행성에서나 그렇고, 여기엔 얼음이 전혀 없습니다. 적어도 이곳에 착륙하는 건 힘들지 않겠죠?\n\n왜 이 지역에는 화산 활동이 없는데 저위도에는 활발한 걸까요? Sera의 조석력이 Dipuc 내부를 자극해 모행성에 가장 가까운 저위도 적도 부근에서 가장 강한 효과가 나타난다는 점으로 설명할 수 있겠지만, Dipuc이 Sera와 동주기 자전한다는 점을 고려하면 화산 활동이 '가까운' 면에 집중되어야 하지 않을까요? 어쨌든, 경이로운 겨울 풍경도 아니니 여기서 더 남쪽이나 북쪽으로 이동해 보는 건 어떨까요?
		#LOC_KS_SciDef_crewReport_Dipuc_SrfLanded_Volcano = 안전과 관련하여, 가파른 경사의 화산 원뿔은 경사도가 높아 위험하며, 임무 진행에 치명적일 수 있는 여러 사고를 유발할 수 있습니다. 적어도 활화산 원뿔 표면에서 뿜어져 나올 것으로 예상되는 열기는 여기엔 없겠죠?\n\n그리고 아니요, 이곳은 진공 환경이라 분출되는 용암이나 잠재적인 화쇄류가 즉시 식어 느리게 흐르는 피하기 쉬운 라하르(lahar) 흐름이 될 것이므로 화산 폭발에 대해 걱정할 필요는 거의 없습니다.\n그저... 크라켄의 이름을 걸고, 활화산 분출구 근처에는 절대 가지 마십시오.\n\n\n이미 근처에 계신 건 아니겠죠?
