		#LOC_KS_SciDef_dmSIGINT_Kcalbeloh_InSpaceLowNorthernHemisphere = 원격 측정 데이터를 연구하던 중, 밴조 연주 소리가 들립니다? 이어서 하모니카, 휘파람 소리, 드럼, 플루트, 그리고 피아노 소리까지 들립니다. 감상적이고 향수를 불러일으키는 소리입니다. 그러다 잠에서 깨어났는데, 노래는 사라지고 없었습니다. 꿈이었을까요?
