		#LOC_KS_SciDef_barometerScan_Dipuc_SrfLanded_Volcano = 화산 근처, 특히 대기가 있는 환경이라면 온도계가 더 적절한 실험 도구 아닐까요? 화산 가스가 방출되더라도, 내부적으로 정적이고 대기가 없는 이 행성의 다른 지역과 마찬가지로 방출된 가스의 압력은 사실상 진공으로 측정될 것입니다.
