		#LOC_KS_SciDef_dmSoilMoisture_Uleg_InSpaceLow = 마이크로파 방출에 따르면 Uleg은 주로 식수로 구성되어 있으며, Uleg의 어느 지역이 아래에 있든 관계없이 방출량은 매우 강합니다.
		#LOC_KS_SciDef_dmSoilMoisture_Wormholes_InSpaceLow = 마이크로파 복사가 웜홀에서 일정하지만 낮은 속도로 방출되고 있습니다. 웜홀 자체가 원인일까요, 아니면 반대편에 있는 무언가가 생성하는 것일까요?
		#LOC_KS_SciDef_dmSolarParticles_Ahtpan_InSpaceHigh = Ahtpan은 Aralc-A로부터 강한 타격을 받고 있지만, 태양풍은 행성 간 공간보다 이곳에서 약간 덜 강렬하며, 이는 적당히 강한 자기장이 존재함을 암시합니다.
		#LOC_KS_SciDef_dmSolarParticles_Ahtpan_InSpaceLow = 이곳의 태양풍은 조금 더 희박하며, 장비는 이산화탄소와 탄화수소의 흔적을 포착합니다.
		#LOC_KS_SciDef_dmSolarParticles_Anehta_InSpaceHigh = Anehta 근처의 태양풍 강도는 커빈과 비슷하지만, 우주선이 거대 행성의 강력한 자기권으로 깊숙이 들어갈수록 빠르게 약해집니다.
		#LOC_KS_SciDef_dmSolarParticles_Anehta_InSpaceLow = Anehta에 의해 태양풍으로부터 보호받는 수집기는 주로 수소, 헬륨, 식수 분자를 포착합니다.
		#LOC_KS_SciDef_dmSolarParticles_Anneheg_InSpaceHigh = 이 고도에서는 Aralc-A의 극심한 태양풍만이 수집됩니다.
		#LOC_KS_SciDef_dmSolarParticles_Anneheg_InSpaceLow = 수집기가 포착한 암석과 금속으로 미루어 볼 때 Anneheg는 질량을 잃고 있는 것으로 보이며, 특히 황혼 경계선을 지날 때 더욱 그렇습니다.
		#LOC_KS_SciDef_dmSolarParticles_AralcA_InSpaceHigh = Aralc-A의 태양풍은 이 장비가 감당할 수 있는 수준보다 훨씬 강력하지만, 장비는 놀랍게도 잘 버티고 있습니다.
		#LOC_KS_SciDef_dmSolarParticles_AralcA_InSpaceLow = 글쎄요, 한 가지는 확실합니다. 보증은 이제 확실히 무효입니다.
		#LOC_KS_SciDef_dmSolarParticles_AralcB_InSpaceHigh = Aralc-B에서 오는 태양풍은 이 거리에서 Aralc-A의 태양풍과 상당히 비슷합니다.
		#LOC_KS_SciDef_dmSolarParticles_AralcB_InSpaceLow = 민감한 웨이퍼들이 강렬한 열기 속에서 빠르게 열화되기 시작했습니다.
		#LOC_KS_SciDef_dmSolarParticles_Arorua_InSpaceHigh = 태양풍이 Arorua 근처의 공간을 가득 채우고 있으며, 우주선까지 날려버릴 기세입니다!
		#LOC_KS_SciDef_dmSolarParticles_Arorua_InSpaceLow = 낮은 Arorua 궤도에서 비교적 높은 농도의 이산화탄소 분자가 포착되는데, 이는 아마도 소멸하는 대기에서 기인한 것으로 보입니다.
		#LOC_KS_SciDef_dmSolarParticles_Dipuc_InSpaceHigh = Dipuc 상공 높이에서는 태양풍만이 수집기가 모을 수 있는 전부입니다.
		#LOC_KS_SciDef_dmSolarParticles_Dipuc_InSpaceLow = 태양 입자 수집기는 황과 다양한 중금속의 흔적을 포착하는데, 이는 수많은 분출로 인해 우주로 튀어 올라 Sera의 중력에 의해 궤도에 진입한 것으로 보입니다.
		#LOC_KS_SciDef_dmSolarParticles_Efil_InSpaceHigh = 웨이퍼에 더 무거운 원소들이 쌓여 있습니다. 이는 Efil이 자체적인 Van Kerman 벨트를 가지고 있다는 증거이며, 마치 Efil이 그곳에 사는 생명체를 가두려는 것처럼 보입니다. 어쩌면 Efil은 생각했던 것만큼 친절한 행성이 아닐지도 모릅니다.
		#LOC_KS_SciDef_dmSolarParticles_Efil_InSpaceLow = Efil 대기의 가장 바깥층을 훑으며, 장비는 태양풍 외에도 식수 분자를 수집합니다. 이는 Efil이 겉보기만큼이나 열대 휴양지라는 확실한 증거입니다.
		#LOC_KS_SciDef_dmSolarParticles_Elad_InSpaceHigh = Elad는 이 고도에서도 태양풍을 막아내는 훌륭한 역할을 하고 있지만, 수집된 다수의 하전 입자들은 Van Kerman 방사선대의 존재를 암시합니다.
		#LOC_KS_SciDef_dmSolarParticles_Elad_InSpaceLow = Elad의 낮은 궤도에서 센서가 미량의 질소를 감지했습니다. 아마도 한때 두꺼웠던 대기의 마지막 흔적일 것입니다.
		#LOC_KS_SciDef_dmSolarParticles_Enots_InSpace = 수집기는 Anehta의 고리에서 많은 입자를 포착했습니다. 그 구성 성분은 주로 규산염 광물과 산화 알루미늄으로 밝혀졌으며, 이는 청색 강옥일 가능성이 있습니다.
		#LOC_KS_SciDef_dmSolarParticles_Eulb_InSpace = Eulb의 약한 자기장은 태양풍을 거의 막아내지 못하지만, 어차피 Anehta가 그 역할을 상당 부분 대신해주고 있습니다.
		#LOC_KS_SciDef_dmSolarParticles_Iomena_InSpaceHigh = Kcalbeloh에서 오는 'Holar wind'는 이 거리에서는 이미 상당히 약해져 있습니다. 거대한 크기에도 불구하고 대부분의 별만큼 많은 양을 방출하지는 않기 때문입니다.
		#LOC_KS_SciDef_dmSolarParticles_Iomena_InSpaceLow = 수집기에 암모니아 흔적이 박혀 있지만, 그 외에는 별다른 것이 없습니다. 'Holar wind'조차 사라졌습니다.
		#LOC_KS_SciDef_dmSolarParticles_Kcalbeloh_InSpaceHigh = 강착 원반의 'Holar wind'가 이온화된 입자를 수집기에 퇴적시키지만, 다른 여러 방향에서 오는 매우 희미한 흔적들도 있습니다. 이는 아마도 Kcalbeloh 시스템에서 가장 거대한 별들로부터 기원한 것으로 보입니다.
		#LOC_KS_SciDef_dmSolarParticles_Kcalbeloh_InSpaceLow = 고에너지 입자들이 활성 이온 농축기를 완전히 태워버렸고 수동 수집기의 민감한 웨이퍼를 파괴했습니다. 잘하셨습니다, 천재님.
		#LOC_KS_SciDef_dmSolarParticles_Maelg_InSpaceHigh = L형 갈색 왜성인 Maelg의 중수소와 리튬 핵융합은 감지 가능한 태양풍을 생성하지 않으며, 수집기는 비어 있습니다.
		#LOC_KS_SciDef_dmSolarParticles_Maelg_InSpaceLow = 헬륨의 여러 동위원소가 수집기에 퇴적되었지만, 실제 별에서 얻을 수 있는 양에는 훨씬 못 미칩니다.
		#LOC_KS_SciDef_dmSolarParticles_Mehtna_InSpace = Mehtna 근처의 우주는 Maelg 궤도에서와 마찬가지로 매우 비어 있습니다. 하지만 행성 근처에는 이산화탄소의 흔적이 약간 있습니다.
		#LOC_KS_SciDef_dmSolarParticles_Meiuqer_InSpace = 잠시 동안, 태양 입자 수집기가 코를 골고 있었다고 확신할 뻔했습니다.
		#LOC_KS_SciDef_dmSolarParticles_Noi_InSpace = Noi 근처는 행성 간 공간과 비교했을 때 실제로 변한 것이 없습니다.
		#LOC_KS_SciDef_dmSolarParticles_Noira_InSpace = Noira 근처의 미량 입자들은 Simetra-Simeht 시스템의 다른 곳과 거의 동일한 것으로 보입니다.
		#LOC_KS_SciDef_dmSolarParticles_Norihc_InSpace = Norihc 궤도에서 질소의 흔적을 찾을 수 있지만, 그 외의 우주는 평소보다 더 비어 있습니다.
		#LOC_KS_SciDef_dmSolarParticles_Noyreg_InSpace = Noyreg 근처의 우주에는 아마도 위성의 밀도 높은 대기에서 기원했을 것으로 보이는 미량의 이산화탄소가 포함되어 있습니다.
		#LOC_KS_SciDef_dmSolarParticles_Onrefni_InSpace = 고에너지 입자들은 Onrefni 근처에 있지 않았을 때와 마찬가지로 수집기에 치명적인 것으로 판명되었습니다.
		#LOC_KS_SciDef_dmSolarParticles_Rouqea_InSpaceHigh = 이 고도에서는 Kcalbeloh에서 오는 'Holar wind'가 전부인 것으로 보입니다. Van Kerman 방사선대의 증거는 감지되지 않았습니다.
		#LOC_KS_SciDef_dmSolarParticles_Rouqea_InSpaceLow = Rouqea 근처에서 수집기는 질소와 산소 외에도 수증기를 포착하지만, Kcalbeloh의 블랙홀 바람은 여전히 강합니다.
		#LOC_KS_SciDef_dmSolarParticles_Sedah_InSpaceHigh = 이곳에서는 태양풍 외에 별다른 것이 감지되지 않지만, Sedah 뒤편 궤도를 돌 때 더 흔해지는 일반적인 수소와 헬륨의 미세한 흔적이 있습니다.
		#LOC_KS_SciDef_dmSolarParticles_Sedah_InSpaceLow = 밤 쪽에서는 Sedah의 거대한 외기권을 통과할 때 수소와 헬륨 미량 입자가 감지됩니다. 낮 쪽에서는 수집기가 태양풍에서 오는 하전 입자들로 뒤덮입니다.
		#LOC_KS_SciDef_dmSolarParticles_Sera_InSpaceHigh = 이 거리에서의 태양풍은 꽤 약해졌지만, 이온 농축기와 웨이퍼를 사용하여 상당한 양의 태양 입자를 수집하는 것은 여전히 쉽습니다.
		#LOC_KS_SciDef_dmSolarParticles_Sera_InSpaceLow = 다량의 하전 입자와 이산화탄소, 질소, 심지어 일부 중금속의 흔적이 수집기에 박혀 있습니다. 이는 Van Kerman 벨트에 대한 꽤 확실한 증거이지만, 다른 입자들은 Sera의 대기에서 온 것이 분명합니다.
		#LOC_KS_SciDef_dmSolarParticles_SimeBoth_InSpace = Simetra와 Simeht가 서로 춤을 추는 동안 수집기는 수소, 헬륨, 메탄의 흔적을 포착합니다.
		#LOC_KS_SciDef_dmSolarParticles_SimeSystem_InSpaceHigh = 이곳의 태양풍 입자는 매우 드물며, 수집기는 질소, 이산화탄소, 이산화염소의 흔적만 포착합니다.
		#LOC_KS_SciDef_dmSolarParticles_Suluco_InSpaceHigh = Suluco의 약한 자기장은 태양풍이 웨이퍼에 충돌하는 것을 거의 막지 못합니다. 이곳의 환경은 행성 간 공간과 크게 다르지 않습니다.
		#LOC_KS_SciDef_dmSolarParticles_Suluco_InSpaceLow = 다소 약해진 태양풍 외에도 Suluco 대기에서 온 질소와 산소 입자가 웨이퍼에 박힙니다.
		#LOC_KS_SciDef_dmSolarParticles_Sunorc_InSpaceHigh = Sunorc의 태양풍은 별치고는 전형적이지만, Kerbol과 같은 G형 별보다는 약간 약합니다.
		#LOC_KS_SciDef_dmSolarParticles_Sunorc_InSpaceLow = 압도적인 태양풍 밀도로 인해 장치가 종료되어 유용한 데이터를 수집할 수 없게 되었습니다. 손상되지 않았기를 바랍니다.
		#LOC_KS_SciDef_dmSolarParticles_Tot_InSpace = 이곳의 태양풍 함량은 Suluco 궤도에 있을 때와 다르지 않습니다.
		#LOC_KS_SciDef_dmSolarParticles_Uleg_InSpace = Kcalbeloh에서 너무 멀리 떨어져 있어 'Holar wind'는 매우 희박하며, Uleg이 궤도상 높은 곳에 있을 때는 더욱 그렇습니다. 이는 수집기가 아마도 Uleg의 대기에서 왔을 질소 입자 외에는 처리할 것이 별로 없다는 것을 의미합니다.
		#LOC_KS_SciDef_dmSolarParticles_WH3141A_InSpace = 수집기는 이 위치에서 놀라울 정도로 많은 양의 태양풍을 포착합니다. 이는 아마도 웜홀 반대편에서 오는 것일 것입니다.
		#LOC_KS_SciDef_dmSolarParticles_WH3141B_InSpace = 이곳의 태양풍은 Kerbol과 Sunorc 바람의 결합입니다. 하지만 Sunorc의 측정값이 훨씬 더 일정합니다.
		#LOC_KS_SciDef_dmbathymetryscan_Ahtpan_SrfSplashedDeep = 아무것도 안 보입니다, 선장님!
		#LOC_KS_SciDef_dmbathymetryscan_Ahtpan_SrfSplashedShallow = 카메라는 두꺼운 기름 속을 제대로 볼 수 없지만, 화학 분석 결과 나프타의 일종임이 확인되었습니다.
		#LOC_KS_SciDef_dmbathymetryscan_Anneheg_SrfSplashedDeep = 화염 저항의 물약이 있다면 이곳을 훨씬 더 명확하게 볼 수 있을 것입니다.
		#LOC_KS_SciDef_dmbathymetryscan_Anneheg_SrfSplashedShallow = 허. 참 이상하군요. 아직 녹지 않은 것 같습니다.
		#LOC_KS_SciDef_dmbathymetryscan_Efil_SrfSplashedWaterDeep = Efil의 어두운 심해는 전혀 어둡지 않습니다. 빛나는 해양 생물들이 지평선 끝까지 풍경을 수놓고 있어, 마치 외계 바다를 헤엄치는 별들처럼 보입니다.
		#LOC_KS_SciDef_dmbathymetryscan_Efil_SrfSplashedWaterShallow = Efil의 따뜻한 열대 바다에는 생물 발광 동물군이 가득하며, 수정처럼 맑은 물 덕분에 아주 자세히 관찰할 수 있습니다.
		#LOC_KS_SciDef_dmbathymetryscan_Iomena_SrfSplashedCraterLakesDeep = 이 호수의 가장 깊은 곳에서는 행성의 가장 깊고 따뜻한 지역에서 탄화수소가 지속적으로 형성되고 있음이 밝혀졌습니다. 황과 인 화합물도 물속을 떠다니고 있는데, 이는 다른 곳에 제한적인 화산 활동이 있음을 암시합니다. 현미경으로 자세히 살펴보니 우리의 추측이 맞았습니다. 미생물들이 실제로 휘발성 물질을 이용하여 탄화수소로 변환하고 있습니다!
		#LOC_KS_SciDef_dmbathymetryscan_Iomena_SrfSplashedCraterLakesShallow = 암모니아 호수에 떠 있는 복잡한 유기 분자들은 춥고 독성이 강한 환경임에도 불구하고 Iomena에 생명체가 존재할 가능성을 시사합니다. 만약 이곳에 무언가 살고 있다면, 우리 고향은 너무 뜨겁다고 느낄 것입니다.
		#LOC_KS_SciDef_dmbathymetryscan_Iomena_SrfSplashedOceansDeep = 카메라에 열수 분출구가 보입니다... 아니면... 암모니아에서는 뭐라고 부르든 말이죠. 어쨌든 검은 연기를 뿜어내고 있는데, 이는 Iomena에 현재 어느 정도의 화산 활동이 있음을 나타냅니다. 진짜 발견은 암모니아 샘플에 있습니다. 새로운 탄화수소가 계속 형성되고 있으며, 현미경으로 보니 작은 유기체들이 연기 기둥의 내용물을 대사하고 있습니다!
		#LOC_KS_SciDef_dmbathymetryscan_Iomena_SrfSplashedOceansShallow = 액체는 확실히 암모니아지만, 복잡한 유기 분자도 상당한 농도로 존재합니다. 이들은 여러 가지 기원을 가질 수 있지만, 그중 하나는 확실히 생물학적 성질을 띠고 있습니다. 더 깊이 들어가 봐야 합니다!
		#LOC_KS_SciDef_dmbathymetryscan_Onrefni_SrfSplashed = "최대 온도 무시"를 끄십시오, 겁쟁이 같으니!
		#LOC_KS_SciDef_dmbathymetryscan_Rouqea_SrfSplashedGenericDeep = 표면보다 훨씬 아래로 내려가도 보이는 것은 식수뿐입니다. 위쪽 대기에 산소가 존재함에도 불구하고, 미생물 수준에서조차 생명체의 흔적은 없습니다.
		#LOC_KS_SciDef_dmbathymetryscan_Rouqea_SrfSplashedGenericShallow = 아래쪽을 포함하여 모든 방향으로 수 킬로미터에 걸쳐 식수뿐입니다. 물 자체를 스캔해도 유기 화합물은 발견되지 않습니다.
		#LOC_KS_SciDef_dmbathymetryscan_Rouqea_SrfSplashedHighlandsDeep = 이 깊이에서는 실제로 단단한 표면을 볼 수 있습니다! 하지만 이 모든 징후는 Rouqea가 완전히 생명체가 없는 곳임을 가리킵니다.
		#LOC_KS_SciDef_dmbathymetryscan_Rouqea_SrfSplashedHighlandsShallow = 스캐너가 아래쪽에서 단단한 표면의 징후를 포착했습니다! 더 깊이 잠수해 봅시다!
		#LOC_KS_SciDef_dmbathymetryscan_Sera_SrfSplashedDeep = Sera의 호수는 수면 아래 깊은 곳에서도 독성이 줄어들지 않습니다. 이곳에 생명체가 존재할 가능성은 매우 낮습니다.
		#LOC_KS_SciDef_dmbathymetryscan_Sera_SrfSplashedShallow = 화학 분석 결과는 희망적이지 않습니다. 액체는 식수이지만, 생명 유지를 불가능하게 만드는 독성 중금속으로 가득 차 있습니다.
		#LOC_KS_SciDef_dmbathymetryscan_Suluco_SrfSplashedColdOceanDeep = 심해 생물은 Suluco 전역에서 거의 비슷합니다. 위치에 상관없이 태양으로부터 격리되어 있기 때문에, 이곳의 생명체는 더 따뜻한 경도에 사는 생물들과 구별하기 어렵습니다.
		#LOC_KS_SciDef_dmbathymetryscan_Suluco_SrfSplashedColdOceanShallow = Suluco의 거의 어두운 쪽 바다의 혹독한 환경은 북극해를 연상시키지만, 더 따뜻한 바다와 매우 가깝기 때문에 온도 변화가 훨씬 빠르며 일부 동물들은 몇 시간 만에 두 곳을 오가기도 합니다.
		#LOC_KS_SciDef_dmbathymetryscan_Suluco_SrfSplashedWaterDeep = 수면 아래 깊은 곳에서는 다양한 색깔의 동물들이 해저를 누비고 있습니다. 여러 면에서 Kerbin의 생명체와 비슷하지만, 다른 면에서는 매우 다릅니다. 우선, 낮과 밤의 주기가 없기 때문에 일주기 수직 이동이 없습니다.
		#LOC_KS_SciDef_dmbathymetryscan_Suluco_SrfSplashedWaterShallow = Suluco의 얕은 황혼의 바다에는 수많은 미세 및 거대 생물군이 서식하고 있습니다. 하지만 그중에서도 '군집 식물' 무리가 가장 흥미롭습니다. 이들은 바다 표면에 거대한 매트 형태로 떠 있으며, 바람과 태양을 모두 받는 거대한 돛을 가지고 있습니다.
		#LOC_KS_SciDef_dmbiodrillscan_Ahtpan_SrfLanded = 코어 샘플에는 나프타가 잔뜩 들어 있지만, 그 외에는 별다른 것이 없습니다. 지속적인 생물학적 활동의 흔적은 없습니다.
		#LOC_KS_SciDef_dmbiodrillscan_Arorua_SrfLanded = 가능성이 낮거나, 터무니없거나, 심지어 미친 짓일 수도 있지만, 확실히 하기 위해 생명체가 없는 코어 샘플을 채취합니다.
		#LOC_KS_SciDef_dmbiodrillscan_Arorua_SrfLandedSubstellarPoint = 이봐요, 모르는 일 아닙니까, 알겠어요? 절대 모르는 일이라고요.
		#LOC_KS_SciDef_dmbiodrillscan_Efil_SrfLandedBeach = 조간대에는 작은 포유류 같은 동물이 껍데기 안에서 살고 있는데, 이는 Kerbin의 친숙한 개념을 매력적으로 뒤집은 것이자 수렴 진화의 대표적인 예입니다. 이 동물은 다른 바다 생물이 버린 껍데기를 집으로 사용하지만, 억지로 버려야 할 상황이 오면 놀라울 정도로 빠르게 움직일 수 있습니다.
		#LOC_KS_SciDef_dmbiodrillscan_Efil_SrfLandedColdDesert = 북극 사막에는 대형 동물이 거의 없지만, 아래 토양은 활동으로 가득 차 있습니다. 곤충 크기의 놀랍도록 작은 털북숭이 생물들이 눈 속을 바쁘게 움직이며 터널을 파고 영양가 있는 뿌리를 가진 강인한 식물을 찾아 수확합니다.
		#LOC_KS_SciDef_dmbiodrillscan_Efil_SrfLandedGrassland = 여섯 개의 다리와 주름진 피부를 가진 튼튼한 짐승 떼가 탁 트인 평원을 휩쓸고 다니는데, 그 수가 너무 많아 감히 도전할 포식자가 거의 없습니다. 다행히 이 무리는 샘플 채취 과정을 방해하지 않지만, 앞으로는 우주선의 카메라로 해당 지역을 더 정기적으로 스캔하는 것이 좋을 것입니다.
		#LOC_KS_SciDef_dmbiodrillscan_Efil_SrfLandedMountains = 안타깝게도 이 고도에서는 볼 것이 별로 없습니다. Efil의 가장 높은 봉우리에서는 토양에 생명체가 거의 없지만, 거대한 날개를 가진 창 부리 생물들이 절벽에 둥지를 틀고 있는 모습은 여전히 볼 수 있습니다. Efil이 Anehta의 그림자를 통과하는 행성의 밤 동안, 이 동물들은 하늘로 날아올라 바다 생물을 잡아 굶주린 새끼들에게 먹이기 위해 이곳까지 가져옵니다.
		#LOC_KS_SciDef_dmbiodrillscan_Efil_SrfLandedNeedleleafForests = Kerbal 크기의 무척추동물들이 눈 속에서 주변 환경만큼이나 창백한 흰색 외골격으로 위장하고 있습니다. 샘플 드릴이 확장될 때 하나가 우주선으로 뛰어들지만, 닿기 전에 멈춥니다. 아마도 딱딱한 외관에서 온기를 거의 느끼지 못해 맛없는 점심거리가 될 것이라고 판단한 모양입니다.
		#LOC_KS_SciDef_dmbiodrillscan_Efil_SrfLandedRainforests = 점액질의 사지 달린 생명체가 울창한 수관의 나뭇가지 사이를 오가는데, 마치 척추동물 크라켄처럼 보입니다. 적어도 눈에 띄는 푸른색이 아니었다면 그렇게 보였을 것입니다. 토양 샘플을 채취하는 동안 이 생명체는 당신의 우주선을 흥미롭게 지켜보다가, 나무에서 내려와 우주선을 툭 건드리고는 재빨리 물러납니다.
		#LOC_KS_SciDef_dmbiodrillscan_Efil_SrfLandedTropicalDesert = 작고 털이 많은 동물들이 모래 속을 파고들어 거대한 군집을 이루며 방대한 지하 터널망을 만듭니다. 터널 사이에는 생물 발광을 하는 균류 같은 유기체가 자라나는데, 이들은 이를 재배하여 먹는 법을 터득했습니다. 지상에서는 다리가 길고 키가 큰 초식동물 무리가 가장 높은 나무의 잎을 뜯어 먹으며, 밝은 빛을 내는 줄무늬로 소리 없이 의사소통합니다.
		#LOC_KS_SciDef_dmbiodrillscan_Efil_SrfLandedTundra = Efil의 툰드라는 황량하지만 생명력이 넘칩니다. 무척추동물임에도 두꺼운 털로 덮인 거대한 이동성 초식동물들을 이곳에서 볼 수 있습니다. 길고 유연한 다리를 이용해 몸을 똑바로 세우면 키가 거의 세 배까지 커져 가장 높은 나무를 제외한 모든 곳의 잎을 먹을 수 있습니다.
		#LOC_KS_SciDef_dmbiodrillscan_Iomena_SrfLandedRocky = 이곳의 암석에는 유기물 흔적이 포함되어 있지만, 생물학적 활동의 다른 징후는 없습니다.
		#LOC_KS_SciDef_dmbiodrillscan_Iomena_SrfLandedWet = 이 코어 샘플에서는 상당한 농도의 유기 분자와 휘발성 원소, 주로 황과 인이 검출되었습니다.
		#LOC_KS_SciDef_dmbiodrillscan_Mehtna_SrfLanded = 코어 샘플은 실망스럽게도 예상대로 비활성 상태입니다.
		#LOC_KS_SciDef_dmbiodrillscan_Norihc_SrfLanded = 이 코어 샘플은 대부분 얼음이며, 형성 후 내부에 갇힌 것으로 보이는 일부 톨린 화합물이 포함되어 있습니다. Norihc에 지하 바다가 있더라도 드릴로는 닿을 수 없습니다.
		#LOC_KS_SciDef_dmbiodrillscan_Noyreg_SrfLanded = 코어 샘플이 탄소로 가득 차 있습니다! 말 그대로... 엄청나게 많은 탄소와 탄화수소 화합물로 이루어져 있는데, 생물학적 활동으로 형성된 것은 하나도 없는 것으로 보입니다.
		#LOC_KS_SciDef_dmbiodrillscan_Rouqea_SrfLanded = 드릴은 대부분의 식수와 다른 원소의 흔적을 발견했지만, 생물학적 활동의 징후는 없습니다. Rouqea의 산소 공급원은 지질학적 성격일 가능성이 높습니다.
		#LOC_KS_SciDef_dmbiodrillscan_Sera_SrfLanded = 코어 샘플은 독성이 강한 중금속으로 가득 차 있으며, 생체 신호로 해석될 만한 것은 전혀 없습니다. 어쩔 수 없죠.
		#LOC_KS_SciDef_dmbiodrillscan_Suluco_SrfLandedDay = 아무것도 발견하지 못할 것이라 예상했겠지만, 놀랍게도 이곳에서도 강인한 미생물 외에 작은 동물들이 생존하고 있습니다. 동물들은 모두 작으며, 햇빛을 피하기 위해 거의 평생을 지하에서 보내야 하지만, 그늘진 곳의 열기를 견디도록 적응했습니다. 태양이 움직이지 않기 때문에 이 그늘진 곳들은 영구적입니다.
		#LOC_KS_SciDef_dmbiodrillscan_Suluco_SrfLandedDayPole = Suluco에 생명체가 존재함에도 불구하고, 낮 쪽의 미미한 생명체들은 항성 직하점에 도달할 때까지 점차 사라집니다. 이곳은 너무 뜨겁고 황량하며 살기 힘들어 극한 미생물 외에는 아무것도 생존할 수 없습니다. 그럼에도 불구하고, 무언가가 이곳에 살고 있습니다. 정말 놀랍지 않습니까?
		#LOC_KS_SciDef_dmbiodrillscan_Suluco_SrfLandedDesert = 더 가혹한 조건에도 불구하고, 이곳의 생명체는 커빈의 사막에서처럼 번성합니다. 모래는 뜨겁지만, 영리한 동물들에게는 가혹한 태양을 피할 수 있는 좋은 안식처를 제공하며, 열기를 견딜 용기만 있다면 활용되지 않은 자원을 얻을 기회가 되기도 합니다.
		#LOC_KS_SciDef_dmbiodrillscan_Suluco_SrfLandedNight = Suluco의 밤 쪽은 황량하고 가혹하지만, 커빈의 극지방에서 생명체가 생존할 수 있다면 이곳에서도 가능합니다. 낮 쪽의 작은 동물들과 대조적으로, 이곳의 동물들은 체온을 최대한 생성하기 위해 보통 거대하며, 두꺼운 지방층 속에 열을 저장합니다. 몇몇 종은 포식자를 피하기 위해 밤 쪽의 짧은 구간을 이동하는 것으로 알려져 있습니다.
		#LOC_KS_SciDef_dmbiodrillscan_Suluco_SrfLandedNightPole = 밤 쪽 극지방은 Suluco에서 가장 추운 곳입니다. 커빈의 그 어떤 곳도 이렇게 춥지는 않습니다. 하지만... 한 종이 살아남았습니다. 거대한 짐승들이 밤 쪽을 가로질러 황혼 지대의 한쪽 끝에서 다른 쪽 끝으로 이동하며 거대한 무리를 지어 날아다닙니다. 그들은 두꺼운 단열층과 밀도 높고 차가운 공기 속에서 활공하며 단 며칠 만에 이 거리를 주파합니다.
		#LOC_KS_SciDef_dmbiodrillscan_Suluco_SrfLandedTundra = Suluco의 황혼 툰드라는 항상 으스스한 빛을 띠고 있는데, 무덤처럼 차갑게 느껴지는 이곳의 분위기와 잘 어울립니다. 그럼에도 생명체는 이곳에서 살아남습니다. 낮 쪽에서는 곤충이 태양을 피하기 위해 땅을 파지만, 이곳에서는 열을 가두고 따뜻함을 유지하기 위해 땅을 팝니다. 가혹한 환경이 포식자로부터 안전을 제공하기 때문에 많은 동물이 이곳에 둥지를 틉니다.
		#LOC_KS_SciDef_dmbiodrillscan_Suluco_SrfLandedTwilight = 코어 샘플은 생명체로 가득 차 있습니다. 이곳 지면의 녹색을 고려하면 놀라운 일은 아닙니다. 작은 유기체들이 흙을 파고 작은 굴을 만들어 그 안에서 안전하게 새끼를 기릅니다.
		#LOC_KS_SciDef_dmbiodrillscan_Suluco_SrfLandedWater = 일부 해양 생물들이 이곳 해안에 알을 낳은 것으로 보입니다. 이는 Suluco 해변 전역에서 흔히 볼 수 있는 광경입니다. 거대한 무척추동물들이 수중 포식자로부터 보호하기 위해 이곳 모래 속에 알을 묻습니다.
		#LOC_KS_SciDef_dmbiodrillscan_Uleg_SrfLanded = 코어 샘플은 얼음, 메탄, 약간의 이산화탄소로 가득 차 있지만, 그 외에는 별다른 것이 없습니다. 메탄이 생물학적 기원일 가능성은 낮습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Ahtpan_SrfLanded = 모래 표면에 대한 화학적 분석 결과, 대부분 규소 성분이며 탄화수소가 곳곳에 섞여 있는 것으로 밝혀졌습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Ahtpan_SrfSplashed = 물질이 레이저에 격렬하게 반응하며 연소합니다! 네, 확실히 기름이 맞습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Anneheg_SrfLanded = Anneheg의 표면은 내열성이 너무 강해서 레이저가 아무런 효과도 내지 못합니다. 음, 실패군요.
		#LOC_KS_SciDef_dmlaserblastscan_Arorua_SrfLanded = 레이저 폭파 스캔 결과, 암석 행성 표면의 전형적인 구성이 밝혀졌으며 규소 광물이 표면의 대부분을 차지하고 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Dipuc_SrfLanded = 이곳의 표면은 중금속이 풍부한 규산염 암석으로 구성되어 있어, Sera와 유사한 구성과 공통된 기원을 시사합니다. 당연히 화산암 형태로 발견됩니다.
		#LOC_KS_SciDef_dmlaserblastscan_Efil_SrfLandedArcticBiomes = Efil의 가장 추운 지역조차 생명체로 가득 차 있습니다. 표면의 얇은 눈 층 아래에는 활발한 활동이 숨겨져 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Efil_SrfLandedBeach = 이 비싼 장비를 사용하여 이미 명백한 사실을 확인하는 것은 낭비인 것 같습니다... 혹시 어떤 위성에 이렇게 맑고 깨끗한 바다가 있을 수 있다는 사실을 믿지 못하는 것입니까?
		#LOC_KS_SciDef_dmlaserblastscan_Efil_SrfLandedMountains = Efil 산맥의 고지대는 식수와 생명체 모두 부족합니다.
		#LOC_KS_SciDef_dmlaserblastscan_Efil_SrfLandedRainforestsGrassland = 표면 스캔 결과 식수뿐만 아니라 유기 화합물에서도 수소가 풍부하게 검출되었습니다. 이는 Efil의 번성하는 생태계를 증명합니다.
		#LOC_KS_SciDef_dmlaserblastscan_Efil_SrfLandedSnowMountains = 이 눈 덮인 봉우리에서 많은 식수 얼음을 찾을 수 있지만, 그 외에는 거의 발견되지 않습니다. 이 지역은 너무 외져서 생명체가 살기 어렵기 때문입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Efil_SrfLandedTropicalDesert = 레이저가 마른 모래 깊숙이 침투하여 극소량의 수소만을 드러냈습니다. 이렇게 건조한 지역임을 고려하면 당연한 결과입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Efil_SrfSplashedWater = 출렁이는 파도를 향해 발사한 레이저는 이곳이 실제로 귀중하고 상쾌한 액체 식수임을 확인시켜 주었습니다. 비록 마실 수 없을 정도로 염도가 높긴 하지만 말입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Enots_SrfLanded = 레이저가 작은 능선을 날려버리자 대부분 규산염 암석, 특히 칼세도니로 구성된 성분이 드러났습니다. 적도 지역이 약간 푸른 빛을 띠는 이유를 설명해 줄 수 있는 커런덤일 가능성이 있는 산화 알루미늄 흔적도 발견되었습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Eulb_SrfLanded = Eulb 표면의 화학 분석 결과 규산염은 상대적으로 적고 알루미늄과 산소가 매우 풍부한 것으로 나타났습니다. 이는 푸른색의 원인이 사파이어라고 흔히 알려진 청색 커런덤임을 시사합니다.
		#LOC_KS_SciDef_dmlaserblastscan_Iomena_SrfLandedCanyonsAll = 철분이 풍부한 암석이 이곳에서 발견되었으며, 아마도 협곡 벽에서 떨어진 것으로 보입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Iomena_SrfLandedGeneric = 표면을 기화시켜 생성된 기둥을 스캔한 결과 암모니아로 심하게 포화된 여러 철분 풍부 규산염이 확인되었습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Iomena_SrfLandedLowlands = Iomena의 저지대 지역은 시간이 지남에 따라 가장 밀도가 높고 철분이 풍부한 암석들이 모이는 곳일 것입니다. 이는 이곳 지표면의 매우 높은 철 함량을 설명하는 데 도움이 됩니다.
		#LOC_KS_SciDef_dmlaserblastscan_Iomena_SrfLandedMountainsAll = 이 산봉우리를 덮고 있는 밝은 흰색 물질은 암모니아 얼음으로 보입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Iomena_SrfLandedOceans = 분석 결과 이 젖은 토양은 액체 암모니아에 흠뻑 젖어 있습니다. 토양에는 단순 탄화수소도 일부 포함되어 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Iomena_SrfSplashed = 액체에 레이저를 발사한 결과 식수가 거의 전혀 없음을 확인했습니다. 대신 암모니아와 단쇄 탄화수소만 검출되었습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Mehtna_SrfLandedIce = 온도부터 대기까지 Mehtna의 모든 특성은 이곳이 식수 얼음일 수밖에 없음을 보여줍니다. 화학 분석 결과가 무엇을 보여주는지는 여러분이 짐작해 보십시오.
		#LOC_KS_SciDef_dmlaserblastscan_Mehtna_SrfLandedRock = 레이저 분석 결과 규산염이 더 나왔습니다. 와! 정말 지루하지 않네요! 전혀요...
		#LOC_KS_SciDef_dmlaserblastscan_Meiuqer_SrfLanded = 니 암석 위에 내가 있네, 니 암석을 레이저로 지지는 중.
		#LOC_KS_SciDef_dmlaserblastscan_Noi_SrfLanded = 표면 스캔 결과 탄소가 매우 풍부하고 다른 광물, 주로 규산염이 흩어져 있는 표면임이 확인되었습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Noira_SrfLanded = 표면 스캔 결과는 익숙합니다. 알루미늄이 풍부한 규산염 표면입니다. 덜 익숙한 점은 식수 얼음이 상당량 농축되어 있다는 것입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Norihc_SrfLanded = 빔이 표면에 구멍을 뚫자 증기가 뿜어져 나왔으며, 이를 통해 이곳이 식수 얼음임을 확인했습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Norihc_SrfLandedLowlands = 스캔 결과 증기 외에도 이곳 표면에 톨린 화합물이 존재함이 나타났습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Noyreg_SrfLanded = 생성된 섬광은 이 물질이 탄소가 매우 풍부함을 확인시켜 줍니다. 사실 구성 성분의 대부분이 탄소입니다. 이는 매우 이례적인 일이며, Noyreg가 매우 희귀한 유형의 천체, 즉 탄소 행성임을 시사하는 것으로 보입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Noyreg_SrfLandedIceCaps = 레이저 분석 결과 여러 장쇄 탄화수소가 이곳에 얼어붙어 있음이 확인되었으며, 식수 얼음의 흔적은 없습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Onrefni_SrfLanded = Onrefni의 표면은 레이저로 기화시키려는 시도에 매우 강한 저항을 보입니다. 실제로 기화된 극소량의 성분은 이곳이 주로 화성암이며, 그중에서도 매우 내열성이 강한 암석임을 확인시켜 줄 뿐입니다. 그럴 만도 하죠.
		#LOC_KS_SciDef_dmlaserblastscan_Onrefni_SrfLandedLava = 그래서 용암을 레이저로 녹이겠다는 계획입니까? 그래, 어디 한번 해보시죠.
		#LOC_KS_SciDef_dmlaserblastscan_Onrefni_SrfSplashed = 괜찮습니다. 현재 벌어지고 있는 상황에 대해 저는 아무런 불만이 없습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Rouqea_SrfLanded = 레이저 분석 결과 고체는... 식수인가요? 잠깐, 식수 얼음이라고요? 하지만 너무 뜨거운데... 이거 이국적인 얼음인가요? 제가 가장 좋아하는 종류의 얼음인데! 멋지네요.
		#LOC_KS_SciDef_dmlaserblastscan_Rouqea_SrfSplashed = 레이저 분석 결과 액체는 식수임이 확인되었습니다. 꽤 당연해 보이지만, 항상 확인하는 것은 좋은 일입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Sera_SrfLandedLakesIslands = 이곳의 젖은 땅은 표면의 대부분처럼 여전히 금속이 풍부하지만, 식수의 농도도 높습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Sera_SrfLandedLowlands = Sera의 분홍빛 저지대는 철분이 풍부한 암석으로 구성된 것으로 보이며, 알루미늄과 티타늄도 많이 포함되어 있어 색을 옅게 만들고 분홍빛이 도는 갈색을 띠게 합니다.
		#LOC_KS_SciDef_dmlaserblastscan_Sera_SrfLandedMidlandsHighlands = Sera의 더 어둡고 높은 지역은 저지대에 비해 알루미늄과 티타늄이 부족하며, 이것이 그 색깔의 이유입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Sera_SrfLandedMountains = Sera의 산들은 자철석, 즉 매우 자성이 강한 철 광물이 자연적으로 매우 풍부한 것으로 보입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Sera_SrfLandedPeaks = 분석 결과 이 물질은 식수 얼음으로 나타났으며, 고도를 고려하면 타당합니다.
		#LOC_KS_SciDef_dmlaserblastscan_Sera_SrfLandedPoles = Sera의 극지방에는 얼음 캡이 없는 것처럼 보이지만, 분석 결과 이곳에 얇은 식수 얼음 층이 존재함이 확인되었습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Sera_SrfSplashed = 액체 스캔 결과 예상대로 식수임이 확인되었습니다. 하지만 중금속과 기타 독성 물질의 농도가 높아 생명체가 존재할 가능성은 매우 낮습니다.
		#LOC_KS_SciDef_dmlaserblastscan_SrfLandedCraterGiant = 이 거대한 분화구는 Elad 표면에서 일반적으로 발견되지 않는 중금속과 기타 화합물이 풍부하며, 이는 충돌체가 매우 밀도가 높고 무거웠음을 시사하는 증거입니다.
		#LOC_KS_SciDef_dmlaserblastscan_SrfLandedCratersCraterLarge = Elad에서는 흔하지 않은 외부 금속과 탄소 화합물의 높은 농도는 이 분화구를 만든 충돌체의 구성 성분을 파악하는 데 통찰력을 제공합니다.
		#LOC_KS_SciDef_dmlaserblastscan_SrfLandedGrandCanyon = 이 협곡의 빽빽하게 채워진 표면은 매우 염분이 많으며, 이는 한때 심해 해구였다는 가설에 큰 무게를 실어줍니다.
		#LOC_KS_SciDef_dmlaserblastscan_SrfLandedGrandCliff = 이 거대한 절벽에는 여러 종류의 석영이 포함된 것으로 보입니다.
		#LOC_KS_SciDef_dmlaserblastscan_SrfLandedLowlands = 이곳의 지표면에는 고농도의 염분이 포함되어 있으며, 이는 과거에 액체 식수 바다나 대양의 바닥이었음을 강력하게 시사합니다.
		#LOC_KS_SciDef_dmlaserblastscan_SrfLandedMidlandsHighlands = Elad의 황량한 지표면은 화학적으로 주로 규산염, 산소, 알루미늄으로 구성된 것으로 보입니다. 커빈과 마찬가지로 지표면의 상당 부분이 화강암으로 이루어져 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_SrfLandedValleys = Elad의 '계곡'은 빽빽하게 채워진 염분 지형을 특징으로 하며, 이는 그중 상당수가, 혹은 전부가 과거에 심해 해구였음을 시사합니다. Elad는 Laythe와 같은 바다 행성이었을 가능성이 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Suluco_SrfLandedDay = 햇빛에 바랜 지표면에는 유기물 성분이 거의 없으며, 그저 모래와 암석뿐입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Suluco_SrfLandedDesert = 이 메마른 사막에서도 생명체의 흔적이 뚜렷하게 나타납니다. 암석의 최상층을 기화시키면 외계 곤충이 파놓은 작은 터널과 끈질긴 풀의 뿌리가 드러납니다.
		#LOC_KS_SciDef_dmlaserblastscan_Suluco_SrfLandedNight = 밤의 어둠 속에서는 식수 얼음과 다양한 광물의 흔적만 발견됩니다. 산조차도 암석만큼이나 단단한 두껍고 영구적인 빙하로 덮여 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Suluco_SrfLandedNightCraters = 이 충돌구에는 주변의 영구 빙하보다 지표면에 광물 화합물과 금속이 훨씬 더 많이 포함되어 있으며, 이는 거의 확실히 충돌구를 형성한 충돌체에서 유래한 것입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Suluco_SrfLandedTwilight = 방출물에서 나뭇잎의 탄소 화합물과 여러 종류의 암석이 감지되었습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Suluco_SrfSplashedWater = 유체를 기화시켜 확인한 결과 확실히 식수였지만, 굳이 이 특수 장비까지 써서 확인할 필요는 없었을 것입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Tot_SrfLanded = 이 소행성은 주로 암석으로 보이지만, 실제로는 예상보다 금속이 조금 더 많습니다. 특히 낮은 지역에 대한 추가 연구가 통찰력을 줄 수 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Tot_SrfLandedCraters = Tot의 충돌구는 소행성의 더 깊은 부분이 대부분 금속으로 이루어져 있음을 보여줍니다. 내부가 모두 이런 식이라면, 크기가 Gilly의 3분의 1 미만임에도 불구하고 중력이 Gilly의 두 배가 넘는 이유일 수 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Tot_SrfLandedLowlands = Tot의 저지대는 예상보다 훨씬 높은 금속 농도를 보입니다. Tot의 구성은 암석과 금속의 혼합물인 것으로 보입니다. 이는 비정상적으로 높은 밀도를 설명할 수 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Uleg_SrfLandedGeneric = Uleg의 얼음 지표면에 대한 화학 분석 결과, 행성 대부분이 단단하고 부서지기 쉬운 얇은 식수 얼음 층으로 덮여 있고 그 아래에는 더 단단하고 어두운 얼음이 있는 것으로 나타났습니다. 이 지표면 코팅에는 메탄 얼음과 이산화탄소 얼음의 흔적도 있습니다. 차가운 바람에 의해 이곳에 퇴적되었을 수 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Uleg_SrfLandedMountainsCliffs = Uleg의 이 지역은 다른 곳보다 색이 더 어둡지만, 분석 결과 화학적 구성은 여전히 대부분 식수 얼음인 것으로 나타났으며, 아마도 지표면의 나머지 부분을 덮고 있는 얇은 층과는 다른 결정 구조일 것입니다.
		#LOC_KS_SciDef_dmseismicHammer_Ahtpan_SrfLanded = 지진파를 보면 Ahtpan의 내부는 여전히 어느 정도 활동적이며, 핵은 여전히 용융 상태일 가능성이 높습니다.
		#LOC_KS_SciDef_dmseismicHammer_Anneheg_SrfLanded = 충격 실험 결과 Anneheg의 구성은 매우 금속성이 강하며, 최소 80%가 금속인 것으로 확인되었습니다.
		#LOC_KS_SciDef_dmseismicHammer_Arorua_SrfLanded = 정밀한 해머 타격 분석 결과, Arorua는 암석 지각과 부분적으로 용융된 금속 핵을 가진 일반적인 지구형 행성의 구성을 가진 것으로 보입니다.
		#LOC_KS_SciDef_dmseismicHammer_Dipuc_SrfLanded = Dipuc은 복잡한 내부 구조를 가지고 있습니다. 초기 스캔 결과 Dipuc은 여전히 용융 상태인 핵과 Sera의 조석력에 의해 형성된 것으로 보입니다.
		#LOC_KS_SciDef_dmseismicHammer_Dipuc_SrfLandedVolcano = 끊임없는 진동 때문에 이곳에서 Dipuc의 내부 구성을 명확하게 파악하는 것은 불가능합니다. 하지만 그 자체로도 흥미로운 데이터를 제공합니다.
		#LOC_KS_SciDef_dmseismicHammer_Dipuc_SrfLandedVolcanoVent = 자, 이제 용암에 빠지지 않도록 조심하십시오.
		#LOC_KS_SciDef_dmseismicHammer_Efil_SrfLandedRocky = 지진파가 이곳에서는 잘 전달되어 Efil의 내부를 더 명확하게 보여줍니다. 하지만 동굴과 층이 많다는 점을 고려하면 그리 놀라운 일은 아닙니다.
		#LOC_KS_SciDef_dmseismicHammer_Efil_SrfLandedSandy = 아래의 고운 지표면은 지진파를 흡수하는 능력이 뛰어나, 비밀을 밝혀내려는 당신의 시도를 방해합니다.
