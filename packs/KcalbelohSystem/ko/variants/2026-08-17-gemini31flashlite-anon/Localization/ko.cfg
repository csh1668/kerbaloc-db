		#LOC_KS_SciDef_atmosphereAnalysis_Sera_FlyingHigh = Sera의 상층 대기에서 수행한 분석 결과, 이산화탄소, 질소, 아르곤과 같은 기체가 미량 포함된 희박한 환경임이 밝혀졌습니다. 하지만 Sera의 상층 대기에는 하전 입자가 놀라울 정도로 높은 농도로 존재하며, 이는 행성 주변에 강력한 자기장이 형성되어 있음을 시사합니다. 한편, Sera의 대기에서 유기 화합물의 흔적이 전혀 발견되지 않은 점으로 미루어 보아, 이 행성은 우리가 아는 형태의 생명체가 살기에 적합하지 않은 것으로 보입니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Sera_FlyingLow = Sera의 하층 대기에서 수행한 분석 결과, 이산화탄소와 질소를 주성분으로 하며 아르곤과 메탄이 미량 포함된 짙고 뿌연 환경임이 밝혀졌습니다. 또한 Sera의 하층 대기에는 상당한 양의 먼지와 미립자가 존재하며, 이는 잦은 모래폭풍이나 대기 교란이 발생함을 시사합니다. 한편, Sera의 대기에서 유기 화합물의 흔적이 전혀 발견되지 않은 점으로 미루어 보아, 이 행성은 우리가 아는 형태의 생명체가 살기에 적합하지 않은 것으로 보입니다.
