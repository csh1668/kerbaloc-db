		#LOC_KS_SciDef_atmosphereAnalysis_Rouqea_FlyingLow_Highlands = 이곳의 대기는 짙고 숨 쉴 수 있지만, 파도 때문에 정확히 언제 숨을 쉴지 조심해야 합니다.
