		#LOC_KS_Dipuc_description = Dipuc는 Sera의 유일한 위성으로, 표면이 거대한 크레이터로 뒤덮여 있습니다. 이는 원래 Sera에 떨어졌을 수많은 강력한 운석 충돌을 이 위성이 대신 받아냈음을 보여줍니다. 또한 지질학적으로 활발하여 표면에 상당수의 활화산이 있으며, Sera 근처에서도 보일 만큼 거대한 산맥이 솟아 있습니다.
		#LOC_KS_Efil_description = 멀리서 보면 Efil은 Anehta 곁에 자리 잡은 사파이어처럼 보입니다. 매력적인 대기와 아름다운 해변 덕분에 이상적인 휴양지로 보입니다. 어쩌면 언젠가 커벌 우주센터(KSC)가 그곳에 리조트를 지을지도 모릅니다. 하지만 이 머나먼 행성을 방문할 티켓을 누가 감당할 수 있을지는 여전히 의문입니다.
		#LOC_KS_Elad_description = Elad는 Anehta의 가장 큰 위성이자 Anehta의 위성 중 가장 먼저 발견된 위성입니다. 과거에는 대기가 있었고 표면에 액체 상태의 물까지 존재했던 것으로 추정되지만, 이 위성이 왜 시간이 지나며 그러한 특성을 잃었는지는 여전히 수수께끼로 남아 있습니다.
		#LOC_KS_Enots_description = Enots는 Anehta의 고리 안에 박혀 있는 작은 소행성 위성으로, Anehta의 위성 중 알려진 가장 작은 위성으로 여겨집니다.
		#LOC_KS_Eulb_description = Eulb는… 파란 위성입니다.
		#LOC_KS_Iomena_description = Iomena는 거대한 크레이터와 대양을 가진 암석 행성입니다. 과학 연구에 따르면 대기와 대양 모두에 고농도의 암모니아가 존재하기 때문에 이 행성에 생명체가 존재할 가능성은 극히 희박합니다. 그럼에도 과학자들은 이처럼 극한의 환경에서 생명체를 발견할 가능성을 포기하지 않았습니다.
		#LOC_KS_Kcalbeloh_description = Kcalbeloh는 초대질량 블랙홀이자 Kcalbeloh 항성계의 중심입니다. 제트나 과열된 푸른 강착원반이 없는 것으로 보아, 수백만 년 동안 별을 삼키지 않은 것으로 보입니다.
