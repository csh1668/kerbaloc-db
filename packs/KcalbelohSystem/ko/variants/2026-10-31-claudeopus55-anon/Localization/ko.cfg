		#LOC_KS_Maelg_description = Maelg는 Kcalbeloh 항성계에서 가장 질량이 작고 온도가 낮은 항성이며, 그 결과 다른 항성들보다 훨씬 적은 빛을 방출합니다. L형 갈색 왜성으로 분류됩니다.
		#LOC_KS_Mehtna_description = Mehtna는 Maelg에 조석 고정된 얼어붙은 행성입니다. 표면 대부분이 두꺼운 빙관으로 덮여 있지만, 항성 직하점 부근 지역만은 예외로, "따뜻한 극"이라는 별명이 붙었습니다. 이 행성은 대기압이 낮아 물이 실온보다 훨씬 낮은 온도에서 끓기 때문에, 물은 주로 얼음이나 수증기 형태로 존재합니다.
		#LOC_KS_Meiuqer_description = Meiuqer는 궤도 이심률이 매우 큰 작은 행성입니다. Maelg와의 거리에 따라 표면 온도가 크게 변동합니다.
		#LOC_KS_Noi_description = Noi는 Sunorc와 Simeht-Simetra 계 사이의 L4 라그랑주점 주위를 칭동하는 트로이 소행성으로, 이 지점은 궤도상에서 쌍성 행성의 질량 중심보다 60° 앞에 있습니다.
		#LOC_KS_Noira_description = Noira는 Simetra-Simeht 쌍성 행성계의 질량 중심에 가장 가깝게 공전하는 위성이며, Kcalbeloh 항성계에서 유일하게 역행 방향으로 궤도를 돕니다. 표면에는 거대 크레이터가 있어, 과거에 비교적 큰 천체와 크게 충돌한 적이 있음을 시사합니다.
		#LOC_KS_Norihc_description = Norihc는 쌍성 가스 행성의 질량 중심을 공전하는 얼어붙은 위성입니다. 얼음으로 덮인 겉모습과 달리 지질 활동이 활발하며, 두꺼운 빙관에 깊은 균열이 수없이 나 있습니다.
		#LOC_KS_Noyreg_description = Noyreg는 대기가 극도로 짙은 암석 위성으로, 표면이 두꺼운 구름층 아래 가려져 있습니다. 대기는 매혹적인 녹색을 띠지만, 공기 중에 부식성 및 독성 성분의 농도가 높아 이 위성에 착륙하는 것은 매우 위험한 일로 여겨집니다.
		#LOC_KS_Onrefni_description = 왜행성 Onrefni는 Kcalbeloh에 극도로 가깝게 공전하며, 강한 조석력을 받아 표면이 갈가리 찢겨 있습니다.
		#LOC_KS_Rouqea_description = Rouqea는 표면 전체가 물로 덮인 매혹적인 바다 행성입니다. 레이테와 달리 이곳의 바다는 독특하고 남다르며, 엄청난 깊이로 인한 극한의 압력 때문에 특이한 얼음으로 이루어진 맨틀이 형성될 수도 있습니다. 신비롭고 매혹적인 그 심연은 지금도 연구자와 과학자들의 관심을 사로잡고 있습니다.
		#LOC_KS_SciDef_Anneheg_surfaceSample_SrfLanded = Anneheg의 표면은 화산 유리와 열에 강한 중금속이 섞여 있는 것으로 보입니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Ahtpan_FlyingHigh = 상층 대기를 분석한 결과, 낮은 농도의 탄화수소 증기가 검출되었습니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Ahtpan_FlyingLow = 하층 대기를 분석한 결과, 낮은 농도의 탄화수소 증기가 검출되었습니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Ahtpan_FlyingLow_NaphthanOceans = 대기 분석기 측정값에 따르면 탄화수소 증기의 농도가 높습니다. 아마 바로 아래에 말 그대로 기름 바다가 펼쳐져 있기 때문일 것입니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Ahtpan_SrfLanded = 대기 분석기에 중간 농도의 탄화수소 증기가 측정되었습니다. 이곳 특유의 좀약 냄새는 아마 이것 때문일 것입니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Ahtpan_SrfLanded_Coast = 대기 분석기에 높은 농도의 탄화수소 증기가 측정되었습니다. 아마 바로 옆에 말 그대로 탄화수소 바다가 있기 때문일 것입니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Ahtpan_SrfLanded_Islands = 대기 분석기에 높은 농도의 탄화수소 증기가 측정되었습니다. 아마 바로 옆에 말 그대로 탄화수소 바다가 있기 때문일 것입니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Anehta_FlyingHigh = 예상대로 수소와 헬륨이 있을 뿐 아니라, 수증기도 매우 풍부합니다. Sudarskerb 분류 체계에 따르면 Anehta는 II등급 가스 행성에 해당합니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Anehta_FlyingLow = 대기가 짙어지면서 하층 구름층에서는 수증기가 줄어들었습니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Arorua_FlyingHigh = Aralc-B에서 끊임없이 쏟아지는 하전 입자 때문에 대기 분석기가 엉뚱한 측정값을 내놓고 있습니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Arorua_FlyingLow = 하층 대기에서는 대기 분석기가 더 정밀하게 측정할 수 있습니다. 대기는 짙고 특이한 화합물로 이루어져 있는데, 아마 두 개의 태양에 끊임없이 구워진 결과일 것입니다.
