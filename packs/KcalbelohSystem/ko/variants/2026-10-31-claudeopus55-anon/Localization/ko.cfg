		#LOC_KS_SciDef_atmosphereAnalysis_EfilHome_SrfLanded_TropicalDesert = 사막임에도 불구하고 이곳의 공기는 이상할 정도로 습합니다.
		#LOC_KS_SciDef_atmosphereAnalysis_EfilHome_SrfLanded_Water = 장비가 물에 잠겨 사용할 수 없게 되었습니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Efil_FlyingHigh = Efil의 상층 대기로 올라가자 희박한 대기가 관측되었습니다. 기체는 드문드문 분포하며, 빛을 산란시키는 미세한 입자가 풍부해 하늘에 신비로운 광채를 더합니다. 이온화된 입자의 존재는 하전 입자들이 펼치는 천상의 발레를 암시하며, 이는 경이로운 이 행성의 가장 높은 곳을 수놓는 영묘한 오로라를 만들어 냅니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Efil_FlyingLow = Efil의 하층 대기에서 수행한 대기 분석 결과, 더 높은 농도의 산소와 섬세하게 균형을 이룬 질소 및 미량 원소가 역동적으로 어우러져 있음이 밝혀졌습니다. 공기 중에는 방향족 화합물의 흔적이 있어, 지표 곳곳에 피어 있는 화사한 꽃들의 향기를 떠올리게 합니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Efil_Srf = Efil 표면에서 실시한 대기 분석 결과, 풍부한 산소가 주를 이루고 기타 필수 원소가 미량 섞인 조화로운 기체 혼합물이 확인되었습니다. 공기에는 은은한 식물 향기가 배어 있어, 이 매혹적인 세계를 수놓은 울창한 숲을 짐작하게 합니다. 또한 대기 중에 떠 있는 미세한 에어로졸도 감지되었는데, 이것이 지평선을 장식하는 숨 막히는 장관을 만들어 냅니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Iomena_FlyingHigh = Iomena의 상층 대기를 분석한 결과, 암모니아 농도가 하층 대기보다 훨씬 높은 것으로 나타났습니다. 이는 암모니아를 높은 고도에 농축시키는 지질학적 또는 대기적 과정이 존재할 수 있음을 시사합니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Iomena_FlyingLow = Iomena의 낮은 고도에서 비행하며 수행한 대기 분석에 따르면, 이 행성의 대기는 주로 암모니아로 이루어져 있으며 미량의 메탄과 이산화탄소가 포함되어 있습니다. 탄화수소의 존재는 지질 활동 가능성을 시사합니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Iomena_SrfLanded = Iomena에 착륙한 상태에서 수행한 대기 분석에 따르면, 이 행성의 대기는 주로 암모니아로 이루어져 있으며 미량의 메탄과 이산화탄소가 포함되어 있는 것으로 보입니다. 대기에는 다양한 탄화수소도 소량 포함되어 있는데, 지질 활동 때문일 수 있습니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Iomena_SrfSplashed = Iomena's 액체 표면에 착수한 상태에서 수행한 대기 분석에 따르면, 이 행성의 대기는 주로 암모니아로 이루어져 있으며 미량의 메탄과 이산화탄소가 포함되어 있는 것으로 보입니다. 대기에는 다양한 탄화수소도 소량 포함되어 있는데, 지질 활동 때문일 수 있습니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Mehtna_FlyingHigh = 대기 분석기에 따르면 이 행성의 희박한 대기는 주로 이산화탄소와 수증기로 이루어져 있으며, 미량 기체도 상당량 포함되어 있습니다. Mehtna는 대기 자원 채취의 최적 후보지가 될 것입니다!
		#LOC_KS_SciDef_atmosphereAnalysis_Mehtna_FlyingLow = 대기 분석기에 따르면 이 행성의 희박한 대기는 주로 이산화탄소와 수증기로 이루어져 있으며, 미량 기체도 상당량 포함되어 있습니다. Mehtna는 대기 자원 채취의 최적 후보지가 될 것입니다!
		#LOC_KS_SciDef_atmosphereAnalysis_Mehtna_SrfLanded = 대기 분석기에 따르면 이 행성의 희박한 대기는 주로 이산화탄소와 수증기로 이루어져 있으며, 미량 기체도 상당량 포함되어 있습니다. Mehtna는 대기 자원 채취의 최적 후보지가 될 것입니다!
		#LOC_KS_SciDef_atmosphereAnalysis_Norihc = Norihc의 희박한 대기는 대부분 질소로 이루어져 있으며, 미량의 일산화탄소와 기타 기체가 포함되어 있습니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Noyreg_FlyingHigh = Noyreg 상공의 높은 고도에서는 질소와 미량의 기타 기체가 발견되지만, 압도적인 대부분은 이산화탄소입니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Noyreg_FlyingLow = 분석 결과 Noyreg의 이산화탄소 대기는 이 고도에서 상당히 짙어지며, 이산화염소 같은 무거운 기체가 발견되는 곳도 바로 여기입니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Noyreg_SrfLanded = Noyreg의 대기는 대부분 이산화탄소로 이루어져 있으며, 소량의 질소와 이산화염소, 그리고 미량의 기타 기체(대개 끔찍한 독성을 띱니다)가 포함되어 있습니다. 대기가 초록색을 띠는 원인이 이산화염소인지, 아니면 독특한 굴절 효과 때문인지는 아직 분명하지 않습니다. 어쩌면 둘 다 조금씩일지도 모릅니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Rouqea_FlyingHigh_Cracks = 높은 고도의 공기는 낮은 고도의 공기와 대체로 비슷합니다. 다만 더 희박하고 덜 습하며, 블랙홀이 훨씬 더 실존적인 공포를 불러일으키는 모습으로 보일 뿐입니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Rouqea_FlyingHigh_Highlands = 대기 높은 곳에서 Kcalbeloh로부터 날아온 고에너지 입자가 이따금 감지됩니다. 마음만 먹으면 눈 깜짝할 새에 행성 전체를 날려 버릴 수 있다는 사실을 상기시켜 주는 듯합니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Rouqea_FlyingHigh_Lowlands = 이곳의 대기는 더 희박하며, 이 높이에서는 미량의 수소가 존재합니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Rouqea_FlyingHigh_Midlands = 미량의 수소는 아마도 Kcalbeloh의 존재 때문일 것입니다! 가벼운 원소일수록 당연히 더 쉽게 빠져나가므로, Rouqea는 그것들을 붙잡기에 완벽한 위치에 있습니다!
