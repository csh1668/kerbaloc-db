		#LOC_KS_SciDef_atmosphereAnalysis_Sera_FlyingHigh = Sera의 상층 대기에서 실시한 대기 분석 결과, 이산화탄소, 질소, 아르곤 등 여러 기체가 미량 존재하는 얇고 희박한 환경이 확인되었습니다. 그러나 Sera의 상층 대기에는 하전 입자가 놀라울 정도로 높은 농도로 분포하고 있어, 행성 주변에 강한 자기장이 존재함을 시사합니다. 하지만 Sera의 대기에서 유기 화합물의 흔적이 전혀 감지되지 않은 것으로 보아, 이 행성은 우리가 아는 형태의 생명체가 살기에는 적합하지 않은 것으로 보입니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Sera_FlyingLow = Sera의 하층 대기에서 실시한 대기 분석 결과, 주로 이산화탄소와 질소로 이루어져 있고 아르곤과 메탄 등 기타 기체가 미량 포함된 짙고 뿌연 환경이 확인되었습니다. 또한 Sera의 하층 대기에는 상당량의 먼지와 미립자 물질이 존재하여, 잦은 먼지 폭풍이나 대기 교란이 일어나고 있음을 시사합니다.  하지만 Sera의 대기에서 유기 화합물의 흔적이 전혀 감지되지 않은 것으로 보아, 이 행성은 우리가 아는 형태의 생명체가 살기에는 적합하지 않은 것으로 보입니다.
