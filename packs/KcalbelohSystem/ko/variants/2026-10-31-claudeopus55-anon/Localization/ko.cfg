		#LOC_KS_SciDef_dmseismicHammer_Sera_Wet = 젖은 지면은 지진파 반사에 그다지 유리하지 않아 쓸 만한 데이터를 많이 얻지 못했습니다. 더 높고 바위가 많은 지점이 더 나은 선택일 수 있습니다.
		#LOC_KS_SciDef_dmseismicHammer_Suluco_SrfLandedDay = Suluco의 모래투성이 낮 쪽 지역은 지진파를 기막히게 잘 흡수해서, 여기서는 정말 알아낼 것이 별로 없습니다. 산맥에서 시도해 보는 것이 어떻겠습니까?
		#LOC_KS_SciDef_dmseismicHammer_Suluco_SrfLandedMountainsDayTwilight = 단단한 지표가 지진파를 잘 전달해 Suluco의 내부를 연구할 기회가 충분합니다. 화산 활동은 매우 드물지만, Suluco는 여전히 지질학적으로 꽤 활발한 것으로 보입니다.
		#LOC_KS_SciDef_dmseismicHammer_Suluco_SrfLandedMountainsNight = 바위처럼 단단한 빙하가 Suluco의 지각 전체에 깨끗하게 반사되어, 액체 상태의 물과 어쩌면 고립된 생태계까지 품고 있을지 모르는 거대한 지하 동굴의 증거를 보여 줍니다!
		#LOC_KS_SciDef_dmseismicHammer_Suluco_SrfLandedNight = 이곳은 눈이 빽빽하게 다져져 있어 데이터에서 쓸 만한 정보를 전혀 얻을 수 없습니다. 산맥의 빙하라면 더 많은 것을 알아낼 수 있을지도 모릅니다.
