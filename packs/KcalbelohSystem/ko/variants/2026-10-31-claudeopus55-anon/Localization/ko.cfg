		#LOC_KS_SciDef_barometerScan_Dipuc_SrfLanded_CraterEast = "대체 왜 대기라고는 흔적도 없는 조그만 자연 위성 Dipuc에서 기압계 측정을 하고 있는 겁니까? Mortimer, 커보노트 센터에 연락하십시오. 현재 Dipuc 지표 탐사 임무 승무원이 귀환하면 정신분석가가 필요하겠습니다. 터무니없는 과학 실험 사례가 또 하나 생겼습니다." -Gene
		#LOC_KS_SciDef_barometerScan_Dipuc_SrfLanded_CraterSouth = 다소 현학적인 과학 실험 수집 중에 죄송하지만, 하던 일을 멈추고 생각해 보신 적 있습니까? 도대체 왜 진공에서 기압계 측정을 하는 겁니까? 우주선에 동료 승무원이 타고 있다면, 이 일로 조롱받을 각오를 하십시오.
		#LOC_KS_SciDef_barometerScan_Dipuc_SrfLanded_CraterWest = "나는 이제 무지의 화신, 지성의 파괴자가 되었노라. 모든 천재들은 내 앞에서 움츠리고 발밑에 엎드릴지어다!" Dipuc에서 기압계를 작동시키려 헛되이 애쓰던 한 괴짜 커벌이 이렇게 외쳤습니다. Gene은 짜증이 난 나머지 임무 승무원과의 무선 통신을 간간이 끊어 버리고 싶었습니다. 하지만 그럴 수 없었습니다. 지금 그가 꼼짝없이 지휘하고 있는 것과 같은 유인 임무에서는, 임무 목표를 달성하고 승무원의 안전을 보장하기 위해 끊임없는 상황 파악과 데이터 전송이 무엇보다 중요했기 때문입니다.\n\n그러나 Gene은 그 사실에서 아무런 위안도 얻지 못했습니다. 진공에서 기압을 측정하려 한 그 커벌이 스스로 자연 선택의 희생양이 될 이유를 만들어 버렸다는 것을 알고 있었기 때문입니다.
		#LOC_KS_SciDef_barometerScan_Dipuc_SrfLanded_DoubleCrater = "기압계 측정이 일반적으로 수행되는 조건과 정반대인 환경에서 현장 기압계 실험을 시도함으로써, 귀하는 스스로 공인된 얼간이임을 입증하였으므로 임무가 끝날 때까지 근신 처분에 처해집니다. 판결에 저항하지 마십시오. 저항하면 근신의 수위만 높아지고 기간만 늘어날 뿐입니다. 추가로 지시를 따르지 않을 경우 진공에 직접 노출시키는 방식으로 즉시 해고됩니다." -Mortimer\n\n커벌 우주센터 우주비행사 단지는 귀하를 잃어도 개의치 않을 것입니다. 어쨌거나 크라켄이 우글거리는 우주를 무사히 누비려면 우주비행사는 커벌 종족의 정점이어야 하니까요.\n\n귀하가 현재 임무의 유일한 승무원이라 해도 임무 관제소 역시 귀하를 잃는 것에 개의치 않을 것입니다.
		#LOC_KS_SciDef_barometerScan_Dipuc_SrfLanded_Highlands = 추가 과학 점수를 얻기 위해 일부러 이 작업을 하는 것이라면 그렇게 하십시오. 다만 진공 환경에서 대기에 의존하는 과학 실험을 수행하는 것이 논리적으로 얼마나 우스꽝스러운 일인지는 꼭 알아 두십시오.
		#LOC_KS_SciDef_barometerScan_Dipuc_SrfLanded_Lowlands = 하필이면 왜 진공 세계에서 기압계 측정을 했는지 정확히 여쭤봐도 되겠습니까? 진공 환경에 들어서는 순간 수리 전까지는 고칠 수도 작동시킬 수도 없는 상태가 되지 않았다 해도, 거기서 데이터를 수집하려는 시도가 결국 그렇게 만들 것이라는 건 논리적으로 당연합니다.\n\n\n<color=#000000>[Kerbalism 같은 모드라면 비슷한 메커니즘을 구현할 수 있지 않을까...]</color>
		#LOC_KS_SciDef_barometerScan_Dipuc_SrfLanded_Midlands = 당신은 커벌치고도 어리석거나(원래도 기준이 낮지만), 아니면 어디든 가는 단일 스테이지 우주선이나 다목적 착륙선에서 실험을 수행하는 중일 것입니다. 후자라면 계속 나아가 노력의 대가를 거두십시오. 다만 중력적으로 이상한 웜홀을 통해 Kcalbeloh 항성계에 도착했다면, 솔직히 그 대가는 보잘것없을 것입니다.
