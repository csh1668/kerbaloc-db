		#LOC_KS_SciDef_atmosphereAnalysis_Simeht_FlyingLow = 극한의 압력이 대기 분석기를 납작하게 짓눌렀지만, 그 전에 분석기는 초임계 유체의 존재를 감지해 냈습니다.
