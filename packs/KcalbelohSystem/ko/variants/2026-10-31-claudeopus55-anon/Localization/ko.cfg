		#LOC_KS_SciDef_rpwsScan_Noyreg_InSpace = 태양 복사가 Noyreg의 두꺼운 대기에서 하전 입자를 방출시키며, 이 입자들이 쌍둥이 거대 행성의 춤추는 자기장과 상호작용하면서 플라스마파가 발생합니다.
		#LOC_KS_SciDef_rpwsScan_Onrefni_InSpaceHigh = 이곳에서는 Kcalbeloh의 '홀풍'이 거세게 붑니다. 울부짖는 소리가 들릴 것만 같지만, 물론 우주에서는 그렇지 않습니다. 하지만 그 고요함이 오히려 이 모든 광경을 더욱 불안하게 만든다고도 할 수 있습니다...
		#LOC_KS_SciDef_rpwsScan_Onrefni_InSpaceLow = 강력한 자기권을 가졌음에도, Onrefni는 이른바 '홀풍'이 표면을 강타하는 것을 거의 막지 못합니다.
		#LOC_KS_SciDef_rpwsScan_Rouqea_InSpaceHigh = Kcalbeloh의 강착 원반에서 불어오는 블랙홀 풍이 Rouqea의 짙은 대기와 흥미로운 상호작용을 일으키고 있지만, 이전에 본 것들에 비하면 그리 특별하지는 않습니다.
		#LOC_KS_SciDef_rpwsScan_Rouqea_InSpaceLow = Rouqea의 두꺼운 대기와 습한 표면은 매우 흥미로운 전파 활동을 많이 만들어 냅니다. 이곳은 진정한 외계 세계입니다!
		#LOC_KS_SciDef_rpwsScan_Sedah_InSpaceHigh = 고에너지 플라스마가 Sedah를 강타하여 반복되는 흥미로운 전파 패턴을 만들어 냅니다. 연구소 사람들이 연구할 데이터가 넘쳐날 것입니다.
		#LOC_KS_SciDef_rpwsScan_Sedah_InSpaceLow = 태양풍이 Sedah의 부풀어 오른 대기를 거세게 두드리며 행성 내부에서 기묘한 신호를 만들어 냅니다. 이는 행성 내부에 전류가 흐르고 있음을 시사하며, 이 전류가 막대한 내부 열을 생성해 행성의 엄청난 크기를 설명하는 데 도움이 될 것입니다. 하지만 예상만큼 강하지는 않은 듯합니다. 이 전류가 만들어 내는 자기장은 강력하긴 하지만 줄에 비하면 다소 약하기 때문입니다.
		#LOC_KS_SciDef_rpwsScan_Sera_InSpaceHigh = Sera의 자기꼬리를 통과하면서 이미 약한 태양풍이 크게 잦아듭니다. 다른 측정값들은 Sera의 자기장이 상당히 강하다는 것을 보여 줍니다.
		#LOC_KS_SciDef_rpwsScan_Sera_InSpaceLow = 하전 입자로 이루어진 고리가 낮은 궤도에서 Sera를 둘러싸고 있는 듯합니다. 틀림없이 위험한 반 커먼 대입니다.
		#LOC_KS_SciDef_rpwsScan_SimeBoth_InSpaceHigh = 두 행성의 자기권과 대기가 상호작용하면서, 이곳 두 행성 사이에는 믿을 수 없을 만큼 복잡한 정전기 환경이 형성되어 있습니다.
		#LOC_KS_SciDef_rpwsScan_SimeSystem_InSpaceHigh = 이 우주 영역에는 태양풍이 거의 도달하지 않으므로, 이곳의 전파 활동은 거의 전부 두 거대한 자기장이 서로, 그리고 다른 위성들의 대기와 상호작용하며 만들어 낸 것입니다.
		#LOC_KS_SciDef_rpwsScan_Simeht_InSpaceLow = Simeht의 약간 덜 무거운 대기는 그만큼 약한 전파를 방출하는 것으로 보입니다.
		#LOC_KS_SciDef_rpwsScan_Simetra_InSpaceLow = Simetra의 대기에서 강력한 전파가 방출되지만, 약간 덜 무거운 Simeht도 그에 거의 버금갑니다.
		#LOC_KS_SciDef_rpwsScan_Suluco_InSpaceHigh = Suluco의 비교적 약한 자기권은 Sunorc의 태양풍을 많이 막아 내지 못하지만, 표면의 생명체를 보호하기에는 충분한 듯합니다.
		#LOC_KS_SciDef_rpwsScan_Suluco_InSpaceLow = 플라스마파 분석 결과 Suluco의 적도 주위에 하전 입자로 이루어진 희미한 고리가 있음이 확인되었습니다. 약한 반 커먼 대의 징후입니다.
		#LOC_KS_SciDef_rpwsScan_Sunorc_InSpaceHigh = 이 K형 항성은 대부분의 별이 그렇듯 강력한 태양풍을 내뿜습니다. Sedah의 자기권과의 상호작용이 주목할 만한데, 행성에서 방출되는 전파가 그 크기의 천체치고는 예상보다 약하기 때문입니다.
		#LOC_KS_SciDef_rpwsScan_Sunorc_InSpaceLow = 장비가 Sunorc 표면에서 방출되는 전파를 분석하면서 수많은 흑점을 감지했습니다.
		#LOC_KS_SciDef_rpwsScan_Tot_InSpace = 이곳은 Sunorc의 태양풍이 강하며, Suluco의 자기꼬리나 Tot의 그림자를 지날 때만 비로소 잦아듭니다.
		#LOC_KS_SciDef_rpwsScan_Uleg_InSpace = 전파 플라스마 환경은 Uleg의 궤도상 위치에 따라 극적으로 달라집니다. 원벨로점 근처에서는 매우 조용합니다. 하지만 근벨로점에서는 Kcalbeloh의 '홀풍'이 느껴집니다. 아주 약간이지만요.
		#LOC_KS_SciDef_rpwsScan_Wormholes_InSpace = 웜홀 양쪽 끝에서 온 태양풍 플라스마가 이곳에서 상호작용하는 것으로 보이며, 지금껏 본 적 없는 복잡한 태양풍 환경을 형성하고 있습니다.
		#LOC_KS_SciDef_scopeScan_Ahtpan_InSpaceHigh = 행성 전체가 검은 황금의 대양으로 뒤덮여 있다는 전망은 그냥 지나치기엔 너무나 매혹적이었습니다. 그래서 망원경을 Ahtpan에 맞추고 사진을 찍기 시작합니다.
		#LOC_KS_SciDef_scopeScan_Ahtpan_InSpaceLowCraters = Ahtpan은 대기가 꽤 두꺼워서, 이를 뚫고 도달하는 몇 안 되는 충돌체는 거대한 것이어야만 합니다. 이 크레이터들의 크기가 그 증거입니다.
		#LOC_KS_SciDef_scopeScan_Ahtpan_InSpaceLowGeneric = Ahtpan은 공상과학 영화에서 그대로 튀어나온 사막 세계처럼 보입니다. 하지만 지금까지 어떤 SF 작가도 석유의 대양을 상상해 낼 만큼의 영감을 받지는 못했습니다! 역시 현실은 소설보다 더 기묘한 듯합니다. 어쩌면 더 멋질지도 모릅니다. 우주 공중전이 적다는 점은 아쉽지만...
		#LOC_KS_SciDef_scopeScan_Ahtpan_InSpaceLowIslands = 알맞은 서어어억유우우우만 있다면 무엇이든 사고팔 수 있습니다!
		#LOC_KS_SciDef_scopeScan_Ahtpan_InSpaceLowMountains = Ahtpan의 산맥은 붉은 색조로 두드러지며, 베이지색 지표의 나머지 부분과 멋진 대조를 이룹니다.
		#LOC_KS_SciDef_scopeScan_Ahtpan_InSpaceLowNaphthaOceansCoast = 이 사진들이라면 틀림없이 석유 업계로부터 넉넉한 자금을 확보할 수 있을 것입니다.
		#LOC_KS_SciDef_scopeScan_Anehta_InSpaceHigh = Anehta의 청백색 고리는 가스 행성과 색이 꽤 비슷한데, 어떻게 이럴 수 있겠습니까? 얼음일 리는 없습니다. Anehta는 항성들의 동결선 훨씬 안쪽에 있기 때문입니다. 어쩌면 고리가 Eulb와 같은 물질로 이루어진 것은 아니겠습니까?
		#LOC_KS_SciDef_scopeScan_Anehta_InSpaceLow = 아래의 푸른 하늘이 꽤 아름다운 사진을 만들어 내며, 거대한 수증기 기둥을 놀라울 만큼 세밀하게 포착합니다. 이 폭풍 중 일부에는 커빈 전체가 들어가고도 남을 것이 확실합니다.
		#LOC_KS_SciDef_scopeScan_Anneheg_InSpaceHigh = Anneheg는 눈부신 빛의 바다 속에서 알아보기 어렵습니다. 화성암 지표가 워낙 어둡기 때문에 더욱 그렇습니다.
		#LOC_KS_SciDef_scopeScan_Anneheg_InSpaceLow = Anneheg의 소용돌이치는 유리질 지형은 이 행성의 지표가 얼마나 심하게 손상되었는지 여실히 보여 줍니다. Aralc-A로부터 이 거리에서 형성되었을 가능성은 낮습니다. 그랬다면 아득한 옛날에 소멸했을 것입니다.
		#LOC_KS_SciDef_scopeScan_Anneheg_InSpaceLowLava = Anneheg의 용암 대양은 벌어진 상처처럼 행성 곳곳을 가로지릅니다. Aralc-A가 이 세계를 산산조각 내고 있습니다.
		#LOC_KS_SciDef_scopeScan_AralcA_InSpace = 으아악, 내 눈!!!
		#LOC_KS_SciDef_scopeScan_AralcB_InSpace = 적색 왜성이라 해도 항성은 항성입니다. 민감한 행성 관측용 망원경을 항성에 겨누는 것은 현명하지 못한 결정입니다.
		#LOC_KS_SciDef_scopeScan_Arorua_InSpaceHigh = Arorua의 오로라가 아래에서 찬란하게 빛나고 있으며, 왜 더 불투명한 구름으로 덮여 있지 않은지 궁금해집니다. 한때는 그랬을지도 모르지만, 강렬한 햇빛이 그 구름마저 날려 버렸을지도 모릅니다.
		#LOC_KS_SciDef_scopeScan_Arorua_InSpaceLowCliffsAll = 이 절벽들은 꽤 가파릅니다. 좋은 관광 명소가 될지도 모릅니다.
		#LOC_KS_SciDef_scopeScan_Arorua_InSpaceLowGeneric = Arorua의 지표는 대부분 구릉지이며 어둡지만, 극한의 햇빛 아래에서는 유리처럼 빛납니다. 어쩌면 일부는 -정말로- 유리일지도 모릅니다!
		#LOC_KS_SciDef_scopeScan_Arorua_InSpaceLowMountainsAll = Aralc의 산맥이 하층 대기를 뚫고 빛나며, 더 어두운 저지대를 배경으로 두드러집니다.
		#LOC_KS_SciDef_scopeScan_Arorua_InSpaceLowSubstellarPoint = Aralc-B를 향한 지점은 대체로 특징이 없지만, 이곳이 모든 햇빛이 집중되는 지점이라는 사실을 알고 나면 그곳이 얼마나 뜨거울지 궁금해집니다.
		#LOC_KS_SciDef_scopeScan_Dipuc_InSpaceHigh = 이 위성은 잘 치댄 밀가루 반죽 덩어리를 살짝 떠올리게 합니다. 화산 활동으로 보아, 스스로를 꽤 잘 굽고 있는 듯합니다.
		#LOC_KS_SciDef_scopeScan_Dipuc_InSpaceLowCraterSouthCraterEast = 충돌 분출물이 햇살처럼 이 크레이터에서 사방으로 뻗어 나갑니다. 그리고 우와, 저 선들이 정말 멀리까지 뻗어 있습니다! 이 크레이터를 만든 것이 무엇이든 엄청난 에너지를 지니고 있었을 것입니다.
		#LOC_KS_SciDef_scopeScan_Dipuc_InSpaceLowCraterWest = 이 상당한 크기의 크레이터는 가장 큰 두 크레이터보다는 덜 극적이며, 충돌 분출물이 없다는 점이 이를 보여 줍니다.
		#LOC_KS_SciDef_scopeScan_Dipuc_InSpaceLowDoubleCrater = 지질학적으로 보면 전혀 드문 지형이 아닙니다. 그래도 두 크레이터의 가장자리가 서로 겹치는 모습은 여전히 볼 만합니다.
		#LOC_KS_SciDef_scopeScan_Dipuc_InSpaceLowGeneric = 재앙에 시달리고 크레이터로 뒤덮인 Dipuc의 지표는 지상에서 보면 분명 장관일 것입니다. 이렇게 흥미로운 무대기 위성은 흔치 않습니다. 이야, 적어도 Sera만큼은 독특합니다!
		#LOC_KS_SciDef_scopeScan_Dipuc_InSpaceLowMountains = 이 뚜렷한 산등성이들은 망원경으로 대낮처럼 선명하게 보이며, 망원경은 그 아래 지표에 드리운 그림자를 인상적인 이미지로 담아냅니다.
		#LOC_KS_SciDef_scopeScan_Dipuc_InSpaceLowVolcano = Dipuc의 화산은 모두 끊임없이 활동 중이며, 소규모 분화가 꽤 정기적으로 일어납니다. 망원경이 Dipuc에서 분출되어 아마도 Sera 궤도로 날아가는 우산 모양의 가스와 먼지 기둥을 포착합니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceHigh = 완벽한 푸른 구슬처럼, Efil은 망원경 속에서 청록빛으로 빛납니다. 사진으로는 Efil의 아름다움을 온전히 담아낼 수 없지만, 적어도 그 일부는 간직할 수 있습니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceLowGrassland = Efil의 저지대에는 완만한 초록 언덕이 펼쳐져 있으며, 마치 거장이 그린 듯 꽃밭이 점점이 박혀 있고 열대우림이 그 둘레를 감싸고 있습니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceLowMountainsSnowMountains = Efil의 봉우리들은 주변의 아름다운 풍경을 더 잘 보려는 듯 구름 위로 고개를 내밀고 있습니다. 저 위에는 분명 사는 것이 거의 없겠지만, 그 나름의 평온함이 있지 않겠습니까? 그런 봉우리 꼭대기에 서면 분명 고요함만을 느낄 것입니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceLowNeedleleafForests = Efil의 극지 숲은 따뜻한 기후 지역만큼이나 무성하고 생명으로 가득하며, 길들지 않은 광활한 황야로 덮여 있고 눈으로 반짝입니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceLowRainforests = 청록색 잎을 단 외계 나무들의 울창한 열대우림이 행성 표면 대부분을 뒤덮고 있어, 거대한 짐승들이 아직 세상을 누비던 낭만적인 고대 커빈의 모습을 떠올리게 합니다. 그 시절의 커빈은 오래전에 사라졌지만, Efil은 이곳에 분명한 실체로 떠 있습니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceLowTropicalDesert = Efil의 열대 사막은 행성의 다른 지역보다 살기 힘들지 모르지만, 그 아름다움은 결코 뒤지지 않습니다. 모래 언덕이 다른 곳의 풀밭 언덕처럼 굽이치고, 모래에 남은 긴 발자국이 보여 주듯 사막에 적응한 강인한 동물 무리가 이곳을 누비고 있을 것이 분명합니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceLowTundraColdDesert = Efil의 춥고 황량한 지역은 행성의 나머지를 감싸는 아름다움이 닿지 않은 몇 안 되는 곳입니다. 대신 이곳은 메마르고 생명이 거의 없으며, 생명으로 넘쳐나는 Efil에 남은 몇 안 되는 황량한 땅입니다.
		#LOC_KS_SciDef_scopeScan_Efil_InSpaceLowWater = Efil의 대양이 쌍둥이 태양의 빛을 받아 밝은 청록색으로 빛납니다. 마치 고전 SF 소설의 표지에서 그대로 튀어나온 삽화 같습니다.
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceHigh = 연구개발부에 따르면 이 기묘한 지형은 Elad가 최근에 두꺼운 대기와 어쩌면 대양까지 잃어버렸다는 것 외에는 설명할 방법이 없다고 합니다. 이렇게 황량해 보이는데... 정말 그럴 수 있을까요?
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceLowCraterGiant = 이 거대한 크레이터는 Elad의 대기를 잃게 만든 원인이었을 만큼 충분히 크지만, 확신할 수는 없습니다.
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceLowCraterLarge = Elad에는 이와 같은 큰 크레이터가 여러 곳에 흩어져 있으며, 모두 비교적 최근에 생긴 지형으로 보입니다.
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceLowCraters = 가까운 Eulb 등 다른 천체에 비해 크레이터가 드문드문한 것은 Elad에 꽤 최근까지 두꺼운 대기가 있었다는 주장에 큰 힘을 실어 줍니다.
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceLowGeneric = Elad의 황무지는 Efil의 푸르른 언덕과 수정 같은 바다와는 극명하게 대조되며, 우주에서 생명이 얼마나 연약한지를 냉혹하게 일깨워 줍니다.
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceLowGrandCanyon = 이 협곡은 너무나 가파르고 깊어서, 한때 해구였던 것이 틀림없습니다.
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceLowGrandCliff = 우와. 저건 진짜 절벽입니다. 저렇게 거대한 능선이 생기려면 격렬한 판 구조 운동이 있었을 것입니다.
		#LOC_KS_SciDef_scopeScan_Elad_InSpaceLowValleys = Elad는 깊은 협곡과 열곡으로 뒤덮여 있으며, 이는 과거에 활발한 판 구조 운동이 있었다는 명백한 증거입니다.
		#LOC_KS_SciDef_scopeScan_Enots_InSpaceHigh = ?까니입름이 슨무 체대 ?까니습였붙 을름이 는라이"enotS" 에것이 게하지진 가누 !깐잠
		#LOC_KS_SciDef_scopeScan_Enots_InSpaceLow = 이 조그마한 소위성은 누군가 커다란 셰일 덩어리를 궤도에 휙 던져 놓은 것처럼 보입니다.
		#LOC_KS_SciDef_scopeScan_Eulb_InSpaceHigh = 파란 달이라니... 이런. Jeb, 닭 옷을 꺼낼 때가 됐습니다.
		#LOC_KS_SciDef_scopeScan_Eulb_InSpaceLowCratersBig = Eulb의 가장 큰 크레이터들은 때때로 바다 지형과 구분하기 어렵습니다. 거의 풍화된 것처럼 보이지만, 그렇게 만들 수 있는 힘은 미세 운석 충돌뿐입니다. Eulb는 대체 얼마나 오래된 것일까요?
		#LOC_KS_SciDef_scopeScan_Eulb_InSpaceLowCratersSmall = 이거 "데자 블루"가 느껴집니다... 이해하셨습니까?
		#LOC_KS_SciDef_scopeScan_Eulb_InSpaceLowDoubleCrater = 오, 흥미로운 지형이 있습니다. 하나는 크고 하나는 작은, 두 개의 충돌 크레이터가 겹쳐 있는 것 같습니다. 안쪽 크레이터가 둘 중 더 젊은 것으로 보입니다.
		#LOC_KS_SciDef_scopeScan_Eulb_InSpaceLowGeneric = 그런데 왜 파란색입니까? 그 문제는 다뤘습니까? 누가 조사하고 있습니까? 누구- 누구든 조사하게 하십시오.
		#LOC_KS_SciDef_scopeScan_Iomena_InSpaceHigh = 멀리서 보면 Iomena의 흐릿한 회색 지형에는 과거와 현재에 지표면을 흐른 액체의 뚜렷한 흔적이 보입니다. 하지만 Kcalbeloh에서 이렇게 멀리 떨어져 있으니 액체 상태의 물이 존재하기에는 너무 추울 것입니다.
		#LOC_KS_SciDef_scopeScan_Iomena_InSpaceLowCanyonsAll = 이 협곡들은 정말 장관입니다. 하지만 대기가 그 사이를 비행할 만큼 두꺼울까요? 당장 알아봐야 합니다!
		#LOC_KS_SciDef_scopeScan_Iomena_InSpaceLowCraters = 물에 잠긴 Iomena 크레이터의 얼어붙은 해안은 숨이 멎을 듯 아름다울 것입니다. 우주에서 보아도 어딘가 쓸쓸한 아름다움이 느껴집니다.
		#LOC_KS_SciDef_scopeScan_Iomena_InSpaceLowGeneric = 청회색 암석이 펼쳐진 황량한 들판은 의외로 아름답습니다. 지표면에서의 경치는 아마 굉장할 것입니다. 특히 Kcalbeloh를 배경으로 한다면 말입니다.
		#LOC_KS_SciDef_scopeScan_Iomena_InSpaceLowMountainsAll = Iomena의 봉우리들은 대부분 밝은 무언가로 서리가 덮여 있어 눈에 띕니다. 하지만 아마 물 얼음은 아닐 것입니다...
		#LOC_KS_SciDef_scopeScan_Iomena_InSpaceLowOceans = 이게 무엇이든 아마 물은 아닐 것입니다. 지표면에 액체 암모니아가 존재하기에 알맞은 조건이니, 착륙하게 된다면 제발 절대 마시지 마십시오.
		#LOC_KS_SciDef_scopeScan_Kcalbeloh_InSpaceHigh = 관측 장비가 Kcalbeloh의 강착 원반을 놀랍도록 세밀하게 포착했습니다. 자세히 분석해 보니 원반의 가장자리가 약간 적색편이 및 청색편이되어 있습니다.
		#LOC_KS_SciDef_scopeScan_Kcalbeloh_InSpaceLow = 망원경 영상을 지켜보던 인턴이 이른바 '특이점'을 발견하고 잠시 크게 흥분했습니다. 알고 보니 강력한 힘 때문에 렌즈에 금이 가서 중앙에 밝은 점이 생긴 것이었습니다.
		#LOC_KS_SciDef_scopeScan_Maelg_InSpaceHigh = Maelg는 광도가 매우 낮아 망원경이 손상 없이 쉽게 초점을 맞출 수 있으며, 덕분에 이 아항성 천체의 매우 상세한 사진을 촬영할 수 있습니다.
		#LOC_KS_SciDef_scopeScan_Maelg_InSpaceLow = (엄밀히 말해) 항성이 아닌 것치고는 이 거리에서 Maelg가 꽤 밝습니다. 다행히 망원경에 필터가 딸려 있었습니다. 맹렬히 휘몰아치는 Maelg의 주황색 폭풍을 고해상도로 촬영했습니다. 마치 불로 만든 미친 버전의 줄 같습니다!
		#LOC_KS_SciDef_scopeScan_Mehtna_InSpaceHigh = Mehtna의 "따뜻한 극"은 정말로 눈알처럼 보이며, 항상 Maelg를 똑바로 응시하고 있습니다. 솔직히 좀 소름 끼칩니다.
		#LOC_KS_SciDef_scopeScan_Mehtna_InSpaceLowDay = Mehtna의 짙은 갈색 '홍채'에는 여러 흥미로운 지형이 독특한 무늬를 이루고 있습니다.
		#LOC_KS_SciDef_scopeScan_Mehtna_InSpaceLowGrandCrater = Mehtna의 지표면에는 크레이터가 거의 없어서 이 거대한 크레이터가 매우 눈에 띕니다!
		#LOC_KS_SciDef_scopeScan_Mehtna_InSpaceLowIce = Mehtna의 빛이 드는 지역에는 아름답고 복잡한 균열이 지표면을 가로지르고 있어, 매혹적인 사진을 남겨 줍니다.
		#LOC_KS_SciDef_scopeScan_Mehtna_InSpaceLowNight = 음... 네, 확실히 어둡긴 어둡습니다.
		#LOC_KS_SciDef_scopeScan_Meiuqer_InSpaceHigh = 으음.... 우주 감자...
		#LOC_KS_SciDef_scopeScan_Meiuqer_InSpaceLow = 오, 이건 꽤 사랑스러운 작은 바위입니다. 소용돌이무늬에 갈색인 것이, 흑설탕을 묻힌 도넛 구멍을 떠올리게 합니다.
		#LOC_KS_SciDef_scopeScan_Noi_InSpaceHigh = 좋습니다, 포기하겠습니다. 대체 무엇을 보라는 겁니까?
		#LOC_KS_SciDef_scopeScan_Noi_InSpaceLow = 별들이 어디로 갔습니까?! 아, 그냥 Noi였군요. 오보입니다...
		#LOC_KS_SciDef_scopeScan_Noira_InSpaceHigh = 이 작은 회색 공은 색깔이나 지표면의 크레이터나 문을 떠올리게 합니다. 위성 한쪽 끝에는 크기에 비해 거대한 크레이터가 보이는데, 행성을 파괴하는 모 전투 기지를 연상시킵니다.
		#LOC_KS_SciDef_scopeScan_Noira_InSpaceLowBasins = 이 넓고 어두운 분지들은 우주 프로그램이 아직 문에 발자국을 남기려고 애쓰던 단순했던 시절을 떠올리게 합니다.
		#LOC_KS_SciDef_scopeScan_Noira_InSpaceLowCraters = 크레이터가 위성 표면 전체에 고르게 분포되어 있어 조석 고정되지 않았음을 알 수 있습니다. 아마 Simetra와 Simeht가 너무 많이 움직이기 때문일 것입니다.
		#LOC_KS_SciDef_scopeScan_Noira_InSpaceLowGeneric = 크레이터로 얼룩진 Noira의 지표면은 기이한 것투성이인 이 항성계에서 반가운 광경입니다.
		#LOC_KS_SciDef_scopeScan_Noira_InSpaceLowGrandCrater = "행성을 파괴하는 능력 따위는 크라켄의 힘 앞에서는 보잘것없습니다."
		#LOC_KS_SciDef_scopeScan_Noira_InSpaceLowRiftValleys = 불쌍한 Noira가 조석력에 의해 한계점까지 잡아늘려져 이 거대한 열곡이 생겨난 것이 분명해 보입니다.
		#LOC_KS_SciDef_scopeScan_Norihc_InSpaceHigh = 불쌍한 Norihc는 모행성들의 조석력에 두들겨 맞아 멍투성이가 된 것 같습니다.
		#LOC_KS_SciDef_scopeScan_Norihc_InSpaceLowCracks = 이 균열은 Norihc의 두꺼운 전역 빙관 깊숙이까지 뻗어 있습니다. 아마 재미있는 경주 트랙이 될 것입니다!
		#LOC_KS_SciDef_scopeScan_Norihc_InSpaceLowCratersAll = Norihc에는 크고 작은 크레이터가 가득하여, 표면이 과연 얼마나 오래되었는지 의문이 듭니다. 두 행성에 의해 잡아늘려지고 있다면, 왜 표면은 그토록 오랫동안 변하지 않은 것처럼 보일까요?
		#LOC_KS_SciDef_scopeScan_Norihc_InSpaceLowGeneric = 깊은 해구와 어두운 저지대가 있는 Norihc의 갈라진 표면은 일루를 꽤 연상시킵니다.
		#LOC_KS_SciDef_scopeScan_Noyreg_InSpaceHigh = 정말 매혹적인 색입니다! 설마 이것 때문에 줄의 색깔에 관한 해묵은 논쟁이 다시 불붙지는 않겠지요...
		#LOC_KS_SciDef_scopeScan_Noyreg_InSpaceLow = 짙은 구름이 표면을 뒤덮고 있어 볼 것이 별로 없습니다. 표면은 일부만 보이며, 알아볼 수 있는 것은 가장 낮은 구름 사이로 솟아오른 높은 산 몇 개뿐입니다.
		#LOC_KS_SciDef_scopeScan_Onrefni_InSpaceHigh = 지금 눈앞에 보이는 것은 황량함 속의 아름다움 그 자체입니다. Onrefni는 파멸 직전의 세계입니다. 대기도 없는 작은 바위에 곁을 지키는 것이라고는 주위를 휘감는 우주 허리케인뿐이지만, 이 블래닛의 종말론적인 표면은 그야말로 매혹적입니다.
		#LOC_KS_SciDef_scopeScan_Onrefni_InSpaceLowCraters = Onrefni의 크레이터 테두리가 강착 원반의 불길한 빛을 받아 반짝입니다. 이 지형이 어떻게 생겨났는지 궁금해집니다. Kcalbeloh 가까이 내려오면서 생긴 것일까요, 아니면 과거에 Onrefni가 이미 이 상처를 지닌 채 이곳으로 내던져진 것일까요?
		#LOC_KS_SciDef_scopeScan_Onrefni_InSpaceLowDay = Onrefni의 표면은 깊은 균열로 덮여 있으며, 특히 낮 쪽이 심합니다. 마치 거대한 우주 존재가 주먹으로 쳐서 표면 절반을 산산조각 낸 것처럼 보입니다.
		#LOC_KS_SciDef_scopeScan_Onrefni_InSpaceLowLava = 밤처럼 검은 암석이 Onrefni 표면의 균열을 따라 흐르는 작열하는 용암의 밝은 적황색 줄기와 강렬한 대비를 이룹니다. 이 행성이 얼마나 더 버틸 수 있을지 궁금해집니다.
		#LOC_KS_SciDef_scopeScan_Onrefni_InSpaceLowNight = Onrefni의 어두운 쪽에도 균열이 뻗어 있으며, Kcalbeloh의 눈부시게 빛나는 강착 원반을 배경으로 뚜렷하게 드러납니다.
		#LOC_KS_SciDef_scopeScan_Rouqea_InSpaceHigh = 파랗고, 파랗습니다.
		#LOC_KS_SciDef_scopeScan_Rouqea_InSpaceLow = 음... 식수. 그리고... 저쪽에도 식수가 좀 있고... 오, 저것 좀 보십시오! 식수입니다.
		#LOC_KS_SciDef_scopeScan_Sedah_InSpaceHigh = 이 행성은 대기의 엄청난 열 때문에 빛을 발하며, 어두운 쪽조차 희미하게 빛납니다.
		#LOC_KS_SciDef_scopeScan_Sedah_InSpaceLow = 근접 사진에는 소용돌이치는 난류 구름과 거대한 허리케인이 드러납니다. 일부는 행성 하나를 통째로 삼킬 만큼 큽니다!
		#LOC_KS_SciDef_scopeScan_Sera_InSpaceHigh = Sera 상공 높은 곳에서 보면 고리가 선명하고 자세하게 드러납니다. 고리의 색과 밝기로 보아 암석질이며, 얼음도 일부 섞여 있을 것으로 보입니다. 아마 한때 작은 위성이었다가 찢겨 나간 것으로 추정됩니다. 시간을 들여 시뮬레이션을 해 보면 그 위성이 어떤 모습이었는지 알아낼 수 있을지도 모릅니다.
		#LOC_KS_SciDef_scopeScan_Sera_InSpaceLowGeneric = Sera의 복숭앗빛 언덕과 평원은 확실히 먹음직스러워 보입니다. 점점 과일이 너무 많이 떠오르기 시작합니다.
		#LOC_KS_SciDef_scopeScan_Sera_InSpaceLowIslands = 거대한 호수, 아니 내해라고 해야 할까요, 그 위로 작은 섬들이 고개를 내밀고 있습니다. 저 낯선 해안에서 바라보는 풍경은 어떨지 궁금해집니다.
		#LOC_KS_SciDef_scopeScan_Sera_InSpaceLowLakes = 이 호수들은 대기처럼 복숭앗빛이 도는 갈색으로 보입니다. 언뜻 생각해 봐도, 눈으로 보는 것만으로는 식수인지 아닌지 알 방법이 없습니다.
		#LOC_KS_SciDef_scopeScan_Sera_InSpaceLowMountains = 거대한 산맥이 Sera 표면의 상당 부분에 걸쳐 뻗어 있습니다. 자세히 보면 봉우리 사이로 혈관 같은 줄무늬 계곡이 이어져 있어, 프랙탈과 크게 다르지 않은 아름다운 무늬를 이룹니다.
		#LOC_KS_SciDef_scopeScan_Sera_InSpaceLowRiftValley = 이것은 일종의 열곡으로 보입니다. 열곡은 신장성 지각 운동으로 암석권이 갈라지면서 형성되는 계곡입니다. 적어도 수억 년 전까지는 Sera에서 지각 활동이 활발했다는 꽤 확실한 증거입니다.
		#LOC_KS_SciDef_scopeScan_SimeSystem_InSpaceHigh = 두 천체가 펼치는 정교한 춤은 그야말로 숨이 멎을 만큼 장관이며, 저속 촬영 사진이 이를 증명합니다. 마치 거대하고 멋진 천상의 탱고를 추는 한 쌍의 파트너 같습니다.
		#LOC_KS_SciDef_scopeScan_Simeht_InSpace = 먼 거리의 망원경 이미지에서 Simeht는 거의 아무 특징이 없어 보이지만, 이렇게 가까이에서 보면 밝은 적도 띠, 경계에서 희미하게 소용돌이치는 하이퍼케인, 그리고 극지방 쪽 띠들 사이의 미묘한 차이까지 드러납니다.
		#LOC_KS_SciDef_scopeScan_Simetra_InSpace = Simetra의 다채로운 띠를 보면, 대체 어떤 화합물이 적도 지역에 저렇게 눈에 띄는 초록색과 노란색을 입히는지 궁금해집니다.
		#LOC_KS_SciDef_scopeScan_Suluco_InSpaceHigh = 안구 행성이라고 불리지만, Suluco는 사실 눈처럼 보이지는 않습니다. 하지만 이른바 "열극"과 황혼 지대 사이의 극명한 대비는 인상적입니다.
		#LOC_KS_SciDef_scopeScan_Suluco_InSpaceLowDay = Suluco의 낮 쪽은 눈이 멀 정도로 밝으며, 뼈처럼 바싹 말라 보입니다. 끝없이 펼쳐진 모래 언덕의 바다가 이 지역의 특징입니다.
		#LOC_KS_SciDef_scopeScan_Suluco_InSpaceLowDayPole = 항성 직하점은 눈이 부십니다. 빛을 엄청나게 반사하고 있으며, 너무 뜨거워 보여서 달걀도 익힐 수 있을 것 같습니다. 구름조차 증발해 버린 듯합니다.
		#LOC_KS_SciDef_scopeScan_Suluco_InSpaceLowNight = 아무것도 보이지 않습니다.
		#LOC_KS_SciDef_scopeScan_Suluco_InSpaceLowTwilight = Suluco의 좁은 온대 지역에는 굽이치는 푸른 언덕과 탁 트인 대양이 있습니다. 여러 장의 사진을 통해 구름이 행성의 자전축이 아니라 낮과 밤의 극을 중심으로 돌고 있다는 것을 알 수 있습니다.
		#LOC_KS_SciDef_scopeScan_Suluco_InSpaceLowWater = Suluco의 대양은 생명체와 마찬가지로 낮과 밤의 경계선을 따라 좁은 띠에 국한되어 있습니다. 이 지역의 해류는 커벌이 지금까지 본 그 어떤 것과도 다릅니다.
		#LOC_KS_SciDef_scopeScan_Sunorc_InSpaceHigh = 이 미치광이 같으니! 망원경을 망가뜨릴 작정입니까? 이 장비는 행성 촬영용입니다!
		#LOC_KS_SciDef_scopeScan_Sunorc_InSpaceLow = 음, 돈만 날렸습니다. 방금 궤도 망원경을 망가뜨렸을지도 모릅니다.
		#LOC_KS_SciDef_scopeScan_Tot_InSpaceHigh = Tot를 공정하게 평가하자면, 꽤 귀여운 작은 감자이긴 합니다.
		#LOC_KS_SciDef_scopeScan_Tot_InSpaceLow = 망원경이 Tot 표면의 작은 암석과 크레이터를 아주 상세하게 포착합니다. 다만 이 일에는 조금 과한 장비인 것 같습니다.
		#LOC_KS_SciDef_scopeScan_Uleg_InSpaceHigh = 이 어두운 블래닛은 어둠 속에서 거부할 수 없는 디저트 한 스쿱처럼 반짝이는 듯합니다. 더 가까이 와 달라고 애원하는 것만 같습니다...
		#LOC_KS_SciDef_scopeScan_Uleg_InSpaceLowBasins = 넓게 트인 분지는 지형이 매우 평탄해 보입니다. 마음에 든다면 기지를 짓기에 좋은 장소일 수도 있습니다. 하지만 Uleg의 터무니없는 궤도를 생각하면 더 나은 장소가 있을 것입니다.
		#LOC_KS_SciDef_scopeScan_Uleg_InSpaceLowCrater = 정말 엄청난 크레이터입니다. 다만 침식이 너무 심해서 이것이 크레이터라는 것을 알아보는 데 시간이 좀 걸렸습니다.
		#LOC_KS_SciDef_scopeScan_Uleg_InSpaceLowGeneric = 움푹 팬 Uleg의 표면은 쿠키 앤 크림 아이스크림을 너무나도 닮았습니다. 대중이 이 사진을 보면 군침을 흘릴 것입니다.
		#LOC_KS_SciDef_scopeScan_Uleg_InSpaceLowMountains = 작은 산들이 바닐라 아이스크림의 광활한 바다에 뿌려진 초콜릿 쿠키 부스러기처럼 Uleg의 표면에 점점이 박혀 있습니다. 이런, 또 배가 고파졌습니다!
		#LOC_KS_SciDef_scopeScan_Uleg_InSpaceLowRiftValleys = 이 거대한 협곡은 Uleg의 표면을 가로질러 북극까지 이어지는 거대한 순환 코스를 이룹니다. 대기가 극도로 희박하지만 않았다면 환상적인 에어 레이스 코스가 되었을 것입니다. 운명이여, 저주받으라! 음... 진정한 무모한 모험가라면 그래도 가능할지도 모릅니다. 지상 레이스라는 선택지도 있습니다!
		#LOC_KS_SciDef_scopeScan_WH3141A_InSpace = 반대편에 다른 행성이 보일 듯 말 듯합니다. 고리와 밝은 주황색 별, 그리고... 크라켄 맙소사! 저건 커다랗고 검은 눈이 이쪽을 노려보고 있는 것입니까?
		#LOC_KS_SciDef_scopeScan_WH3141B_InSpace = 줄의 친근한 초록빛 모습이 마치 유화처럼 우주 공간에 번져 있습니다. 레이테, 발, 타일로의 흔적도 보입니다.
		#LOC_KS_SciDef_seismicScan_Ahtpan_SrfLanded = 지진계에 깊고 먼 울림이 감지됩니다. Ahtpan의 내부는 아직 살아 있는 것 같습니다!
		#LOC_KS_SciDef_seismicScan_Anneheg_SrfLanded = 가속도계가 열 때문에 합선되어 더 이상 작동하지 않습니다.
		#LOC_KS_SciDef_seismicScan_Arorua_SrfLanded = 지진 센서가 열 때문에 자동으로 꺼집니다. 장비를 안으로 들여놓는 것이 좋겠습니다.
		#LOC_KS_SciDef_seismicScan_Dipuc_SrfLanded = 인근 화산 활동에 따른 저주파 울림이 Dipuc 어디에서나 끊임없이 이어집니다. 이 위성이 얼마나 활발한지를 보여 주는 분명한 신호입니다.
		#LOC_KS_SciDef_seismicScan_Dipuc_SrfLandedVolcano = 커벌이 느낄 수 있을 만큼 땅이 흔들립니다. 여기서 벗어나는 것이 좋겠습니다...
		#LOC_KS_SciDef_seismicScan_EfilHome_SrfLanded = 지진계가 Efil의 지진 활동 정보를 기록하여 우리 고향의 내부 구조에 대한 통찰을 제공합니다.
		#LOC_KS_SciDef_seismicScan_Efil_SrfLanded = 숨이 멎을 듯 아름다운 Efil의 지표에 발을 내딛자, 지진파 탐사 장비가 행성의 지질과 정교한 춤을 추기 시작했습니다. 진동과 반향이 지형을 따라 퍼져 나가며 푸른 아름다움 아래 숨겨진 비밀을 풀어내고, 복잡하게 얽힌 지하 공동망과 Efil의 오래된 핵이 뛰는 잔잔한 고동을 지도로 그려 냈습니다. 지진파 하나하나에는 행성의 역사가 메아리쳤고, 그 지질학적 태피스트리를 생생하게 그려 내며 지표를 수놓은 매혹적인 풍경만큼이나 활기차고 수수께끼 같은 세계를 드러냈습니다.
		#LOC_KS_SciDef_seismicScan_Elad_SrfLanded = 측정값은 Elad가 여전히 지진 활동 중이라는 것을 강하게 시사합니다.
		#LOC_KS_SciDef_seismicScan_Enots_SrfLanded = 지진 스캐너는 미세 유성체 충돌 외에는 아무런 활동도 감지하지 못합니다.
		#LOC_KS_SciDef_seismicScan_Eulb_SrfLanded = 지진 센서가 지표 아래에서 매우 희미한 지진 활동을 감지합니다.
		#LOC_KS_SciDef_seismicScan_Iomena_SrfLanded = Iomena 표면에 착륙하여 수행한 지진 스캔 실험은 행성의 내부 구조에 대한 귀중한 정보를 제공했습니다. 스캔 결과 행성 표면 아래에 복잡한 단층과 균열망이 드러났으며, 이는 과거에 지각 활동이 있었음을 나타냅니다. 데이터는 또한 단단한 암석질 맨틀과 금속 핵의 존재를 보여 주었습니다.
		#LOC_KS_SciDef_seismicScan_Mehtna_SrfLanded = 지진 스캔 결과, 이 외로운 행성에서 감지할 수 있는 활동은 이따금 일어나는 충돌뿐입니다.
		#LOC_KS_SciDef_seismicScan_Meiuqer_SrfLanded = 예상대로 Meiuqer의 지진 스캔 결과 이 작은 세계는 완전히 죽어 있으며, 우주의 진공 속을 떠다니는 거대한 감자나 다름없다는 것이 드러납니다.
		#LOC_KS_SciDef_seismicScan_Noi_SrfLanded = 쥐 죽은 듯한 고요함입니다. Noi는 너무 작아서 충돌조차 제대로 일어나지 않는 것 같습니다.
		#LOC_KS_SciDef_seismicScan_Noira_SrfLanded = 잦은 진동은 인근의 두 행성이 춤추듯 움직이는 동안 Noira가 조석력에 시달리는 위성이라는 것을 보여 줍니다.
		#LOC_KS_SciDef_seismicScan_Norihc_SrfLanded = 지진계에 여러 차례의 약한 지진이 기록되며, 행성이 바로 머리 위를 지날 때마다 활동이 최고조에 달합니다.
		#LOC_KS_SciDef_seismicScan_Noyreg_SrfLanded = 근처를 도는 두 거대한 세계의 조석력이 Noyreg의 지각에 뚜렷한 영향을 미쳐, 두 행성이 가까이 접근할 때마다 지진 활동이 일어납니다.
		#LOC_KS_SciDef_seismicScan_Onrefni_SrfLanded = 극심한 조석력과 인근 강착원반 물질의 거의 끊임없는 충돌로 인해 지진 장비가 데이터에 완전히 파묻힙니다. 이는 Onrefni의 혼란스러운 특성을 아주 잘 보여 줍니다.
		#LOC_KS_SciDef_seismicScan_Rouqea_SrfLanded = Rouqea의 해저에 착륙하는 동안 수집한 지진 데이터를 분석한 결과, 행성 지각에서 지각 활동의 징후가 발견되었습니다.
		#LOC_KS_SciDef_seismicScan_Sera_SrfLanded = Sera의 지각과 맨틀에 대한 지진파 탐사 결과, 이 행성은 지진 활동이 잦은 매우 활발한 지각 변동 행성임이 드러났습니다. 행성의 지각은 균열되어 있으며 단층과 틈이 광범위하게 뻗어 있는데, 이는 행성의 고리계가 유발하는 응력 때문으로 보입니다. 그러나 유기 화합물이나 기타 생명의 징후가 전혀 감지되지 않는 것으로 보아, Sera는 우리가 아는 형태의 생명을 유지하기에 적합하지 않은 것으로 보입니다.
		#LOC_KS_SciDef_seismicScan_SulucoHome_SrfLanded = 지진 스캐너가 감지한 지진 활동은 매우 미미합니다. 우리 고향은 지질학적으로 매우 안정적인 것으로 보입니다.
		#LOC_KS_SciDef_seismicScan_Suluco_SrfLanded = 지진파 탐사 결과 Suluco는 지질학적으로 비교적 안정적인 것으로 나타났습니다. 그러나 끊임없이 부는 강풍이 행성 지표에 마찰과 응력을 일으켜 지반 진동을 유발할 가능성이 있습니다. 또한 Suluco의 황혼 지대에서는 더 높은 수준의 지반 진동이 관측되는데, 이는 끊임없는 바람이 만드는 마찰력과 함께 낮 반구와 밤 반구에서 지표가 서로 다르게 가열되고 냉각되기 때문으로 보입니다.
		#LOC_KS_SciDef_seismicScan_Tot_SrfLanded = 지진 스캐너의 측정값은...... 아무것도 없습니다.
		#LOC_KS_SciDef_seismicScan_Uleg_SrfLanded = Uleg 표면에서 지진 스캔을 하는 동안 장비에 여러 차례의 약한 진동이 기록되었습니다. 이는 표면 대부분이 얼어 있음에도 행성이 여전히 지질학적으로 활동 중일 수 있음을 나타냅니다. 이 진동의 원인과 행성 지질학에 미칠 잠재적 영향을 밝히려면 데이터를 더 분석해야 합니다.
		#LOC_KS_SciDef_surfaceSample_Ahtpan_SrfLanded = 땅이 꽤 모래투성이입니다. 커빈의 사막이 많이 떠오릅니다.
		#LOC_KS_SciDef_surfaceSample_Ahtpan_SrfLanded_Coast = 지표 시료에 등유와 비슷한 물질의 흔적이 들어 있습니다.
		#LOC_KS_SciDef_surfaceSample_Ahtpan_SrfLanded_NaphthanOceans1 = 장갑이 등유와 비슷한 물질로 뒤덮였습니다. 좋은 연료원이 될 수도 있을 것 같습니다.
		#LOC_KS_SciDef_surfaceSample_Ahtpan_SrfLanded_NaphthanOceans2 = Ahtpan의 대양은 검은 황금... 아니, 석유로 이루어진 것 같습니다.
		#LOC_KS_SciDef_surfaceSample_Ahtpan_SrfSplashed = 우주복이 Ahtpan의 대양을 이루는 등유 같은 물질로 뒤덮였습니다. 닦아 내려면 한참 걸리겠습니다.
		#LOC_KS_SciDef_surfaceSample_Anneheg_SrfLanded_Lava = 용암 시료를 채취하려 하자 장갑이 녹기 시작합니다.
		#LOC_KS_SciDef_surfaceSample_Anneheg_SrfSplashed = 우주복이 녹기 시작하자, 말 그대로 용암의 시료를 채취하는 것은 그다지 좋은 생각이 아니라는 것을 금세 깨닫습니다.
		#LOC_KS_SciDef_surfaceSample_Arorua_SrfLanded = Arorua의 지표 시료를 채취합니다. 단열이 잘 된 장갑을 통해서도 시료의 열기가 느껴집니다.
		#LOC_KS_SciDef_surfaceSample_Dipuc_SrfLanded = 이 암석 시료는 중금속이 풍부한 화산암으로 이루어진 것으로 보입니다.
		#LOC_KS_SciDef_surfaceSample_Dipuc_SrfLandedLowlands = 땅에서 아주 반짝이는 화산 유리 조각을 발견하고 집어 들어, 매끄럽게 빛을 반사하는 표면에 감탄합니다. 안타깝게도 귀환하면 과학자들에게 넘겨야 하니, 지금 실컷 감상해 두는 것이 좋겠습니다.
		#LOC_KS_SciDef_surfaceSample_Dipuc_SrfLandedVolcanoVent = 우와! 뜨거워! 뜨거워!!!
		#LOC_KS_SciDef_surfaceSample_EfilHome_SrfLanded = Efil의 지표 시료를 채취합니다.
		#LOC_KS_SciDef_surfaceSample_EfilHome_SrfLanded_Beach = 해변의 시료를 움켜쥐었다가, 장갑 안에 모래게가 가득하다는 것을 깨닫고 곧바로 떨어뜨립니다!
		#LOC_KS_SciDef_surfaceSample_EfilHome_SrfLanded_Desert = 사막 모래 시료를 채취합니다. 입자가 아주 곱지만, 놀랍게도 그리 건조하지는 않습니다.
		#LOC_KS_SciDef_surfaceSample_EfilHome_SrfLanded_Forests = 숲 바닥의 시료를 채취하면서 약간의 식물도 함께 담깁니다. 고향이 얼마나 푸르고 아름다운 곳인지 새삼 떠오릅니다.
		#LOC_KS_SciDef_surfaceSample_EfilHome_SrfLanded_Grassland = 지표를 덮은 풀의 시료를 채취합니다. 매우 건강해 보입니다.
		#LOC_KS_SciDef_surfaceSample_EfilHome_SrfLanded_Mountains = 산맥에서 작은 돌 하나를 집어 듭니다. 아마도 눈 녹은 물에 침식된 탓인지 아주 매끄럽습니다.
		#LOC_KS_SciDef_surfaceSample_EfilHome_SrfLanded_Tundra = 발밑의 얼어붙은 땅에서 시료를 채취합니다. 이런 곳에서도 여전히 식물이 조금씩 자라고 있습니다.
		#LOC_KS_SciDef_surfaceSample_EfilHome_SrfSplashed = 물입니다. 뭘 기대하셨습니까?
		#LOC_KS_SciDef_surfaceSample_Efil_SrfLanded = 나는 조심스럽게 토양 시료를 채취하며 그 풍부한 질감과 선명한 색채에 감탄했습니다. 알갱이 하나하나가 이 매혹적인 세계에서 번성하는 생명의 정교한 태피스트리를 증언하고 있었습니다.
		#LOC_KS_SciDef_surfaceSample_Efil_SrfSplashed = 깨끗한 바닷물이 나를 감싸 안자, Efil 바닷속 세계가 매혹적인 생명의 태피스트리를 드러냈습니다. 나는 세심한 주의를 기울여 번성하는 해양 생태계에서 시료를 채취했고, 선명한 산호와 섬세한 해초들은 이 행성의 풍부한 생물 다양성을 말해 주었습니다.
