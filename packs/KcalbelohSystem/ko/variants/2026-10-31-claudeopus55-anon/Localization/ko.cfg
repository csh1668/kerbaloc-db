		#LOC_KS_SciDef_temperatureScan_Rouqea_InSpaceLow = 여기서 보면 물이 따뜻할 것 같지만, 온도계는 전혀 알지 못합니다.
		#LOC_KS_SciDef_temperatureScan_Rouqea_SrfLanded_Cracks = 온도가 매우 높은 값에서 매우 낮은 값으로 갑자기 떨어집니다. 거의 영하입니다! 무엇이 이런 변화를 일으키는 걸까요?
		#LOC_KS_SciDef_temperatureScan_Rouqea_SrfLanded_Highlands = 예측할 수 없는 순간에 온도가 급격히 치솟습니다. 근처에 해저 화산 분출구라도 있는 걸까요?
		#LOC_KS_SciDef_temperatureScan_Rouqea_SrfLanded_Lowlands = 온도가 어마어마합니다! 블랙홀의 조석력이 행성 핵 내부에서 일종의 화산 활동을 일으키고 있는지도 모릅니다.
		#LOC_KS_SciDef_temperatureScan_Rouqea_SrfLanded_Midlands = 사방이 물로 둘러싸여 있는데도 표시되는 온도가 점점 더 올라갑니다. 무언가가 센서를 달구고 있습니다! 연구 개발 센터가 이걸 보면 신이 날 겁니다.
		#LOC_KS_SciDef_temperatureScan_Rouqea_SrfSplashed_Cracks = 기체 아래의 물이 소름 끼칠 만큼 차갑습니다. 마치 무언가가 이 열대 행성의 바다에서 열을 빨아들이고 있는 것 같습니다.
		#LOC_KS_SciDef_temperatureScan_Rouqea_SrfSplashed_Highlands = 멀리 보이는 산맥의 수온도 같은지 궁금하지만, 다가갈수록 산맥이 멀어지는 것 같습니다. 걱정 마십시오. 지금 하나가 다가오고 있습니다.
		#LOC_KS_SciDef_temperatureScan_Rouqea_SrfSplashed_Lowlands = 수영하기에 완벽한 수온입니다! 파도는요? 그다지 그렇지 않습니다.
		#LOC_KS_SciDef_temperatureScan_Rouqea_SrfSplashed_Midlands = 물은 잔잔하고 적당히 따뜻합니다. 마치 커빈 해변에서 보내는 한낮 같습니다. 하지만 커빈에 산맥만 한 파도가 친 적은 없었습니다.
		#LOC_KS_SciDef_temperatureScan_Sedah_FlyingHigh = 온도 측정 결과, 외부 우주 환경보다 온도가 크게 높은 것으로 나타났습니다. 행성 대기에서 뿜어져 나오는 열이 우주선 주위에 밝은 빛을 만들어 냈습니다.
		#LOC_KS_SciDef_temperatureScan_Sedah_FlyingLow1 = 우주선이 Sedah의 하층 대기를 통과해 하강하자 온도가 크게 상승한 것으로 측정되었습니다. 이 고도의 강렬한 열과 압력 때문에 우주선의 계기가 제대로 작동하기 어려웠고, 승무원은 장비 손상을 막기 위해 특별한 예방 조치를 취해야 했습니다.
		#LOC_KS_SciDef_temperatureScan_Sedah_FlyingLow2 = 온도계가 최대치에 도달하기도 전에 극한의 압력에 찌그러져 버립니다.
		#LOC_KS_SciDef_temperatureScan_Sera_FlyingHigh = 여기 꽤 춥지 않습니까?
