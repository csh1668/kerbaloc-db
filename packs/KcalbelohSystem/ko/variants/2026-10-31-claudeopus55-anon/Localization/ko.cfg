		#LOC_KS_Ahtpan_description = Ahtpan은 주로 나프타로 이루어진 대양을 가진 암석질 사막 행성입니다. 행성 표면에 석유화학 공장을 세우는 것이 좋은 생각처럼 보일 수도 있지만, 커벌 우주센터(KSC)는 이 행성을 탐사하는 모든 커보너트에게 헬멧을 벗지 말 것을 권고합니다. 행성의 대기에서 지독한 좀약 냄새가 나기 때문입니다!
		#LOC_KS_Anehta_description = Anehta는 눈부신 고리계를 자랑하는 거대 가스 행성입니다. 이 행성은 늘 구름으로 덮여 있으며, 구름은 밝은 색의 대(zone)와 어두운 띠(belt)로 뚜렷하게 나뉩니다. 이 대와 띠의 순환 방향이 서로 엇갈리기 때문에 행성에는 격렬한 폭풍과 난류가 발생합니다.
		#LOC_KS_Anneheg_description = Anneheg는 석탄처럼 검은 외관을 지닌 행성으로, Aralc-A의 바로 곁을 공전합니다. 항성과 매우 가깝기 때문에 강렬한 열과 빛으로 표면 대부분이 녹아 용암의 강과 대양이 형성되었으며, 기화된 금속 폭풍도 자주 발생합니다. 이처럼 혹독한 환경 탓에 Anneheg는 지금까지 발견된 행성 중 가장 지옥 같은 행성 중 하나로 꼽힙니다.
		#LOC_KS_AralcA_description = Aralc-A는 Kcalbeloh 항성계에 있는 쌍성계의 첫 번째 항성으로, 항성계에서 가장 밝고 무거운 항성으로 여겨집니다. 높은 온도와 청백색 빛으로 보아 A형 주계열성으로 추정됩니다.
		#LOC_KS_AralcB_description = 쌍성계의 두 번째 항성인 Aralc-B는 적색 왜성이라고도 불리는 M형 주계열성으로 분류되는 작고 가벼운 항성입니다.
		#LOC_KS_AralcSystem_description = 쌍성계의 질량 중심입니다.
		#LOC_KS_Arorua_description = Arorua는 Aralc-B에 조석 고정된 거대한 암석 행성입니다. Aralc-B에서 뿜어져 나오는 강한 항성풍 때문에 Aralc-B를 향한 반구 전역에서 오로라를 관측할 수 있습니다. 동시에 이 행성의 대기는 적색 왜성의 항성풍에 의해 서서히 날아가고 있습니다.
