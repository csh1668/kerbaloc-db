		#LOC_KS_SciDef_evaReport_Dipuc_SrfLanded_VolcanoVent = 당신은 매우, 매우 위태로운 상황에 처해 있습니다. 온도가 우주복을 뚫고 스며들 만큼 높고 분출구도 활동 중이니, 한 줌의 연기로 사라지고 싶지 않다면 분출구 안으로 발을 딛지 말고 그 위에서 호버링하기를 권합니다. 그 점만 빼면, 분출구 벽면에는 화성암이 널리 분포해 있는 것으로 보이며, 아래쪽 벽면은 열기로 인해 다소 녹아내렸으면서도 변성된 것으로 보입니다. Sera와 관련이 있는 걸까요, 아니면 Dipuc의 화산 활동은 모행성의 어떤 메커니즘과도 무관한 걸까요?\n\n\nAcapello 1 승무원처럼 되고 싶지 않다면, 즉시 이곳을 떠나십시오.
