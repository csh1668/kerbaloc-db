		#LOC_KS_SciDef_dmlaserblastscan_Efil_SrfLandedBeach = 이미 뻔한 사실을 이 비싼 장비로 확인하는 건 낭비처럼 보입니다... 어쩌면 위성에 이토록 맑고 깨끗한 바다가 있다는 것이 그저 믿기지 않는 것입니까?
		#LOC_KS_SciDef_dmlaserblastscan_Efil_SrfLandedMountains = Efil 산맥의 고지대는 물도 생명도 부족합니다.
		#LOC_KS_SciDef_dmlaserblastscan_Efil_SrfLandedRainforestsGrassland = 지표 스캔 결과 물뿐 아니라 유기 화합물에도 수소가 풍부하게 존재합니다. Efil의 생태계가 번성하고 있다는 증거입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Efil_SrfLandedSnowMountains = 이 눈 덮인 봉우리에서는 물 얼음을 풍부하게 찾을 수 있지만, 그 외에는 거의 아무것도 없습니다. 너무 외진 곳이라 생물이 살아남기 어렵기 때문입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Efil_SrfLandedTropicalDesert = 레이저가 메마른 모래 깊숙이 파고들지만, 수소는 거의 드러나지 않습니다. 이렇게 건조한 지역이라면 당연한 일입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Efil_SrfSplashedWater = 넘실대는 파도에 레이저를 쏘아 보니, 정말로 귀하고 상쾌한 액체 상태의 물임이 확인되었습니다. 다만 염분이 너무 높아 마시기는 어렵습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Enots_SrfLanded = 레이저가 작은 능선을 날려 버리자, 대부분 규산염 암석, 정확히는 옥수로 이루어진 구성이 드러납니다. 강옥일 가능성이 있는 산화알루미늄의 흔적도 있어, 적도 지역이 살짝 푸른빛을 띠는 이유를 설명해 줍니다.
		#LOC_KS_SciDef_dmlaserblastscan_Eulb_SrfLanded = Eulb 지표의 화학 분석 결과 규산염은 비교적 적고, 알루미늄과 산소는 매우 풍부합니다. 이는 푸른색의 원인이 흔히 사파이어로 알려진 청색 강옥임을 시사합니다.
		#LOC_KS_SciDef_dmlaserblastscan_Iomena_SrfLandedCanyonsAll = 이곳에서 철이 풍부한 암석이 발견됩니다. 협곡 벽에서 떨어져 내린 것으로 보입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Iomena_SrfLandedGeneric = 지표를 기화시켜 생긴 기둥을 스캔한 결과, 철이 풍부한 규산염 여러 종이 검출되었으며 모두 암모니아로 흠뻑 포화되어 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Iomena_SrfLandedLowlands = Iomena의 저지대에는 오랜 시간에 걸쳐 밀도가 가장 높고 철이 풍부한 암석이 모였을 것입니다. 이곳 땅의 철 함량이 매우 높은 이유가 설명됩니다.
		#LOC_KS_SciDef_dmlaserblastscan_Iomena_SrfLandedMountainsAll = 이 산봉우리를 덮은 새하얀 물질은 암모니아 얼음으로 보입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Iomena_SrfLandedOceans = 분석에 따르면 이 젖은 토양은 액체 암모니아에 흠뻑 젖어 있습니다. 토양에는 단순한 탄화수소도 일부 섞여 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Iomena_SrfSplashed = 액체에 레이저를 쏘아 보니 물이 거의 전혀 없음이 확인되었습니다. 대신 암모니아와 단쇄 탄화수소만 검출됩니다.
		#LOC_KS_SciDef_dmlaserblastscan_Mehtna_SrfLandedIce = 온도부터 대기까지, Mehtna의 모든 특성이 이것은 물 얼음일 수밖에 없다고 말하고 있습니다. 화학 분석 결과가 무엇인지는 직접 맞혀 보십시오.
		#LOC_KS_SciDef_dmlaserblastscan_Mehtna_SrfLandedRock = 레이저 분석 결과 또 규산염입니다. 야호! 하나도 지루하지 않습니다! 정말... 하나도...
		#LOC_KS_SciDef_dmlaserblastscan_Meiuqer_SrfLanded = 니 돌 위에 이씀, 니 돌 레이저로 지지는 중.
		#LOC_KS_SciDef_dmlaserblastscan_Noi_SrfLanded = 지표 스캔 결과 탄소가 극도로 풍부한 지표에 다른 광물, 주로 규산염이 흩어져 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Noira_SrfLanded = 지표 스캔 결과는 익숙한 내용입니다. 알루미늄이 풍부한 규산염 지표입니다. 덜 익숙한 점은 상당한 농도의 물 얼음입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Norihc_SrfLanded = 빔이 지표에 구멍을 뚫자 증기가 뿜어져 나오며, 이것이 물 얼음임이 확인됩니다.
		#LOC_KS_SciDef_dmlaserblastscan_Norihc_SrfLandedLowlands = 증기 외에도, 스캔 결과 이곳 지표에 톨린 화합물이 존재하는 것으로 나타납니다.
		#LOC_KS_SciDef_dmlaserblastscan_Noyreg_SrfLanded = 발생한 섬광을 분석한 결과 이 물질은 탄소가 극도로 풍부하며, 실제로 구성의 대부분이 탄소입니다. 이는 매우 이례적인 일로, Noyreg가 매우 희귀한 유형의 천체인 탄소 행성일 가능성을 시사합니다.
		#LOC_KS_SciDef_dmlaserblastscan_Noyreg_SrfLandedIceCaps = 레이저 분석 결과 이곳에 여러 장쇄 탄화수소가 얼어 있음이 확인되었으며, 물 얼음의 흔적은 없습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Onrefni_SrfLanded = Onrefni의 지표는 레이저로 기화시키려는 시도에 매우 강하게 저항합니다. 그나마 기화된 소량을 분석한 결과, 주성분은 화성암이며 그것도 내열성이 매우 높은 암석입니다. 납득이 갑니다.
		#LOC_KS_SciDef_dmlaserblastscan_Onrefni_SrfLandedLava = 그러니까 레이저로 용암을 녹이겠다는 겁니까? 좋습니다, 해 보시죠.
		#LOC_KS_SciDef_dmlaserblastscan_Onrefni_SrfSplashed = 괜찮습니다. 지금 벌어지는 일들에 저는 아무렇지도 않습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Rouqea_SrfLanded = 레이저 분석 결과 이 고체는... 물? 잠깐, 물 얼음입니까? 이렇게 뜨거운데... 이게 이색 얼음입니까? 제가 제일 좋아하는 얼음입니다! 굉장합니다.
		#LOC_KS_SciDef_dmlaserblastscan_Rouqea_SrfSplashed = 레이저 분석 결과 이 액체는 물로 확인되었습니다. 꽤 뻔해 보이지만, 확인해서 나쁠 건 없습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Sera_SrfLandedLakesIslands = 이곳의 젖은 땅은 대부분의 지표처럼 여전히 금속이 풍부하지만, 물의 농도도 높습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Sera_SrfLandedLowlands = Sera의 분홍빛 저지대는 철이 풍부한 암석으로 이루어져 있으며, 알루미늄과 티타늄도 다량 섞여 있어 색이 옅어지면서 분홍빛 갈색을 띠는 것으로 보입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Sera_SrfLandedMidlandsHighlands = Sera의 더 어둡고 높은 지역은 저지대에 비해 알루미늄과 티타늄이 부족하며, 이것이 그 색을 설명해 줍니다.
		#LOC_KS_SciDef_dmlaserblastscan_Sera_SrfLandedMountains = Sera의 산맥에는 자성이 매우 강한 철광석의 일종인 천연 자철석이 매우 풍부한 것으로 보입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Sera_SrfLandedPeaks = 분석 결과 이 물질은 물 얼음입니다. 고도를 생각하면 납득이 갑니다.
		#LOC_KS_SciDef_dmlaserblastscan_Sera_SrfLandedPoles = Sera의 극지방에는 극관이 없는 것으로 보이지만, 분석 결과 얇은 물 얼음층이 존재합니다.
		#LOC_KS_SciDef_dmlaserblastscan_Sera_SrfSplashed = 액체를 스캔한 결과 예상대로 물임이 확인되었습니다. 하지만 중금속과 기타 독성 물질의 농도가 높아 생명체가 존재할 가능성은 극히 낮습니다.
		#LOC_KS_SciDef_dmlaserblastscan_SrfLandedCraterGiant = 이 거대한 크레이터에는 Elad 지표에서 흔히 볼 수 없는 중금속과 기타 화합물이 풍부하며, 이는 충돌체가 밀도가 매우 높고 상당히 무거웠음을 시사합니다.
		#LOC_KS_SciDef_dmlaserblastscan_SrfLandedCratersCraterLarge = Elad에서는 흔치 않은 외래 금속과 탄소 화합물이 고농도로 존재하여, 이 크레이터를 만든 충돌체의 구성을 짐작할 수 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_SrfLandedGrandCanyon = 이 협곡의 단단히 다져진 지표는 염분이 매우 높아, 이곳이 한때 심해 해구였다는 가설에 큰 힘을 실어 줍니다.
		#LOC_KS_SciDef_dmlaserblastscan_SrfLandedGrandCliff = 이 거대한 절벽에는 여러 종류의 석영이 포함되어 있는 것으로 보입니다.
		#LOC_KS_SciDef_dmlaserblastscan_SrfLandedLowlands = 이곳의 지면에는 염분이 다량 농축되어 있으며, 이는 한때 이곳이 액체 상태의 물로 이루어진 바다나 대양의 밑바닥이었음을 강하게 시사합니다.
		#LOC_KS_SciDef_dmlaserblastscan_SrfLandedMidlandsHighlands = Elad의 황량한 표면은 주로 규산염, 산소, 알루미늄으로 이루어진 것으로 보입니다. 커빈과 마찬가지로 표면의 상당 부분이 화강암입니다.
		#LOC_KS_SciDef_dmlaserblastscan_SrfLandedValleys = Elad의 '계곡'에는 염분이 빽빽하게 쌓인 지형이 있으며, 이는 계곡 대부분, 어쩌면 전부가 한때 깊은 해구였음을 시사합니다. Elad는 레이테처럼 바다로 뒤덮인 세계였을지도 모릅니다.
		#LOC_KS_SciDef_dmlaserblastscan_Suluco_SrfLandedDay = 햇볕에 바랜 표면에는 이렇다 할 유기 성분이 없습니다. 전부 모래와 암석뿐입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Suluco_SrfLandedDesert = 이 바싹 마른 사막에도 여전히 생명의 뚜렷한 흔적이 있습니다. 암석 표층을 증발시키자 외계 곤충이 파 놓은 작은 굴들과 끈질긴 풀의 뿌리가 드러났습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Suluco_SrfLandedNight = 밤 쪽의 어둠 속에서는 물 얼음과 여러 광물의 흔적만 발견됩니다. 산맥조차 바위처럼 단단하고 두꺼운 만년 빙하로 덮여 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Suluco_SrfLandedNightCraters = 이 충돌 크레이터의 표면에는 주변의 만년 빙하보다 광물 화합물과 금속이 훨씬 많이 포함되어 있습니다. 이는 거의 확실히 크레이터를 만든 충돌체에서 비롯된 것입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Suluco_SrfLandedTwilight = 방출물에서 식물에서 유래한 탄소 화합물과 여러 종류의 암석이 검출되었습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Suluco_SrfSplashedWater = 액체를 증발시켜 보니 정말로 물임이 확인되었습니다. 하지만 이걸 알아내는 데 굳이 이런 특수 장비까지 필요하지는 않았을 겁니다.
		#LOC_KS_SciDef_dmlaserblastscan_Tot_SrfLanded = 이 소행성은 주로 암석질로 보이지만, 실제로는 예상보다 금속이 조금 더 많습니다. 특히 낮은 지역을 더 조사하면 유익한 사실을 알아낼 수 있을 것입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Tot_SrfLandedCraters = Tot의 충돌 크레이터는 대부분 금속질인 소행성 내부 깊은 곳을 드러냅니다. 내부가 모두 이렇다면, 크기는 길리의 3분의 1에 조금 못 미치는데도 중력이 길리의 두 배가 넘는 이유를 설명할 수 있을 것입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Tot_SrfLandedLowlands = Tot의 저지대에는 예상보다 훨씬 높은 농도의 금속이 있습니다. Tot은 암석질과 금속질이 섞인 구성으로 보이며, 이것으로 유난히 높은 밀도를 설명할 수 있을 것입니다.
		#LOC_KS_SciDef_dmlaserblastscan_Uleg_SrfLandedGeneric = Uleg의 얼음 표면을 화학 분석한 결과, 이 블래닛의 대부분은 단단하고 잘 부서지는 얇은 물 얼음층으로 덮여 있고, 그 아래에는 훨씬 단단하고 어두운 얼음이 있습니다. 이 표면층에는 메탄 얼음과 이산화탄소 얼음의 흔적도 있습니다. 혹한의 바람에 실려 와 쌓였을 수도 있습니다.
		#LOC_KS_SciDef_dmlaserblastscan_Uleg_SrfLandedMountainsCliffs = Uleg의 이 지역은 다른 곳보다 색이 어둡지만, 분석 결과 화학 조성은 여전히 대부분 물 얼음입니다. 아마 표면의 나머지를 덮은 얇은 층과는 결정 구조가 다를 것입니다.
		#LOC_KS_SciDef_dmseismicHammer_Ahtpan_SrfLanded = 지진파를 보면 Ahtpan의 내부는 아직 어느 정도 활동 중이며, 핵은 아마 여전히 녹아 있을 것입니다.
		#LOC_KS_SciDef_dmseismicHammer_Anneheg_SrfLanded = 충격을 통해 Anneheg가 금속 성분이 매우 높다는 것이 확인되었습니다. 이 천체의 최소 80%가 금속입니다.
		#LOC_KS_SciDef_dmseismicHammer_Arorua_SrfLanded = 정교한 망치 타격 분석 결과, Arorua는 암석 지각과 부분적으로 녹은 금속 핵을 지닌, 지구형 천체로서는 꽤 전형적인 구성을 가진 것으로 보입니다.
		#LOC_KS_SciDef_dmseismicHammer_Dipuc_SrfLanded = Dipuc의 내부 구조는 복잡합니다. 초기 스캔에 따르면 Dipuc는 아직 녹아 있는 핵과 Sera의 조석력 모두에 의해 형성된 것으로 보입니다.
		#LOC_KS_SciDef_dmseismicHammer_Dipuc_SrfLandedVolcano = 끊임없는 진동 때문에 이곳에서는 Dipuc의 내부 구성을 명확히 파악할 수 없습니다. 그래도 그 자체로 매우 흥미로운 데이터입니다.
		#LOC_KS_SciDef_dmseismicHammer_Dipuc_SrfLandedVolcanoVent = 자, 그럼. 너무 열 받지 마십시오.
		#LOC_KS_SciDef_dmseismicHammer_Efil_SrfLandedRocky = 이곳에서는 지진파가 잘 전달되어 Efil의 내부를 더 선명하게 보여 줍니다. 다만 동굴과 지층이 이렇게 많으니 그리 놀랄 일은 아닙니다.
		#LOC_KS_SciDef_dmseismicHammer_Efil_SrfLandedSandy = 아래의 가루 같은 표면이 지진파를 아주 잘 흡수하여, 비밀을 밝혀내려는 시도를 가로막습니다.
		#LOC_KS_SciDef_dmseismicHammer_Efil_SrfLandedSoily = 아래의 토양이 통과하는 지진파 대부분을 약화시키지만, 표면 아래 깊숙이 뻗은 동굴의 존재를 희미하게 암시합니다.
		#LOC_KS_SciDef_dmseismicHammer_Elad_SrfLanded = Elad 깊은 곳에서 반사된 지진파를 통해 핵이 여전히 완전히 녹아 있으며 맨틀도 매우 활발하다는 것이 확인되었습니다.
		#LOC_KS_SciDef_dmseismicHammer_Elad_SrfLandedCraterGiant = 이 거대한 크레이터의 지진 스캔에서는 고밀도 중금속의 대규모 매장층이 뚜렷하게 나타납니다. 이는 이 크레이터를 만든 소행성이 아마 금속질이었으며, 두꺼운 대기조차 뚫고 들어올 만큼 거대했음을 의미합니다.
		#LOC_KS_SciDef_dmseismicHammer_Elad_SrfLandedGrandCanyonValleys = 이곳 지면의 조성과 엄청난 압력으로 압축된 흔적으로 보아, 고대의 해구로 보입니다.
		#LOC_KS_SciDef_dmseismicHammer_Elad_SrfLandedLowlands = 이 지역의 조성은 커빈의 해저와 매우 비슷하며, 그 때문에 지진파를 잘 전달하지 못합니다.
		#LOC_KS_SciDef_dmseismicHammer_Enots_SrfLanded = 지진파가 이 작은 위성 전체에 걸쳐 잘 반사됩니다. 이는 위성의 밀도가 꽤 높고 구조적 힘으로 단단히 결합되어 있다는 뜻입니다.
		#LOC_KS_SciDef_dmseismicHammer_Eulb_SrfLanded = 가루 같은 푸른 표토가 지진 스캔을 꽤 많이 흡수합니다. 큰 크레이터처럼 더 단단한 곳에서 더 나은 결과를 얻을 수 있을 것입니다.
		#LOC_KS_SciDef_dmseismicHammer_Eulb_SrfLandedCratersBig = Eulb의 내부를 분석한 결과 밀도 높은 조성이 드러났으며, 아마 표면처럼 강옥 같은 알루미늄 산화물이 풍부할 것입니다.
		#LOC_KS_SciDef_dmseismicHammer_Iomena_SrfLandedRocky = 이곳의 암석은 공명이 잘 되어 센서에 Iomena의 내부 구조를 선명하게 보여 줍니다. 액체 암모니아의 흐름에 침식된 것으로 보이는 거대한 지하 동굴들이 있으며, 지각의 대부분은 암석질로 보입니다. 물 얼음은 놀라울 정도로 적습니다.
		#LOC_KS_SciDef_dmseismicHammer_Iomena_SrfLandedWet = 이곳의 축축하고(액체 암모니아로) 부드러운 토양은 지진파를 그다지 잘 전달하지 못합니다. 그러니까... 망치를 들자마자 찾을 수 있는 가장 무른 땅부터 찾아간 겁니까? 다른 곳으로 가 보십시오. Iomena는 꽤 암석이 많은 곳입니다.
		#LOC_KS_SciDef_dmseismicHammer_Mehtna_SrfLanded = 지하 반사파를 보면 Mehtna에서는 지질 활동의 증거가 거의 보이지 않습니다.
		#LOC_KS_SciDef_dmseismicHammer_Meiuqer_SrfLanded = 밀도가 낮은 '돌무더기' 소행성인 Meiuqer는 매우 느슨하게 뭉쳐 있어서, 충격으로 튀어 나간 잔해 일부는 분명 탈출 속도에 도달했을 것입니다. 쓸 만한 데이터를 하나도 얻지 못했다는 뜻이기도 합니다.
		#LOC_KS_SciDef_dmseismicHammer_Noi_SrfLanded = 밀도가 낮은 소행성이 지진파를 꽤 잘 흡수해서 데이터를 모으기가 상당히 어렵습니다. 하지만 어차피 내부가 어떻게 생겼을지는 짐작하기 어렵지 않습니다.
		#LOC_KS_SciDef_dmseismicHammer_Noira_SrfLanded = 지진파 반사를 보면 거대한 지하 동굴이 존재한다는 증거가 뚜렷이 드러납니다. 어쩌면 액체 상태의 물로 가득 차 있을지도 모릅니다!
		#LOC_KS_SciDef_dmseismicHammer_Norihc_SrfLanded = 측정한 지진파 수치는 Norihc 지표 아래에 액체 대양이 있다는 뚜렷한 징후를 보여 줍니다. 유기 화합물이 존재한다는 점을 고려하면 생명체가 있을 가능성도 충분합니다.
		#LOC_KS_SciDef_dmseismicHammer_Noyreg_SrfLanded = Noyreg의 내부 구성을 보면 대부분이 다이아몬드와 비슷한 밀도를 지니고 있으며, 측정값이 맞다면 작고 거의 활동이 멈춘 금속 핵만 있을 뿐입니다. 이로써 확실해졌습니다. Noyreg는 대부분 탄소로 이루어져 있습니다.
		#LOC_KS_SciDef_dmseismicHammer_Onrefni_SrfLanded = Onrefni는 매우 쉽게 공명하며, 이는 지나치게 거대한 금속 핵이 존재한다는 사실을 사실상 확증해 줍니다.
		#LOC_KS_SciDef_dmseismicHammer_Rouqea_SrfLanded = 안타깝게도 이 깊이에서조차 수집할 데이터가 많지 않습니다. 센서가 제 역할을 하기에는 환경이 너무 맞지 않는 데다, 어차피 저 위의 어마어마한 파도 위를 떠다니고 있을 것이기 때문입니다. 그래도 근처 센서는 바로 주변이 이색 얼음에서 예상되는 방식과 아주 비슷하게 공명한다는 사실만큼은 알려 줍니다.
		#LOC_KS_SciDef_dmseismicHammer_Rouqea_SrfSplashed = 음... 첨벙? 무엇을 기대했는지 스스로도 잘 모르겠습니다.
