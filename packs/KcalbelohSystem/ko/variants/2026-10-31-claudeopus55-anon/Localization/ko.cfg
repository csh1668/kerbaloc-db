		#LOC_KS_SciDef_rpwsScan_Efil_InSpace = Efil의 전리층은 Anehta의 강력한 자기장과 상호작용하며, 두 세계의 대기와 자기권 사이의 관계를 다채롭게 그려 냅니다. 보호자 Anehta와, 자기도... 태양풍을... 혼자서 막을 수 있다는 걸, 어, 증명하고 싶어 안달 난 반항아 Efil이라고 할까요? 이보세요, 이제 쓸 말이 바닥났습니다.
