		#LOC_KS_SciDef_mysteryGoo_WH3141B_InSpaceLow = 구가 마치 웜홀을 두려워하는 듯 움츠러드는 것 같습니다.
		#LOC_KS_SciDef_rpwsScan_Ahtpan_InSpaceHigh = 전파 패턴을 보면 이곳의 자기 환경이 뚜렷하게 왜곡되어 있습니다. Ahtpan을 둘러싼 자기장의 영향일 가능성이 높습니다.
