		#LOC_KS_SciDef_atmosphereAnalysis_Rouqea_FlyingLow_Midlands = Rouqea's 대기는 숨 쉴 수 있습니다! 하지만 물속에서 숨 쉬려고 하지는 마십시오. 그다지 현명한 행동이 아닙니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Sedah_FlyingHigh = Sedah's 상층 대기를 분석한 결과, 극도로 높은 온도와 빛나는 외관이 확인되어 이 가스 행성의 강렬한 열기를 보여 줍니다. 또한 분석을 통해 Sedah's 대기는 크기 대비 질량이 낮아 줄보다 밀도가 낮고 더 넓게 퍼져 있음이 확인되었습니다. 그 결과 대기층 간 경계가 덜 뚜렷한 "폭신한" 모습을 띱니다.
		#LOC_KS_SciDef_atmosphereAnalysis_Sedah_FlyingLow1 = Sedah's 하층 대기를 분석한 결과, 주로 수소와 헬륨으로 이루어져 있으며 온도가 높고 구름 패턴이 역동적인 것으로 밝혀졌습니다. 크기에 비해 질량이 낮기 때문에 Sedah's 대기는 밀도가 낮고 더 넓게 퍼져 있어, 대기층 간 경계가 덜 뚜렷한 흐릿한 모습을 만들어 냅니다.
