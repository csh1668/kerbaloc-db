		#LOC_KS_SciDef_mobileMaterialsLab_Suluco_SrfSplashed = Suluco의 대양에서 수행한 물질 연구에서 흥미로운 결과를 얻었습니다. 대양에서 채취한 물 샘플을 분석한 결과, 행성의 다른 지역에서는 발견되지 않는 희귀 광물과 유기 화합물이 고농도로 포함되는 등 독특한 화학적 특성이 확인되었습니다. 황혼 지대에 끊임없이 부는 강풍이 대양의 조성에 영향을 미쳐 물질의 분포를 바꾸고, 이 행성의 기이한 외계 생명체를 형성하는 데 한몫한 것으로 추정됩니다.
