		#LOC_KS_SciDef_dmseismicHammer_Suluco_SrfLandedWater = 느슨한 토양은 지진파를 잘 반사하지 못해 쓸 만한 데이터를 많이 얻지 못했습니다.
		#LOC_KS_SciDef_dmseismicHammer_Tot_SrfLanded = 조심하십시오! 부서지겠습니다! 아니, 망치 말고요, 이 답답한 양반- 소행성 말입니다!
		#LOC_KS_SciDef_dmseismicHammer_Tot_SrfLandedLowlandsCraters = 충격이 예상보다 크게 울려 퍼져 Tot의 내부 전체를 선명하게 파악할 수 있습니다. 이 소행성은 한때 금속질 소행성과 암석질 충돌체, 두 개의 천체였던 것으로 보입니다. 성기게 뭉쳐 울림이 약한 암석부터 깊이 들어갈수록 흔해지는 철과 니켈이 풍부한 단단한 부분까지, 매우 다양한 구성을 가장 쉽게 설명할 수 있는 가설입니다. Tot의 밀도가 이렇게 높은 이유도 분명 이 때문일 것입니다.
		#LOC_KS_SciDef_dmseismicHammer_Uleg_SrfLanded = 망치가 부딪히자 부서지기 쉬운 얼음 지표에 쉽게 균열이 생기지만, 지진파는 여전히 꽤 잘 전달됩니다. 측정값은 Uleg 전역에서 활발한 빙화산 활동이 일어나고 있음을 나타냅니다.
		#LOC_KS_SciDef_evaReport_Ahtpan_Flying = 어, 저 멀리 먼지 폭풍이 보이는 것 같습니다!
		#LOC_KS_SciDef_evaReport_Ahtpan_InSpace = 잠시 시간을 내어 아래의 풍경과 저 멀리 떠 있는 쌍둥이 태양의 풍경을 감상합니다.
		#LOC_KS_SciDef_evaReport_Ahtpan_InSpaceLow_NaphthanOceans = 저기, 우리 아래에 있는 게 석유라고 생각하십니까?
