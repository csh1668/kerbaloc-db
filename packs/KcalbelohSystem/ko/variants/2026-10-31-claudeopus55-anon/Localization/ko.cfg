		#LOC_KS_SciDef_evaReport_Ahtpan_SrfLanded_Coast = 여기라면 석유 시추 시설을 세우기 딱 좋겠- 죄송합니다, 방금 뭐라고 하셨습니까?
		#LOC_KS_SciDef_evaReport_Ahtpan_SrfLanded_Islands = 여기라면 석유 시추 시설을 세우기 딱 좋겠- 죄송합니다, 방금 뭐라고 하셨습니까?
