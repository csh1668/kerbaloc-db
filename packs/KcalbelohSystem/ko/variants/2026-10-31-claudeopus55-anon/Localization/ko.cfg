		#LOC_KS_SciDef_dmbiodrillscan_Efil_SrfLandedBeach = 조간대에서는 작은 포유류 비슷한 동물이 껍데기 안에 집을 짓고 삽니다. 커빈에서 익숙한 개념을 귀엽게 뒤집은 모습이자 수렴 진화의 대표적인 예입니다. 다른 바다 생물이 버린 껍데기를 은신처로 삼지만, 껍데기를 버려야 할 때는 놀라울 만큼 빠르게 움직일 수 있습니다.
