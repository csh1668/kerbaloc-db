		#LOC_KS_SciDef_evaReport_Anneheg_SrfLanded1 = 우주복 냉각 시스템이 열기를 버티느라 애쓰는 동안, 지표 곳곳에 솟아 있는 기묘한 기둥과 탑들을 눈여겨봅니다.
		#LOC_KS_SciDef_evaReport_Anneheg_SrfLanded2 = 이 행성 지표에서라면 간식을 쉽게 튀길 수 있을 것입니다. 그래야 한다는 말은 아닙니다. 그럴 수 있다는 말일 뿐입니다.
		#LOC_KS_SciDef_evaReport_Anneheg_SrfLanded_Lava = 이게 왜 좋은 생각이라고 여기셨는지는 묻지도 않겠습니다.
