		#LOC_KS_SciDef_atmosphereAnalysis_EfilHome_FlyingLow = Efil의 하층 대기는 여전히 살기에 매우 적합합니다.
		#LOC_KS_SciDef_atmosphereAnalysis_EfilHome_SrfLanded = 장비가 Efil의 대기를 분석합니다.
