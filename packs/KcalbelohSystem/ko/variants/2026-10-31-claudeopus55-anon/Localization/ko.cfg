		#LOC_KS_SciDef_gravityScan_Arorua_InSpace = 중력 센서는 Arorua가 행성을 공전하고 Aralc-B 주위를 돌면서 생기는 국지 중력의 미세한 변화를 감지합니다.
		#LOC_KS_SciDef_gravityScan_Arorua_SrfLanded = 열 때문에 중력 센서의 측정값이 부정확해집니다.
		#LOC_KS_SciDef_gravityScan_Dipuc_InSpaceHigh = 이 거리에서 Dipuc의 약한 중력은 상당히 균일하지만, 데이터에는 여전히 작은 변동이 나타납니다.
		#LOC_KS_SciDef_gravityScan_Dipuc_InSpaceLow = Dipuc의 표면 위를 지날 때 중력 측정값이 지하 마그마 흐름을 암시하는 패턴으로 요동칩니다.
		#LOC_KS_SciDef_gravityScan_Dipuc_SrfLanded = 중력은 0.15g로 문과 비슷합니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_InSpace_Beach = 해변 위를 지나자 중력 센서 측정값이 평탄해집니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_InSpace_Desert = 사막 위를 지나자 중력 센서 값이 일직선이 됩니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_InSpace_Forests = 중력 센서가 엉터리 값을 내뱉습니다. 아래에 있는 엄청난 양의 초목을 감당하지 못하는 것 같습니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_InSpace_Grassland = 똑같이 평평한 초원 위를 지나자 중력 센서 측정값도 평탄해집니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_InSpace_Mountains = 중력 센서가 아래 산맥의 지형을 따라가며, 국지 중력 측정값에 작지만 뚜렷한 변화가 나타납니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_InSpace_Tundra = 아래의 툰드라 때문에 중력 센서 값이 아주 잠깐 치솟습니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_InSpace_Water = 중력 센서가 바다 위에서 국지 중력의 짧은 변화를 감지합니다. 아마도 Anehta와 이 항성계의 다른 위성들의 영향인 것 같습니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_SrfLanded = 중력 센서가 실제보다 훨씬 높은 값을 측정합니다. 재보정이 필요한 것 같습니다.
		#LOC_KS_SciDef_gravityScan_EfilHome_SrfSplashed = 바닷물이 스며들어 중력 센서가 합선됩니다.
		#LOC_KS_SciDef_gravityScan_Efil_InSpaceHigh = 광활한 우주 한가운데에서 우리 우주선은 매혹적인 세계 Efil 상공 높은 곳까지 나아가 중력이 펼치는 천체의 춤을 포착했습니다. 이 높은 관측 지점에서 우리는 Efil과 그 우주 동반자들 사이의 복잡한 상호작용을 목격하고, 시공간이라는 직물에 새겨진 곡선과 물결을 추적했습니다.
		#LOC_KS_SciDef_gravityScan_Efil_InSpaceLow = 광활한 우주 공간에서 우리 우주선은 Efil 상공에서 중력 스캔을 시작하여 중력이 펼치는 천체의 안무를 포착했습니다. 무중력 상태에 떠 있는 채로 우리는 Efil의 중력장이 부드럽게 당기고 미는 모습을 관찰하고, 우주의 구조를 형성하는 복잡한 패턴을 지도로 기록했습니다.
		#LOC_KS_SciDef_gravityScan_Efil_SrfLanded = Efil의 매혹적인 해안에 두 발을 굳건히 딛고, 우리는 이 행성의 중력 품속에 감춰진 비밀을 풀기 위해 중력 스캔을 시작했습니다. 장비가 중력의 미세한 변동을 꼼꼼히 측정하면서 지표 아래의 질량 분포와 행성 역학의 복잡한 상호작용, 그리고 푸른 장막 아래 숨겨진 보물에 대한 통찰을 얻었습니다.
		#LOC_KS_SciDef_gravityScan_Elad_InSpaceHigh = 이 거리에서 보면 Elad의 중력은 꽤 일정한 것 같습니다. 표면의 불규칙성이 무게중심을 움직이지는 않는 것으로 보입니다.
		#LOC_KS_SciDef_gravityScan_Elad_InSpaceLow = 몇몇 불규칙성이 Elad의 중력 분포에 불규칙성을 일으키는 것으로 감지되었는데, 그 분포는 불규칙과는 거리가 멉니다.
		#LOC_KS_SciDef_gravityScan_Elad_SrfLanded = 이 우주선에 달린 작은 상자가 땅 쪽으로 끌려가는 것 같습니다. 이는 Elad가 만들어 내는 중력의 존재를 증명할 수 있습니다. 이 효과는 질량이 주변의 시공간을 휘게 하는 능력 때문에 발생합니다. 이것을 중력이라고 부르는데, 여기까지 이것을 가지고 왔다면 이미 알고 계셔야 합니다. 그렇죠?
		#LOC_KS_SciDef_gravityScan_Enots_InSpaceHigh = 센서가 Enots와 Anehta 사이를 오락가락합니다. 그래도 Tot 탐사 때만큼 심하지는 않습니다.
		#LOC_KS_SciDef_gravityScan_Enots_InSpaceLow = 중력 스캐너가 이제 Enots에 더 집중하고 있습니다. 하지만 측정값으로는 여전히 구가 미쳐 날뛰는 이유를 설명할 수 없습니다.
		#LOC_KS_SciDef_gravityScan_Enots_SrfLanded = 이곳의 표면 중력은 매우 낮습니다. 떨어지지, 아니 정확히는 뛰어내리지 않도록 조심하십시오.
		#LOC_KS_SciDef_gravityScan_Eulb_InSpace = 센서가 Eulb의 중력을 측정하여 이 푸른 위성의 내부 구조에 대한 단서를 제공합니다.
		#LOC_KS_SciDef_gravityScan_Eulb_SrfLanded = 센서가 지표면에서 국지 중력을 상세히 조사하여 내부 구조가 어떠한지 추론할 수 있게 해 줍니다.
		#LOC_KS_SciDef_gravityScan_Iomena_InSpaceHigh = 중력 측정값은 우주선의 고도와 Kcalbeloh의 중력에 따라 약간씩 변동합니다.
		#LOC_KS_SciDef_gravityScan_Iomena_InSpaceLow = Iomena 주위의 저궤도에서 측정한 중력값은 행성 표면에서 측정한 값에 비해 비교적 안정적입니다. Iomena 주위 저궤도에서 실시한 중력 스캔 결과, 이 행성은 커빈에 비해 중력이 비교적 약한 것으로 관측되었습니다.
		#LOC_KS_SciDef_gravityScan_Iomena_SrfLanded = Iomena의 중력 측정값은 측정 위치에 따라 눈에 띄게 변동합니다. 이는 행성의 고르지 않은 지형과, 수많은 크레이터와 협곡이 내부 지질에 미친 영향 때문일 가능성이 높습니다.
		#LOC_KS_SciDef_gravityScan_Kcalbeloh_InSpaceHigh = 멀리서 Kcalbeloh를 중력 스캔하자 데이터에서 미세한 불규칙성이 드러났습니다. 이는 블랙홀을 공전하는 행성, 즉 '블래닛'일 가능성이 높습니다. 그중 몇몇은 꽤 가까이 있을 것입니다!
		#LOC_KS_SciDef_gravityScan_Kcalbeloh_InSpaceLow = 중력 스캔 결과 상당한 중력 왜곡이 나타났으며, 이는 앞으로 이 거대한 천체 주변에서 중력 새총 기동을 하는 데 도움이 될 수 있습니다.
		#LOC_KS_SciDef_gravityScan_Maelg_InSpaceHigh = 이 거리에서 Maelg의 중력 우물은 커볼 같은 진짜 항성에 비하면 다소 희미하지만, 여전히 뚜렷하게 느껴지며 가장 무거운 행성조차 훨씬 능가합니다.
		#LOC_KS_SciDef_gravityScan_Maelg_InSpaceLow = Maelg 표면에서 측정된 중력은 이미 강력한 줄의 중력 우물을 훨씬 더 극단적으로 만든 것에 비유할 수 있습니다. (상대적으로) 작은 크기에도 불구하고, 이 실패한 항성은 인근의 다른 항성계와 Kcalbeloh 자체의 간섭 속에서도 Mehtna와 Meiuqer를 꽤 단단히 붙잡고 있습니다.
		#LOC_KS_SciDef_gravityScan_Mehtna_FlyingHigh = 우주선이 Mehtna 대기에 진입하면서 생긴 흔들림에도 불구하고, 지표면의 중력은 대략 0.5G 정도로 추정됩니다.
		#LOC_KS_SciDef_gravityScan_Mehtna_FlyingLow = 이 고도에서는 아직 정밀한 중력 스캔이 불가능합니다. 희박한 대기가 우주선을 흔들고 진동을 일으키기에 딱 충분할 만큼은 있어서 장비가 제대로 작동하지 않기 때문입니다. 하지만 덕분에 대략적인 풍속을 알 수 있습니다(물론 의도한 대로 대략적인 중력 수치도 얻었습니다)!
		#LOC_KS_SciDef_gravityScan_Mehtna_InSpaceHigh = 아래쪽의 중력은 커빈 중력의 절반 정도, 어쩌면 그보다 조금 더 되는 것으로 추정됩니다.
		#LOC_KS_SciDef_gravityScan_Mehtna_InSpaceLow = 아래쪽의 중력은 커빈 중력의 절반 정도, 어쩌면 그보다 조금 더 되는 것으로 추정됩니다.
		#LOC_KS_SciDef_gravityScan_Mehtna_SrfLanded = 이 세계의 중력은 태양계 안팎의 다른 목적지들에 비해 상당히 강한 편으로, 커빈 중력의 절반을 조금 넘습니다. 걸음마다 발이 묶이거나 너무 멀리 날아가지 않고 이 무덤 같은 세계를 효과적으로 탐사하기에 적당한 수준입니다.
		#LOC_KS_SciDef_gravityScan_Meiuqer_InSpaceHigh = 중력 스캐너는 이 소행성의 중력장에 대한 보잘것없는 측정값을 내놓으며, 왜 굳이 이런 짓을 했는지 의문을 표합니다.
		#LOC_KS_SciDef_gravityScan_Meiuqer_InSpaceLow = 중력 스캐너가 무례하게 웃으며 무시해도 될 만한 수치를 보고합니다.
		#LOC_KS_SciDef_gravityScan_Meiuqer_SrfLanded = Meiuqer의 중력을 측정하려고 시도합니다. 센서 화면이 그렇게 낮은 값까지 겨우 표시할 수 있는 수준이지만, 어쨌든 측정값을 얻었습니다.
		#LOC_KS_SciDef_gravityScan_Noi_InSpace = 중력 측정기가 잠들어 있어서 측정하려면 깨워야 합니다. 이곳의 궤도 속도는 정말 느리며, 아래에 Noi의 어느 부분이 있느냐에 따라 중력이 '거의 없음'에서 '사실상 없음' 사이를 격렬하게 오갑니다.
		#LOC_KS_SciDef_gravityScan_Noi_SrfLanded = Noi의 중력은 궤도에서보다 지표면에서 아주 약간 더 강하지만, 여전히 사실상 없는 수준입니다. 여기서 EVA 중에 점프하는 것은 끔찍한 생각입니다.
		#LOC_KS_SciDef_gravityScan_Noira_InSpaceHigh = 이 고도에서는 Noira의 중력을 Simetra와 Simeht의 중력과 구별하기 어렵습니다.
		#LOC_KS_SciDef_gravityScan_Noira_InSpaceLow = Noira의 중력은 꽤 낮기 때문에 측정값의 상당 부분은 여전히 Simetra와 Simeht의 영향입니다.
		#LOC_KS_SciDef_gravityScan_Noira_SrfLanded = 쌍둥이 세계가 머리 위에서 나선을 그리며 돌 때마다 Noira의 중력 측정값이 주기적으로 감소합니다.
		#LOC_KS_SciDef_gravityScan_Norihc_InSpace = 주변에 무거운 천체가 많이 있어 검출기가 연구하기에 꽤 복잡한 중력자 환경이 형성되어 있습니다.
		#LOC_KS_SciDef_gravityScan_Norihc_SrfLanded = Simetra나 Simeht가 위를 지나갈 때 중력 측정값이 다소 감소하는데, 이는 조석력이 Norihc의 지질에 미치는 영향을 암시합니다.
		#LOC_KS_SciDef_gravityScan_Noyreg_InSpace = 중력 측정값은 아래의 지형에 따라 변동하지만, 안타깝게도 그 지형은 두꺼운 구름층에 가려져 있습니다.
		#LOC_KS_SciDef_gravityScan_Noyreg_SrfLanded = Simetra나 Simeht가 머리 위를 지날 때마다 측정값이 약간씩 증가합니다. Noyreg가 강한 조석력을 받고 있다는 증거입니다.
		#LOC_KS_SciDef_gravityScan_Onrefni_InSpaceHigh = 이 거리에서는 평소라면 뚜렷했을 이 작은 행성의 중력 측정값이 Kcalbeloh의 숨 막히는 중력 신호에 완전히 묻혀 버립니다.
		#LOC_KS_SciDef_gravityScan_Onrefni_InSpaceLow = 센서는 블랙홀과 Onrefni가 주변에서 벌이는 행성 규모의 줄다리기를 수치화하느라 애를 먹고 있습니다.
		#LOC_KS_SciDef_gravityScan_Onrefni_SrfLanded1 = Onrefni의 어느 지점에서 측정하느냐에 따라 중력 측정값이 아주 미세하게 변동합니다. 이 작은 세계의 불안정한 지형과 망가진 내부 지질 구조 때문인 것으로 보입니다.
		#LOC_KS_SciDef_gravityScan_Onrefni_SrfLanded2 = Onrefni의 중력은 분명 불안정하지만, 대체로 듀나의 지표 중력과 비슷하거나 약간 더 높은 수준에서 안정됩니다. 이렇게 작은 천체는 보통 이만큼 높은 중력을 갖지 않으므로, 이 사실은 이 작은 세계에 무거운 철 핵이 있다는 이전 과학 측정 결과의 가설을 뒷받침합니다.
		#LOC_KS_SciDef_gravityScan_Onrefni_SrfSplashed = 중력 센서가 Onrefni의 지옥불 같은 혹독한 열기에 녹아내리기 시작하면서 의미 없는 데이터를 마구 쏟아냅니다.
		#LOC_KS_SciDef_gravityScan_Rouqea_InSpaceHigh = Kcalbeloh가 너무 가까워서 Rouqea의 중력을 제대로 측정하기가 어렵습니다. 하지만 -65535 같은 측정값이 홍수처럼 쏟아진 끝에, 마침내 Rouqea의 미약한 중력을 찾아냅니다.
		#LOC_KS_SciDef_gravityScan_Rouqea_InSpaceLow = 중력 센서는 Rouqea가 지배적인 중력원임을 감지하지만, 몇 초마다 엄청난 크기의 값이 화면에 번쩍입니다. 아마도 Kcalbeloh가 자신이 아직 여기 있다는 걸 상기시키는 것이겠지요.
		#LOC_KS_SciDef_gravityScan_Rouqea_SrfLanded = 이곳의 중력은 지표에서 측정했을 때보다도 더 강한 것 같습니다! 흥미롭군요!
		#LOC_KS_SciDef_gravityScan_Rouqea_SrfSplashed = 이곳의 중력은 커빈보다 조금 더 강하지만 불편할 정도는 아닙니다. 마치 언덕을 계속 뛰어 올라가는 느낌입니다! 하지만 큰 파도의 뒷면을 타고 기체를 미끄러뜨리면 멋진 무중력 체험을 할 수 있습니다!
		#LOC_KS_SciDef_gravityScan_Sedah_InSpaceHigh1 = 측정 결과 Sedah의 중력은 줄 같은 더 큰 가스 행성에 비해 상당히 약했습니다. Sedah의 낮은 질량 때문에 중력이 덜 강한 것이며, 이는 행성의 전체 구조와 구성에 영향을 미쳤을 수 있습니다.
		#LOC_KS_SciDef_gravityScan_Sedah_InSpaceHigh2 = 센서가 이 크기의 행성치고는 비정상적으로 낮은 값을 표시합니다. 더 자세히 조사해 볼 가치가 있을 것 같습니다.
		#LOC_KS_SciDef_gravityScan_Sedah_InSpaceLow1 = 중력 스캔 결과 Sedah의 밝은 면과 어두운 면 사이에 뚜렷한 차이가 나타났습니다. 온도 차이로 인한 밀도 차이 때문일 가능성이 있습니다.
		#LOC_KS_SciDef_gravityScan_Sedah_InSpaceLow2 = 센서 데이터에 따르면 Sedah는 엄청난 크기에도 불구하고, 적어도 크기에 비해서는 그다지 무겁지 않습니다.
		#LOC_KS_SciDef_gravityScan_Sera_Srf = 중력은 1.08G로 커빈보다 아주 조금 더 높습니다.
		#LOC_KS_SciDef_gravityScan_SimeSystem_InSpaceHigh = 이 계의 중심에 거대한 천체 두 개가 있음에도, 센서는 거의 일정한 값을 표시합니다.
		#LOC_KS_SciDef_gravityScan_Simeht_InSpaceHigh = 비슷한 크기의 다른 얼음 거인이 가까이 있어 중력 센서가 혼란을 일으키고, 이 계의 질량 중심을 가리킵니다.
		#LOC_KS_SciDef_gravityScan_Simeht_InSpaceLow = Simeht에 더 가까워지자 중력을 훨씬 더 정확하게 측정할 수 있습니다.
		#LOC_KS_SciDef_gravityScan_Simetra_InSpaceHigh = 비슷한 크기의 다른 얼음 거인이 가까이 있어 중력 센서가 혼란을 일으키고, 이 계의 질량 중심을 가리킵니다.
		#LOC_KS_SciDef_gravityScan_Simetra_InSpaceLow = Simetra에 더 가까워지자 중력을 훨씬 더 정확하게 측정할 수 있습니다.
		#LOC_KS_SciDef_gravityScan_Suluco = Suluco의 전역 중력 스캔 결과, 행성 표면 전체에 걸쳐 큰 변화나 이상 없이 비교적 균일한 중력장이 나타났습니다. 중력 세기는 낮 반구와 밤 반구, 그리고 그 사이의 황혼 지대에서 모두 비슷한 것으로 확인되었습니다.
		#LOC_KS_SciDef_gravityScan_SulucoHome_InSpace = Suluco 상공의 국지 중력을 측정합니다.
		#LOC_KS_SciDef_gravityScan_SulucoHome_InSpace_Day = 사막 쪽은 중력이 매우 안정적인 것으로 보이며, 이는 지질 구성의 변화가 매우 적음을 시사합니다.
		#LOC_KS_SciDef_gravityScan_SulucoHome_InSpace_Night = 밤 쪽 상공을 지날 때, 특히 얼어붙은 산봉우리 위에서 중력 센서의 측정값이 요동칩니다.
		#LOC_KS_SciDef_gravityScan_SulucoHome_InSpace_Twilight = 황혼 지대 상공을 지나면서 중력 센서가 국지 중력이 아주 약간 감소한 것을 감지합니다. 행성의 이 지역이 비교적 고도가 낮다는 것을 시사합니다.
		#LOC_KS_SciDef_gravityScan_SulucoHome_SrfLanded = 중력 센서를 제대로 보정한 뒤, Suluco 지표의 국지 중력을 측정합니다.
		#LOC_KS_SciDef_gravityScan_SulucoHome_SrfSplashed = 중력 센서가 물에 닿자마자 타 버립니다.
		#LOC_KS_SciDef_gravityScan_Sunorc_InSpace = 중력 센서의 데이터로 Sunorc의 크기와 구성에 대한 단서를 얻을 수 있습니다.
		#LOC_KS_SciDef_gravityScan_Tot_InSpaceHigh = 중력 센서는 이 조그만 천체보다 Suluco에 훨씬 더 관심이 많은 것 같습니다. Tot에 집중하게 만들려는 시도는 헛수고일 것입니다.
		#LOC_KS_SciDef_gravityScan_Tot_InSpaceLow = 중력 센서는 여전히 Suluco를 가리킵니다. 답답한 마음에 센서를 강제로 초기화해 보지만, 센서는 또다시 Suluco로 관심을 돌립니다.
		#LOC_KS_SciDef_gravityScan_Tot_SrfLanded = 이 조그만 바위 바로 옆에 와서야 마침내 중력 센서가 Tot에 집중합니다.
		#LOC_KS_SciDef_gravityScan_Uleg_InSpaceHigh = 높은 궤도의 우주선에서 Uleg 행성의 중력 스캔을 수행했습니다. 스캔 결과 행성의 중력장에 상당한 변화가 나타났으며, 이는 지하에 밀도가 낮은 물질이 존재함을 나타냅니다.
		#LOC_KS_SciDef_gravityScan_Uleg_InSpaceLow = Uleg 저궤도 우주 공간에서 중력 스캔 실험을 수행하는 동안 우주선은 행성의 중력장을 측정할 수 있었습니다. 측정값은 예상보다 약한 중력을 보였으며, 이는 Uleg의 밀도가 낮고 내부가 부분적으로 비어 있을 수 있음을 나타냅니다.
		#LOC_KS_SciDef_gravityScan_Uleg_SrfLanded = 승무원이 Uleg 지표에서 중력 스캔을 수행했습니다. 결과는 행성 중력장의 변화를 보여 주었으며, 이는 얼음 지표 아래에 비교적 빈 공간이 존재함을 나타냅니다. 이 공간의 성질과 구성을 밝히려면 추가 분석이 필요합니다.
		#LOC_KS_SciDef_gravityScan_WH3141A_InSpaceHigh = 중력 센서의 측정값이 심하게 요동칩니다. 이 기이한 중력장을 수치화하기는커녕 처리조차 하지 못하는 것 같습니다.
		#LOC_KS_SciDef_gravityScan_WH3141A_InSpaceLow = 중력 센서의 측정값이 심하게 요동칩니다. 이 기이한 중력장을 수치화하기는커녕 처리조차 하지 못하는 것 같습니다.
		#LOC_KS_SciDef_gravityScan_WH3141B_InSpaceHigh = 중력 센서의 측정값이 심하게 요동칩니다. 이 기이한 중력장을 수치화하기는커녕 처리조차 하지 못하는 것 같습니다.
		#LOC_KS_SciDef_gravityScan_WH3141B_InSpaceLow = 중력 센서의 측정값이 심하게 요동칩니다. 이 기이한 중력장을 수치화하기는커녕 처리조차 하지 못하는 것 같습니다.
		#LOC_KS_SciDef_magnetometer_Ahtpan_InSpaceHigh = 붐이 자기장을 감지하지만, 아래 행성에서 오는 것인지 두 항성에서 오는 잡음인지 구분하기 어렵습니다.
		#LOC_KS_SciDef_magnetometer_Ahtpan_InSpaceLow = 붐이 꽤 강한 자기장을 감지합니다. 나침반을 어느 정도 믿고 쓸 수 있을 정도입니다. 두 항성의 항성풍에 깎여 나가지 않고 대기가 유지되는 것도 아마 이 자기장 덕분일 것입니다.
		#LOC_KS_SciDef_magnetometer_Anehta_InSpaceHigh = 낮은 궤도에서 관측된 요동치는 난류성 자기장과 달리, 고고도 영역의 자기장은 세기와 방향이 일정하여 비교적 안정적인 것으로 보입니다. 이 영역에서는 행성 고리계의 자기 변동도 미미하여, 보다 일관되고 정돈된 자기 환경임을 시사합니다.
		#LOC_KS_SciDef_magnetometer_Anehta_InSpaceLow = Anehta's 저궤도에서 얻은 자력계 측정값은 복잡하고 역동적인 자기장 패턴을 드러냅니다. 행성의 자기장은 세기와 방향이 크게 변하며, 영구적인 구름층의 어두운 띠와 구역에서 더 높은 자기 활동을 보입니다.
		#LOC_KS_SciDef_magnetometer_Anneheg_InSpaceHigh = Aralc-A의 강렬한 복사선 때문에 자력계 붐이 타 버렸습니다.
		#LOC_KS_SciDef_magnetometer_Anneheg_InSpaceLow = 붐이 타 버리기 직전, Anneheg의 희미한 자기장을 잠깐 측정할 수 있었습니다. 다만 이 측정값이 Aralc-A에서 온 잡음인지는 아무도 모릅니다.
		#LOC_KS_SciDef_magnetometer_AralcA_InSpaceHigh = 장비가 강한 자기장을 감지하지만, 측정값을 신뢰할 수 없습니다.
		#LOC_KS_SciDef_magnetometer_AralcA_InSpaceLow = Aralc-A의 자기장이 정확히 얼마나 강한지는 모르지만, 장비를 태워 버릴 만큼 강하다는 것만은 확실합니다.
		#LOC_KS_SciDef_magnetometer_AralcB_InSpaceHigh = 장비가 매우 강한 자기장을 감지하지만, 가까이 있는 Aralc-A의 영향 때문일 수도 있습니다.
		#LOC_KS_SciDef_magnetometer_AralcB_InSpaceLow = Aralc-B에 가까이 있으니 자기장을 훨씬 정확하게 측정할 수 있습니다. 상당히 강하지만, 주계열성이라면 예상할 수 있는 수준입니다.
		#LOC_KS_SciDef_magnetometer_AralcSystem_InSpaceHigh = 장비가 강력한 항성 자기장을 감지합니다. 하지만 이 측정값은 훨씬 큰 Aralc-A의 영향이 지배적일 가능성이 높습니다.
		#LOC_KS_SciDef_magnetometer_Arorua_InSpace = 자력계가 Aralc-B에서 날아오는 다량의 하전 입자를 감지합니다. 이 입자들이 Arorua의 대기를 깎아 내고 있습니다.
		#LOC_KS_SciDef_magnetometer_EfilHome_InSpace = 자력계 붐이 아주 미세하게 요동치는 강한 자기장을 감지합니다. 아마 가까이 있는 Anehta의 영향일 것입니다.
		#LOC_KS_SciDef_magnetometer_Efil_InSpace = 광활한 우주에서 자력계가 신비로운 세계 Efil을 둘러싼 자기장을 꼼꼼히 탐사했습니다. 행성 자기의 미묘한 요동과 물결을 감지하여, 작용하는 힘들의 생생한 모습을 그려 냈습니다. 자력계 스캔은 Efil의 자기장과 그 존재를 빚어내는 천체의 힘들 사이에서 벌어지는 복잡한 춤을 드러냈습니다.
		#LOC_KS_SciDef_magnetometer_Eulb_InSpaceHigh = 장비가 푸른 위성에서 오는 미약한 자기장을 감지하지만, 측정값이 Anehta's 자기장에서 오는 잡음으로 가득합니다.
		#LOC_KS_SciDef_magnetometer_Eulb_InSpaceLow = Eulb에 더 가까이 있으니 자기장을 더 정밀하게 측정할 수 있습니다.
		#LOC_KS_SciDef_magnetometer_Iomena_InSpaceHigh = Iomena's 고궤도에서 얻은 자력계 측정값에 따르면, 이 행성의 자기장은 약합니다. 아마 대기가 희박하고 철이 풍부한 큰 핵이 없기 때문일 것입니다. 하지만 자기장에 작은 국지적 변화가 있어, 추가로 연구할 만한 광물 매장지나 다른 지질학적 특징이 존재함을 시사합니다.
		#LOC_KS_SciDef_magnetometer_Iomena_InSpaceLow = Iomena의 약한 자기장은 저궤도에서도 감지되며, 이는 행성 표면이나 지하에 자성 물질의 원천이 있을 가능성을 나타냅니다. 자기장 세기의 변화 또한 추가로 조사할 만한 국지적 광물 매장지나 다른 지질학적 특징이 존재함을 시사합니다.
		#LOC_KS_SciDef_magnetometer_Kcalbeloh_InSpaceLow = 강착 원반 입자에서 나오는 강렬한 복사선 때문에 측정하기도 전에 장비가 합선되었습니다.
		#LOC_KS_SciDef_magnetometer_Maelg_InSpaceHigh = 이 높이에서 감지되는 자기장은 Maelg의 나머지 부분처럼 아직 꽤 얌전합니다. 하지만 가까이 갈수록, 당신과 당신의 작은 우주선에 비해 이 갈색 왜성 내부의 격렬함은 점점 거세질 것입니다.
		#LOC_KS_SciDef_magnetometer_Maelg_InSpaceLow = 자력계가 엄청나게 강한 자기장과 그로 인한 복사대를 포착하면서, 겉보기엔 어둡고 연약해 보이는 Maelg 속에 끓어오르는 분노를 드러냅니다. 커벌 우주센터는 이것을 스테로이드를 맞은 줄의 자기장... 곱하기 50이라고 생각하면 된다고 알려 줍니다.
		#LOC_KS_SciDef_magnetometer_Mehtna_InSpaceHigh = 자력계에 따르면 Mehtna는 다소 약하긴 하지만 분명히 감지할 수 있는 자기장을 지니고 있습니다! 다만 이 자기장은 Maelg와 주변의 다른 항성계에서 오는 항성/성간 복사선으로부터 표면을 보호할 만큼 강하지는 않습니다.
		#LOC_KS_SciDef_magnetometer_Mehtna_InSpaceLow = 감지된 자기장은 듀나의 자기장과 어느 정도 비슷하지만 더 증폭된 형태라고 할 수 있습니다. 두 행성이 여러 특성을 공유하지만 Mehtna가 훨씬 크기 때문일 것입니다.
		#LOC_KS_SciDef_magnetometer_Meiuqer_InSpaceHigh = 조그마한 Meiuqer에 자기장이 있는지 확인하는 것이 시간 낭비라는 건 알지만, "과학 성과를 극대화하지 않았다"는 둥 하는 어처구니없는 이유로 승무원 중 과학자에게 또 혼나고 싶지는 않습니다.
		#LOC_KS_SciDef_magnetometer_Meiuqer_InSpaceLow = 자력계가 이 우주 감자 전체가 완전히 죽은 상태라는 사실을 다시 한번 확인해 줍니다.
		#LOC_KS_SciDef_magnetometer_Noyreg_InSpace = 자력계 측정값은 복잡한 패턴과 요동을 드러내며, 자기 이상과 그 밑에 숨은 지질 현상의 존재를 암시합니다. 위험한 대기와 매혹적인 수수께끼를 품은 Noyreg는 우주의 경이로움을 보여 주는 증거로 서 있습니다.
		#LOC_KS_SciDef_magnetometer_Onrefni_InSpaceHigh = 이렇게 먼 거리에서도 Onrefni에서 놀라울 만큼 강한 자기 신호가 뿜어져 나옵니다. Kcalbeloh의 압도적인 자기장 때문에 자기장 형태가 일그러져 있지만, 분명 '무언가'가 있습니다. 이 측정값을 확인하려면 더 가까이 접근해야 합니다.
		#LOC_KS_SciDef_magnetometer_Onrefni_InSpaceLow = 자력계 붐이 이 왜소행성의 (크기에 비해) 꽤 강한 자기 신호를 포착하면서, Onrefni가 크기에 비해 거대하고 무거운 금속 핵을 지니고 있다는 이론이 금세 신빙성을 얻습니다.
		#LOC_KS_SciDef_magnetometer_Rouqea_InSpaceHigh = Rouqea 고궤도에서 실시한 자력계 실험에서는 자기장이 감지되지 않았습니다.
		#LOC_KS_SciDef_magnetometer_Rouqea_InSpaceLow = Rouqea 저궤도에서 측정한 자력계 값은 약하지만 감지 가능한 자기장이 있음을 나타냅니다.
		#LOC_KS_SciDef_magnetometer_Sedah_InSpaceHigh = 자력계 측정 결과, Sedah는 더 큰 행성인 줄에 비해 자기장이 비교적 약한 것으로 나타났습니다. 아마 질량이 더 작기 때문일 것입니다. 하지만 여전히 감지 가능한 자기 변동이 있어 Sedah의 대기에 어느 정도 자기 활동이 존재함을 알 수 있습니다.
		#LOC_KS_SciDef_magnetometer_Sedah_InSpaceLow = Sedah는 저궤도 우주에서 비교적 강하고 복잡한 자기장을 보였습니다. 데이터에서는 자기 폭풍과 변동이 감지되었으며, 이는 이 뜨거운 가스 행성 주변의 자기 환경이 역동적이고 활발하다는 것을 시사합니다. 이번 발견은 Sedah의 "푹신한" 대기가 지닌 독특한 자기적 특성과, 그것이 행성 전체의 대기 역학과 우주 기상에 미칠 수 있는 영향을 밝혀 줍니다.
		#LOC_KS_SciDef_magnetometer_Sera_InSpace = Sera는 비교적 강한 자기장을 지니고 있어 Sunroc의 태양풍으로부터 행성을 보호하는 것으로 보입니다.
