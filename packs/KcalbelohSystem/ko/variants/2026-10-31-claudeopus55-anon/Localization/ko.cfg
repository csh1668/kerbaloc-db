		#autoLOC_RBodies_discovery_Ahtpan = 음, 커볼처럼 노란색입니다. 하지만 그만큼 따뜻해 보이지는 않습니다. Bob은 불을 붙여서 어떻게 되는지 보자고 합니다.
		#autoLOC_RBodies_discovery_Anehta = 굉장합니다! 이 천체는 주위에도, 표면에도 거대한 띠가 있습니다! 지상에서 보면 어떤 모습일지 궁금합니다.
		#autoLOC_RBodies_discovery_Anneheg = 와, 뜨거운 바위입니다! 심지어 빛까지 납니다!
		#autoLOC_RBodies_discovery_AralcA = 이 항성은 너무 밝아서 Jeb의 눈이 멀 뻔했습니다! 지금까지 이걸 발견하지 못했다니 믿을 수가 없습니다!
		#autoLOC_RBodies_discovery_AralcB = 이 항성은 커볼에 비하면 아주 작습니다... 하지만 다른 항성과 함께 춤추듯 움직이는 것 같습니다.
		#autoLOC_RBodies_discovery_Arorua = 이 행성은... 놀라운 무늬로 일렁이며 빛나는 것 같습니다. 사진이 더 필요합니다.
		#autoLOC_RBodies_discovery_Dipuc = 문?! 어떻게 저기에 있는 겁니까? 아, 잠깐... 문이 아닙니다. 잘못 봤습니다.
		#autoLOC_RBodies_discovery_Efil = 커빈과 거의 똑같아 보입니다! 여기야말로 꼭 가 봐야 할 곳입니다! 갈 수만 있다면 말입니다.
		#autoLOC_RBodies_discovery_Elad = 와, 이건 문과 비슷하지만 크기는 커빈에 맞먹습니다! Jeb은 늘 제대로 된 도전을 좋아했습니다!
		#autoLOC_RBodies_discovery_Enots = 이건 이상합니다... 소행성처럼 작지만, 모양은 무슨 기괴한 예술 작품 같습니다.
		#autoLOC_RBodies_discovery_Eulb = 이건 문만큼 큰데... 민무스처럼 파랗습니다? 아이스크림이 기다립니다!
		#autoLOC_RBodies_discovery_Iomena = 크레이터투성이인 이 천체에는 대기가 있는 것 같습니다. 이웃 행성 듀나처럼 아주 희박합니다.
		#autoLOC_RBodies_discovery_Kcalbeloh = 빛조차 사라지는 듯한 우주 공간의 한 지점을 발견했습니다. Jeb의 농담조차 빠져나올 수 없는 대발견입니다! 다음엔 로켓 맛을 들이지 않기를 바랄 뿐입니다!
		#autoLOC_RBodies_discovery_Maelg = Bob은 이 항성을 렌즈에 생긴 흠집인 줄 알고 무시할 뻔했지만, 자세히 들여다보니 달랐습니다. 거대한 가스 행성에 더 가까워 보이는데, 뜨겁습니다... 정말 뜨겁습니다!
		#autoLOC_RBodies_discovery_Mehtna = 이상하게도 이 천체는 한쪽이 다른 쪽보다 더 뜨거운 것 같습니다. 거기서라면 멋지게 태닝할 수 있을지도 모릅니다.
		#autoLOC_RBodies_discovery_Meiuqer = 와... 정말 작습니다. 이렇게 먼 곳에서 뭐라도 보였다는 게 신기할 정도입니다.
		#autoLOC_RBodies_discovery_Noi = 이건 위성이라고 부르기도 민망합니다. 소행성에 더 가깝습니다... 표면에 붙어 있을 수 있을지, 그냥 둥둥 떠내려갈지 궁금합니다.
		#autoLOC_RBodies_discovery_Noira = 이 위성은... 거꾸로 공전하고 있습니까? 이상합니다. 저 커다랗게 움푹 팬 자국과 무슨 관련이 있는지 궁금합니다.
		#autoLOC_RBodies_discovery_Norihc = 이 거대한 바위를 표현할 말은... 희뿌옇고... 차갑다는 것뿐입니다.
		#autoLOC_RBodies_discovery_Noyreg = 간식?! 노다지를 찾았습니다!!!! 아, 잠깐... 독성이 있다는 겁니까? 그럼 간식은 없는 겁니까?
		#autoLOC_RBodies_discovery_Onrefni = 이 행성은 조각 사이로 뜨겁게 녹은 용암이 빛나는 직소 퍼즐처럼 보입니다.
		#autoLOC_RBodies_discovery_Rouqea = 처음에 최고의 과학자들은 누가 사진에 물을 한 방울 흘린 줄 알았습니다... 알고 보니 물로 뒤덮인 행성이었습니다!
		#autoLOC_RBodies_discovery_Sedah = 새로운 아이스크림?! 꽤 큽니다... 아, 아닙니다. 줄 같은데 분홍색입니다. 이상합니다.
		#autoLOC_RBodies_discovery_Sera = 이건 듀나와 좀 비슷합니다! 아주 붉고, 더 크긴 합니다. Jeb은 경주용 자동차가 떠오른다며 좋아합니다. 줄무늬까지 있습니다!
		#autoLOC_RBodies_discovery_Simeht = 아이스크림?! 아닙니다, 아이스크림이라기엔 너무 큽니다. 색깔은 민무스를 쏙 빼닮았지만 훨씬 더 큽니다.
		#autoLOC_RBodies_discovery_Simetra = 와, 커다란 바위입니다! 아, 아닙니다. 바위 색깔일 뿐입니다... 가스가 엄청 많아 보이는데, 냄새는 어떨지 궁금합니다.
		#autoLOC_RBodies_discovery_Suluco = 처음에는 이 바위가 그저 황량한 천체인 줄 알았지만, 오래 관찰해 보니 얼어붙어 있기까지 했습니다. Bob은 거기로 휴가를 가고 싶다고 합니다. 저희는 그가 제정신이 아니라고 생각합니다.
		#autoLOC_RBodies_discovery_Sunorc = 망원경에 작은 빛 점이 나타났습니다. 반사광인 줄 알았습니다. 아니, 아닙니다. 항성입니다!
		#autoLOC_RBodies_discovery_Tot = 이건 소행성만큼 작습니다! 커빈까지 끌고 와서 민무스의 말동무로 삼을 수 있을지 궁금합니다.
		#autoLOC_RBodies_discovery_Uleg = 아이스크림?! 아닙니다... 그냥 얼음인 것 같습니다. 뭐, 잠깐이나마 신났습니다.
		#autoLOC_RBodies_discovery_WH3141A = 이상 현상으로 보이는 것을 발견했습니다... 주변에서 빛이 제대로 움직이지 않습니다. 조사가 필요합니다!
		#autoLOC_RBodies_discovery_WH3141B = 이상합니다. 일종의 이상 현상입니다... 이 물체가 무엇인지 도무지 알 수 없습니다. 탐사 임무가 필요할지도 모릅니다. 하지만 너무 멀어서 여정에 필요한 간식을 충분히 챙길 수 없습니다.
