		#LOC_KS_SciDef_temperatureScan_Simetra_FlyingLow = 극도로 짙은 대기가 온도계를 찌그러뜨립니다.
		#LOC_KS_SciDef_temperatureScan_SulucoHome_FlyingHigh = 고층 대기의 온도는 더 균일하지만, 여전히 대기 전반에 걸친 대류의 흔적이 보입니다.
		#LOC_KS_SciDef_temperatureScan_SulucoHome_FlyingLow = 대기 중의 대류 흐름 때문에 고도를 지날 때마다 온도가 크게 오르내립니다.
		#LOC_KS_SciDef_temperatureScan_SulucoHome_FlyingLow_Day = 낮 지역 상공의 온도는 지표면보다 약간 서늘하지만, 그 차이는 크지 않습니다. 따뜻한 상승 기류가 공기를 원래보다 더 따뜻하게 만듭니다.
		#LOC_KS_SciDef_temperatureScan_SulucoHome_FlyingLow_Night = 차가운 하강 기류 때문에 이 지역의 대기 온도는 원래보다 훨씬 낮습니다.
		#LOC_KS_SciDef_temperatureScan_SulucoHome_SrfLanded_Day = 여기는 매우 덥습니다. 여기서 살고 싶어 한다면 제정신이 아닐 겁니다!
		#LOC_KS_SciDef_temperatureScan_SulucoHome_SrfLanded_DayPole = 이곳은 행성에서 가장 뜨거운 곳이며, 세상에, 정말 푹푹 찝니다! 행성의 이 지역에 정착하지 않은 것도 당연합니다.
		#LOC_KS_SciDef_temperatureScan_SulucoHome_SrfLanded_Night = 행성의 이쪽 절반은 거의 견딜 수 없을 만큼 춥습니다.
		#LOC_KS_SciDef_temperatureScan_SulucoHome_SrfLanded_NightPole = 이곳은 행성에서 가장 추운 곳이며, 온도계마저 얼어붙은 것 같습니다. 굳이 말할 필요도 없이, 아무도 여기 살지 않는 이유가 분명합니다.
		#LOC_KS_SciDef_temperatureScan_SulucoHome_SrfLanded_Twilight = 이곳의 온도는 딱 알맞습니다. 이제 우리가 왜 행성의 이 지역에 사는지 알겠습니다.
		#LOC_KS_SciDef_temperatureScan_SulucoHome_SrfSplashed_ColdOcean = 온도계가 얼음장 같은 물에 닿자마자 산산조각 났습니다. 보증서가 있어서 다행이지 않습니까? 뭐라고요, "보증이 무효"라니 그게 무슨 말입니까??
		#LOC_KS_SciDef_temperatureScan_SulucoHome_SrfSplashed_Water = 이곳의 수온은 의외로 쾌적합니다. 수영을 해도 괜찮을 것 같습니다.
		#LOC_KS_SciDef_temperatureScan_Suluco_FlyingHigh = Suluco의 상층 대기에서 온도를 측정하자 흥미로운 온도 분포가 드러났습니다. Suluco는 Sunorc에 조석 고정되어 한쪽은 영원한 낮, 다른 쪽은 영원한 밤이기 때문에, 상층 대기에서 주간 반구와 야간 반구 사이의 뚜렷한 온도 차이가 나타납니다.
		#LOC_KS_SciDef_temperatureScan_Suluco_FlyingLow_Day = Suluco 주간 반구의 저층 대기에서 온도를 측정한 결과, 섭씨 90도가 넘는 뚜렷한 온도 구배가 확인됩니다. 항성을 향한 쪽은 끊임없이 햇빛에 노출되어 극도로 높은 온도를 겪습니다. 밤이 없어 대기가 지속적으로 가열되므로 타는 듯한 고온이 이어집니다. 이러한 극한 환경은 Suluco 주간 반구의 탐사나 거주에 어려움이 될 수 있습니다.
		#LOC_KS_SciDef_temperatureScan_Suluco_FlyingLow_Night = Suluco 야간 반구의 하층 대기에서 온도를 측정하자 극한의 온도 조건이 드러났습니다. 야간 반구는 영원한 어둠에 잠겨 있어 주간 반구와 황혼 지대보다 훨씬 춥습니다. 야간 반구 하층 대기의 평균 온도는 섭씨 -65도로, 빙점보다 훨씬 낮습니다.
		#LOC_KS_SciDef_temperatureScan_Suluco_FlyingLow_Twilight = Suluco 황혼 지대의 저층 대기에서 온도를 측정한 결과, 주간 반구 및 야간 반구와는 다른 독특한 온도 분포가 확인됩니다. 주간 반구와 야간 반구의 경계인 황혼 지대는 섭씨 -15~45도의 온화한 온도 범위를 보입니다. 이는 주간 반구와 야간 반구 사이의 끊임없는 상호 작용 덕분으로, 양쪽 반구의 극한 온도 환경에 비해 비교적 온화한 환경이 형성됩니다.
		#LOC_KS_SciDef_temperatureScan_Suluco_SrfLanded_Day = 온도 측정 보고서: Suluco 주간 반구의 착륙 지점은 행성이 끊임없이 햇빛에 노출되는 탓에 지표면 온도가 극도로 높은 타는 듯한 곳입니다. 측정 온도는 섭씨 90도를 넘어, 대부분의 생명체가 살기 어려운 환경입니다.
		#LOC_KS_SciDef_temperatureScan_Suluco_SrfLanded_Night = Suluco 야간 반구의 착륙 지점은 평균 섭씨 -65도로 빙점보다 훨씬 낮은 극한의 추위를 보입니다. 영원한 밤이 이어지는 이 지역은 햇빛이 없어 극도로 추운 환경이며, 우리가 아는 생명체가 살아가기에는 큰 어려움이 따릅니다.
		#LOC_KS_SciDef_temperatureScan_Suluco_SrfLanded_Twilight = Suluco의 황혼 지대에 있는 착륙 지점에서 독특하고 역동적인 온도 분포가 드러났습니다. 이 지역은 낮 반구와 밤 반구의 극명한 차이로 인해 온도 변화가 매우 큽니다. 측정값은 섭씨 -25도에서 45도 범위이며, 짧은 시간 동안 급격한 변화가 일어납니다. 이 역동적인 환경은 Suluco의 황혼 지대에서 빛과 어둠의 상호작용을 연구하는 데 독특한 어려움과 기회를 동시에 제공합니다.
		#LOC_KS_SciDef_temperatureScan_Suluco_SrfSplashed = Suluco의 황혼 지대에 착수하자 독특한 온도 패턴이 드러났습니다. 낮 반구와 밤 반구 사이에 놓인 영원한 황혼의 좁은 고리는 온화한 온도를 보이는데, 이는 낮 반구와 밤 반구 사이의 끊임없는 상호작용 때문인 것으로 보입니다. 식물과 기타 생물 활동이 존재한다는 점으로 미루어 볼 때, 이 지역은 이국적인 외계 생명체의 서식지가 될 가능성이 있습니다.
		#LOC_KS_SciDef_temperatureScan_Sunorc_FlyingHigh = 온도계가 순식간에 최대치를 찍더니, 하전 입자가 계기와의 연결을 방해하면서 바닥까지 떨어집니다.
		#LOC_KS_SciDef_temperatureScan_Sunorc_FlyingLow = [데이터 없음]
		#LOC_KS_SciDef_temperatureScan_Sunorc_InSpaceLow = 항성에 가까워질수록 온도계 눈금이 올라가기 시작합니다.
		#LOC_KS_SciDef_temperatureScan_Uleg_FlyingHigh = Uleg 상층 대기의 온도는 극도로 낮은데, 이는 행성이 Kcalbeloh에서 멀리 떨어져 있고 열을 가둘 만한 충분한 대기가 없기 때문으로 보입니다. 온도 측정 결과 상층 대기 전반에 걸쳐 작은 온도 차이도 나타나는데, 이는 지표 지형과 얼음 덮개의 차이 때문으로 보입니다.
		#LOC_KS_SciDef_temperatureScan_Uleg_FlyingLow = Uleg의 온도는 고도가 낮아질수록 크게 떨어지며, 상층 대기와 하층 대기 사이의 차이는 최대 섭씨 50도에 이릅니다. 이는 행성의 희박한 대기와 열을 가두는 기체의 부족 때문으로 보입니다.
		#LOC_KS_SciDef_temperatureScan_Uleg_SrfLanded = Uleg의 지표면은 극도로 추우며, 측정값이 꾸준히 빙점 아래를 기록합니다. 지표면을 덮은 얼음은 행성의 혹독한 추위 때문으로 보이며, 행성에 얼음으로 덮이지 않은 지역이 있는지는 확실하지 않습니다.
		#LOC_KS_SciDef_temperatureScan_WH3141A_InSpaceHigh = 우주선 코앞에 시공간을 뒤틀어 버리는 이상 현상이 있는데도, 온도계는 이상한 점을 전혀 감지하지 못한 것 같습니다.
		#LOC_KS_SciDef_temperatureScan_WH3141A_InSpaceLow = 우주선 코앞에 시공간을 뒤틀어 버리는 이상 현상이 있는데도, 온도계는 이상한 점을 전혀 감지하지 못한 것 같습니다.
		#LOC_KS_SciDef_temperatureScan_WH3141B_InSpaceHigh = 우주선 코앞에 시공간을 찢는 이상 현상이 있는데도, 온도계는 별다른 이상을 전혀 감지하지 못한 것 같습니다.
		#LOC_KS_SciDef_temperatureScan_WH3141B_InSpaceLow = 우주선 코앞에 시공간을 찢는 이상 현상이 있는데도, 온도계는 별다른 이상을 전혀 감지하지 못한 것 같습니다.
		#LOC_KS_Sedah_description = Sedah는 Sunorc 바로 가까이에서 공전하는 뜨거운 가스 행성입니다. 대기 온도가 높아 은은하게 빛납니다. 크기는 줄과 비슷하지만 질량은 줄의 약 7분의 1에 불과하여, 밀도가 낮고 더 "푹신한" 대기를 가지고 있습니다.
		#LOC_KS_Sera_description = Sera는 눈에 띄는 고리계와 여러 개의 큰 호수를 지닌 황량한 암석 행성입니다. 안타깝게도 호수는 유독하며, Sera에서 생명체의 흔적은 알려진 바가 없습니다.
		#LOC_KS_SimeSystem_description = 쌍성 가스 행성계의 질량 중심입니다.
		#LOC_KS_Simeht_description = 쌍성 가스 행성계에서 더 작은 행성인 Simeht 역시 얼음 거인으로 분류됩니다. 그러나 Simetra와 달리 구름 띠와 폭풍을 가시광선으로 관측하기 어렵습니다.
		#LOC_KS_Simetra_description = Simetra는 Simetra-Simeht 쌍성 가스 행성계에서 더 큰 얼음 거인입니다. 푸른빛은 가장 바깥 영역에 존재하는 미량의 메탄 때문이며, 행성의 다른 영역은 정체불명의 화합물로 인해 초록색과 노란색을 띠는 것으로 추정됩니다.
		#LOC_KS_Suluco_description = Suluco는 Sunorc에 조석 고정된 커빈과 비슷한 행성으로, 한쪽 면은 항상 항성을 향하고 다른 쪽 면은 영원한 어둠 속에 있습니다. 두 반구가 극명하게 대비되는 양분된 세계입니다. 한쪽은 끝없는 낮이 계속되고, 다른 한쪽은 영원한 밤에 뒤덮여 있습니다. 두 반구의 경계는 영원한 황혼으로 이루어진 좁은 고리이며, 이곳은 행성에서 생명체가 살 수 있을 가능성이 있는 유일한 지역입니다.
		#LOC_KS_Sunorc_description = Sunorc는 주황색 왜성으로도 알려진 K형 주계열성입니다. 커볼보다 작고 차가워 외계 생명체 탐사에서 특히 주목받고 있습니다. Sunorc는 수명이 더 길고 자외선 방출량이 적어, 그 항성계에 생명체가 거주 가능한 행성이 존재할 가능성을 높여 줍니다.
		#LOC_KS_Tot_description = Suluco 주위를 공전하는 소행성 위성입니다.
		#LOC_KS_Uleg_description = Uleg는 Kcalbeloh에서 멀리까지 벗어나는 궤도를 도는 혹한의 행성입니다. 표면은 대부분 얼음으로 덮여 있습니다. 경사가 크고 이심률이 높은 궤도로 보아 Kcalbeloh에 포획된 것으로 추정됩니다.
		#LOC_KS_WH_description = 웜홀은 커볼계와 Kcalbeloh계를 연결하는 기묘한 시공간 왜곡입니다. 웜홀을 통과하려면 우주선의 근점을 30 km 아래로 낮추되, 웜홀 중심에 너무 가까이 다가가지 않도록 하십시오.
		#LOC_KS_WormholeEntry = <color=#ff0000>[경고: 강력한 시공간 왜곡으로 우주선을 제어할 수 없습니다!]
