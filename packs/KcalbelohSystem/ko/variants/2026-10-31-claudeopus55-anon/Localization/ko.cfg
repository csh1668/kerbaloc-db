		#LOC_KS_SciDef_crewReport_WH3141B_InSpaceHigh2 = 저것이 고향으로 돌아가는 “포털”이라니… 여러분은 물론 최고의 커벌 과학자들조차 그 전모를 이해하기는커녕 시작조차 못 하는 무언가에 Kerman 엄마 아빠에게 돌아갈 희망을 걸고 있는 셈입니다.
		#LOC_KS_SciDef_crewReport_WH3141B_InSpaceLow1 = 여러분과 승무원들은 이런 것을 또다시 통과하고 싶지 않습니다.
		#LOC_KS_SciDef_crewReport_WH3141B_InSpaceLow2 = 이상 현상 너머로 커볼의 점이 보이는 것 같지만, 확신할 수는 없습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Ahtpan_InSpaceHigh = Ahtpan의 대기는 대부분 이산화탄소로 이루어져 있지만, 많은 지역에 탄화수소 증기도 매우 높은 농도로 존재합니다.
		#LOC_KS_SciDef_dmImagingPlatform_Ahtpan_InSpaceLow = 분광 분석 결과는 명백합니다. 저것은 나프타의 대양입니다. 귀중한 "폭발륨"으로 가득한 바다 전체가 개발을 기다리고 있습니다. ISRU용이든 돈벌이용이든 말입니다!
		#LOC_KS_SciDef_dmImagingPlatform_Anehta_InSpaceHigh = Anehta를 스캔한 결과, Sudarskerb 분류 체계에 따른 II등급 가스 행성으로 확인되었습니다. 밝은 청백색 상층 구름층이 가시광선을 많이 반사하며, 강한 자외선 흡수로 보아 이 구름은 수증기로 이루어져 있습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Anehta_InSpaceLow = Anehta's 상층 구름을 종합적으로 스캔한 결과, 주로 수소, 헬륨, 수증기로 구성되어 있는 것으로 나타났습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Anneheg_InSpaceHigh = 행성의 반사율이 극도로 낮은데도, 그야말로 죽음의 광선이 표면에 쏟아지고 있어 Anneheg의 절대 복사 조도는 여전히 높습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Anneheg_InSpaceLow = Anneheg 표면을 스캔한 결과, 금속 함량이 극도로 높은 화산 유리가 확인되었습니다. 이 행성은 한때 훨씬 컸던 행성의 핵을 얇은 지각이 덮고 있는 것에 불과할 가능성이 높습니다.
		#LOC_KS_SciDef_dmImagingPlatform_AralcA_InSpace = 이미징 플랫폼이 섬세한 장비를 노출하기를 단호히 거부합니다. 이런 작업에는 더 특화된 도구가 필요합니다.
		#LOC_KS_SciDef_dmImagingPlatform_AralcB_InSpace = 이미징 플랫폼이 Aralc-B의 빛을 감지하자마자 스스로 작동을 멈춥니다. 적색 왜성조차도 연구하기에는 너무 밝습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Arorua_InSpaceHigh = Arorua 대기의 분광 분석 결과, 대부분 이산화탄소로 이루어져 있으며 그 밖의 성분은 거의 없는 것으로 나타났습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Arorua_InSpaceLow = Arorua 표면의 적외선 스캔은 쌍둥이 태양이 이 행성을 가열하는 방식을 정교한 지도로 보여 줍니다.
		#LOC_KS_SciDef_dmImagingPlatform_Dipuc_InSpaceHigh = 열화상 촬영 결과, Dipuc 전역의 온도가 크게 차이 나며 이는 화산 활동과 밀접한 관련이 있는 것으로 나타났습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Dipuc_InSpaceLow = 자외선 스캔 결과, 위성 표면 바로 위에 황이 풍부한 매우 희박한 대기가 낮게 깔려 있는 것으로 나타났습니다. 이 대기는 화산에서 활발하게 생성되고 있을 가능성이 높습니다.
		#LOC_KS_SciDef_dmImagingPlatform_EfilHome_InSpaceLow = Efil의 매우 다양한 지질과 생물은 복잡한 그림을 이루며, 생명의 품에 감싸인 위성의 풍부한 역사를 들려줍니다. 우뚝 솟은 산부터 완만한 평원까지, 울창한 정글부터 깊은 해구까지, Efil에는 볼거리가 가득합니다.
		#LOC_KS_SciDef_dmImagingPlatform_Efil_InSpaceHigh = Efil의 폭넓은 색채는 비가시광선 영역까지 이어져, 과학자들이 연구할 데이터를 그야말로 화폭 가득 채워 줍니다. 확실한 것은 커빈과 마찬가지로 대기가 주로 질소와 산소로 이루어져 있다는 점입니다. 가시광선으로 촬영한 Efil의 모습과 함께 보면 생명의 뚜렷한 징후입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Efil_InSpaceLow = Efil의 매우 다양한 지질과 생물은 복잡한 그림을 이루며, 생명의 품에 감싸인 위성의 풍부한 역사를 들려줍니다. 우뚝 솟은 산부터 완만한 평원까지, 울창한 정글부터 깊은 해구까지, Efil에는 볼거리가 가득합니다. 관광객들이 정말 좋아할 곳입니다! 여행 안내 책자에 꼭 넣겠습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Elad_InSpaceHigh = 열 방출을 분석한 결과 Elad 내부에서 가열 징후가 나타나며, 이는 현재 지질 활동이 진행 중임을 의미합니다.
		#LOC_KS_SciDef_dmImagingPlatform_Elad_InSpaceLow = 분광 분석 결과, 표면은 커빈과 비슷한 조성으로 규산염과 금속이 풍부한 것으로 나타났습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Enots_InSpace = 다중 분광 분석 결과, Enots는 주로 어두운 규산염 광물로 이루어져 있는 것으로 나타났습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Eulb_InSpaceHigh = 극도로 희박한 대기가 Eulb 표면에 달라붙어 있습니다. 기압계로 감지하기에는 너무 희박합니다.
		#LOC_KS_SciDef_dmImagingPlatform_Eulb_InSpaceLow = Eulb 표면을 분광 스캔한 결과, 위성 표면 거의 모든 곳에서 강한 적외선 흡수가 나타났습니다. 이는 흔히 사파이어로 알려진 청색 강옥이 눈에 띄는 푸른색의 원인임을 시사합니다.
		#LOC_KS_SciDef_dmImagingPlatform_Iomena_InSpaceHigh = Iomena의 희박한 대기는 주로 암모니아로 이루어져 있지만, 측정값은 미량의 메탄과 이산화탄소도 있음을 시사합니다. 이 미량 성분은 생명 신호일 수도 있습니다. 추가 연구가 필요합니다!
		#LOC_KS_SciDef_dmImagingPlatform_Iomena_InSpaceLowGeneric = 다중 분광 분석으로 판단하건대, Iomena's 청회색 표면은 다양한 규산염 광물과 암모니아가 섞인 꽤 평범한 혼합물로 보입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Iomena_InSpaceLowMountainsAll = 적외선 신호로 보아 Iomena's 산맥을 덮고 있는 밝은 물질은 암모니아 얼음일 가능성이 높습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Iomena_InSpaceLowWater = 적외선 측정값에 따르면, 이 액체는 암모니아이기에 딱 알맞은 온도입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Kcalbeloh_InSpaceHigh = 다중 분광 분석 결과, 강착 원반의 양 끝이 미세하게 적색 편이와 청색 편이를 보이는 것이 확인되었습니다. 한편 원반의 조성은 대부분 수소와 헬륨으로 보이며, 이는 수백만 년 전 Kcalbeloh가 집어삼킨 최소 하나 이상의 항성에서 온 질량으로 이루어져 있음을 입증합니다.
		#LOC_KS_SciDef_dmImagingPlatform_Kcalbeloh_InSpaceLow = 이론적으로는 이 거리에서 빛에 손상되지 않고 강착 원반을 분석할 수 있지만, 작용하는 강력한 힘 때문에 센서가 속절없이 뒤틀려 분석할 수 없습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Maelg_InSpace = Maelg의 분광 분석은 앞서 L형 천체로 분류한 결과를 뒷받침하며, 중수소와 리튬이 각각 헬륨-3과 헬륨-4로 융합되고 있다는 명확한 증거를 보여 줍니다.
		#LOC_KS_SciDef_dmImagingPlatform_Mehtna_InSpaceHigh = 분광 분석 결과, Mehtna의 대기는 주로 이산화탄소와 수증기로 이루어져 있습니다. 수증기는 낮 쪽에서 얼음이 승화하며 생성되는 것으로 보입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Mehtna_InSpaceLowDayGrandCrater = Mehtna의 어두운 표면을 다중 분광 스캔한 결과, 대부분 평범한 규산염 표면으로 나타났습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Mehtna_InSpaceLowIce = 앞서 행성의 온도와 대기를 분석하여 예측한 대로, 흰색 물질은 물 얼음으로 보입니다. 기압이 낮아 물이 곧바로 기체로 승화하기 때문에 액체는 존재하지 않습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Mehtna_InSpaceLowNight = 적외선 스캔 결과, Mehtna의 "한극"은 크레이터로 뒤덮인 황량한 표면이며, 보이는 쪽에서 관찰되는 균열은 거의 없습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Meiuqer_InSpace = 바위입니다! 바위라는 건 저도 압니다! 바위를 보면 바위인 줄 모르겠습니까? 저는 바위 사진을 들여다보는 데 엄청난 시간을 씁니다!
		#LOC_KS_SciDef_dmImagingPlatform_Noi_InSpaceHigh = 열화상 촬영으로 Noi가 실제로 얼마나 차가운지 드러났습니다. 스캔 결과 탄소질이지만, Sunorc에서 이 정도 떨어진 거리라면 얼음으로 이루어져 있었어도 이상하지 않았을 것입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Noi_InSpaceLow = Noi 표면의 정밀 스캔에서 탄소가 풍부한 암석과 일부 석질 규산염 물질이 감지되었습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Noira_InSpaceHigh = 높은 궤도에서 Noira를 분석한 결과, 크레이터로 얽고 함몰지로 뒤덮인 혼란스러운 표면이 나타났습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Noira_InSpaceLow = Noira의 레골리스는 문과 비슷한 조성을 가지고 있으며, 규산염과 알루미늄의 농도가 높습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Norihc_InSpaceHigh = Norihc의 대기는 주로 질소로 이루어져 있으며, 미량의 일산화탄소와 기타 기체가 포함되어 있습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Norihc_InSpaceLow = 표면의 분광 분석 결과, 표면은 대부분 물 얼음으로 이루어져 있으며 저지대에는 부분적으로 서리에 덮인 톨린 화합물이 있음이 확인되었습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Noyreg_InSpaceHigh = 분광 분석 결과, 대기는 대부분 이산화탄소이고 나머지는 질소, 이산화염소, 미량 기체로 이루어져 있습니다. 이 초기 분석만으로는 녹색의 원인이 분명하지 않습니다. 이산화염소 때문일 수도 있고, 전례 없는 종류의 산란 효과일 수도 있습니다. 추가 연구가 필요합니다.
		#LOC_KS_SciDef_dmImagingPlatform_Noyreg_InSpaceLow = 짙은 구름층 너머를 들여다보니 탄소가 엄청나게 풍부한 표면의 징후가 보입니다. Noyreg가 대부분 탄소로 이루어져 있을 가능성도 있는데, 그렇다면 정말 극히 드문 발견이 될 것입니다!
		#LOC_KS_SciDef_dmImagingPlatform_Onrefni_dmImagingPlatform_Onrefni_InSpaceHigh = 열화상 결과, Onrefni는 조석 고정되어 있음에도 양쪽 면 모두 이글이글 타오르고 있습니다. 어차피 낮 면도 빛 때문에 그리 많이 데워지는 것은 아닐 것입니다. 열을 내는 주범은 Kcalbeloh의 중력입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Onrefni_dmImagingPlatform_Onrefni_InSpaceLow = 다중 스펙트럼 분석 결과, 대기의 흔적은 없으며 표면은 금속이 풍부한 규산염이 주를 이룹니다. 아마도 이 표면은 거의 고밀도 금속 핵으로만 이루어진 블래닛 위에 덮인 얇은 층일 것입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Rouqea_InSpaceHigh = Rouqea 대기의 다중 스펙트럼 분석 결과, 대부분이 질소이지만 산소도 상당히 많은 것으로 확인되었습니다. 흥미롭군요. Rouqea에 생명체가 있을까요?
		#LOC_KS_SciDef_dmImagingPlatform_Rouqea_InSpaceLow = 대부분의 스펙트럼으로 Rouqea의 표면을 살펴보아도 수면 아래는 거의 드러나지 않습니다. 물이 꽤 깊은 것 같습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Rouqea_InSpaceLowHighlands = Rouqea 대양의 이 지역을 분석하자 놀라운 사실이 드러났습니다. 일부 구역은 수심이 100m밖에 되지 않는 것으로 보입니다!
		#LOC_KS_SciDef_dmImagingPlatform_Sedah_InSpaceHigh = Sedah는 매우 강한 열을 방출하고 있어, 일반적인 가스 행성보다 훨씬 많은 적외선을 내뿜습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Sedah_InSpaceLow = 대기 조성으로 보아 이 행성은 원래 좀 더 크림빛을 띠었을 수도 있지만, 극심한 열 때문에 칙칙한 붉은빛으로 빛나고 있습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Sera_InSpaceHigh = Sera 고리의 분광 분석 결과, 모행성처럼 금속질이 아닌 규산질 조성인 것으로 보입니다. 이 차이를 설명할 수 있는 한 가지 가능성은 이 고리를 형성한 천체가 포획된 소행성이었다는 것입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Sera_InSpaceLow = 스펙트럼 스캔 결과, Sera의 표면에는 중금속이 다량 함유되어 있으며, 특히 철, 알루미늄, 티타늄이 상당히 많습니다. 이것으로 분홍빛이 도는 갈색을 설명할 수 있습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Sera_InSpaceLowLakes = 이 액체의 흡수 스펙트럼을 보면 다른 유체가 아니라 물이라는 것이 꽤 분명합니다.
		#LOC_KS_SciDef_dmImagingPlatform_SimeSystem_InSpaceHigh = 두 천체의 스펙트럼 분석 결과, 양쪽 대기 모두에 메탄이 많다는 증거가 나타났습니다. Simetra의 녹색과 청색 띠에 대한 설명은 아직 오리무중입니다...
		#LOC_KS_SciDef_dmImagingPlatform_Simeht_InSpace = Simeht의 수소-헬륨 대기에는 메탄도 많이 포함되어 있어, 옅은 청록색을 설명하는 데 도움이 됩니다.
		#LOC_KS_SciDef_dmImagingPlatform_Simetra_InSpace = 상층 대기는 주로 메탄으로 이루어진 것으로 보이며, 하층은 대부분 수소, 헬륨, 메탄이고 미량의 황과 이산화염소가 섞여 있습니다. 이 이산화염소가 메탄과 함께 녹색 띠의 원인일 수 있습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Suluco_InSpaceHigh = 자외선 및 적외선 스펙트럼으로 Suluco의 대기를 종합 스캔한 결과, 예상대로 주로 질소와 산소로 이루어져 있음이 밝혀졌습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Suluco_InSpaceLowDay = Suluco의 낮 면은 Sunorc를 향해 빛을 그대로 되쏘고 있으며, 자외선과 적외선 스펙트럼 모두에서 많은 빛을 반사합니다.
		#LOC_KS_SciDef_dmImagingPlatform_Suluco_InSpaceLowDayPole = 항성 직하점이 단연 가장 많은 햇빛을 반사하고 있어, 적외선 측정값이 눈에 띄게 치솟습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Suluco_InSpaceLowNight = 적외선 촬영으로 Suluco의 밤 면을 더 선명하게 볼 수 있습니다. 재미있게도 지형은 대체로 낮 면과 비슷하게 언덕과 산맥이 대부분을 차지합니다. 하지만 흥미롭게도 Suluco의 밤 면은 크레이터로도 뒤덮여 있습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Suluco_InSpaceLowTwilight = 분석 중 검출된 미량 기체는 황혼 지대에서 생물 활동이 진행 중이라는 뚜렷한 징후를 보여 주지만, 낮 면이나 밤 면 쪽으로 깊이 들어갈수록 점차 사라집니다.
		#LOC_KS_SciDef_dmImagingPlatform_Suluco_InSpaceLowWater = 열화상으로 Suluco 대양의 해저 지형이 드러났습니다. 특이한 지형을 고려하면 이곳에는 연구할 거리가 아주 많을 것입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Sunorc_InSpaceHigh = 음, 이건 나쁜 생각이었습니다. 민감한 장비들이 Sunorc를 향하는 순간 자동으로 꺼졌으며, 손상되었을 수도 있습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Sunorc_InSpaceLow = 보증이 무효화되었습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Tot_InSpace = 다중 스펙트럼 분석에 따르면 Tot는 주로 암석질 소행성인 것 같습니다. 자, 이제 끝난 거죠?
		#LOC_KS_SciDef_dmImagingPlatform_Uleg_InSpaceHigh = 광대역 스펙트럼 분석에 따르면 Uleg의 희박한 대기는 주로 질소로 이루어져 있으며, 상당량의 메탄과 이산화탄소도 포함되어 있습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Uleg_InSpaceLow = 표면 분석 결과, Uleg의 표면은 주로 물 얼음으로 이루어져 있습니다.
		#LOC_KS_SciDef_dmImagingPlatform_Uleg_InSpaceLowMountains = Uleg의 어두운 산맥을 촬영한 데이터에 따르면 표면은 여전히 물 얼음입니다. 결정 구조가 달라서 더 어두운 색을 띠는 것으로 보입니다.
		#LOC_KS_SciDef_dmImagingPlatform_Wormholes_InSpace = 다중 스펙트럼 분석 결과는... '결론 불가'라고 해 둡시다. 웜홀에서 나오는 빛이 너무 심하게 왜곡되어 있어서, 측정값이 정확한지 검증하기가 어렵습니다.
		#LOC_KS_SciDef_dmMagScan_Ahtpan_SrfLanded = 종합적인 분석 끝에, Ahtpan의 자기장은 비교적 약하지만 태양풍을 막아 낼 수 있을 만큼은 겨우 강하다고 추정합니다.
		#LOC_KS_SciDef_dmMagScan_Anneheg_SrfLanded = 이곳의 엄청난 방사선 때문에 불쌍한 붐이 작동하지 않게 되었지만, 적어도 -대체로는- 똑바로 버티고 있습니다.
		#LOC_KS_SciDef_dmMagScan_Arorua_SrfLanded = 지표에서 측정해 보니 Arorua는 꽤 강한 자체 자기장을 가진 것으로 보입니다. 이 자기장이 하전 입자의 흐름을 어느 정도 막아 주어 대기의 수명을 늘리고 있을지도 모릅니다.
		#LOC_KS_SciDef_dmMagScan_Dipuc_SrfLanded = 자기력선이 지표에서는 보이지 않는 지형을 따라 흐르는 것으로 보입니다. 깊은 지하에서 자화된 용융 암석이 흐르고 있기 때문일 수 있습니다.
		#LOC_KS_SciDef_dmMagScan_Efil_SrfLanded = 자력계가 지표에서 Efil의 강한 자기장을 포착했습니다. 자기력선이 위성의 자전축과 절묘하게 정렬되어 있어, 마치 완벽하게 호흡을 맞춘 두 무용수 같습니다.
		#LOC_KS_SciDef_dmMagScan_Elad_SrfLanded = 자기력선이 이상한 방향으로 뻗어 있으며, 자전축에서 약 40도 기울어진 한 쌍의 자극을 가리키는 것으로 보입니다.
		#LOC_KS_SciDef_dmMagScan_Enots_SrfLanded = Enots는 자기장을 생성하지 않는 것으로 보입니다. 이렇게 짜릿할 수가...
		#LOC_KS_SciDef_dmMagScan_Eulb_SrfLanded = Eulb의 자기장은 꽤 약하지만, 지표에서 장비로 감지하기는 어렵지 않습니다. 또한 근처에 더 작고 강한 국지적 자기장이 여럿 있습니다.
		#LOC_KS_SciDef_dmMagScan_Iomena_SrfLanded = Iomena는 상당한 지표 자기장을 가지고 있으며, 위치에 따라 크게 왜곡됩니다. 가장 조용한 곳에서도 끊임없이 활동이 이어집니다. 아마도 지오다이나모 효과로 생성되는 진정한 자기장일 것입니다.
		#LOC_KS_SciDef_dmMagScan_Iomena_SrfLandedCanyonsAll = 일부 자기력선이 협곡 벽을 따라 뻗어 있어, 자기적으로 활성화된 물질이 존재함을 확인해 줍니다.
		#LOC_KS_SciDef_dmMagScan_Iomena_SrfLandedCraters = 고립된 강한 자기 활동 지역들로 보아, 충돌체가 떨어지면서 자성 광석을 흩뿌린 것으로 추정됩니다.
		#LOC_KS_SciDef_dmMagScan_Iomena_SrfLandedHighlands = 이곳의 자기 활동은 오히려 약간 더 약합니다. 융기된 지형 때문에 지각 내 자성 광석의 밀도가 낮아졌기 때문일 수 있습니다.
		#LOC_KS_SciDef_dmMagScan_Iomena_SrfLandedMountainsAll = 이곳에서는 자기장이 강해집니다. Iomena 깊은 곳에서 자화된 물질이 지각으로 올라왔기 때문일 수 있습니다.
		#LOC_KS_SciDef_dmMagScan_Kcalbeloh_InSpaceHigh = Kcalbeloh에서 이만큼 떨어진 곳에서는 이렇다 할 활동이 거의 없습니다. 행성간 공간, 아니 성간 공간과 매우 비슷합니다.
		#LOC_KS_SciDef_dmMagScan_Kcalbeloh_SrfLanded = 붐이 스파게티가 되었습니다. 당신도 스파게티입니다. 모든 것이 스파게티입니다! 대체 무슨 일이죠?!?! 왜 이렇게 파스타가 많은 겁니까?!?
		#LOC_KS_SciDef_dmMagScan_Mehtna_SrfLanded = 지표에서도 Mehtna의 자기장은 여전히 약하지만, 쉽게 감지됩니다.
		#LOC_KS_SciDef_dmMagScan_Meiuqer_SrfLanded = 원칙에 따라 자력계를 확인합니다. 아무것도 없습니다. 금속 매장지가 만드는 국지적 자기장조차 없습니다.
		#LOC_KS_SciDef_dmMagScan_Noi_SrfLanded = 흠. 역시 아닙니다. 여전히 자기장이 없습니다.
		#LOC_KS_SciDef_dmMagScan_Noira_SrfLanded = 지표에서는 작은 국지적 자기장이 감지되지만, 이 위성은 자체적인 큰 자기장이 없는 것으로 보입니다. 아니면 쌍둥이 행성에 비해 감지할 수 없을 만큼 약한 것이므로, 데이터를 더 정밀하게 분석해야 합니다.
		#LOC_KS_SciDef_dmMagScan_Norihc_SrfLanded = Norihc의 지표에서 약한 자기장이 측정되지만, 특별히 인상적인 수준은 아닙니다.
		#LOC_KS_SciDef_dmMagScan_Noyreg_SrfLanded = Noyreg의 자기장은 지표에서도 크게 달라지지 않는 것으로 보입니다.
		#LOC_KS_SciDef_dmMagScan_Onrefni_SrfLanded = Onrefni의 지표 자기장은 상당히 강하며, 이렇게 작은 천체치고는 더욱 그렇습니다. 핵이 비율상 매우 거대하고, Kcalbeloh의 막대한 중력에 의해 강하게 휘저어지고, 아니 반죽되고 있을 가능성이 큽니다.
		#LOC_KS_SciDef_dmMagScan_Onrefni_SrfSplashed = 초대질량 블랙홀 가까이를 공전하는 블래닛의 용암 속에서 녹아내리던 자력계가 왜 '아, 안 돼, 또야!'라는 메시지를 보냈는지 안다면, 우리는 지금보다 우주의 본질에 대해 훨씬 더 많이 알게 될 것이라고 많은 이들이 추측해 왔습니다.
		#LOC_KS_SciDef_dmMagScan_Rouqea_SrfLanded = 붐은 이런 압력을 견디도록 설계되지 않은 것이 분명하며, 일부가 찌그러진 것으로 보입니다.
		#LOC_KS_SciDef_dmMagScan_Rouqea_SrfSplashed = Rouqea 지표의 자기장은 궤도에서보다 약간 강하지만 여전히 약합니다. Kcalbeloh와 가까우니 조석력이 핵을 휘저어야 할 텐데, 어쩌면 금속 핵이 아예 없는 것일까요?
		#LOC_KS_SciDef_dmMagScan_Sera_InSpaceHigh = 이 고도에서도 강한 자기 수치가 측정되어, Sera를 강력한 자기권이 둘러싸고 있음을 알 수 있습니다. Dipuc의 조석력이 Sera의 핵을 활성 상태로 유지시켰을 수도 있지만, 정말 그럴 만큼 가까울까요?
		#LOC_KS_SciDef_dmMagScan_Sera_SrfLanded = Sera의 지표에서는 자기력선이 사방으로 뻗어 있어, 주변에 강력한 국지적 자기장이 다수 존재함을 분명히 보여 줍니다.
		#LOC_KS_SciDef_dmMagScan_Suluco_InSpaceHigh = 이 거리에서는 Suluco의 자기장이 매우 희미합니다. 지표에서 그리 멀리 뻗어 있지 않은 것으로 보입니다.
		#LOC_KS_SciDef_dmMagScan_Suluco_SrfLanded = 지표에서 측정한 Suluco의 자기장은 약한 것으로 보이며, 이는 태양풍을 이상적인 수준만큼 막아 주지 못한다는 뜻입니다. 하지만 황혼 지대는 원래 햇빛 노출이 제한적이므로, 그곳의 생명체는 개의치 않고 살아가고 있습니다.
		#LOC_KS_SciDef_dmMagScan_Sunorc_InSpaceLow = 붐이 구조적 완전성을 유지하는 데 어려움을 겪는 것 같습니다. 현재 액체로 변하고 있기 때문입니다.
		#LOC_KS_SciDef_dmMagScan_Tot_SrfLanded = Suluco 외에는 여전히 이렇다 할 자기 활동이 없습니다.
		#LOC_KS_SciDef_dmMagScan_Uleg_InSpaceHigh = 이 고도에서는 자기장이 감지되지 않습니다. 극단적인 궤도 때문에 상당한 조석력을 받을 텐데도 이렇다면, Uleg에는 철-니켈 핵이 없을 가능성이 높습니다.
		#LOC_KS_SciDef_dmMagScan_Uleg_SrfLanded = 지표에서도 Uleg의 자기장은 거의 없다시피 할 만큼 약합니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Ahtpan_SrfLanded = 육지에서도 센서가 수소 매장물을 다량 감지합니다. 땅조차 수소가 풍부합니다!
		#LOC_KS_SciDef_dmNAlbedoScan_Ahtpan_SrfSplashed = 매우 강한 수소 신호가 우리의 가장 큰 희망을 확인해 줍니다. Ahtpan의 지표는 나프타 대양으로 덮여 있습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Anneheg_SrfLanded = 지표 수소 수치는 틀림없이 터무니없이 강한 태양풍이 지표에 수소를 쌓아 놓은 결과일 뿐입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Arorua_SrfLanded = 두꺼운 대기에도 불구하고 Aralc-B 때문에 배경 중성자 수치가 상당히 높아, 정확한 측정이 어렵습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Dipuc_SrfLanded = 중성자 스캔에 따르면 Dipuc의 지표는 수소가 상당히 부족한 것으로 보입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Dipuc_SrfLandedPoles = 이곳에서 미량의 수소가 감지됩니다. 아마도 지하의 소량의 물 얼음에서 비롯된 것으로 보입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Efil_SrfLandedArcticBiomes = 얼음과 눈에 얼어붙은 극지의 토양은 신선한 식수를 원하는 이들에게 기꺼이 그것을 내어줍니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Efil_SrfLandedBeach = 직접 이곳에 와서 즐길 수 있었다면 젖은 모래가 발가락에 달라붙었을 것입니다. 수소 함량은 카메라 영상만 봐도 뻔한 사실을 알려 줍니다. 이 해변에는 생명을 주는 수정처럼 맑은 물이 주기적으로 밀려듭니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Efil_SrfLandedMountains = Efil의 산맥은 상대적으로 건조하며, 고도가 너무 높아 Efil조차 거주자들을 부양하지 못하기 때문에 생명체가 거의 없습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Efil_SrfLandedRainforestsGrassland = Efil의 축축하고 비옥한 토양에는 물 분자의 수소 원자가 풍부하며, 이것이 거대한 숲과 끝없이 펼쳐진 초원에 생명을 불어넣습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Efil_SrfLandedSnowMountains = 눈 덮인 봉우리는 멋진 경치를 선사하지만, 생명이 뿌리내리기에는 척박한 토양입니다. 물은 풍부하지만 마실 것은 하나도 없습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Efil_SrfLandedTropicalDesert = 이곳의 모래는 건조하지만, 미량의 물이 사막의 거주자들에게 꼭 필요한 해갈을 계속 제공합니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Elad_SrfLanded = 이곳에서 희미한 수소 신호가 감지되지만, 그것이 거리 때문인지 낮은 농도 때문인지 판단하기 어렵습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Elad_SrfLandedLowlands = 높은 수준의 수소가 감지되지만, 두꺼운 암석층을 통과한 탓에 신호가 약합니다. 지하 깊은 곳에 액체 대양이 존재한다는 증거일 수도 있습니다!
		#LOC_KS_SciDef_dmNAlbedoScan_Enots_SrfLanded = 약한 수소 신호는 이 작은 위성이 쓸어 담은 Anehta's 외기권의 잔해로 설명할 수 있습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Eulb_SrfLanded = 스캔 결과 Eulb에서는 유의미한 양의 지하 수소가 발견되지 않았습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Eulb_SrfLandedPolarCrater = 이곳에서 상당히 강한 수소 신호가 감지됩니다. 극지 크레이터의 대부분이 영구적인 그늘에 놓여 있기 때문일 것입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Eulb_SrfLandedPoles = 이곳의 낮은 수소 수치는 흩어져 있는 얼음 퇴적물로 설명할 수 있습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Iomena_SrfLanded = Iomena's 표면은 전체가 수소로 포화되어 있습니다. 하지만 그 대부분은 물이 아닐 가능성이 높습니다. 암모니아와 일부 유기 화합물일 가능성이 더 큽니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Mehtna_SrfLandedIce = 이곳의 얼어붙은 표면은 강한 저에너지 중성자 신호를 내며, 이는 물 얼음임을 확인해 줍니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Mehtna_SrfLandedRock = 다소 의외로, Mehtna의 어두운 지역에는 물 퇴적물이 거의 없습니다. 이 정도의 온도와 압력에서는 물이 액체가 되지 않고 곧바로 기체로 승화하기 때문일 것입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Meiuqer_SrfLanded = 있잖습니까, 우주 임무 감독관에 지원했을 때는 폭발을 실컷 구경할 줄 알았습니다. 하루 종일 지루한 원격 측정 데이터나 쳐다볼 줄은 몰랐습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Noi_SrfLanded = 주변 중성자가 거의 없는 이토록 고요한 환경에서는 고정밀 측정이 가능합니다. Sunorc와의 거리에 비해 Noi에는 얼음이 매우 부족합니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Noira_SrfLanded = Noira 전역에서 지하 수소가 감지됩니다. 물 퇴적물의 증거일 가능성이 높습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Norihc_SrfLanded = 이 지역의 수소 신호는 두꺼운 얼음 극관이 있음을 확인해 주는 것으로 보이며, 그 아래 깊은 곳에 액체 상태의 바다가 있을 가능성도 있습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Noyreg_SrfLanded = Noyreg의 표면은 수소가 풍부한 것으로 보입니다. 하지만 이 정도의 온도와 압력에서는 물이 아니라 장쇄 탄화수소일 가능성이 가장 높습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Onrefni_SrfLanded = 사방으로 날아다니는 중성자 때문에 정확한 측정값을 얻기 어렵지만, Onrefni의 표면은 수소 원자로 뒤덮여 있습니다. 이것은 분명 물이 아니며, 강렬한 '홀라 바람'과 강착 원반과의 직접 접촉으로 생긴 퇴적물입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Rouqea_SrfLanded = 안타깝게도 장비가 터무니없는 수압에 찌그러진 것 같습니다. Rouqea에 물이 있는지는 영영 알 수 없을지도 모릅니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Rouqea_SrfSplashed = ...네, 물입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Sera_SrfLandedLakes = 고에너지 중성자가 뚜렷한 반응을 보이며, 온도와 압력을 고려할 때 이 액체는 물임이 틀림없습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Sera_SrfLandedLowlandsIslands = 이곳의 토양은 축축하여 지하 물 퇴적물을 나타내는 신호가 꾸준히 감지됩니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Sera_SrfLandedRock = 이곳의 암석은 꽤 건조하며, 장비는 지표 아래에서 미량의 수소만 감지합니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Suluco_SrfLandedDay = 이곳에는 지하 수소가 사실상 존재하지 않습니다. 영구적인 그늘이 진 곳에만 극미량이 있을 뿐입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Suluco_SrfLandedDayPole = 항성 직하점의 표면은 뼈처럼 메마른 정도가 아닙니다. 뼈에는 물이 조금이라도 있으니까요. 이곳의 수소는 끊임없는 태양풍이 남긴 미량뿐인 것으로 보입니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Suluco_SrfLandedDesert = 이 지역에는 수소가 약간 있어 지표 바로 아래에 물이 묻혀 있음을 알 수 있습니다. 건조하지만 생존은 가능합니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Suluco_SrfLandedNight = 수소 스캔에 따르면... 아니, 육안 스캔에 따르면, 밤 쪽의 모든 표면은 단단한 얼음으로 덮여 있습니다. 빛 없는 황무지에서는 얼어붙은 눈이 모래처럼 날리고 흘러갑니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Suluco_SrfLandedTwilight = 황혼 지대의 토양에서는 매우 높은 농도의 수소가 발견되며, 물론 대부분은 물입니다. 이 행성의 액체 상태 물은 대부분 이곳에 있습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Suluco_SrfLandedWater = 이곳의 극도로 젖은 표면에는 당연히 수소가 잔뜩 들어 있으며, 대부분의 중성자를 흡수합니다. 혹시 바다를 오염시키고 있는 건 아닌지 걱정됩니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Tot_SrfLanded = 이곳의 표면 스캔에서는 특별한 것이 감지되지 않습니다.
		#LOC_KS_SciDef_dmNAlbedoScan_Uleg_SrfLanded = 선명한 저에너지 중성자 신호는 Uleg's 표면 대부분이 물 얼음으로 이루어져 있음을 확인해 줍니다. 꽁꽁 얼었습니다!
		#LOC_KS_SciDef_dmRadiometerScan_Ahtpan_InSpaceHigh = Ahtpan의 대기는 자외선과 단파 적외선을 많이 흡수하며, 이는 대기 대부분이 이산화탄소일 가능성이 높음을 나타냅니다. 표면의 반사율이 꽤 높아 온실 효과를 어느 정도 상쇄해 줍니다.
		#LOC_KS_SciDef_dmRadiometerScan_Anehta_InSpaceHigh = Anehta는 아름다운 청백색 덕분에 반사율이 꽤 높습니다. 어두운 쪽에서도 강한 열 방출이 나타나는 것으로 보아 내부 가열이 상당합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Anneheg_InSpaceHigh = Anneheg는 표면이 극도로 어두운데도 Aralc-A와 가깝기 때문에 절대 복사 조도가 매우 높습니다.
		#LOC_KS_SciDef_dmRadiometerScan_AralcA_InSpaceHigh = Aralc-A는 대부분의 더 작고 차가운 별보다 훨씬 많은 자외선을 방출합니다. 이 항성계에 사는 생명체라면 꽤 단단히 보호받아야 할 것이고, 진화할 시간도 그리 많지 않을 것입니다. 하지만 흔히 말하듯... "Efil"은, 어, 길을 찾아냅니다.
		#LOC_KS_SciDef_dmRadiometerScan_AralcB_InSpaceHigh = 적색 왜성인 Aralc-B는 적외선을 많이 방출하며, 가시광선과 자외선 영역에서는 꽤 어둡습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Arorua_InSpaceHigh = Arorua는 두꺼운 이산화탄소 대기를 지녔음에도 두 항성에 가까이 있어 절대 복사 조도가 상당히 높습니다. 거대하게 일렁이는 오로라도 한몫하는 듯합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Dipuc_InSpaceHigh = Dipuc의 어두운 화산성 지표는 의외로 비가시광선 영역에서 반사율이 높습니다. 단, 적외선 파장은 예외입니다.
		#LOC_KS_SciDef_dmRadiometerScan_Efil_InSpaceHigh = Efil의 밝은 지표는 두꺼운 대기 때문에 아름다운 청록색으로 짙게 물들어 있습니다. 이 대기는 자외선과 근적외선 대부분을 흡수합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Elad_InSpaceHigh = Elad의 밝은 지표는 전반적으로 반사율이 꽤 높으며, 이 위성에 수수께끼처럼 대기가 없다는 점도 한몫합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Enots_InSpaceHigh = Enots는 반사율이 매우 낮지만, 분광 분석 결과 탄소의 존재는 나타나지 않습니다. 이는 검은 색이 다른 원인에서 비롯되었음을 시사합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Eulb_InSpaceHigh = Eulb는 반사율이 상당히 높습니다. 밝은 지표는 적색과 적외선을 제외한 모든 관측 파장에서 많은 빛을 반사합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Iomena_InSpaceHigh = Iomena는 대체로 회색인 지표 때문에 전체 반사율이 낮으며, 대기는 대부분의 가시광선 파장을 흡수하는데, 그 패턴은 다량의 암모니아 가스가 있음을 나타냅니다.
		#LOC_KS_SciDef_dmRadiometerScan_Kcalbeloh_InSpaceHigh = 물론 사건의 지평선 자체의 반사율은 정확히 0이지만, 강착 원반은 마치 별처럼 모든 관측 파장에서 빛을 내고 있습니다. 다만 대부분의 별보다는 상당히 어둡습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Maelg_InSpaceHigh = Maelg는 가시광선 영역에서는 비교적 적은 빛을 내지만, 적외선 영역에서는 훨씬 잘 보입니다. 어느 쪽이든 이 거리에서는 보기 어렵지 않습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Mehtna_InSpaceHigh = Mehtna의 거대한 검은 반점과 자외선 흡수 특성을 보면 지표가 물 얼음으로 덮여 있음이 확실하며, 대기 스펙트럼은 주성분이 이산화탄소와 수증기임을 시사합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Meiuqer_InSpaceHigh = Meiuqer는 어두운 지표 때문에 반사율이 매우 낮으며, Maelg에서 오는 빛이 극도로 희미하다는 점이 이를 더욱 악화시킵니다.
		#LOC_KS_SciDef_dmRadiometerScan_Noi_InSpaceHigh = 정말 어두운 소행성입니다. Noi는 거의 모든 스펙트럼에서 빛을 강하게 흡수하며, C형 소행성치고도 자외선 흡수가 많습니다. 그 결과 간신히 보일까 말까 한 천체가 되었는데, 항성에서 매우 멀리 떨어져 있어 더욱 그렇습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Noira_InSpaceHigh = Noira의 전체 반사율은 문과 상당히 비슷하지만, Sunorc에서 워낙 멀리 떨어져 있어 절대 복사 조도는 매우 낮습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Norihc_InSpaceHigh = Norihc의 얇은 대기는 빛을 많이 흡수하지 않아, 밝은 지표가 자외선을 제외한 대부분의 파장에서 많은 빛을 반사합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Noyreg_InSpaceHigh = Noyreg의 짙은 대기는 자외선과 적외선을 많이 흡수하며, 가시광선 스펙트럼도 상당 부분 흡수합니다. 초록색으로 보이는 이유가 이 때문일 수 있습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Onrefni_InSpaceHigh = Onrefni는 어두운 지표 때문에 반사율이 매우 낮아, 모든 파장에서 빛을 거의 반사하지 않습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Rouqea_InSpaceHigh = 가시광선 영역에서는 아름답지만, Rouqea의 바다로 덮인 지표는 반사율이 다소 낮으며, 짙은 대기는 가시광선 이외 파장의 빛을 대부분 흡수합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Sedah_InSpaceHigh = Sedah를 스캔하자 밤인 쪽에서도 강렬한 열 신호가 기록됩니다. 이는 분명 이 거대 행성의 터무니없이 높은 온도 때문입니다.
		#LOC_KS_SciDef_dmRadiometerScan_Sera_InSpaceHigh = Sera의 지표와 호수는 자외선은 물론 단파 적외선까지 많이 흡수하는 것으로 보이며, 이는 금속이 풍부한 지표와 이산화탄소로 가득한 대기를 시사합니다.
		#LOC_KS_SciDef_dmRadiometerScan_SimeSystem_InSpaceHigh = 두 천체를 합치면 결합 반사율이 상당히 높습니다. 특히 Simeht가 꽤 밝습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Simeht_InSpaceHigh = Simeht는 가시광선 영역에서 많은 빛을 반사하여 반사율이 높습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Simetra_InSpaceHigh = 적외선 영역에서 Simetra는 Simeht보다 상당히 많은 에너지를 방출하는데, 이는 더 높은 온도와 더 활발한 내부 가열 과정을 나타냅니다.
		#LOC_KS_SciDef_dmRadiometerScan_Suluco_InSpaceHigh = 센서가 주간 반구를 더 많이 보는지, 황혼 지대를 더 많이 보는지에 따라 반사율이 크게 달라지며, 그 정도는 대부분의 천체보다 훨씬 심합니다.
		#LOC_KS_SciDef_dmRadiometerScan_Sunorc_InSpaceHigh = Sunorc는 대부분의 관측 파장에서 많은 빛을 방출하지만, K형 항성(주황 왜성)이기 때문에 커볼 같은 G형 항성(황색 왜성)보다 청색광과 자외선을 상당히 적게 방출합니다. 온도가 더 낮기 때문에 이런 유형의 별은 황색 왜성보다 수십억 년 더 오래 살 수 있습니다.
		#LOC_KS_SciDef_dmRadiometerScan_Tot_InSpaceHigh = Tot의 지표 대부분은 어두워 가시광선과 적외선을 모두 흡수하지만, 가장 낮은 지역은 약간 더 반사율이 높습니다. 흥미롭습니다...
		#LOC_KS_SciDef_dmRadiometerScan_Uleg_InSpaceHigh = Uleg의 지표는 가시광선과 적외선 영역에서 전반적으로 반사율이 꽤 높지만, 자외선은 강하게 흡수하는 것으로 보입니다. 이는 지표에 다량의 물 얼음이 있음을 나타냅니다.
		#LOC_KS_SciDef_dmRadiometerScan_Wormholes_InSpaceHigh = 조금만 움직여도 웜홀 너머로 보이는 천체들의 초점이 흐트러지니 이 장비를 쓰기가 어렵습니다. 그냥 각오를 다지고 통과해 보는 건 어떻겠습니까?
		#LOC_KS_SciDef_dmSIGINT_Ahtpan_InSpaceLow = Ahtpan을 스캔하는 동안 무선 감시에는 잡음만 잡힙니다. 완벽합니다. 외계인의 석유 채굴 작업이 없다는 건 이 행성이 온전히 우리 차지라는 뜻입니다! 먼저 온 쪽이 임자입니다. 안 그렇습니까, 외계인 친구?
		#LOC_KS_SciDef_dmSIGINT_Anehta_InSpaceLow = Anehta는 하층 대기가 소용돌이치고 폭풍이 몰아치면서 무선 신호의 교향곡을 쏟아내며, 자기권을 뚫고 들어온 태양풍은 깊은 대기에 부딪혀 헛되이 흩어집니다.
		#LOC_KS_SciDef_dmSIGINT_Anneheg_InSpaceLow = 이곳에서는 Aralc-A의 강렬한 전파 활동만 감지됩니다.
		#LOC_KS_SciDef_dmSIGINT_AralcA_InSpaceLow = Aralc-A는 대부분의 스펙트럼에서, 특히 이 장비로는 감지할 수 없는 영역에서 엄청난 양의 복사를 방출합니다. 하지만 청색 항성이 어떤지는 다들 알지 않습니까? 이 무거운 장비를 -굳이- 여기까지 가져올 필요는 없지 않았습니까?
		#LOC_KS_SciDef_dmSIGINT_AralcB_InSpaceLow = 두 항성이 방출하는 전파가 매우 강렬해서, 거대한 접시 안테나의 구조적 안정성이 의심스러워지기 시작합니다.
		#LOC_KS_SciDef_dmSIGINT_Arorua_InSpaceLow = Arorua의 대기가 깎여 나가면서 강렬한 전파 활동이 쏟아져 나옵니다.
		#LOC_KS_SciDef_dmSIGINT_Dipuc_InSpaceLow = 놀랍게도 Dipuc은 약한 전파를 방출하는 것으로 보입니다. 원인을 밝히려면 장기간의 연구가 필요할 것입니다.
		#LOC_KS_SciDef_dmSIGINT_EfilHome_InSpaceLow = Efil의 대기는 자기의 노래를 부르며- 잠깐, 잠깐만요, 미사여구는 집어치웁시다. 최신 헤드볼 경기 중계가 들립니다. 듣고 싶습니다!
		#LOC_KS_SciDef_dmSIGINT_Efil_InSpaceLow = Efil 대기의 전파 활동은 Anehta의 자기권과의 상호작용을 들려주지만, 이 노래를 부르는 이는 아무도 없습니다. 즉- 지적 생명체의 흔적은 없습니다.
		#LOC_KS_SciDef_dmSIGINT_Elad_InSpaceLow = Elad에 무언가가- 혹은 누군가가- 살았던 적이 있더라도, 지금은 완전히 무선 침묵 상태입니다.
		#LOC_KS_SciDef_dmSIGINT_Enots_InSpaceLow = 이곳에서 잡히는 전파 신호는 Anehta에서 오는 것뿐입니다.
		#LOC_KS_SciDef_dmSIGINT_Eulb_InSpaceLow = 여러 차례 전파 감시를 수행했지만 Eulb에서는 흥미로운 것이 발견되지 않았습니다.
		#LOC_KS_SciDef_dmSIGINT_Iomena_InSpaceLow = Kcalbeloh의 '홀라 풍'을 제외하면, 이곳의 전파 활동은 그것과 Iomena의 희박한 대기 사이의 상호작용으로 생겨나는 것뿐입니다.
		#LOC_KS_SciDef_dmSIGINT_Kcalbeloh_InSpaceLowNorthernHemisphere = 원격 측정 자료를 살펴보던 중... 밴조 연주 소리가 들립니다? 이어서 하모니카, 휘파람 소리, 드럼, 플루트, 피아노가 들려옵니다. 감상적인, 아니 향수를 불러일으키는 소리입니다. 그러다 잠에서 깨어나고, 노래는 사라졌습니다. 모두 꿈이었을까요?
		#LOC_KS_SciDef_dmSIGINT_Kcalbeloh_InSpaceLowSouthernHemisphere = Kcalbeloh의 강착 원반은 끊임없이 강렬한 전파를 방출하지만, 이 장비는 Kerman 복사를 감지할 만큼 민감하지 않습니다.
		#LOC_KS_SciDef_dmSIGINT_Maelg_InSpaceLow = Maelg의 내부가 격렬하게 요동치고 흐르면서, 그야말로 폭발적인 전파가 항상 방출되고 있습니다.
		#LOC_KS_SciDef_dmSIGINT_Mehtna_InSpaceLow = 흠... 아쉽게도 Mehtna에서는 무선 침묵 외에 아무것도 들리지 않습니다.
		#LOC_KS_SciDef_dmSIGINT_Meiuqer_InSpaceLow = 바위는 전파 신호를 내지 않습니다, 바보 같으니.
		#LOC_KS_SciDef_dmSIGINT_Noi_InSpaceLow = 두-두두-두-두우우... 어, 아무것도 없습니다. 이곳에는 전파 활동이 없습니다.
		#LOC_KS_SciDef_dmSIGINT_Noira_InSpaceLow = Noira를 전파로 감시해 보았지만 흥미로운 것은 없고, 쌍둥이 행성에서 반사된 신호만 잡힙니다.
		#LOC_KS_SciDef_dmSIGINT_Norihc_InSpaceLow = Simetra와 Simeht가 만들어내는 잡음을 제외하면, Norihc 궤도의 전파 활동은 조용합니다.
		#LOC_KS_SciDef_dmSIGINT_Noyreg_InSpaceLow = Noyreg의 두꺼운 대기는 Simetra와 Simeht의 자기권으로부터 에너지를 받아 규칙적인 전파 신호를 만들어냅니다.
		#LOC_KS_SciDef_dmSIGINT_Onrefni_InSpaceLow = Onrefni는 전파 환경을 전혀 바꾸지 않은 것으로 보입니다. 강착 원반에서 오는 끊임없는 활동이 이곳에서도 그대로입니다.
		#LOC_KS_SciDef_dmSIGINT_RouqeaHome_InSpaceLow = 안타깝게도 이 고도에서는 최신 헤드볼 경기 중계가 너무 지직거려서 즐길 수가 없습니다. 우주까지 닿으려면 그 많은 물과 대기를 통과해야 하니 말입니다.
		#LOC_KS_SciDef_dmSIGINT_Rouqea_InSpaceLow = Rouqea의 격렬한 대기와 대양이 흥미로운 전파 활동을 많이 만들어내지만, 저 아래에 지적 존재가 있다는 징후는 없습니다.
		#LOC_KS_SciDef_dmSIGINT_Sedah_InSpaceLow = Sedah의 전파 방출은 매우 다양하고 엄청나게 강력합니다. 아마도 태양풍과 행성 내부 활동 사이의 복잡한 상호작용 때문일 것입니다.
		#LOC_KS_SciDef_dmSIGINT_Sera_InSpaceLow = Sunorc의 태양풍과 Sera의 대기 사이의 상호작용으로 복잡하지만 전형적인 전파 패턴이 생성됩니다.
		#LOC_KS_SciDef_dmSIGINT_SimBoth_InSpaceLow = 두 거대 행성의 자기장이 상호작용하며 강력한 전파를 만들어내, 전파 잡음의 불협화음을 이룹니다.
		#LOC_KS_SciDef_dmSIGINT_SulucoHome_InSpaceLow = 전파 탐색으로 여러 지표 정착지와 구조물에서 나오는 산발적인 송신이 잡힙니다. 일부 소규모 전초기지는 낮 반구와 밤 반구 깊숙이 자리 잡고 있기도 합니다. 커벌들이 이곳에 온 지 그리 오래되지는 않았지만, 그동안 벌써 Suluco를 고향처럼 만들어 가기 시작했습니다. 주파수만 잘 맞추면 최신 헤드볼 경기도 들을 수 있습니다!
		#LOC_KS_SciDef_dmSIGINT_Suluco_InSpaceLow = 태양풍이 약간 흥미로운 전파 활동을 만들어내지만, 특별히 이상한 점은 없습니다.
		#LOC_KS_SciDef_dmSIGINT_Sunorc_InSpaceLow = 대부분의 항성처럼 Sunorc도 넓은 스펙트럼에 걸쳐 전파를 방출합니다. 전파 활동의 급증은 흑점의 형성 및 이동과 연관된 것으로 보입니다.
		#LOC_KS_SciDef_dmSIGINT_Tot_InSpaceLow = 죄송합니다. 이곳에는 흥미로운 것이 없습니다.
		#LOC_KS_SciDef_dmSIGINT_Uleg_InSpaceLow = Uleg의 희박하고 고요한 대기와 Kcalbeloh로부터의 먼 거리 때문에 전파 환경이 상당히 따분합니다.
		#LOC_KS_SciDef_dmSIGINT_WH3141A_InSpaceLow = 그 물체에서 이상한 전파 송신이 나오는 것 같습니다. 신호를 모니터링하던 중, 누군가 "안녕!"과 "안전 비행하세요"라고 말하는 소리를 분명히 들은 것 같습니다. 고맙습니다, 정체불명의 우주 목소리여. 우리는 -꼭- 안전하게 비행하겠습니다!
		#LOC_KS_SciDef_dmSIGINT_WH3141B_InSpaceLow = 웜홀에서 나오는 전파 활동을 모니터링하자, 커빈에서 보낸 송신의 일그러진 메아리가 잡힙니다.
		#LOC_KS_SciDef_dmSoilMoisture_Ahtpan_InSpaceLow = Ahtpan에서 나오는 마이크로파 방출이 매우 약합니다. 이는 표면의 물질이 물이 아님을 나타냅니다.
		#LOC_KS_SciDef_dmSoilMoisture_Anehta_InSpaceLow = 강한 마이크로파 신호가 수신됩니다. Anehta의 대기에 수증기가 풍부하다는 징후입니다.
		#LOC_KS_SciDef_dmSoilMoisture_Anneheg_InSpaceLow = Aralc-A에 이렇게 가까우면 안테나가 거의 작동하지 못하지만, 어차피 행성에서 오는 것은 아무것도 감지되지 않습니다.
		#LOC_KS_SciDef_dmSoilMoisture_AralcA_InSpaceLow = 이 항성보다 안테나가 오히려 훨씬 더 물에 가까운 모습이 되어 가고 있습니다.
		#LOC_KS_SciDef_dmSoilMoisture_AralcB_InSpaceLow = 장치가 열을 견디지 못하고, 그 화학적 구성을 이루는 첨단 고분자가 분해되기 시작했습니다. 다시 말해, 우주 물 찾는 거시기가 고장 났습니다.
		#LOC_KS_SciDef_dmSoilMoisture_Arorua_InSpaceLow = 감지되는 마이크로파 신호는 Aralc-B와 Aralc-A에서 오는 것뿐입니다.
		#LOC_KS_SciDef_dmSoilMoisture_Dipuc_InSpaceLow = 극지방에서는 약한 마이크로파 방출이 감지되지만, 다른 곳에서는 감지되지 않습니다. 예상대로 Dipuc은 꽤 건조합니다.
		#LOC_KS_SciDef_dmSoilMoisture_EfilHome_InSpaceLow = 마이크로파 방출을 보면 Efil의 표면이 사실상 물에 흠뻑 젖어 있다는 것이 더욱 분명해집니다. 이미 알려진 사실이지만, 적어도 장비 보정에는 유용합니다- 그리고 먼 옛날 레이테가 얼마나 거짓된 낙원이었는지 다시금 떠올리게 해 줍니다.
		#LOC_KS_SciDef_dmSoilMoisture_Efil_InSpaceLow = 마이크로파 방출을 보면 Efil의 지표면이 사실상 물에 흠뻑 젖어 있다는 것이 더욱 분명해집니다. 쓸데없는 일처럼 보일 수도 있지만, 얼어붙은 가짜 낙원으로 드러난 레이테를 결코 잊어서는 안 됩니다. 그러니 확인해 보는 것이 현명합니다.
		#LOC_KS_SciDef_dmSoilMoisture_Elad_InSpaceLow = Elad의 가장 낮은 지역 상공을 공전하면 일관되게 강한 마이크로파 신호가 잡히며, 이는 지하에 액체 상태의 물로 이루어진 바다가 존재함을 강하게 시사합니다. Elad에 한때 생명체가 있었다면, 아직도 그 아래에서 살고 있을 가능성이 충분합니다!
		#LOC_KS_SciDef_dmSoilMoisture_Enots_InSpaceLow = Enots에서는 마이크로파 방출이 전혀 감지되지 않으므로, 지표면이나 그 아래에 물 얼음이 존재할 가능성은 배제됩니다.
		#LOC_KS_SciDef_dmSoilMoisture_Eulb_InSpaceLow = 약한 마이크로파 신호가 감지되지만, 안테나를 극지방으로 향했을 때만 잡힙니다.
		#LOC_KS_SciDef_dmSoilMoisture_Iomena_InSpaceLow = 낮은 마이크로파 방출은 Iomena의 지표면이 물이 아닌 암모니아로 덮여 있다는 가설을 뒷받침합니다.
		#LOC_KS_SciDef_dmSoilMoisture_Kcalbeloh_InSpaceLow = 좋습니다. 블랙홀 탐사 임무에 마이크로파 방출로 물을 탐지하는 센서를 넣은 개그맨이 누구입니까? 이름을 대십시오!
		#LOC_KS_SciDef_dmSoilMoisture_Maelg_InSpaceLow = 강력한 마이크로파 방출이 감지되지만, 이것이 물 매장층에서 나왔을 리는 없습니다. Maelg는 갈색 왜성이니까요. 혹시 잊으셨을까 봐 말씀드립니다. 행성도, 항성도 아닙니다.
		#LOC_KS_SciDef_dmSoilMoisture_Mehtna_InSpaceLow = 마이크로파 방출을 보면 Mehtna의 상당 부분이 물 얼음으로 덮여 있음이 분명합니다. 다만 태양을 향한(왜성을 향한?) 건조한 지역 상공에서도 일정한 배경 신호가 남아 있습니다. 대기 중의 수증기로 깔끔하게 설명할 수 있을 것입니다.
		#LOC_KS_SciDef_dmSoilMoisture_Meiuqer_InSpaceLow = 마이크로파 측정값이 없습니다. 우주 센터의 전자레인지에서 나오는 값만 빼면 말입니다. 데이터를 모니터링하던 인턴이 매운 라면을 데우고 있습니다.
		#LOC_KS_SciDef_dmSoilMoisture_Noi_InSpaceLow = 매우 약한 마이크로파 방출만 감지되는 것으로 보아, Noi는 Sunorc에서 이렇게 멀리 떨어진 소행성치고는 놀라울 정도로 건조합니다. 더 안쪽에서 형성된 뒤 외곽 항성계로 튕겨 나가 결국 이곳에 자리 잡았을 가능성이 있습니다.
		#LOC_KS_SciDef_dmSoilMoisture_Noira_InSpaceLow = 측정 결과, 이 작은 위성의 지표면 아래에 대량의 물 얼음이 묻혀 있는 것으로 나타났습니다. 이는 Noira에 지하 바다가 있을 수도 있다는 뜻입니다!
		#LOC_KS_SciDef_dmSoilMoisture_Norihc_InSpaceLow = Norihc 전역에 물이 꽤 흔하며, 측정값이 가장 약한 저지대에서도 마찬가지입니다. 지표면 아래에 액체 상태의 바다가 있더라도 이 장비로는 구별할 수 없습니다.
		#LOC_KS_SciDef_dmSoilMoisture_Noyreg_InSpaceLow = Noyreg에서는 마이크로파 방출이 거의 감지되지 않으며, 이는 물이 거의 또는 전혀 없다는 뜻으로 보입니다.
		#LOC_KS_SciDef_dmSoilMoisture_Onrefni_InSpaceLow = 음... 네. 네, 이 블래닛에는 분명히 지하 물 매장층이 있습니다. 그렇고 말고요...
		#LOC_KS_SciDef_dmSoilMoisture_Rouqea_InSpaceLow = 물이요? 있습니다!
		#LOC_KS_SciDef_dmSoilMoisture_Sedah_InSpaceLow = Sedah 궤도에서 감지되는 강한 마이크로파 방출은 틀림없이 행성 내부의 작용으로 생성되는 것입니다.
		#LOC_KS_SciDef_dmSoilMoisture_Sera_InSpaceLow = 호수 상공에서 감지되는 강한 마이크로파 방출은 Sera에 물이 비교적 풍부하다는 꽤 확실한 증거입니다.
		#LOC_KS_SciDef_dmSoilMoisture_Simeht_InSpaceLow = 강력한 마이크로파 방출은 Simeht 깊숙한 곳에 대량의 물 얼음이 존재함을 나타냅니다.
		#LOC_KS_SciDef_dmSoilMoisture_Simetra_InSpaceLow = Simetra의 마이크로파 방출은 내부가 물 얼음으로 가득 차 있음을 나타냅니다.
		#LOC_KS_SciDef_dmSoilMoisture_Suluco_InSpaceLow = L-밴드 마이크로파 방출은 Suluco 지표면 대부분에서 상당히 일정하지만, 안테나가 주간 반구 위를 지나갈 때는 측정값이 서서히 떨어져 항성 직하점 상공에서는 사실상 0이 됩니다.
		#LOC_KS_SciDef_dmSoilMoisture_Sunorc_InSpaceLow = 마이크로파 방출을 감지하는 민감한 장비를 저궤도 항성 공전 중에 전개하지 않는 편이 좋을지도 모릅니다. 아마도요. 혹시나 해서 말씀드립니다.
		#LOC_KS_SciDef_dmSoilMoisture_Tot_InSpaceLow = 실험 결과는... 안타깝게도 설명하기엔 너무 지루합니다.
		#LOC_KS_SciDef_dmSoilMoisture_Uleg_InSpaceLow = 마이크로파 방출에 따르면 Uleg는 주로 물로 이루어져 있으며, 아래에 Uleg의 어느 지역이 있든 방출은 매우 강합니다.
		#LOC_KS_SciDef_dmSoilMoisture_Wormholes_InSpaceLow = 웜홀에서 마이크로파 복사가 일정하지만 낮은 비율로 방출되고 있습니다. 웜홀 자체가 원인일까요, 아니면 반대편의 무언가가 만들어내는 것일까요?
		#LOC_KS_SciDef_dmSolarParticles_Ahtpan_InSpaceHigh = Ahtpan은 Aralc-A로부터 꽤 강하게 두들겨 맞고 있지만, 이곳의 태양풍은 행성 간 공간보다 약간 약합니다. 이는 적당히 강한 자기장이 존재함을 시사합니다.
		#LOC_KS_SciDef_dmSolarParticles_Ahtpan_InSpaceLow = 이곳은 태양풍이 조금 더 희박하며, 장비에 미량의 이산화탄소와 탄화수소가 포착됩니다.
		#LOC_KS_SciDef_dmSolarParticles_Anehta_InSpaceHigh = Anehta 근처의 태양풍은 커빈과 비슷한 세기이지만, 기체가 이 거대 행성의 강력한 자기권 깊숙이 들어갈수록 빠르게 약해집니다.
		#LOC_KS_SciDef_dmSolarParticles_Anehta_InSpaceLow = Anehta가 태양풍을 막아 주기 때문에, 수집기에는 주로 수소, 헬륨, 물 분자가 포착됩니다.
		#LOC_KS_SciDef_dmSolarParticles_Anneheg_InSpaceHigh = 이 고도에서는 Aralc-A의 극심한 태양풍만 수집됩니다.
		#LOC_KS_SciDef_dmSolarParticles_Anneheg_InSpaceLow = 수집기에 포착되는 암석과 금속으로 판단하건대, Anneheg는 질량을 잃고 있는 것으로 보입니다. 특히 황혼 지대 경계를 지날 때 두드러집니다.
		#LOC_KS_SciDef_dmSolarParticles_AralcA_InSpaceHigh = Aralc-A의 태양풍은 이 장비가 원래 감당하도록 설계된 수준보다 훨씬 강력하지만, 장비는 감탄스러울 만큼 잘 버티고 있습니다.
		#LOC_KS_SciDef_dmSolarParticles_AralcA_InSpaceLow = 글쎄요, 한 가지는 확실합니다. 이제 보증은 확실히 무효입니다.
		#LOC_KS_SciDef_dmSolarParticles_AralcB_InSpaceHigh = 이 거리에서는 Aralc-B에서 오는 태양풍이 Aralc-A의 태양풍과 거의 비슷한 세기입니다.
		#LOC_KS_SciDef_dmSolarParticles_AralcB_InSpaceLow = 민감한 웨이퍼가 극심한 열로 인해 빠르게 손상되기 시작했습니다.
		#LOC_KS_SciDef_dmSolarParticles_Arorua_InSpaceHigh = Arorua 근처 공간은 태양풍으로 가득 차 있어, 우주선까지 날려 버릴 기세입니다!
		#LOC_KS_SciDef_dmSolarParticles_Arorua_InSpaceLow = Arorua 저궤도에서는 비교적 높은 농도의 이산화탄소 분자가 포착되는데, 아마 깎여 나가고 있는 대기에서 나온 것으로 보입니다.
		#LOC_KS_SciDef_dmSolarParticles_Dipuc_InSpaceHigh = Dipuc 상공 높은 곳에서는 수집기가 수집할 수 있는 것이 태양풍뿐입니다.
		#LOC_KS_SciDef_dmSolarParticles_Dipuc_InSpaceLow = 태양 입자 수집기에 미량의 황과 각종 중금속이 포착됩니다. 수많은 분출로 우주로 솟구친 뒤 Sera의 중력에 의해 궤도에 오른 것으로 보입니다.
		#LOC_KS_SciDef_dmSolarParticles_Efil_InSpaceHigh = 웨이퍼에 무거운 원소들이 쌓였습니다. 이는 Efil에도 일종의 반 커먼 대가 있다는 증거로, 마치 그 위에 사는 생명체를 가둬 두려는 것처럼 보입니다. Efil은 생각했던 것만큼 친절한 주인이 아닐지도 모릅니다.
		#LOC_KS_SciDef_dmSolarParticles_Efil_InSpaceLow = Efil 대기의 가장 바깥층을 스치듯 지나며, 장비가 태양풍과 함께 물 분자를 수집합니다. Efil이 보이는 그대로 열대 휴양지라는 확실한 증거입니다.
		#LOC_KS_SciDef_dmSolarParticles_Elad_InSpaceHigh = Elad는 이 고도에서도 태양풍을 훌륭하게 막아 내고 있지만, 수집된 하전 입자들의 양상으로 보아 반 커먼 방사선대가 존재하는 것으로 보입니다.
		#LOC_KS_SciDef_dmSolarParticles_Elad_InSpaceLow = Elad 저궤도에서 센서가 미량의 질소를 감지합니다. 한때 두꺼웠던 대기의 마지막 흔적일지도 모릅니다.
		#LOC_KS_SciDef_dmSolarParticles_Enots_InSpace = 수집기가 Anehta의 고리에서 엄청난 양의 입자를 수집합니다. 주로 규산염 광물과 산화알루미늄으로 이루어져 있으며, 청색 강옥일 가능성이 있습니다.
		#LOC_KS_SciDef_dmSolarParticles_Eulb_InSpace = Eulb의 약한 자기장은 태양풍을 거의 막아 내지 못하지만, 어차피 Anehta가 대신 많은 일을 해 주고 있습니다.
		#LOC_KS_SciDef_dmSolarParticles_Iomena_InSpaceHigh = Kcalbeloh에서 불어오는 '홀라풍'은 이 거리에서 이미 상당히 약해졌습니다. 거대한 크기에도 불구하고 대부분의 항성만큼 많은 양을 방출하지는 않기 때문입니다.
		#LOC_KS_SciDef_dmSolarParticles_Iomena_InSpaceLow = 수집기에 미량의 암모니아가 박혀 있지만, 그 외에는 별다른 것이 없습니다. '홀라풍'조차 사라졌습니다.
		#LOC_KS_SciDef_dmSolarParticles_Kcalbeloh_InSpaceHigh = 강착 원반의 '홀라풍'이 수집기에 이온화된 입자를 남깁니다. 그러나 여러 다른 방향에서 온 아주 희미한 흔적도 있으며, 이는 Kcalbeloh 항성계에서 가장 무거운 항성들에서 비롯된 것으로 보입니다.
		#LOC_KS_SciDef_dmSolarParticles_Kcalbeloh_InSpaceLow = 고에너지 입자가 능동 이온 농축기를 완전히 태워 버리고 수동 수집기의 민감한 웨이퍼를 파괴합니다. 아주 잘하셨습니다, 천재 양반.
		#LOC_KS_SciDef_dmSolarParticles_Maelg_InSpaceHigh = L형 갈색 왜성인 Maelg의 중수소·리튬 핵융합은 감지할 수 있는 태양풍을 만들어 내지 않으며, 수집기는 텅 빈 상태로 남아 있습니다.
		#LOC_KS_SciDef_dmSolarParticles_Maelg_InSpaceLow = 수집기에 여러 헬륨 동위원소가 쌓였지만, 진짜 항성에서 얻을 수 있는 양에는 한참 못 미칩니다.
		#LOC_KS_SciDef_dmSolarParticles_Mehtna_InSpace = Mehtna 근처의 우주는 Maelg 궤도에서와 마찬가지로 매우 텅 비어 있습니다. 하지만 행성 근처에서는 미량의 이산화탄소가 발견됩니다.
		#LOC_KS_SciDef_dmSolarParticles_Meiuqer_InSpace = 잠시 동안, 태양 입자 수집기가 코를 고는 소리를 들은 것 같았습니다.
		#LOC_KS_SciDef_dmSolarParticles_Noi_InSpace = Noi 부근은 행성간 우주와 비교해 사실상 달라진 것이 없습니다.
		#LOC_KS_SciDef_dmSolarParticles_Noira_InSpace = Noira 근처의 미량 입자들은 Simetra-Simeht 항성계의 다른 곳과 거의 같아 보입니다.
		#LOC_KS_SciDef_dmSolarParticles_Norihc_InSpace = Norihc 궤도에서 미량의 질소가 발견되지만, 그 외에는 우주가 평소보다 더 텅 비어 있습니다.
		#LOC_KS_SciDef_dmSolarParticles_Noyreg_InSpace = Noyreg 근처의 우주에는 미량의 이산화탄소가 있으며, 아마도 이 위성의 짙은 대기에서 비롯된 것으로 보입니다.
		#LOC_KS_SciDef_dmSolarParticles_Onrefni_InSpace = 고에너지 입자는 Onrefni 근처에 있지 않았을 때와 마찬가지로 수집기에 위험한 것으로 드러났습니다.
		#LOC_KS_SciDef_dmSolarParticles_Rouqea_InSpaceHigh = 이 고도에서는 Kcalbeloh의 '홀라풍'이 전부인 것 같습니다. 반 커먼 방사선대의 흔적은 전혀 감지되지 않습니다.
		#LOC_KS_SciDef_dmSolarParticles_Rouqea_InSpaceLow = Rouqea 근처에서 수집기는 질소와 산소뿐 아니라 수증기도 수집합니다. 하지만 Kcalbeloh의 블랙홀풍은 여전히 강합니다.
		#LOC_KS_SciDef_dmSolarParticles_Sedah_InSpaceHigh = 이곳에서는 태양풍 외에 감지되는 것이 별로 없지만, 일반 수소와 헬륨의 미세한 흔적이 있으며 Sedah 뒤편을 공전할 때 더 많아집니다.
		#LOC_KS_SciDef_dmSolarParticles_Sedah_InSpaceLow = 밤 쪽에서는 Sedah의 거대한 외기권을 통과하며 공전할 때 수소와 헬륨 미량 입자가 감지됩니다. 낮 쪽에서는 수집기가 태양풍의 하전 입자 세례를 받습니다.
		#LOC_KS_SciDef_dmSolarParticles_Sera_InSpaceHigh = 이 거리에서는 태양풍이 꽤 약해졌지만, 이온 농축기와 웨이퍼로 상당한 양의 태양 입자를 여전히 쉽게 모을 수 있습니다.
		#LOC_KS_SciDef_dmSolarParticles_Sera_InSpaceLow = 다량의 하전 입자와 함께 미량의 이산화탄소, 질소, 심지어 일부 중금속까지 수집기에 박힙니다. 이는 반 커먼 대의 꽤 명확한 증거이지만, 다른 입자들은 Sera의 대기에서 온 것이 틀림없습니다.
		#LOC_KS_SciDef_dmSolarParticles_SimeBoth_InSpace = Simetra와 Simeht가 서로 춤추듯 맴도는 동안, 수집기가 미량의 수소, 헬륨, 메탄을 수집합니다.
		#LOC_KS_SciDef_dmSolarParticles_SimeSystem_InSpaceHigh = 이곳에서는 태양풍 입자가 상당히 희박하며, 수집기는 미량의 질소, 이산화탄소, 이산화염소만 수집합니다.
		#LOC_KS_SciDef_dmSolarParticles_Suluco_InSpaceHigh = Suluco의 약한 자기장은 태양풍이 웨이퍼에 부딪히는 것을 거의 막지 못합니다. 이곳의 환경은 행성간 우주와 크게 다르지 않습니다.
		#LOC_KS_SciDef_dmSolarParticles_Suluco_InSpaceLow = 다소 약해진 태양풍과 더불어, Suluco 대기의 질소와 산소 입자도 웨이퍼에 박힙니다.
		#LOC_KS_SciDef_dmSolarParticles_Sunorc_InSpaceHigh = Sunorc의 태양풍은 항성으로서 전형적인 수준이지만, 커볼 같은 G형 항성보다는 조금 약합니다.
		#LOC_KS_SciDef_dmSolarParticles_Sunorc_InSpaceLow = 압도적인 태양풍 밀도 때문에 장치가 강제로 종료되어 유용한 데이터를 전혀 수집하지 못했습니다. 손상되지 않았기를 바랍니다.
		#LOC_KS_SciDef_dmSolarParticles_Tot_InSpace = 이곳의 태양풍 성분은 Suluco 궤도에서와 다를 바 없습니다.
		#LOC_KS_SciDef_dmSolarParticles_Uleg_InSpace = Kcalbeloh에서 이렇게 멀리 떨어진 곳에서는 '홀라풍'이 매우 희박하며, Uleg가 궤도의 높은 지점에 있을 때는 더욱 희박해집니다. 따라서 수집기가 처리할 것은 아마도 Uleg의 대기에서 온 미량의 질소 입자 외에는 별로 없습니다.
		#LOC_KS_SciDef_dmSolarParticles_WH3141A_InSpace = 이 위치에서 수집기가 놀라울 만큼 많은 태양풍을 수집합니다. 아마도 웜홀 반대편에서 오는 것으로 보입니다.
		#LOC_KS_SciDef_dmSolarParticles_WH3141B_InSpace = 이곳의 태양풍은 커볼과 Sunorc의 바람이 섞인 것이지만, Sunorc 쪽의 측정값이 훨씬 더 안정적입니다.
		#LOC_KS_SciDef_dmbathymetryscan_Ahtpan_SrfSplashedDeep = 아무것도 안 보입니다, 선장님!
		#LOC_KS_SciDef_dmbathymetryscan_Ahtpan_SrfSplashedShallow = 짙은 기름 속이라 카메라로는 사실상 아무것도 보이지 않지만, 화학 분석 결과 일종의 나프타로 확인되었습니다.
		#LOC_KS_SciDef_dmbathymetryscan_Anneheg_SrfSplashedDeep = 화염 저항 물약이 있다면 이 아래를 훨씬 선명하게 볼 수 있을 것입니다.
		#LOC_KS_SciDef_dmbathymetryscan_Anneheg_SrfSplashedShallow = 흠. 이거 이상합니다. 아직 녹지 않은 것 같습니다.
		#LOC_KS_SciDef_dmbathymetryscan_Efil_SrfSplashedWaterDeep = Efil의 어두운 심해는 전혀 어둡지 않습니다. 빛나는 해양 생물들이 수평선 끝까지 곳곳에 흩어져 있어, 마치 외계의 바다를 헤엄치는 별들처럼 보입니다.
		#LOC_KS_SciDef_dmbathymetryscan_Efil_SrfSplashedWaterShallow = Efil의 따뜻한 열대 바다에는 생물 발광 동물들이 보물 창고처럼 가득 헤엄치고 있으며, 수정처럼 맑은 물 덕분에 아주 자세히 관찰할 수 있습니다.
		#LOC_KS_SciDef_dmbathymetryscan_Iomena_SrfSplashedCraterLakesDeep = 이 호수의 가장 깊은 곳에서는 행성에서 가장 깊고 따뜻한 지역에서 탄화수소가 계속 생성되고 있음이 드러납니다. 황과 인 화합물도 물속을 떠다니고 있어 다른 곳에 제한적인 화산 활동이 있음을 시사합니다. 현미경으로 자세히 살펴보니 의심이 사실로 확인되었습니다. 미생물들이 실제로 휘발성 물질을 이용해 탄화수소로 바꾸고 있습니다!
		#LOC_KS_SciDef_dmbathymetryscan_Iomena_SrfSplashedCraterLakesShallow = 암모니아 호수 위에 떠 있는 복잡한 유기 분자들은 추위와 유독한 환경에도 불구하고 Iomena에 생명체가 존재할 가능성을 시사합니다. 만약 이곳에 무언가가 산다면, 우리의 고향은 너무 덥다고 느낄 것입니다.
		#LOC_KS_SciDef_dmbathymetryscan_Iomena_SrfSplashedOceansDeep = 카메라에 열수 분출공이... 아니면... 암모니아에서는 뭐라고 부르든 간에 그런 것이 잡혔습니다. 아무튼 검은 연기를 뿜어내고 있어 현재 Iomena에 어느 정도의 화산 활동이 있음을 보여 줍니다. 진짜 발견은 암모니아 샘플에 있습니다. 새로운 탄화수소가 계속 생성되고 있으며, 현미경으로 보니 아주 작은 생물들이 연기 기둥의 성분을 대사하고 있습니다!
		#LOC_KS_SciDef_dmbathymetryscan_Iomena_SrfSplashedOceansShallow = 이 액체는 확실히 암모니아이지만, 복잡한 유기 분자도 상당한 농도로 포함되어 있습니다. 그 기원은 여러 가지일 수 있지만, 그중 하나는 분명 생물학적인 것입니다. 더 깊이 들어가 봐야 합니다!
		#LOC_KS_SciDef_dmbathymetryscan_Onrefni_SrfSplashed = "최대 온도 무시"를 끄십시오, 겁쟁이 같으니!
