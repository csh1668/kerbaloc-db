		#LOC_KS_SciDef_evaReport_Ahtpan_SrfLanded_NaphthanOceans2 = 검은 황금의 대양을 떠올리자 흥분이 차오릅니다... 그러다 이걸로 조금이라도 이익을 보려면 실제로 고향까지 실어 날라야 한다는 사실을 문득 깨닫습니다.
		#LOC_KS_SciDef_evaReport_Ahtpan_SrfSplashed = Ahtpan의 대양을 이루는 걸쭉한 석유 속에서 헤엄치느라 애를 먹습니다.
		#LOC_KS_SciDef_evaReport_Anehta_FlyingHigh = 누가 이걸 허가했습니까?!
		#LOC_KS_SciDef_evaReport_Anehta_FlyingLow = 이보다 나은 생각을 하신 적도 분명 있었을 것입니다.
		#LOC_KS_SciDef_evaReport_Anehta_InSpaceHigh = "있잖습니까, 노래라도 한 곡 부르고 싶지만, '행성 Anehta는 파랗고, 나는 어쩔 수 없네'는 리듬이 영 매끄럽지 않습니다."
		#LOC_KS_SciDef_evaReport_Anehta_InSpaceLow = 눈을 감았는데도 여전히 별이 보인다는 사실을 깨닫습니다. 안으로 돌아가는 편이 좋겠습니다.
		#LOC_KS_SciDef_evaReport_Anneheg_InSpaceHigh = Aralc-A에서 쏟아지는 강렬한 빛에 눈이 멀 지경입니다.
