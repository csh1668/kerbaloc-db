		#LOC_KS_SciDef_evaReport_AralcA_InSpaceHigh = 거대한 항성에서 나오는 강렬한 빛에 눈이 멀 지경입니다.
		#LOC_KS_SciDef_evaReport_AralcA_InSpaceLow = 이렇게 거대한 항성 가까이에서 EVA를 하는 게 왜 좋은 생각이라고 여기셨습니까? 도대체 왜입니까?
		#LOC_KS_SciDef_evaReport_AralcB_InSpaceLow = 항성에 이렇게 가까이 있으니 강렬한 빛에 눈이 거의 멀 지경입니다.
		#LOC_KS_SciDef_evaReport_Arorua_Flying = 지금 밖에 나가는 게 좋은 생각이라고 여기다니, 정말 제정신이 아닙니다!
