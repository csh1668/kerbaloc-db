		#LOC_KS_SciDef_evaReport_Arorua_SrfLanded = 여기는 정말 뜨. 겁. 습. 니. 다! 대체 왜 여기에 착륙하기로 한 것입니까?
		#LOC_KS_SciDef_evaReport_Arorua_SrfLanded_Substellar = 뜨겁습니다! 뜨겁습니다! 여기 너무 뜨겁습니다! 안으로 들여보내 주십시오!
		#LOC_KS_SciDef_evaReport_Dipuc_InSpaceHigh1 = 커볼과 유사한 항성을 도는 차가운 사막 세계의 유일한 위성<color=#000000>[굳이 말하지 않아도 알겠지만, 아인슈타인-로젠 다리는 치지 않습니다]</color>은 멀리서 보면 다소 평범한 곳이지만, 가까이서 살펴보면 더 많은 것이 드러날 수도 있습니다. 이 영향권으로 이끈 조우가 의도치 않은 것이었거나 이상 데이터<color=#000000>[즉, 영향권 버그]</color> 때문에 일어난 것이 아니라면, Dipuc을 더 자세히 조사하기 위해 조금 더 가까이 다가가 보시겠습니까?
