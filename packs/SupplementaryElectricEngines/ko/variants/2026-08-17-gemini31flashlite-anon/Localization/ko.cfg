		#LOC_SEE_engine_sorbet_desc = 전계 방출 전기 추진(FEEP! 정말 재미있는 약자죠...)입니다. 이 독특한 엔진은 액체 금속(이 경우에는 세슘)을 추진제로 사용합니다. 세슘은 엔진 내부의 작은 바늘 모양 물체들을 따라 흐르며 강한 전기장에 노출되어 이온화됩니다. 이온은 바늘 끝에서 떨어져 나와 매우 빠른 속도로 전기 가속됩니다. 이 엔진은 비추력이 매우 높지만, 추력은 그리 인상적이지 않습니다.
