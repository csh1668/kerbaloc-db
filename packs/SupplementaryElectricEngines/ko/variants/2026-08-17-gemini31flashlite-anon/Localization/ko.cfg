		#LOC_SEE_engine_fudge_title = KO-R1 "Fudge" 저항 가열식 전기 엔진
		#LOC_SEE_engine_gumdrop_desc = 성능이 약간 더 향상된 대형 아크제트입니다. 소형 모델과 마찬가지로 수명 제한 문제는 여전하지만, 대형 전열 엔진이 필요한 모든 상황에 충분할 것입니다.
