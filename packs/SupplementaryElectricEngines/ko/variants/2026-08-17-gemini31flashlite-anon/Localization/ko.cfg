		#LOC_SEE_engine_toffee_desc = 조금 더 크고 최적화된 저항 가열식 엔진입니다. 여전히 엔진으로서 아주 인상적인 성능은 아니지만, 최소한 소형 모델보다는 성능이 한 끗 더 뛰어납니다. 조립하려면 오후 몇 번을 투자하거나, 더 큰 차고가 필요할지도 모릅니다.
