		#LOC_SEE_engine_pancake_desc = 이 단순하고 비용 효율적인 전기 추진기는 덕트 테이프와 철물점에서 할인 중이던 잡동사니들을 정성껏 조립해 만들었습니다. Pancake는 기대에 못 미치는 성능을 제공하며, 보충할 수 없는 고체 연료를 소량만 포함하고 있습니다. 하지만 작고 컴팩트한 크기와 매우 저렴한 가격 덕분에 저렴하고 작은 탐사선을 제작하려는 분들에게는 유용한 장비가 될 수 있습니다.
