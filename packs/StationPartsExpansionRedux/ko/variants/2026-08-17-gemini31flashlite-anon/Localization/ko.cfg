		#LOC_SSPX_ScienceDef_VisualObservation_DunaSrfLanded = 토양과 하늘의 녹슨 붉은색이 낯설고 생소하게 느껴지지만, 미래에는 이곳을 집으로 여길 수도 있을 것 같습니다.
		#LOC_SSPX_ScienceDef_VisualObservation_EelooInSpaceHigh = 이렇게 멀리 나오니 고립감이 새로운 차원으로 커집니다. Kerbol의 희미한 빛도 도움이 되지 않습니다.
		#LOC_SSPX_ScienceDef_VisualObservation_EelooInSpaceLow = 아래에 있는 행성을 바라보며 승무원들의 얼어붙은 기분이 조금 나아집니다. 저 노란 눈 위에 착륙하고 싶은 마음은 전혀 없습니다.
		#LOC_SSPX_ScienceDef_VisualObservation_EelooSrfLanded = 거리는 멀지만, 이곳은 커빈의 겨울과 조금 닮은 것 같습니다.
		#LOC_SSPX_ScienceDef_VisualObservation_EveInSpaceHigh = 거리에도 불구하고, Eve의 크기와 색깔은 밤하늘에서 큰 경외감을 자아냅니다.
		#LOC_SSPX_ScienceDef_VisualObservation_EveInSpaceLow = Eve의 은빛 바다와 보라색 토양이 불길하게 아래에서 기다리고 있습니다.
		#LOC_SSPX_ScienceDef_VisualObservation_EveSrfLanded = 독성 보라색 바람이 창문을 때리며 유리를 서서히 침식합니다. 기분이 좋지 않습니다.
		#LOC_SSPX_ScienceDef_VisualObservation_IkeInSpaceHigh = 우연히 왔든 의도적으로 왔든, Ike는 그다지 볼거리가 없습니다. 대신 Duna 쪽으로 시선을 돌립니다.
		#LOC_SSPX_ScienceDef_VisualObservation_IkeInSpaceLow = 저에게는 그냥 문처럼 보입니다.
		#LOC_SSPX_ScienceDef_VisualObservation_IkeSrfLanded = 자세히 살펴보니 Ike의 짙은 회색 암석들은 꽤 흥미롭습니다. Ike를 너무 성급하게 판단하지 않았더라면 좋았을 텐데요.
		#LOC_SSPX_ScienceDef_VisualObservation_JoolInSpaceHigh = 이렇게 멀리 떨어져 있으니 Jool의 흥미로운 위성계가 손짓하는 것 같습니다. 너무 가깝지만, 또 너무 멉니다.
		#LOC_SSPX_ScienceDef_VisualObservation_JoolInSpaceLow = Jool의 녹색 구름 띠가 시야를 가득 채우며, 섬세한 가스의 춤 속으로 당신을 감쌉니다.
		#LOC_SSPX_ScienceDef_VisualObservation_JoolSrfLanded = 어떻게 창문이 아직 깨지지 않았는지 도무지 알 수가 없습니다.
		#LOC_SSPX_ScienceDef_VisualObservation_KerbinInSpaceHigh = 여기서 보니 모든 역사가 너무 작고 하찮아 보입니다. 창백한 푸른 점 하나에 모든 것이 담겨 있습니다.
		#LOC_SSPX_ScienceDef_VisualObservation_KerbinInSpaceLow = 마치 그림 같습니다. 아래로 지나가는 생생한 녹색, 파란색, 황갈색을 보며 그 아름다움에 숨이 멎을 지경입니다.
		#LOC_SSPX_ScienceDef_VisualObservation_KerbinSrfLanded = 네, 확실히 창문이 맞습니다. 그것도 아주 비싼 창문이죠.
		#LOC_SSPX_ScienceDef_VisualObservation_LaytheInSpaceHigh = 작은 섬 사슬들은 탐험을 기다리는 손길 닿지 않은 낙원을 이야기합니다.
		#LOC_SSPX_ScienceDef_VisualObservation_LaytheInSpaceLow = Laythe의 얕은 바다, 외딴 섬, 생생한 푸른 대기는 방문하고 정착하고 싶게 만듭니다.
		#LOC_SSPX_ScienceDef_VisualObservation_LaytheSrfLanded = 해안가의 풍경이 마음을 진정시키고, 주변에는 파도 소리가 들려옵니다. 머리 위 멀리 있는 녹색 거대 행성이 이곳이 외계의 하늘임을 상기시킵니다.
		#LOC_SSPX_ScienceDef_VisualObservation_MinmusSrfLanded = 눈길이 닿는 곳마다 민트색 녹색이 펼쳐져 있어, 무의식적으로 특정 디저트를 갈망하게 만듭니다. 이곳에서는 간식을 찾을 수 없기에 생각을 떨쳐버립니다.
		#LOC_SSPX_ScienceDef_VisualObservation_Minmus_InSpaceHigh = 민무스는 밤하늘에서 여전히 매우 작으며, 아직 눈에 띄는 특징은 없습니다.
		#LOC_SSPX_ScienceDef_VisualObservation_Minmus_InSpaceLow = 굽이치는 언덕과 인상적인 고원이 눈길이 닿는 곳까지 가파른 절벽과 평지로 이어집니다. 저 평지들은 매우 유망한 착륙 지점으로 보입니다.
		#LOC_SSPX_ScienceDef_VisualObservation_MohoInSpaceHigh = Moho의 짙은 갈색 표면을 바라보며, 창가에 있는 동안 얼마나 탔을지 궁금해합니다.
		#LOC_SSPX_ScienceDef_VisualObservation_MohoInSpaceLow = 이 행성은 Kerbol 근처에서 수십억 년 동안 충돌에 시달리고 구워져, 핵까지 타버린 것 같습니다.
		#LOC_SSPX_ScienceDef_VisualObservation_MohoSrfLanded = 주변의 암석을 알아보기 위해 눈을 가늘게 떠야 하며, 창문 안쪽의 공기는 매우 뜨겁습니다.
		#LOC_SSPX_ScienceDef_VisualObservation_MunInSpaceHigh = 이 관점에서 보면 문과 커빈은 하늘을 다스리는 동등한 파트너처럼 보입니다.
		#LOC_SSPX_ScienceDef_VisualObservation_MunInSpaceLow = 완전히 황량하고 이질적으로 보이는 산과 계곡의 엄숙한 회색빛이 지나갑니다.
		#LOC_SSPX_ScienceDef_VisualObservation_MunSrfLanded = 엄지손가락을 들어 커빈을 가려봅니다. 갑자기 자신이 매우, 매우 작게 느껴집니다.
		#LOC_SSPX_ScienceDef_VisualObservation_PolInSpaceHigh = 단지 작은 점에 불과하지만, Pol의 독특한 색깔은 Jool 시스템에서 신비로움과 중요성을 더해줍니다.
		#LOC_SSPX_ScienceDef_VisualObservation_PolInSpaceLow = Pol의 울퉁불퉁한 표면은 많은 계곡 위로 깊고 긴 그림자를 드리웁니다.
		#LOC_SSPX_ScienceDef_VisualObservation_PolSrfLanded = 동굴 같은 계곡과 우뚝 솟은 언덕 사이로 흥미롭고 울퉁불퉁한 모양들이 표면 위로 튀어나와 있습니다. 이곳은 탐험을 요구하는 장소입니다.
		#LOC_SSPX_ScienceDef_VisualObservation_SunInSpaceHigh = 우주는 이곳에서 너무나 황량하여 수백만 킬로미터를 가도 볼 것이 아무것도 없습니다.
		#LOC_SSPX_ScienceDef_VisualObservation_SunInSpaceLow = 빛이 너무나 눈부셔서, 그 힘에 압도되어 고개를 돌리기 전까지 아주 짧은 시간 동안만 밖을 내다볼 수 있습니다.
		#LOC_SSPX_ScienceDef_VisualObservation_Title = 시각 관측
		#LOC_SSPX_ScienceDef_VisualObservation_TyloInSpaceHigh = 이 관점에서 보면 Tylo는 Jool만큼이나 하늘을 지배합니다. 위성들의 패권을 두고 결투를 벌이는 모습이 상상됩니다.
		#LOC_SSPX_ScienceDef_VisualObservation_TyloInSpaceLow = 이 위성에 더 가까이 다가가는 것은 곧 죽음을 의미할 것 같은 기분이 듭니다. 창문에서 몸을 피합니다.
		#LOC_SSPX_ScienceDef_VisualObservation_TyloSrfLanded = Tylo의 표면은 바위가 많고 칙칙하지만 왠지 위협적입니다. 고립된 기분이 듭니다.
		#LOC_SSPX_ScienceDef_VisualObservation_VallInSpaceHigh = 이 푸른 공은 Laythe와는 확연히 다르게 보입니다. 저 얼음을 바다로 바꾸려면 무엇이 필요할지 궁금해집니다.
		#LOC_SSPX_ScienceDef_VisualObservation_VallInSpaceLow = 흥미로운 색상에도 불구하고, Vall은 딱히 내세울 만한 것이 없습니다. 적어도 Jool 자체와 비교하면 말이죠.
		#LOC_SSPX_ScienceDef_VisualObservation_VallSrfLanded = 색맹이라면 Vall과 민무스를 구분할 방법이 없을 것입니다. 뭐, 하늘에 떠 있는 거대한 녹색 공만 빼면 말이죠.
