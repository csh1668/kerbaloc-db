		#LOC_SSPX_ScienceDef_FishStudy_GillyInSpaceLow = 지금 물고기를 스캔해 봐야 소용없다고 직감이 강하게 말합니다. 하지만 물에 무언가를 넣어 볼 수는 있겠습니다...
