		#LOC_SSPX_ScienceDef_VisualObservation_Minmus_InSpaceLow = 완만한 언덕과 위압적인 고원이 끝없이 펼쳐진 깎아지른 절벽과 평원으로 이어집니다. 저 평원은 매우 유망한 착륙 지점으로 보입니다.
		#LOC_SSPX_ScienceDef_VisualObservation_MohoInSpaceHigh = 모호의 짙은 갈색 표면을 바라보며, 창가에 있는 동안 얼마나 그을렸을지 궁금해집니다.
		#LOC_SSPX_ScienceDef_VisualObservation_MohoInSpaceLow = 이 행성은 충돌로 두들겨 맞고 수십억 년 동안 커볼 가까이에서 구워져, 핵까지 타 버린 것 같습니다.
