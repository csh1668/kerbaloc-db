		#LOC_SSPX_ScienceDef_VisualObservation_LaytheInSpaceLow = 레이테의 얕은 바다, 외딴 섬들, 선명한 푸른 대기가 방문과 정착을 간절히 청합니다.
		#LOC_SSPX_ScienceDef_VisualObservation_LaytheSrfLanded = 해안의 경치와 주위에 찰싹이는 파도 소리가 마음을 달래 줍니다. 저 높은 곳의 녹색 거인이 이곳이 외계의 하늘임을 일깨워 줍니다.
		#LOC_SSPX_ScienceDef_VisualObservation_MinmusSrfLanded = 눈길이 닿는 곳마다 민트빛 초록이 펼쳐져, 은연중에 어떤 디저트가 먹고 싶어집니다. 하지만 이곳에서는 간식을 찾을 수 없으니 그런 생각은 떨쳐 버립니다.
