		#LOC_SSPX_ScienceDef_FishStudy_EveInSpaceHigh = 고속으로 행성을 향해 돌진하면서 물고기의 맛… 아니, 건강 상태를 측정합니다.
		#LOC_SSPX_ScienceDef_FishStudy_EveInSpaceLow = 이브의 보랏빛 바다가 손짓합니다! 행성의 흥미로운 색깔의 물에 물고기들이 어떻게 반응할지 빨리 시험해 보고 싶습니다.
		#LOC_SSPX_ScienceDef_FishStudy_EveSrfLanded = 세상에, 그 용액이 물고기를 순식간에 죽여 버렸습니다! 탱크 방사선 계수기의 째깍거리는 소리를 희미하게 의식하며, 이브의 물 샘플이 들어 있던 탱크를 죄책감 속에 비웁니다.
