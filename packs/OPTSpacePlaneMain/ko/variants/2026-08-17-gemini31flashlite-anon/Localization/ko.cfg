		#LOC_OPT_k_oms_desc = OPT의 일부 엔지니어들은 오랫동안 이 부품이 시장에 나오기를 고대했습니다. 불행히도 그들이 직접 개념 부품을 조립하기로 결정한 직후, 공기역학적 추진기 블록이 생산 라인에서 쏟아져 나오기 시작했습니다. 엔지니어들은 타협안으로 탱크와 토크 휠만 탑재한 유틸리티 부품으로 프로젝트를 제출했습니다. 다행히 그들의 반항은 해고나 그보다 더 나쁜 결과를 초래할 정도는 아니었습니다.
