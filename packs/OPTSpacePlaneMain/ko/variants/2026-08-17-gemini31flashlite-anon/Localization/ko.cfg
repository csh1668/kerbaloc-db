		#LOC_OPT_opt_s2intake_desc = 공기 흡입식 엔진을 설계하는 것은 비교적 쉽습니다. 그중에서도 궁극의 엔진을 설계하는 것은 꽤 어려운 일이었습니다. 하지만 J-92 Shcramjet 엔진에 맞는 나셀을 설계하는 것은 OPT의 가장 뛰어난 인재들도 책상에 머리를 찧게 만들었습니다. 그러다 누군가 내부 부품을 적절하게 구획하는 방법을 발견했습니다. 서랍에 물건을 무작위로 쑤셔 넣었다가 나중에 모든 것이 어떻게든 깔끔하게 정리된 것을 발견한 덕분이었습니다.
