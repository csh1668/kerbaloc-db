		#LOC_OPT_opt_vtol_jumpa1_desc = OPT의 엔지니어들은 호버 드라이브 개념 프로그램의 중후반 단계에서, 수직 및 전진 작동 모드를 자유롭게 전환할 수 있는 엔진이 너무 적다는 것을 깨달았습니다. 특히 K 클래스와 같은 대형 비행기가 이 모델의 목표이지만, 더 작은 비행기를 만드는 것도 어렵지 않을 것입니다...
		#LOC_OPT_opt_vtol_jumpa1_title = OPT-E VT "Valkyrie" 틸트 엔진
		#LOC_OPT_opt_vtol_jumpa2_desc = K 틸트 엔진의 WarpJet 형태가 필요했다는 것은 말할 필요도 없습니다. 그래서 M.A.R.G.E.(모듈식 축 호흡 가우스 엔진)가 탄생했습니다. S.U.R.G.E.와 마찬가지로, 이 엔진은 두꺼운 대기에서 매우 잘 작동하지만 S.A.G.E.처럼 진공 상태에서도 작동할 수 있습니다.
