		#LOC_OPT_opt_nebula_engine_desc = Nebula 엔진은 SSTO를 달성하기 위한 궁극의 엔진입니다. 거대한 Super Condensation Optimized Output Propulsion 유닛을 장착한 스크램제트 엔진입니다. 대기 중의 다양한 비활성 기체를 흡입합니다. 최적의 속도와 고도에 도달하면 엔진이 챔버 내의 기체를 이온화하고 초고온으로 가열하며, 생성된 플라즈마는 스크램제트의 뜨거운 가스와 함께 배출됩니다. 그 결과로 나타나는 찬란한 푸른색 플라즈마 '애프터버너'는 어떤 우주 왕복선이라도 강력하게 우주로 밀어 올릴 것입니다.
