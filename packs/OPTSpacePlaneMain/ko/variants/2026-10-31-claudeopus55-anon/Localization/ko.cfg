		#LOC_OPT_opt_vtol_jumpa1_desc = OPT의 엔지니어들은 호버 드라이브 개념 프로그램의 중후반 단계에서 수직 모드와 전진 모드를 자유롭게 전환할 수 있는 엔진이 너무 적다는 사실을 깨달았습니다. 이 모델은 특히 K급 같은 대형 항공기를 대상으로 하지만, 더 작은 버전을 만드는 것도 어렵지 않을 것입니다...
		#LOC_OPT_opt_vtol_jumpa1_title = OPT-E VT "Valkyrie" 틸트 엔진
		#LOC_OPT_opt_vtol_jumpa2_desc = K 틸트 엔진의 WarpJet 버전이 필요했던 것은 두말할 필요도 없습니다. 그렇게 탄생한 것이 M.A.R.G.E.(Modular Axis Respirating Gauss Engine)입니다. 이 엔진은 S.U.R.G.E.처럼 짙은 대기에서 뛰어난 성능을 발휘하면서도, S.A.G.E.처럼 진공에서도 작동할 수 있습니다.
