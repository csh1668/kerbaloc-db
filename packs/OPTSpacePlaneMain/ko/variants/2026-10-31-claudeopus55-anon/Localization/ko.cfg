		#LOC_OPT_k_oms_desc = OPT 내부에서도 일부 엔지니어들은 오래전부터 바로 이 파트가 출시되기를 고대해 왔습니다. 안타깝게도 직접 콘셉트 파트를 조립하기로 결심한 직후, 공기역학 추력기 블록이 조립 라인에서 쏟아져 나오기 시작했습니다. 엔지니어들은 타협하기로 하고 탱크와 토크 휠만 탑재한 사실상의 유틸리티 파트로 프로젝트를 제출했습니다. 다행히 이 정도 반항으로는 해고되거나 그보다 더한 일을 당하지는 않았습니다.
