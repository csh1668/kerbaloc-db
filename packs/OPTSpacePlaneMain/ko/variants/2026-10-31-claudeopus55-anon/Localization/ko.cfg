		#LOC_OPT_opt_pylon_a_title = OPT-W 초대형 파일런
		#LOC_OPT_opt_pylon_b_desc = 많은 양력과 연료 용량을 제공하는 대형 구조물입니다.
		#LOC_OPT_opt_pylon_b_title = OPT-W 대형 파일런
		#LOC_OPT_opt_s2intake_desc = 공기 흡입식 엔진을 설계하는 일은 대체로 쉽습니다. 그중 최고의 엔진을 설계하는 일은 꽤 어려웠습니다... 하지만 그 엔진인 J-92 Shcramjet에 맞는 나셀을 설계하는 일에는 OPT 최고의 두뇌들도 그저 책상에 머리를 찧을 뿐이었습니다. 그러던 중 누군가 서랍에 물건을 아무렇게나 쑤셔 넣었다가 나중에 모든 것이 어째서인지 깔끔하게 정리되어 있는 것을 발견하고, 내부를 제대로 구획하는 방법을 알아냈습니다.
		#LOC_OPT_opt_s2intake_title = OPT 2.5m Nebula Shock Intake
