		#LOC_OPT_opt_nebula_engine_desc = Nebula 엔진은 SSTO 달성을 위한 궁극의 엔진입니다. 거대한 초응축 최적화 출력 추진(Super Condensation Optimized Output Propulsion) 장치를 갖춘 스크램제트로, 대기 중의 각종 불활성 기체를 퍼 담습니다. 최적의 속도와 고도에 도달하면 엔진이 연소실 안의 기체를 이온화하고 초고온으로 가열하며, 이렇게 생성된 플라즈마는 스크램제트의 고온 가스와 함께 분사됩니다. 그 결과 찬란한 푸른 플라즈마 '애프터버너'가 생겨나 어떤 우주왕복기든 우주로 힘차게 밀어 올립니다.
		#LOC_OPT_opt_nebula_engine_title = OPT-E J-92 "Nebula" 스크램제트
