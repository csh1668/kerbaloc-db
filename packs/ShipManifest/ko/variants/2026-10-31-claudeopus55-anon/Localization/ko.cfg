		#smloc_settings_highlight_003 = CLS 강조 표시 활성화
		#smloc_settings_highlight_004 = 테두리 강조 표시 활성화 (마우스 오버 시)
		#smloc_settings_highlight_tt_001 = 매니페스트 창에서 선택한 자원이 들어 있는 모든 파트를 강조 표시합니다.\n전역 설정입니다. 마우스 오버 시의 파트 강조 표시에는 영향을 주지 않습니다.
		#smloc_settings_highlight_tt_002 = 선택하면 선택한 자원에 대한 파트의 일반 강조 표시를 비활성화합니다.\n이송 창에서 선택한 파트만 강조 표시하도록 제한합니다.\n강조 표시 활성화가 켜져 있어야 합니다.
		#smloc_settings_highlight_tt_003 = CLS가 활성화되어 있고 매니페스트 창에서 승무원을 선택한 경우 강조 표시 동작을 변경합니다.\n우주선에서 거주/통행 가능한 공간에 연결된 파트를 강조 표시합니다.\n강조 표시 활성화가 켜져 있어야 하며, 다음 옵션과 함께 사용할 수 없습니다:\n출발/목표물 파트만 강조 표시.
