		#smloc_settings_realism_tt_001 = 사실성 설정이 잠겨 있습니다.\n잠금을 해제하려면 SMSettings.dat 파일을 수정해야 합니다.\n게임을 종료하고 파일을 수정한 뒤 게임을 다시 시작하십시오.
		#smloc_settings_realism_tt_002 = 사실성 설정 묶음을 각 범주에 맞게 지정하는 버튼입니다.\n - 전체 - 모든 사실성 설정을 활성화합니다.\n - 없음 - 모든 사실성 설정을 비활성화합니다.\n - 기본값 - 처음 설치했을 때의 사실성 설정으로 되돌립니다.\n - 사용자 지정 - 이 옵션을 선택해도 설정은 변경되지 않습니다.\n\n 설정을 변경하여 다른 범주에 해당하지 않게 되면 사용자 지정이 자동으로 선택됩니다.
		#smloc_settings_realism_tt_003 = 사실성을 최대로 활성화합니다. SM을 가장 제한적으로 사용합니다.
		#smloc_settings_realism_tt_004 = 사실성 설정을 모두 비활성화합니다.  SM을 가장 자유롭게 사용합니다.
		#smloc_settings_realism_tt_005 = SM 설치 시 제공되는 기본 설정입니다.\n사실성 쪽에 가까운 설정 조합입니다.
		#smloc_settings_realism_tt_006 = 설정을 변경하여 다른 범주에 해당하지 않게 되면\n이 설정이 자동으로 선택됩니다.
		#smloc_settings_realism_tt_007 = 사실적인 자원 이송을 켜거나 끕니다.
		#smloc_settings_realism_tt_008 = 사실적인 우주선 제어를 켜거나 끕니다.\n켜면 승무원이 탑승해 있거나, 제어 기지 또는 위성과 유효한 통신 링크가 있어야 합니다.\n끄면 언제든지 우주선을 완전히 제어할 수 있습니다(자원 보유량에 따라 다름).
		#smloc_settings_realism_tt_009 = 명단 창의 명단 수정 및 작업을 활성화하거나 비활성화합니다.\n켜면 승무원을 생성, 편집, 추가, 제거, 재생성할 수 없습니다.\n끄면 명단 창의 모든 작업을 자유롭게 사용할 수 있습니다.
		#smloc_settings_realism_tt_010 = 커벌의 이름을 변경할 수 있습니다.\n명단 수정이 켜져 있어야 합니다.
		#smloc_settings_realism_tt_011 = 커벌의 직업을 변경할 수 있습니다.\n(파일럿, 엔지니어, 과학자)\n명단 수정이 켜져 있어야 합니다.
		#smloc_settings_realism_tt_012 = 기본 승무원 이송을 켜거나 끕니다.\n켜면 기본 승무원 이송이 평소대로 작동합니다.\n끄면 파트 조정 메뉴에 승무원 이송 옵션이 표시되지 않습니다.
		#smloc_settings_realism_tt_013 = SM 승무원 이송을 켜거나 끕니다.\n켜면 자원 목록에 승무원 옵션이 표시됩니다.\n끄면 SM을 이용한 승무원 이송을 사용할 수 없습니다.
		#smloc_settings_realism_tt_014 = 비행 전 승무원 채우기 및 비우기를 켜거나 끕니다.\n켜면 우주선 전체의 승무원 채우기 및 비우기가 가능합니다(자원 목록에 표시됨).\n끄면 우주선 전체 승무원 채우기 및 비우기가 자원 목록에 표시되지 않습니다.
		#smloc_settings_realism_tt_015 = 기본 승무원 이송 방식을 SM 방식으로 대체하는 기능을 켜거나 끕니다.\n켜면 기본 승무원 이송이 SM 방식 이송처럼 작동합니다.\n(기본 승무원 이송과 SM 승무원 이송이 모두 켜져 있어야 합니다)\n끄면 기본 승무원 이송이 활성화된 경우 평소대로 작동합니다.
		#smloc_settings_realism_tt_016 = Connected Living Space 지원을 켜거나 끕니다.\n켜면 승무원을 같은 '거주 공간' 내의 파트로만 이송할 수 있습니다.\n끄면 커벌을 수용할 수 있는 모든 파트로 승무원을 이송할 수 있습니다.
		#smloc_settings_realism_tt_017 = CLS 스위치를 활성화하여 제한 없는 승무원 이송을 허용하는 기능을 켜거나 끕니다.\n켜면(사실성 모드가 켜져 있어야 함) SM이 기본 및 CLS 연동 승무원 이송을 관리합니다.\n끄면(또는 사실성 모드가 꺼져 있으면) CLS의 설정을 변경하지 않습니다.
		#smloc_settings_realism_tt_018 = 과학 데이터 이송을 켜거나 끕니다.\n켜면 과학 데이터 이송이 가능하며 자원 목록에 표시됩니다.\n끄면 과학 데이터 이송이 자원 목록에 표시되지 않습니다.
		#smloc_settings_realism_tt_019 = 자원 이송을 켜거나 끕니다.\n켜면 자원 이송이 가능하며 매니페스트 창에 표시됩니다.\n끄면 자원이 자원 목록에 표시되지 않습니다.
		#smloc_settings_realism_tt_020 = 비행 전 자원 채우기 및 비우기를 켜거나 끕니다.\n켜면 우주선 전체의 자원 채우기 및 버리기가 가능합니다(자원 목록에 표시됨).\n끄면 우주선 전체 자원 채우기 및 버리기가 자원 목록에 표시되지 않습니다.
		#smloc_settings_realism_tt_021 = 자원 이송 시 전력 소모를 켜거나 끕니다.\n켜면 자원 이송 시 전력을 소모합니다.\n끄면 자원 이송 시 전력을 소모하지 않습니다.
		#smloc_settings_realism_tt_022 = 자원 이송의 전력 소모량을 설정합니다.\n값이 클수록 자원 단위당 소모되는 전력이 많아집니다.
		#smloc_settings_realism_tt_023 = 사실적인 이송이 켜져 있을 때 자원 이송 속도를 설정합니다.\n값이 클수록 자원이 더 빠르게 이동합니다.\n아래 슬라이더로도 이 값을 변경할 수 있습니다.
		#smloc_settings_realism_tt_024 = 위에 표시된 자원 유량을 변경하는 슬라이더입니다.
		#smloc_settings_realism_tt_025 = 유량 슬라이더 범위의 하한값(왼쪽)을 설정합니다.
		#smloc_settings_realism_tt_026 = 유량 슬라이더 범위의 상한값(오른쪽)을 설정합니다.
		#smloc_settings_realism_tt_027 = 자원 이송의 최대 소요 시간(초)을 설정합니다.\n유량과 함께 작동합니다. 자원을 옮기는 데 걸리는 시간이\n 이 값을 초과하면, 이 값을 사용하여\n 조정된 유량을 계산합니다.\n(지나치게 긴 이송을 방지합니다)
		#smloc_settings_realism_tt_028 = 이 섹션의 설정을 잠가 게임 내에서 변경할 수 없게 합니다.\n잠금을 해제하려면 반드시 SMSettings.dat 파일을 수정해야 합니다.\n게임을 종료하고 파일을 수정한 뒤 게임을 다시 시작하십시오.\n(유혹을 참지 못하는 분들을 위해 추가했습니다.)
		#smloc_settings_realism_tt_029 = 사실적인 승무원 이송을 켜거나 끕니다.
