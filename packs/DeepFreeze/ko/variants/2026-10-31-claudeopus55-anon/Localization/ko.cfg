		#autoLOC_DF_00194 = 최대 10명의 커벌을 장기 보관하도록 설계되었습니다. CRY-2300은 Glykerol과 전력을 사용하여 한 번에 한 명씩 커벌을 냉동하거나 해동합니다. 우주선에 충분한 전력 용량이 있는지 확인하십시오. CRY-2300에는 Glykerol 50단위가 기본으로 비축되어 있습니다. 주의: CRY-2300은 감시 시스템을 계속 작동시키기 위해 커벌 한 명당 분당 전력이 필요합니다. 이 전력을 공급받지 못하면 냉동된 커벌이 사망할 위험이 있습니다.
		#autoLOC_DF_00195 = RS-X20R Glykerol 용기
		#autoLOC_DF_00196 = RS-X20R은 커벌 냉동 및 해동에 필요한 모든 것을 위한 소용량 방사형 Glykerol 용기입니다. REPOSoftTech의 친절한 직원들이 제공합니다. Glykerol을 채우면 보증이 무효화됩니다.
		#autoLOC_DF_00197 = deepfreeze 극저온 냉동기 glykerol 탱크
		#autoLOC_DF_00198 = 극저온학, 인체공학, 전기 장비 분야의 전문가인 REPOSoftTech의 커벌들은 우주를 여행하는 모든 커벌을 살리고 그들의 임무를 성공시키기 위해 열심히 노력하고 있습니다.
