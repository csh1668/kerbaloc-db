		#LOC_ChemicalCore_HTPB_description = 하이드록실 말단 폴리부타디엔(HTPB)은 PBAN보다 다루기 쉽고 생산 속도도 빠른 현대식 공중합체 바인더입니다.\n\n사소하긴 하지만 이러한 장점 덕분에 엔지니어들은 모든 고체 로켓 부스터의 출력을 극대화하는 추진제 혼합물을 완성할 수 있었습니다.
