Localization
{
	ko
	{
		#DQS_AutoSave = 자동 저장
		#DQS_AutoSaveEnable = 자동 저장 사용
		#DQS_AutoSaveFreq = 자동 저장 주기 (분)
		#DQS_AutoSaveOnStart = 씬 로드 시 자동 저장
		#DQS_AutoSaveOnStart_t = 씬을 불러올 때 첫 자동 저장을 할지, 지정한 시간(분)이 지난 후에만 할지 선택합니다.
		#DQS_MaxAutoSaveCount = 자동 저장 최대 개수
		#DQS_MaxAutoSaveCount_t = 초과된 저장 파일을 삭제합니다. 음수이면 모든 저장 파일을 유지합니다.
		#DQS_MaxQuickSaveCount = 퀵세이브 최대 개수
		#DQS_MaxQuickSaveCount_t = 초과된 저장 파일을 삭제합니다. 음수이면 모든 저장 파일을 유지합니다.
		#DQS_Note1 = :추가 설정은 GameData/DatedQuickSaves/ 폴더의 extra-settings.cfg를 확인하십시오.
		#DQS_Note2 = persistent.sfs에 대한 기본 자동 저장의 숨겨진 기본 설정입니다 (settings.cfg에서 확인할 수 있습니다).
		#DQS_QuickSave = 퀵세이브
		#DQS_QuickSaveDelay = 퀵세이브 지연 (ms)
		#DQS_QuickSaveDelay_t = F5를 누른 후 날짜가 붙은 퀵세이브를 시도하기까지의 지연 시간입니다 (게임 내 밀리초).
		#DQS_QuickSaveEnable = 퀵세이브 사용
		#DQS_ReloadExtra = extra-settings.cfg 다시 불러오기
		#DQS_ReloadExtra_t = extra-settings.cfg만 다시 불러오려면 활성화한 후 적용하십시오 (MM 패치가 있어도 무시됩니다).
		#DQS_StockAutosaveInterval = 기본 자동 저장 간격 (분)
		#DQS_StockAutosaveInterval_t = 기본 자동 저장 간격
		#DQS_StockAutosaveShortInterval = 기본 자동 저장 단기 간격 (초)
		#DQS_StockAutosaveShortInterval_t = 첫 번째 저장 시도가 실패했을 때 다시 저장을 시도하는 시간 간격입니다.\n자동 저장이 실패하면,\n저장에 성공할 때까지 이 간격으로 계속 재시도합니다.
		#DQS_StockQuickSaveRename = 기본 빠른 저장 이름 변경
		#DQS_StockQuickSaveRename_t = quicksave.sfs의 이름을 변경하거나 복사합니다.\n - "이름 변경"은 더 빠르지만 F9 퀵로드를 할 수 없습니다.\n - "복사"는 F9 퀵로드를 지원합니다.
	}
