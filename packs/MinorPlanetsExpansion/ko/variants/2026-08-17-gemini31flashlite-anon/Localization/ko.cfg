		#LOC_MPE_Planets_Mracksis_description = Mracksis는 Havous와 같은 우주 영역에 위치한 매우 붉은 왜소행성입니다. 이 생생한 붉은색은 표면에 쌓인 톨린의 결과입니다. Havous에는 없는데 Mracksis에만 전 지구적으로 높은 농도의 톨린이 존재하는 이유는 미스터리입니다. 안타깝게도 Mracksis는 주변의 다른 천체들만큼 주목받지 못하고 있습니다.
