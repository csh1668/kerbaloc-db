		#autoLOC_6005138 = Jebediah 커먼은 KSC 전속 무모한 파일럿이라는 본업에서 위험을 아침, 점심, 저녁으로 먹어 치웁니다. 그렇다면 주말에 쉬고 싶을 때는 무엇을 할까요? 최첨단 고물상 시설에서 폭죽 통을 채웁니다.\n\nStarshot-8에는 짧은 불꽃놀이를 즐기기에 충분한 폭죽이 들어 있습니다. 여러 개를 늘어놓으면 발사대에서 벌어지는 대폭발과 겨룰 만한 장관도 연출할 수 있습니다. 원할 때 확실히 터지며, 그렇지 않으면 다음 제품은 반값입니다.
		#autoLOC_6005139 = Jebediah Kerman은 KSC의 상주 스턴트 파일럿으로 일하며 아침, 점심, 저녁으로 위험을 먹어 치웁니다. 그렇다면 주말에 쉬고 싶을 때는 무엇을 할까요? 최첨단 고물상 시설에서 폭죽 통을 채웁니다.\n\nStarshot-32는 대형 폭죽 발사기입니다. 이것이 엉뚱한 때에 터진다면 환불 이상의 것을 찾게 될지도 모릅니다.
		#autoLOC_6005140 = 커벌 스페이스 프로그램 1.12: 최종 접근의 새로운 기능\n\n커벌 스페이스 프로그램의 10주년 기념 업데이트를 선보이게 되어 기쁩니다. 이번에는 그 어느 때보다 많은 콘텐츠를 추가했으며, 가득 담긴 새로운 기능과 콘텐츠로 KSP의 기념일을 멋지게 축하하려 합니다. 그럼 바로 시작하겠습니다!\n\n먼저, 두 가지 주요 앱이 새로 추가되었습니다. 새로운 기동 생성기 앱을 사용하면 다른 천체로 향하는 전이 궤도를 빠르게 생성하고, 다가오는 전이 시기를 확인하며, 목적지와 그곳에 도달하는 데 필요한 델타-V를 쉽게 파악할 수 있습니다. \n\n이와 함께 알람 시계 앱도 추가됩니다. 전이를 포함한 모든 기동에 대해 알람을 만들 수 있으며, 수동 시간 알람과 다양한 궤도 위치에 대한 알람도 설정할 수 있습니다. 알람을 놓치지 않도록 재미있는 알람 소리를 골라 두십시오!\n\n다음으로, 다가오는 10주년을 맞아 다양한 콘텐츠를 추가합니다. 내용은 다음과 같습니다: \n- 태양계 곳곳에 숨겨진 새로운 이스터 에그\n- 방문하면 잠금 해제되는 커빈의 새로운 발사 기지\n- 새로운 '슬림' 우주복\n- 축하를 도와줄 새로운 폭죽 발사기!\n\n그 밖에도 KSP의 사용자 경험을 개선하기 위해 요청이 많았던 기능과 편의성 개선 사항을 다수 추가했습니다. 그 목록은 다음과 같습니다:\n- 기체 및 게임 저장 파일 불러오기를 대폭 개편하여 검색, 폴더 정리, 저장 파일 간 기체 파일 공유 기능 추가 \n- 도킹 포트에 회전식 도킹 포트 칼라를 추가하여 결합된 기체를 완벽하게 정렬 가능\n- 깃발 패널의 구조용 변형 추가\n- 원할 때 분리할 수 있는 스트럿\n- 파트 도구 업데이트 및 모더 요청 사항 다수 반영\n- 바퀴와 착륙 다리의 대규모 수정 및 개선\n- 그 밖에 훨씬 더 많은 내용...\n\n1.12에서는 새로운 파트와 개편된 파트도 만나볼 수 있습니다. 폴과 일루가 외형 개선을 받으며 태양계 전체의 업그레이드가 마무리되었습니다. 모든 도킹 포트가 개편되었습니다. 또한 1.25미터 엔진 플레이트와 여러 종류의 새로운 태양 전지판도 추가됩니다.\n\n물론 버그 수정과 기타 개선 사항이 너무 많아 여기에 모두 적을 수는 없으니, 자세한 내용은 변경 사항 목록을 확인하십시오.\n\n이번 업데이트가 역대 최고의 업데이트 중 하나라는 데 동의해 주시기를 바랍니다! 아쉽게도 모든 좋은 일에는 끝이 있습니다. 최종 접근은 커벌 스페이스 프로그램의 마지막 주요 업데이트입니다. 여러분을 위해 이 멋진 게임을 만들 수 있었던 것은 더없는 영광이자 기쁨이었습니다. 이곳의 모두가 애정을 담아 작업해 왔으며, 매 순간 함께해 준 훌륭한 커뮤니티가 있었다는 것을 큰 특권으로 생각합니다. 이 여정에 함께해 주셔서 감사합니다. \n\n하지만 Squad가 사라지는 것은 아닙니다. 소셜 팀은 계속 이벤트를 진행할 것이며, 저희가 KSP2 개발을 돕느라 바쁜 동안에도 KSP와 커뮤니티가 앞으로 오래도록 이어지리라 기대합니다.\n\n커벌 스페이스 프로그램 1.12: 최종 접근을 즐겨 주시기 바라며, 2022년에는 커벌 스페이스 프로그램 2에서 새로운 모험을 함께해 주십시오!
