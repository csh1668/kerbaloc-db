		#autoLOC_501189 = Mallard는 물보라를 피하도록 동체 위쪽 높이 고효율 터보팬 두 기를 장착한 대형 수상 비행기입니다. 다소 느리지만 비행이 매우 안정적입니다. 주익 뒷전에 빼곡히 달린 플랩 덕분에 저속에서도 뛰어난 양력을 얻으며, 동체 하단 양쪽에 달린 작은 수중익 스텝이 이륙 활주 중 기체를 수면 위로 띄워 물의 항력을 줄여 줍니다. 앞쪽 조종석을 제외한 동체 전체가 하나의 긴 화물칸이며, 꼬리 쪽에 램프가 있습니다. 덕분에 Mallard가 착륙해 있는 동안 로버(와 보트)가 타고 내릴 수 있습니다. 연료가 다소 부족하므로, 장거리 비행 시에는 화물칸에 연료를 추가하거나 높은 고도에서 비행하는 것을 고려하십시오.
		#autoLOC_501190 = Osprey
		#autoLOC_501191 = 고성능(그리고 고위험) 수상기인 Osprey는 성능을 포기하고 싶지 않으면서도 커빈의 물 위든 땅 위든 어디에나 착륙하고 싶은 무모한 이들을 위해 설계되었습니다. 애프터버너를 갖춘 Panther 터보팬은 건식 모드에서 높은 효율을, 습식 모드에서 높은 추력을 제공하므로 느긋한 산책과 전력 질주 모두에 안성맞춤입니다.\n\n아우트리거 사이에는 수중익판이 걸쳐 있어, Osprey가 수상 이륙 활주 중에 "스텝 업"하여 항력을 크게 줄일 수 있습니다. 일단 스텝 업하면 안전하게 이륙할 수 있습니다. 아우트리거는 분리할 수 있지만, 착륙 바퀴도 함께 달려 있습니다. 따라서 마지막 수상 착륙(또는 정말로 마지막이 될 지상 "착륙")을 계획하는 것이 아니라면 아우트리거를 스테이지로 분리하지 마십시오.
		#autoLOC_501192 = Prospector 로버
		#autoLOC_501193 = 모든 탐사 요구를 충족하는 범용 개방형 진공 로버!\n연료 전지 동력 시스템으로 수 km의 주행 거리를 확보합니다. \n탐사 과학 패키지가 기본 탑재되어 있으며, 평판 적재함에는 확장할 공간도 넉넉합니다.\n제조사는 갈색 부품이 지면을 향하도록 유지할 것을 권장합니다.
		#autoLOC_501194 = Ravenspear Mk1
		#autoLOC_501195 = 빠른 고고도 항공기인 Ravenspear 시리즈의 첫 모델 Mk1에는 엔진 세 개가 장착되어 있습니다. 저속에서 가장 효율적인 중앙 엔진 하나와, 건식 추력에서는 거의 비슷한 효율을 내면서 습식 모드에서는 (상당한 대가를 치르고) 꽤 강력한 힘을 내는 애프터버너 터보팬 두 개입니다.\n\n카나드 설계는 몇몇 유명 시험 비행사들에게 "사실 꽤 조종하기 좋다"는 평을 받았지만, 그들은 너무 성급하게 기수를 들면 이륙 시 꼬리가 지면에 닿는 경향이 있다고 경고하기도 합니다. 물론 "가운데 엔진이 부서져도 엔진이 더 있으니 다행"이라는 말도 덧붙였습니다.
		#autoLOC_501196 = Ravenspear Mk3
		#autoLOC_501197 = Ravenspear Mk3는 장거리 고고도 우주 비행기로, 높은 고도에서 많은 양력을 내는 참신한 날개 형상을 갖추고 있습니다. \n\n준궤도 비행이 가능하므로 고고도 실험용 엔진이나 그 밖의 과학스러운 것들을 시험하기에 괜찮은 플랫폼입니다.
		#autoLOC_501198 = Ravenspear Mk4
		#autoLOC_501199 = Mk4는 이전 Ravenspear 모델들과는 방향이 조금 달라졌습니다. \n\n고고도 비행에 집중하는 대신, Mk4는 주로 애프터버너 터보팬 네 개의 성능을 최대한 끌어내는 데 맞춰져 있습니다. 그러나 건식 모드에서도 상당한 항속 거리를 낼 수 있습니다.\n\n저고도에서 초고속 비행이 가능하여 가장 용감한 시험 비행사들에게 인기가 높으며, 그다지 용감하지 않은 비행사들에게는 정반대입니다.\n
		#autoLOC_501200 = 로켓 동력 VTOL
		#autoLOC_501201 = 이 기체는 로켓 동력 비행을 위한 실험용 시험 플랫폼입니다. \n\n주로 낙하산 강하가 불가능한 곳에 착륙하는 조종사를 훈련하는 데 쓰이며, 에이스 조종사와 '그럭저럭'인 조종사를 구별하는 데에도 쓰입니다. 방법은 간단합니다. 이 기체에 태운 뒤 무사히 빠져나온 조종사를 "에이스"라고 부르면 됩니다.
		#autoLOC_501202 = 위성 발사체
		#autoLOC_501203 = 높은 고도에서의 로켓 발사가 가능함을 입증하기 위해 소형 로켓을 장착한 재래식 제트기입니다.
		#autoLOC_501204 = Skywinder AE1
		#autoLOC_501205 = Skywinder AE1은 날렵하고 민첩한 비행기로, 원래 Green Kraken 에너지 스낵이 후원하는 에어 레이스와 곡예 비행 쇼에서 사용되었습니다. 전방 카나드, 역추력 장치, 내장형 안전 낙하산 덕분에 무모한 조종사들은 상식적인 조종사라면 시도조차 하지 않을 온갖 창의적인 기동을 선보일 수 있었습니다! \n\n일련의 불행한 사건 이후, 이 기체는 여가용으로 우주 센터에 기증되었습니다.
		#autoLOC_501206 = Stearwing A300
		#autoLOC_501207 = Stearwing A300은 무거운 탑재물과 많은 승객을 실어 나르도록 제작된 대형 항공기입니다. 다만 아주 인상적인 고도나 속도에 도달하리라고는 기대하지 마십시오. 과도한 하중이 걸리면 날개가 떨어져 나갈 수 있습니다. 곡예비행 시도로 인한 손상은 보증 대상이 아닙니다.
		#autoLOC_501208 = Stratolauncher
		#autoLOC_501209 = 로켓을 10km 고도까지 운반해 그곳에서 발사하도록 설계된 대형 무인기입니다. 이후 무인기는 이론상 활주로로 돌아와 재사용될 수 있습니다. 항공전자장비가 제대로 작동한다면 말입니다.
		#autoLOC_501210 = Thunderbird
		#autoLOC_501211 = Thunderbird는 항공기계의 머슬카입니다. 성능은 대체로 Osprey와 비슷하지만, 더 높은 최고 속도를 얻는 대신 Osprey의 우아한 선(그리고 수상기로서의 능력)을 포기했습니다. 사실 Thunderbird는 엔진에 조종석과 날개 몇 개를 볼트로 붙여 놓은 것에 불과하며... 그래서 시험 조종사들에게 엄청난 인기를 끌었습니다. 최고 속도를 내려면 보조 연료 탱크가 비면 반드시 분리하십시오!
		#autoLOC_501212 = Velociteze
		#autoLOC_501213 = 소형 기본 제트 엔진 두 개를 사용하는 소형 인원 수송기입니다. 터보팬만큼 효율적이지는 않지만, 이 역할에서는 훌륭하게 제 몫을 해내며 애프터버너나 터보램제트보다 연료를 훨씬 덜 소모합니다. Velociteze는 다루기 쉬운 항공기로, Gull과 Aeris 3A에 익숙해진 뒤 다발 엔진 항공기로 한 단계 올라가고 싶은 훈련생에게 적합합니다(덤으로 승객을 실어 나르는 유용한 임무도 수행할 수 있습니다).
		#autoLOC_501214 = AeroEquus
		#autoLOC_501215 = 하늘을 나는, 네 다리로 히힝 우는 육상 생물.\n\n전설에 따르면 용감한 커벌만이 에쿠스를 탈 수 있다고 합니다. 우리가 아는 것은 네 개의 부스터를 단 이 야수를 타고 문 너머까지, 정말 무모하다면 민무스 너머까지 가려면 용감한 커벌이 필요하다는 사실뿐입니다.
		#autoLOC_501216 = ComSat Lx
		#autoLOC_501217 = 안테나와 태양광 전력을 갖춘 초소형 위성?\n우주까지 데려다 줄 발사체?\n\n둘 다 준비 완료!
		#autoLOC_501218 = Dynawing
		#autoLOC_501219 = Dynawing은 Dynawing 궤도선(KS25 엔진 2기 장착)과 이 엔진에 연료를 공급하는 외부 탱크로 구성되며, Kickback 2기로 추진되는 부분 재사용형 셔틀입니다. 최대 16톤의 탑재물(기준 탑재물 포함)을 실을 수 있는 저렴한 우주 진출 수단의 "차세대"로 칭송받지만, 조종이 다소 까다롭고 기존 로켓만큼 비싸며, 상승 중에 무언가 폭발하기라도 하면 Kraken의 가호를 빌어야 합니다. 그래도 외관은 훌륭하고 아주 미래적입니다. 물론 비행 승무원들은 앞다투어 줄을 서고 있습니다.\n\n주 엔진은 대략 질량 중심을 관통하는 방향으로 분사합니다. 셔틀이 스택의 '아래쪽'에 오도록 뒤집힌 자세로 상승하고, 진행 방향 벡터를 약간 앞서 나가십시오. 첫 분사에서 외부 탱크의 추진제를 모두 소진하도록 설계되었으며, 45 km에서 수평 자세를 잡고 계속 분사하여 대략 75 x 0 km "궤도"에 도달하십시오. 그런 다음 스테이지를 진행해 탱크를 분리하고, 6을 눌러 주 엔진을 끈 뒤, 다시 스테이지를 진행해 OMS 엔진을 점화하고, 이를 이용해 원 궤도화와 이후의 궤도 이탈을 수행하십시오. 재진입은 RCS로 제어하며 높은 받음각을 유지하십시오.
		#autoLOC_501220 = GDLV3
		#autoLOC_501221 = Generally Designed Launch Vehicle 3는 고객이 필요에 맞게 조정할 수 있는 적응형 설계입니다. 사실 GDLV3는 너무 널리 쓰여서 누구도 이것을 실제로 소유하고 있다고 말할 수 없습니다.
		#autoLOC_501222 = 이온 추진 우주 탐사선
		#autoLOC_501223 = 이 작은 탐사선은 귀엽고 별 볼 일 없어 보일지 모르지만, 장거리 안테나를 펼치고 나서도 거의 똑같아 보입니다.\n\n이온 엔진은 이렇게 작은 우주선치고 매우 효율적이어서 정말 멀리까지 갈 수 있습니다. 물론 먼저 무언가가 궤도까지 올려 준다면 말입니다.
		#autoLOC_501224 = Jumping Flea
		#autoLOC_501225 = Jumping Flea라는 이름은 원래 대부분의 부품을 건져 온 놀이공원 기구의 이름에서 따왔습니다. 우주까지 끝까지 가지는 못할지 몰라도, 그 첫걸음만큼은 확실히 화끈하게 내디디게 해 줄 것입니다!
		#autoLOC_501226 = 커벌 1-5
		#autoLOC_501227 = 일요일 나들이용으로 딱 좋은 아담한 기체인 커벌 1-5는 낮은 커빈 궤도로의 당일 여행에 안성맞춤입니다.\n\n이 모델에는 선택 사양인 도킹 포트와 RCS 업그레이드 패키지가 포함되어 있어 우주에서 친구들과 만나기에 완벽합니다.
		#autoLOC_501228 = 커벌 1
		#autoLOC_501229 = 로켓 제작 연습용으로, 기초를 가르치기에 딱 알맞습니다.\n\n날기는 합니다. 더 무엇이 필요하겠습니까?
		#autoLOC_501230 = 커벌 2
		#autoLOC_501231 = 커벌 2는 '훈련용' 로켓으로 제작되었습니다. 아주 멀리 가도록 만들어지지는 않았지만, 대형 우주선에 있는 중요한 시스템 대부분을 갖추고 있습니다.\n\n낙하산도 달려 있습니다. 대부분의 우주비행사는 이것이 최고의 장점 중 하나라고 입을 모읍니다.
		#autoLOC_501232 = 커벌 X
		#autoLOC_501233 = 커벌 X는 카탈로그로 주문할 수 있는 로켓 중 가장 성공적인 로켓 중 하나입니다. 원래 플라스틱 모형용으로 설계되었음에도, 실물 크기 기체로서도 꽤 믿음직하다는 것이 입증되었습니다.\n\nX는 커빈 궤도에 도달할 수 있으며, 상단 스테이지에는 매우 낙관적인 착륙 다리 세트까지 갖추고 있습니다.
		#autoLOC_501234 = Learstar A1
		#autoLOC_501235 = SSTO는 과대평가되었습니다. 요즘 대세는 탑재물 수송 능력과 편안한 좌석입니다.
		#autoLOC_501236 = Orbiter 1A
		#autoLOC_501237 = Orbiter 1A는 궤도 기동 훈련용 기체입니다. 자력으로는 궤도에 도달할 수 없지만, 일단 도달하면 기동성이 매우 뛰어나고 조종하는 재미가 있는 기체입니다.
		#autoLOC_501238 = Orbiter One
		#autoLOC_501239 = 엔지니어들이 이 비행체의 이름을 시리즈 번호에서 따왔는지 부스터 개수에서 따왔는지는 확실하지 않으며, 우리 조종사들은 이것을 "미완성"이라고 부릅니다.\n이름의 유래가 무엇이든, 조종해 볼 만한 흥미로운 비행체입니다.
		#autoLOC_501240 = PT 시리즈 Munsplorer
		#autoLOC_501241 = PT Munsplorer: 문/민무스용 군더더기 없는 초절약형 발사체 겸 착륙선입니다.\n\n배터리, 핀, 과학은 별매입니다.
		#autoLOC_501242 = 로버 + 스카이크레인
		#autoLOC_501243 = 이 기체는 Kerlington 카탈로그에서 가장 야심 찬 설계 중 하나입니다. 다른 행성에서 실제로 사용할 생각이라면 더더욱 그렇습니다. \n\n우주로(그리고 그 너머로) 가려면 발사체가 필요하지만, 네 개의 로켓은 발사대에서 짧은 시험 운행을 할 만큼의 추력은 충분히 갖추고 있습니다.\n\n운용 설명서에는 "지면에 천천히 접근하고, 로버를 떨어뜨릴 때 부서지지 않게 주의할 것"이라고 적혀 있습니다.
		#autoLOC_501244 = 과학 실험 모듈
