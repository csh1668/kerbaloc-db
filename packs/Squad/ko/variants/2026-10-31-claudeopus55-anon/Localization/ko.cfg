		#autoLOC_316043 = 좋습니다, 계속하겠습니다. 이번 귀환 비행은 세 단계로 나뉩니다. 문 지표면에서의 상승, 커빈 전이 궤도 진입, 그리고 문에서 돌아오는 재진입입니다. 첫 번째 단계인 낮은 문 궤도 진입을 마치면 다음 단계의 세부 사항을 다루겠습니다.\n \n지금은 다음과 같이 하십시오(이 수업에서 늘 그렇듯 조종을 돕기 위해 목표물 마커를 추가해 두겠습니다):\n\t* 스로틀을 올린 뒤 즉시 마커를 따라 90도 방위각 선(동쪽) 방향으로 피치를 숙이십시오.\n\t* 원점이 50km를 넘으면 스로틀을 끄십시오.\n\t* 원점에서 원 궤도화하십시오.\n \n궤도로 출발 튜토리얼에서 커빈을 상승했을 때보다 훨씬 간단합니다. 문의 중력 우물은 커빈보다 훨씬 얕기 때문에 스테이지 하나면 충분합니다\u2014 그마저도 전부 쓸 필요가 없습니다. 이 스테이지는 문에 착륙할 때 사용한 바로 그 스테이지이며, 귀환할 때도 사용합니다. 문의 중력은 커빈보다 훨씬 약하고 대기에 발목을 잡히지도 않으므로, 이 스테이지 하나로 이번 임무의 착륙과 귀환 구간 전체를 감당할 연료가 충분합니다.
