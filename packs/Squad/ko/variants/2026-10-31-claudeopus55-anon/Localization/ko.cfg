		#autoLOC_315621 = <color=<<1>>>경고</color>: 상세한 정보입니다! 필요하면 <color=<<2>>>[<<3>>]</color> 키를 눌러 일시 정지하십시오.\n\n지금 커빈의 대기에 재진입하고 있습니다. 손발은 항상 포드 안에 두십시오. 화상이라도 입으면 곤란하니까요! 불꽃은 신경 쓰지 마십시오. 어쨌든 Wernher는 \"세계적으로 유명한 로켓 과학자\"이고, 이 우주선을 불꽃에 견디도록 만들었습니다.\n\n지난번에는 낙하산 아이콘을 지켜보며 낙하산을 펼칠 때를 기다렸습니다. 이번에는 조금 다르게 해 보겠습니다. 이 우주선을 설계했던 제작 튜토리얼에서 낙하산이 0.75기압이 될 때까지 반전개되지 않도록 설정했던 것을 기억하십니까? 즉, 지금 스테이징으로 낙하산을 작동시켜도 그때까지는 두 단계 전개 중 첫 단계가 진행되지 않습니다. 커빈에서 0.75atm은 해발 고도 약 2000m에 해당하며, 그때쯤이면 기체가 충분히 느려져 낙하산이 전개 시 버틸 수 있을 것입니다.\n\n그러니 과감하게 지금 낙하산을 준비시키고, 내장된 장치가 적절한 고도에서 펼치도록 맡겨 봅시다.\n\n저를 믿으셔도 됩니다! 지금 <color=<<4>>>[<<5>>]</color> 키를 눌러 낙하산 스테이지를 작동하십시오.
