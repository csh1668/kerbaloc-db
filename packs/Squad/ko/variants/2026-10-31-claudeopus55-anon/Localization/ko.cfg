		#autoLOC_8003447 = 커벌 스페이스 프로그램 1.11의 새로운 기능: 약간의 재조립 필요\n\n커벌 스페이스 프로그램의 새 버전을 선보이게 되어 기쁩니다. 이번 버전은 새로운 EVA 활동 추가에 관한 모든 것입니다!\n\n먼저, EVA 건설 모드를 추가했습니다. 이제 커벌 엔지니어가 밖으로 나가 새로운 레이저 용접기로 우주선을 개조할 수 있습니다. 각 파트의 무게에 따라 기체의 파트를 이동, 제거, 추가할 수 있으며, 저중력에서 작업하면 점점 더 큰 것을 지을 수 있습니다! EVA 건설 모드에는 배치/이동/회전 도구 일체와 언제나 유용한 중심 표시기(질량 중심, 양력 중심, 추력 중심)가 함께 제공됩니다.\n\nEVA 건설을 지원하기 위해 Breaking Ground 확장팩의 화물 시스템을 본편 게임으로 가져왔으며, 몇 가지 기능도 추가했습니다. 이제 여러분이 좋아하는 많은 파트를 화물로 운반할 수 있습니다. 다만 이제 부피 제한이 있으므로 온갖 잡동사니를 전부 실을 수는 없을 수도 있습니다. 하지만 이것도 걱정하지 마십시오. 새로운 화물 컨테이너 몇 종을 추가하고 일부 기존 파트에도 보관 공간을 추가했습니다.\n\n인벤토리 이야기가 나온 김에, 커벌의 낙하산과 제트팩은 이제 분리할 수 있으며 커벌 자신의 인벤토리에 보관됩니다. 따라서 다른 유용한 물품으로 교체하거나, 질량을 줄이기 위해 아예 빼 둘 수도 있습니다. 이제 커벌의 질량은 소지품에 따라 달라지며, 이는 기체에도 영향을 줍니다. 승무원실은 이를 보정하도록 수정되었지만, 이제 승무원을 일부만 태우고 발사하면 차이가 생깁니다.\n\n파트 수리가 이제 핵심 게임의 일부가 되었습니다. 태양 전지판이나 안테나처럼 예전에는 영구적으로 손상되던 파트를 이제 EVA 중인 커벌이 수리 키트를 하나 이상 사용하여 고칠 수 있습니다. 그리고 이 기능과 위의 각 신규 기능에 맞춰 새로운 계약도 추가했습니다.\n\n다음으로, 앞서 언급한 화물 컨테이너 외에도 여러 신규 파트를 게임에 추가했습니다! 우주선이나 야외 작업 공간을 밝혀 줄 부착식 및 전개식 신규 조명 여러 종과 새로운 조명 기능이 추가되었습니다. 더 작은 RCS와 RCS 블록 변형 구성도 새로 추가되었습니다. 커벌의 EVA 지속 시간을 늘려 줄 예비 EVA 연료 실린더도 있습니다. 또한 커벌이 밖에 나가 돌아다니며 실험을 해 볼 수 있는 새로운 EVA 과학 키트도 있습니다.\n\n마지막으로, 태양계 개편 작업이 막바지에 이르렀습니다. 이번에는 타일로, 밥, Val이 모두 새롭게 단장되었습니다.\n\n언제나처럼 변경 사항 목록에서 확인할 수 있는 세부 사항이 많이 있습니다. 커벌 스페이스 프로그램 1.11: 약간의 재조립 필요를 즐겨 주시기 바랍니다.
