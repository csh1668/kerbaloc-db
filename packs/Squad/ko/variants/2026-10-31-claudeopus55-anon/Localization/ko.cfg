		#autoLOC_6005008 = KSP 1.5: Dressed for Success에 오신 것을 환영합니다. 이번 릴리스에는 게임 전반에 걸친 다양한 개선 사항과 수정 사항, 그리고 몇 가지 깜짝 선물이 포함되어 있습니다.\n\n이제 커벌을 지휘석에 배치할 수 있으며, 분사 시간 표시기가 개선되어 우주선의 기동을 더 잘 계획하고 수행할 수 있습니다. 또한 (어쩌면) 다가올 불타는 최후를 맞이할 때에도 커벌이 최고로 멋져 보이도록 새 우주복을 준비했습니다.\n\n여러 파트의 수정, 조정, 개정과 함께 게임 전반에 걸친 다수의 소소한 조정 및 버그 수정도 포함되어 있습니다. 아울러 4K 디스플레이 지원이 향상되었고 소행성 물리도 세밀하게 조정되었습니다. 언제나처럼 전체 변경 및 개선 사항은 릴리스 노트에서 확인할 수 있습니다!\n\n플레이해 주셔서 감사합니다!
