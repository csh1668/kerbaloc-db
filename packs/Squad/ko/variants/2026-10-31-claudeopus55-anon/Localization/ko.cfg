		#autoLOC_900100 = 정말 열심히 눈을 찡그리면 보이는 빨간 점으로도 알려진 듀나는 오랫동안 커벌들에게 경이의 대상이었습니다. 이 행성은 눈에 띄는 붉은색과 초록색과의 뚜렷한 대비 덕분에 큰 경외를 받아 왔습니다.
		#autoLOC_900101 = 독특한 세계인 커빈에는 평탄한 평원과 우뚝 솟은 산맥, 넓고 푸른 바다가 있습니다. 커벌의 고향인 이곳은 의욕 넘치는 초록색 생명체들이 끝없이 불어나는 듯한 막대한 인구를 유지하기에 딱 알맞은 조건을 갖추고 있습니다.\n\n커빈 주위의 안정적인 궤도에 도달하는 것은 신생 우주 프로그램들이 가장 먼저 이루고자 하는 목표 중 하나입니다. 우주선을 궤도에 올릴 수 있다면 어디든 이미 절반은 간 것이라는 말이 있습니다.
		#autoLOC_900103 = 이브는 분명 태양계에서 가장 보라색인 천체입니다. 주로 아주, 아주 보라색인 빛깔 덕분에 크고 눈에 잘 띄는 천체 중 하나입니다.\n\n어떤 이들은 이브를 거의 커빈의 자매 행성으로 여깁니다. 뭐, 보라색이라는 점과 유독한 대기, 극한의 압력과 온도만 빼면 말입니다. 사실 별로 비슷하지 않지 않습니까? 대체 그 사람들은 누구입니까?
		#autoLOC_900105 = 모호는 커벌 신화에서 용암이 흐르는 바다가 있는 불타는 곳으로 등장합니다. 하지만 실제로는 훨씬 덜 흥미롭습니다.\n\n과학자들은 모호를 “이야기 속처럼 멋지게” 만들 방법을 궁리합니다. 그중 몇몇 아이디어는 항공우주 기술의 새로운 돌파구로 이어지기도 했습니다.
