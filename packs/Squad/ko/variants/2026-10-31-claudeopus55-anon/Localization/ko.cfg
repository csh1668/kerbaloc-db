		#autoLOC_6005016 = KSP 1.6: To Vee or not to Vee에 오신 것을 환영합니다! 멋진 새 기능을 잔뜩 준비했습니다. \n\n첫째, 항법 기능이 대폭 개선되었습니다! 우선 스테이징 다이어그램에 델타-V 표시가 추가되었습니다! 이제 Jeb이 아닌 조종사도 궤도에 도달할 연료와 추력이 충분한지 확실히 알 수 있습니다. 물론 Jeb은 한 번도 의심한 적이 없습니다. 이 표시는 스테이지별로도 작동하므로 스테이징 구성의 결함을 찾는 데 도움이 됩니다.\n\n둘째, KSC나 다른 착륙 지점으로 향할 수 있도록 항법 아이콘도 추가했습니다.\n\n마지막으로, 이제 여러 조종 파트에서 네비게이션 볼의 방향을 변경할 수 있어 비행이나 주행 중 올바른 방향을 잡는 데 도움이 됩니다. 덕분에 같은 파트를 주행용 구성과 착륙선 구성 모두에 사용할 수 있습니다. 힌트: Mk2 Lander Can의 변형을 확인해 보십시오!\n\n시각적인 개선도 훌륭합니다. 무엇보다 커벌이 드디어 헬멧을 벗을 수 있게 되었습니다. 하지만 우주로 날아가기 전에는 꼭 다시 쓰십시오. 아니, 그보다는 캡슐 안으로 돌아가십시오, 무모한 분들.\n\n지상과 우주 유영 중에 보여 줄 재미있는 대기 애니메이션도 새로 추가했습니다. 동적 큐브 맵을 추가하여 반짝이는 파트가 주변 환경을 반사하며, 그림자도 일부 조정했습니다. 마지막으로, 아름답게 개편된 파트도 훨씬 더 많아졌습니다!
