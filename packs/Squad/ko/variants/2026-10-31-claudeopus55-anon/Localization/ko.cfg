		#autoLOC_6012030 = KSP 1.7: Room to Maneuver에 오신 것을 환영합니다! \n\n이번 버전 업데이트는 이름 그대로 로켓을 우주에서 안내하는 데 도움이 되는 새로운 기능과 개선 사항으로 가득합니다. \n\n두 가지 새로운 항법 도구가 추가되었습니다. 비행 화면 상단을 보면 고도계 옆에 수상한 새 아이콘이 보일 것입니다. 고도계를 클릭하면 해수면 기준 표시와 지면 기준 표시가 전환되므로, 이제 Jeb도 계기만 보고 우주선을 착륙시킬 수 있습니다. 그리고 이번에는 정말로 부서지지 않은 채로 말입니다. \n\n비행 화면 왼쪽 하단의 다른 모드 전환 버튼들 사이에도 새 아이콘이 생겼습니다. 클릭하면 새로 추가된 '기동 모드'를 확인할 수 있습니다. 지도 모드와 비행 모드 모두에서 원점, 근점, 이심률 등의 궤도 정보를 확인할 수 있는 패널이 열립니다. 더 좋은 점은, 기동 노드를 설치하면 해당 기동을 조정할 수 있는 두 번째 패널이 나타나 행성 간 전이를 정밀하게 다듬을 수 있다는 것입니다. \n\n비주얼 면에서는 소형 기동 모터를 모두 업데이트했습니다. Ant, Twitch, Puff, Place-Anywhere 7, RV-105 Thruster Block, Vernor Engine의 아트가 개선되었으며, Twitch, Ant, Spider에는 새로운 변형이 추가되었습니다. 행성 사이를 순항하는 동안 즐길 수 있도록 은하 지도도 업그레이드했습니다.\n\n마지막으로, 파트 액션 창이 너무 커지면 스크롤 바가 표시되도록 했습니다. 모드로 창이 가득 찬 분들께 매우 유용할 것입니다. 일부 소형 기동 엔진의 수치도 새롭게 조정했습니다. 또한 3.75m 노즈콘과, Making History를 보유한 분들을 위한 5m 노즈콘도 추가되었습니다! \n\n1.7 Room to Maneuver 버전을 즐겁게 플레이하시기 바랍니다!
