		#autoLOC_8003363 = 커벌 스페이스 프로그램 1.9의 새로운 기능: 집만 한 곳은 없다!\n\n최신 버전에서도 커벌 스페이스 프로그램의 경험을 계속 개선했으며, 이를 여러분께 선보이게 되어 기쁩니다. 추가된 기능 중 상당수는 사용자 피드백에서 직접 비롯되었으며, 버그 수정과 성능 개선에도 중점을 두었습니다. \n\n가장 큰 변화는 텍스처와 셰이더를 개선하여 커빈 자체를 대폭 향상시킨 것입니다. 커빈이 이렇게 멋져 보인 적은 없었습니다! 또한 Skipper, Mainsail, Thumper를 새롭게 단장했습니다.\n\n그 밖의 새로운 기능으로, 일시 정지 중에 어떤 각도에서든 스크린샷을 쉽게 찍을 수 있는 카메라 모드와 파트에서 자원을 배출할 수 있는 새로운 배출 밸브 파트를 추가했습니다. Breaking Ground 사용자를 위해서는 블레이드 파트에 사이클릭 및 컬렉티브 편향 조종 기능을 추가하여 헬리콥터와 기타 회전익기를 더 쉽게 제작하고 조종할 수 있도록 했습니다.\n\n1.9에는 사용자 피드백을 바탕으로 한 여러 편의성 개선 사항도 포함되어 있습니다. 저희가 특히 좋아하는 것 중 하나는 시간 가속 시스템을 조정하여 행성 위 특정 고도에서의 가속 제한을 없앤 것입니다. 또 하나는 어느 천체에서든 기체를 착륙 상태로 또는 대기 중에 배치할 수 있는 새로운 치트입니다.\n\n또한 두 가지 큰 성능 개선도 이루어졌습니다. 단일 카메라 시스템으로 DX11 렌더링 성능이 향상되었고, KSPedia를 동적으로 불러와 메모리 사용량이 줄었습니다.\n\n커벌 스페이스 프로그램의 최신 버전을 즐겨 주십시오!\n
