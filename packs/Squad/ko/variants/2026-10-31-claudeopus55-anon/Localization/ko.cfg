		#autoLOC_8014130 = ESA와의 협력으로 제공되는 이 임무에서는 현재 실제로 진행 중인 BepiColombo 임무의 일부를 커벌 특유의 감각을 더해 재현합니다.\n\n이 버전에서는 모호에 도달하기 위한 궤도 기동을 생략하고, 대신 모호 근처의 요격 경로에서 임무를 시작합니다.\n\n목표는 모호의 자기장과 행성 지형을 조사할 궤도 탐사선 두 대를 모호에 보내고, 마지막으로 소형 착륙선으로 지표면에 도달하는 것입니다.\n\n행운을 빕니다!
		#autoLOC_8014131 = ESA와 협력하여 제작한 BepiColombo 미션입니다. BepiColombo 우주선의 여러 탐사선을 모호 주위에 배치하고 착륙선을 착륙시키는 것이 목표입니다.\n\n이 버전은 미션을 단축하여 모호 바로 앞에서 시작합니다.
