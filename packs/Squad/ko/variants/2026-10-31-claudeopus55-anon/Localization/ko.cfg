		#autoLOC_6011123 = 커벌 스페이스 프로그램 1.8: Moar Boosters에 오신 것을 환영합니다!\n\n새로운 파트와 업데이트, 개선 사항이 가득 담긴 최신 버전 업데이트를 선보이게 되어 정말 기쁩니다!\n\n먼저 Unity를 2019.2.2f1로 업그레이드했습니다. 이번 엔진 업그레이드로 비주얼, 셰이더, VFX가 개선되었습니다. 또한 점진적 가비지 컬렉션을 활용하게 되었는데, 모드를 설치한 환경에서 발생하던 프레임 끊김은 대개 GC 때문이었으므로 특히 모드 커뮤니티에 큰 도움이 될 것입니다. Unity 업그레이드와 함께 다양한 성능 향상에도 집중했습니다! 예를 들어 로켓이 "실수로" 무언가에 충돌할 때의 프레임 속도가 크게 개선되어, 여러분의 고통이 더 짧고 달콤해졌습니다.\n\n비주얼 개선은 엔진 업데이트에만 그치지 않습니다. 파트와 천체도 새롭게 단장했습니다. 문, 민무스, 듀나, 아이크, 이브, 길리 모두 특히 가까이에서 볼 때 훨씬 멋져졌으며, 3.75m 탱크도 마찬가지입니다!\n\n다음으로, 비행 중 액션/축 그룹 편집기를 추가했습니다! 액션 그룹 앱에서 새 버튼을 찾아보십시오. 이제 발사 후에도 기체의 조작 설정을 변경할 수 있어, 1.7 이후 추가된 다양한 액션 그룹 기능을 더욱 유연하게 활용할 수 있습니다.\n\n이번 업그레이드의 이름에 걸맞게, 새로운 고체 로켓 부스터 다섯 종을 추가했습니다! 기본 게임에 네 종, Making History에 한 종입니다. 이제 고체 모터의 직경은 하나뿐이 아닙니다. .625m, 1.25m, 2.5m, 그리고 DLC가 있다면 1.875m 부스터 중에서 선택할 수 있습니다. Making History에는 부스터 끝을 마감할 1.875 노즈콘도 추가되었습니다. Breaking Ground에도 새 파트가 추가됩니다. 새로운 덕트 팬 블레이드 세 종과 이에 맞는 덕트 팬 덮개 파트로 우주 탐사 드론을 더욱 재미있게 만들어 보십시오.\n\n최신 KSP 버전에는 이 밖에도 개선 사항이 너무 많아 여기서 모두 소개할 수 없습니다. 자세한 내용은 1.8 변경 내역을 꼭 확인하십시오.
