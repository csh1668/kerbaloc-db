		#autoLOC_313006 = 잘하셨습니다! 제 입으로 말하기는 뭣하지만, 꽤 잘 조립된 상단 스테이지입니다. 아래에 로켓을 충분히 달아 주기만 하면 궤도까지 올라갈 수 있을 것입니다. 이렇게 비교적 단순한 우주선이 있는 김에, 사용할 수 있는 다른 유용한 도구 하나를 살펴보겠습니다.\n\n우주선을 안정적으로 제어하며 비행하려면, 일부 파트를 우주선 내부의 \"질량 중심\"이라는 지점 주변에 신중하게 배치해야 합니다. 이 CoM은 한쪽의 질량과 반대쪽의 질량이 균형을 이루는 지점입니다. CoM을 지나도록 가해진 추력은 원치 않는 회전 없이 우주선을 이동시키고, CoM 주변에 (적절히) 가해진 추력은 우주선을 이동시키지 않고 회전시킵니다.\n\nCoM은 이처럼 유용하고 중요하기 때문에, 조립 건물에서 표식으로 보여 주는 도구를 추가했습니다. 이 표시기가 어떻게 작동하는지 살펴보겠습니다.\n\nCoM 표시기 토글을 <color=<<1>>>클릭</color>하여 직접 다뤄 보십시오. 아래는 표시기를 강조한 그림입니다.
