		#autoLOC_8014134 = BepiColombo 단열 대화창
		#autoLOC_8014135 = BepiColombo 단열재
		#autoLOC_8014136 = "실제 BepiColombo 우주선은 특별히 설계된 고온용 다층 단열재로 감싸여 있습니다. 이 단열재는 단열 폼을 사이에 둔 세라믹 기반 직물 두 겹과 여러 겹의 티타늄 포일로 구성되어 있습니다.\n\n이 단열재를 우주선에 맞게 제작하기 위해 절단 도구를 정기적으로 교체해야 했고, 바느질도 모두 손으로 해야 했습니다.\n\n발사장에서 직접 수작업 바느질을 해 줄 전문가들을 불러와야 했고, 이 작업을 위해 별도의 시간도 확보해야 했습니다."\n\t<color=#e6752a>Ulli</color> (프로젝트 매니저)
		#autoLOC_8014137 = BepiColombo 태양 전지 대화창
		#autoLOC_8014138 = BepiColombo 태양 전지
		#autoLOC_8014139 = 실제 BepiColombo 우주선의 태양 전지판은 고주파·고강도 자외선과 고온에 동시에 노출됩니다. 이 조합은 태양 전지 성능을 예상보다 빠르게 떨어뜨리는 것으로 알려져 있습니다.\n\n이 문제는 온도를 허용 최대치 이하로 유지하기 위해 태양 전지판의 방향을 계속 제어하는 복잡한 방식과 태양 전지 자체의 재설계로 해결되었습니다.\n\n"제 생각에 태양 전지판 개발은 가장 어렵고 위험한 기술적 난제였으며, 질량과 일정, 비용에 가장 큰 영향을 미쳤습니다. 특히 고온에서 고강도 자외선이 함께 일으키는 촉매 효과 때문에 태양 전지 성능이 급격히 떨어진다는 사실이 뒤늦게 밝혀졌습니다. 이 문제를 해결하는 데 오랜 시간이 걸렸고, 우주선 재설계에도 심각한 영향을 주었습니다."\n\t<color=#e6752a>Daniele</color> (시스템 엔지니어)
		#autoLOC_8014140 = BepiColombo 추진 장치 대화창
		#autoLOC_8014141 = BepiColombo 추진 장치
		#autoLOC_8014142 = "BepiColombo 우주선이 현재 우주선에 탑재되는 모든 추진 시스템을 모아 놓은 살아 있는 카탈로그라는 놀라운 사실에 주목해 주시기 바랍니다.\n\n실제로 운송 모듈에는 이온 추진 장치와 이원 추진제 시스템이 있습니다. 궤도선 하나에는 이른바 듀얼 모드라는 또 다른 이원 추진제 시스템과 단일 추진제 추력기 세트가 있습니다. 마지막으로, 다른 궤도선에는 냉가스 시스템이 장착되어 있습니다."\n\t<color=#e6752a>Daniele</color> (시스템 엔지니어)
		#autoLOC_8014143 = BepiColombo 이름 유래 대화창
		#autoLOC_8014144 = BepiColombo 이름의 유래
		#autoLOC_8014145 = BepiColombo는 Mercury의 독특한 '3:2 공명', 즉 태양을 두 번 공전하는 동안 세 번 자전하는 현상을 설명한 이탈리아의 엔지니어이자 수학자 Giuseppe "Bepi" Colombo(1920 - 1984)의 이름을 딴 것입니다.\n\n그는 또한 NASA에 Mariner 10을 궤도에 올려 1974-1975년 사이 Mercury를 세 차례 근접 비행할 수 있게 하는 방법을 조언했습니다.
		#autoLOC_8014146 = BepiColombo MPO 탐색 대화창
		#autoLOC_8014147 = BepiColombo MPO 목표
		#autoLOC_8014148 = 실제 BepiColombo 우주선이 찾아볼 것 중 하나는 Mercury에 생명체가 살 수 있는 환경이 국지적으로 존재할 가능성입니다.\n\nMercury의 자전축은 행성의 궤도면과 거의 수직을 이루고 있어, 극지방에서는 햇빛이 항상 낮은 각도로 표면을 스치듯 비춥니다. 극지방에 있는 큰 크레이터의 내부는 영구적으로 그늘져 있어 60K(-210°C) 이하의 혹한이 계속됩니다.\n\n1991년에 처음 얻은 극지방의 레이더 영상을 보면 큰 크레이터 내부가 레이더 파장을 매우 강하게 반사합니다. 이 현상을 설명할 수 있는 가장 흔한 물질은 바로... 얼음입니다!\n\n떨어지는 혜성과 운석에서 조금씩 유입된 얼음이 수십억 년에 걸쳐 Mercury의 극관에 갇혀 얼어붙었을 수 있습니다. 혹은 행성 내부에서 나온 수증기가 극지방에서 얼어붙었을 수도 있습니다.
