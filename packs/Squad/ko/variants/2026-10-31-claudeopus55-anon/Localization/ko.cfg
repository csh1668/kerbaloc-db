		#autoLOC_6002522 = 커벌 스페이스 프로그램 1.10: Shared Horizons의 새로운 기능\n\n커벌 스페이스 프로그램 1.10 업데이트에 오신 것을 환영합니다! 이번 업데이트는 특별합니다. 유럽 우주국(ESA)과 협력하여 환상적인 신규 콘텐츠와 KSP 태양계의 큰 변화를 준비했기 때문입니다.\n\n먼저, ESA와의 협업으로 실제 BepiColombo 및 Rosetta 임무의 KSP 버전이 추가되었습니다. 이 임무들은 Making History DLC 없이도 플레이할 수 있습니다!\n\n우주 상식에 밝은 분이라면 아시겠지만, Rosetta 임무를 추가한 이상 혜성을 게임에 넣지 않을 수 없었습니다! 혜성은 모든 게임 모드에 등장하며, 커리어 모드에는 혜성 관련 신규 계약이 몇 가지 추가되었습니다. 혜성은 사실적으로 변화하는 꼬리를 가지며, 일반 소행성보다 훨씬 큽니다. 성간 공간에서 찾아온 혜성을 만날 수도 있습니다!\n\n새 파트도 여럿 추가하고 기존 파트도 업데이트했습니다. 우선, 다양한 깃발 파트를 새로 추가하여 여러 임무나 여러 기관이 함께하는 기체를 다양한 깃발로 장식할 수 있습니다. 다음으로, 소형 Claw와 새로운 과학 실험인 자력계를 추가했습니다. 일부 탱크, SRB, 분리기에도 새 변형이 추가되었으며, 페어링은 새 변형뿐 아니라 기능도 일부 개선되었으니 꼭 확인해 보십시오!\n\n만우절(April Jool's Day) 게시물에서 눈치채신 분도 있겠지만, 줄이 새롭게 개편되었습니다. 물론 여전히 초록색입니다. 게다가 이제 줄의 구름이 움직입니다. 랑데부 지점을 향해 시간 가속을 하며 바라보면 감탄이 절로 나옵니다. 레이테 역시 개편되었으니, 아름다운 해변에 의자를 펴고 앉아 줄을 감상해 보십시오.\n\n다음으로, 새로운 EVA 우주복 선택기를 추가하여 다양한 우주복 종류와 색상을 고를 수 있습니다. 새로운 ESA 우주복 텍스처를 포함해, 커벌의 든든한 우주복을 개성 있게 꾸며 보십시오! 또한 모드 제작자가 직접 만든 우주복 텍스처를 게임에 추가하기도 훨씬 쉬워졌습니다.\n\n마지막으로, 수많은 버그 수정, 성능 개선, 편의성 향상이 이루어졌으니 변경 내역에서 확인하십시오. 커벌 스페이스 프로그램 1.10: Shared Horizons를 즐겁게 플레이하시기 바랍니다.
