		#autoLOC_8003234 = 커벌 스페이스 프로그램: Breaking Ground 확장팩은 호평받은 우주 비행 시뮬레이터 커벌 스페이스 프로그램 PC 버전의 두 번째 확장팩입니다.\n\n풍부한 기능을 갖춘 이 확장팩은 더 흥미로운 과학적 가능성과 확장된 도구를 추가하여, 천체에 도달한 이후 선택의 폭을 넓히는 데 중점을 둡니다.\n\n 이제 천체에 착륙한 후 다양한 데이터 수집 장비를 배치하여 과학 실험을 수행할 수 있습니다. 데이터를 수집하는 동안, 태양계 곳곳에 새로 추가된 지형 특징을 찾아 나서서 스캔하거나 커빈으로 가져와 정밀 조사할 수 있습니다. \n\n 또한 로봇 파트가 추가됩니다! 다양한 크기의 힌지, 피스톤, 로터, 회전 서보를 사용하여 기체의 가능성을 크게 넓힐 수 있습니다. 이 파트들은 모두 실제 힘과 토크, 전력 소비, 심지어 모터 질량까지 반영된 사실적인 물리 법칙에 따라 작동합니다.
