		#autoLOC_500000 = 옆으로 가도 똑같이 잘 추락할 수 있는데 왜 굳이 위로 올라가겠습니까? 이것이 C7 Aerospace Division의 오랜 모토입니다. 소박한 시작에서 오늘날의 거대 기업으로 성장하기까지, C7은 언제나 지평선을 향해 똑바로 앞만 바라보았습니다. 하지만 최근에는 하늘과 땅이 만나는 그 지점을 훨씬 더 잘 볼 수 있게 해 주는 파트를 만들고 있습니다. 회사의 고참들 사이에서는 불평도 좀 나왔지만, 그들조차도 어느 방향을 택하든 모험은 있다는 사실을 부정하지는 못합니다.
		#autoLOC_500001 = Dinkelstein 커먼은 우주선 업계에서 일종의 전설이 되었습니다. 특히 인상적인 점은, 그가 기록상 최초로 우주선이 조립되기 훨씬 전부터 이미 우주선을 만들고 비행했다고 강력히 주장한다는 것입니다. 이 때문에 그와 커빈 세계 최초 기록 보존 협회 사이에는 논란과 함께 상당히 어색한 분위기가 감돌고 있습니다. 그렇다 하더라도 Dinklestein's Emporium은 여전히 전통적이고 고풍스러운 회사로 대체로 좋은 평가를 받고 있으며, 그 제품들은 실제로 회사 주인보다 녹이 훨씬 덜 슬어 있습니다.
		#autoLOC_500002 = Experimental Engineering Group은 전형적인 신생 기업입니다. 적은 예산과 터무니없이 촉박한 마감 기한은 이들에게 평범한 일상입니다. 하지만 신생 기업임에도 Experimental Engineering은 순조롭게 출발했습니다. 무엇보다 교육적이고 재미있는 SC-9001 과학 실험 모듈 덕분에 업계에서 빠르게 이름을 알렸습니다. 그러나 대변인들의 눈물겨운 노력에도 불구하고, 아직 악평을 완전히 떨쳐내지는 못했습니다. 이 악평은 자사 제품 하나와 연구 개발 센터의 한 과학자가 애완동물로 기르던 작은 동물이 얽힌 사고 영상이 유출되면서 시작되었습니다. 일각에서는 이 사고 이후 회사가 자사 제품에 다가오는 모든 것의 안전에 극도로 신경 쓰게 되었다고 합니다. 심지어 회사 로고의 모서리까지 둥글게 다듬었습니다.
		#autoLOC_500003 = FLOOYD Labs는 단 한 가지 일에 집중하며, 그 일을 상상할 수 있는 최고 수준으로 해내는 회사입니다. 그 일이란 바로 액체를 한 곳에서 다른 곳으로 옮기는 것입니다. 이 회사의 주력 제품인 FTX-2 연료 덕트는 수년간의 연구 개발과 끝없는 커벌-시간을 들인 노력의 결실입니다. 아무리 차갑고, 밀도가 높고, 휘발성이 강하더라도 거의 무엇이든 얼마든지 펌핑할 수 있는 장치를 만들기 위한 노력이었습니다. 회사는 업계에 대한 이처럼 중요한 공헌으로 마땅한 명성을 누리고 있습니다. 또한 요즘에는 FTX-1 시리즈 리콜의 망신을 기억하는 이가 거의 없다는 데 대부분이 동의합니다. FTX-1 시리즈에는 작지만 매우 심각한 문제가 하나 있었습니다. 유체를 완벽하게 펌핑하기는 했지만, 엉뚱한 방향으로 펌핑했던 것입니다.
		#autoLOC_500004 = Goliath National Products는 경쟁에서 앞서 나가는 데 무엇이 필요한지 잘 알고 있습니다. 바로 세부 사항을 꿰뚫어 보는 눈, 그리고 용감한 엔지니어들에게 필요한 것을 냄새 맡는 예리한 코입니다. 이 시대의 위대한 우주선 상당수가 Goliath의 노즈콘을 달고 있으며, 이 노즈콘은 우주선의 연약하고 말랑하지만 중요한 부분, 즉 또 다른 모험을 떠나는 우리 영웅들 앞에서 공기를 비켜내는 데 탁월합니다.
		#autoLOC_500005 = 이 작은 회사는 부족한 경험과 명성을 프로젝트의 엄청난 야심으로 메웁니다. 이 회사의 첫 제품은 매우 거대한 이동식 처리 연구소였습니다. 소문에 따르면 이 연구소는 원래 실험적이고 어쩌면 불법일지도 모르는 연료 혼합물을 몰래 제조하기 위한 이동식 처리 시설로 개발되었다고 합니다. 이 혼합물은 현재 사용 가능한 추진제보다 훨씬 강력했으며, 특유의 푸른빛을 띠었다고 전해집니다. 하지만 이 소문은 한 번도 입증된 적이 없으며, 이 수수께끼의 푸른 추진제를 직접 보았다는 믿을 만한 출처도 아직 없습니다. 소문을 없애려는 거듭된 노력에도 불구하고, 회사는 여전히 (아마도 부당한) 나쁜 명성에 시달리고 있습니다. 회사는 이러한 첫인상을 만회하려고 비슷한 규모의 다른 회사보다 훨씬 많은 보수를 제시합니다. 물론 이것이 현재 이미지를 개선하는 데 별 도움이 되지 않는다는 점은 인정할 수밖에 없습니다.
		#autoLOC_500006 = 우주선 전자 장비 분야를 선도하는 이름 중 하나입니다. 단지 이름이 멋지게 들려서만은 아닙니다. Ionic Symphonic Protonic Electronics는 간단한 통신 장치부터 진정한 최첨단 장비에 이르기까지 방대한 부품 카탈로그를 보유하고 있습니다. 덕분에 이들의 제품은 항공우주 엔지니어들 사이에서 큰 인기를 얻었고, 동시에 실용주의자들인 Probodobodyne 사람들의 깊은 적대감도 키우게 되었습니다.
		#autoLOC_500007 = Jeb's Junkyard가 도저히 넘을 수 없어 보이는 역경 앞에서도 흔들림 없는 의지가 승리를 거둔 가장 훌륭한 사례 중 하나라는 데에는 모두가 동의합니다. 커벌 종족이 깊은 우주를 향해 내디딘 첫걸음 중 일부가 시작되었다고 전해지는 이 수수한 고물상은, 갈수록 늘어나는 우주선 부품 수요를 감당하기 위해 시설을 확장해야 했고, 이제는 훨씬 더 큰 고물상이 되었습니다. Jeb's Junkyard는 커빈에서 가장 상징적인 이름 중 하나가 되어 단순히 사랑받는 브랜드 이상의 존재가 되었습니다. 이제 이곳은 상황의 '중력'을 심하게 과소평가하면서도 불가능에 도전하려는 커벌의 멈출 수 없는 열정을 상징하며 당당히 서 있습니다.
		#autoLOC_500008 = Kerbal Motion LLC는 처음에 네모난 바퀴로 바퀴 사업을 시작했습니다. 이들은 면을 하나씩 늘려 가다가 마침내 좀 더 구형에 가까운 형태에 정착했습니다. 집중적인 테스트 끝에 둥근 바퀴가 정말로 훨씬 부드러운 승차감을 준다는 의심이 사실로 확인되었습니다. 이 난관을 극복하자 Kerbal Motion LLC의 두뇌들은 자신들의 상당한 회백질을 또 어디에 쓸 수 있을지 고민하기 시작했습니다. 그리고 결국 그래버를 만들기로 했는데, 주된 이유는 그러면 음료수를 집으려고 그렇게 멀리 손을 뻗지 않아도 되기 때문이었습니다.
		#autoLOC_500009 = 모든 사건의 최초 사례를 추적하고 기록하는 데 전념하는 기관인 Kerbin World-Firsts Record-Keeping Society는 지금까지 아무도 해낸 적 없는 일, 특히 우주 탐사 분야의 업적을 이룬 이에게 보상을 주기 위한 비영리 단체입니다. 하지만 이들의 일은 생각보다 훨씬 까다롭습니다. 어떤 일이든 사상 최초로 해냈다는 명성은 상업 기업들에게도 탐나는 목표물이며, 그런 기업들은 그러한 사건의 공식 후원사가 될 기회를 결코 놓치지 않기 때문입니다. 이 협회의 계약을 맡는다면 돈을 바라고 하는 일이 아니라는 메시지를 확실히 전할 수 있으며, 이는 언제나 전할 가치가 있는 메시지입니다. 사실 상금은 대부분 상징적인 수준이라 그것이 거의 유일한 보상이기도 합니다.
		#autoLOC_500010 = Kerbodyne은 항공우주 업계에서 비교적 신생 기업이지만, K 시리즈 엔진과 연료 탱크로 짧은 기간에 상당한 명성을 쌓았습니다. 그 덕분에 Kerbodyne은 작년 우주선 개발자 컨벤션에서 "최우수 데뷔상" 후보에 오르기까지 했습니다. 아쉽게도 상은 다른 회사에 돌아갔지만, Kerbodyne 팬들은 회사와 제품에 대한 애정을 공개적으로, 그리고 아주 요란하게 표현하는 것으로 유명합니다.
		#autoLOC_500011 = Kerlington은 획기적인 신기술을 선보여 온 오랜 역사를 지니고 있으며, 그중 상당수는 이제 로켓 공학과 항공우주 공학에 없어서는 안 될 기술로 여겨집니다. 이로 인해 충성스러운 Kerlington 팬층이 두텁게 형성되었으며, 그에 못지않게 불만을 품은 경쟁사 무리도 생겨났습니다.
		#autoLOC_500012 = Maxo Construction Toys의 엔지니어들은 늘 무언가를 만드는 일을 즐겼습니다. 특히 작은 플라스틱 블록으로요. 그래서 머리를 맞대고 은행에 돈이 좀 모이자, 이번에는 가벼운 금속 조각으로 같은 일을 해 보기로 했습니다. Maxo의 금속 구조물은 내구성과 마감 품질로 정평이 나 있습니다. 실제로 또 한 번의 화려한 "착륙" 잔해를 뒤져 보면, 이들의 파트는 거의 언제나 멀쩡한 상태로 발견됩니다.
		#autoLOC_500013 = Moving Parts Experts Group은 가장 뛰어난 인재들을 한자리에 모아 우주선 건조를 위한 진정으로 혁신적이고 획기적인 기술을 개발하려는, 대체로 비영리적인 계획으로 출발했습니다. 이런 사업들이 흔히 그렇듯 초기 투자 자금은 금세 바닥났고, 이들은 팔 수 있는 물건을 서둘러 개발해야만 했습니다. 그 결과 이 그룹은 늘 바쁘고 늘 돈에 쪼들린다는 명성을 얻게 되었습니다. 그래도 여전히 처음의 동기에 최대한 충실하려 애쓰고 있으며, 현재의 한계를 넘어서려는 모든 도전을 언제든 기꺼이 지원합니다.
		#autoLOC_500014 = 최대한 많은 파괴를 일으키는 것으로 명성을 쌓은 회사답게, O.M.B.는 항공우주 산업에서 자사의 극도로 불안정한 장치들이 놀라울 만큼 잘 어울리는 자리를 찾아냈습니다. 우주선을 여러 개의 작은 우주선으로 쪼개야 할 때, 이 회사의 정밀 분리기는 누구에게도 뒤지지 않습니다. 그러나 훨씬 강력한 분해 도구라고 대대적으로 광고한 다른 철거용 제품들은 그만큼 성공하지 못했습니다. O.M.B.는 그 "누가 봐도 더 나은" 제품들이 왜 그리 좋은 반응을 얻지 못했는지 아직도 의아해하고 있습니다.
		#autoLOC_500015 = Periapsis Rocket Supplies는 비밀스럽기로 악명 높은 회사입니다. 이들이 만드는 얼마 안 되는 부품 목록은 회사를 둘러싼 신비감을 더할 뿐입니다. 많은 이들이 왜 부품을 더 만들지 않느냐고 묻지만, Periapsis는 이에 대해 "우리가 다음에 무엇을 할지 기다려 보십시오!"라고 답합니다. 하지만 이 답변이 적어도 3세대째 이어져 왔기 때문에, 많은 이들이 꽤 오랫동안 답을 기다리고 있습니다.
		#autoLOC_500016 = Probodobodyne은 한때 업계를 선도하는 (몇 안 되는) 이름 중 하나였습니다. 세월이 흐르며 회사는 다소 시대에 뒤처졌지만, 우주 탐사는 최소한의 기술적 도움만으로 그 정복의 난관을 극복할 수 있는 소수만의 특권이어야 한다는 철학을 여전히 고수하고 있습니다. 이들의 제품은 그러한 실용적이면서도 어쩌면 시대에 뒤떨어진 관점을 반영합니다. 우주여행을 "초창기"보다 훨씬 쉽게 만들어 주는 대안을 내놓는 신생 회사들이 주변에 수없이 생겨나고 있는데도 말입니다. 그럼에도 이 회사는 소수지만 충성스러운 열성 팬층을 유지하고 있으며, 이들은 최고의 우주비행사와 엔지니어만으로 이루어진 엄선된 업계라는 회사의 비전을 신념으로 삼고 살아갑니다.
		#autoLOC_500017 = 우주 프로그램 자체의 연구 개발 부서입니다. 유명 로켓 과학자 Wernher von 커먼이 이끄는 이들은 이 모든 활동의 두뇌입니다. 지칠 줄 모르는 지식욕에 이끌려, 아무리 사소하거나 쓸모없어 보이는 데이터도 결코 가볍게 여기지 않으며, 커벌 종족의 지식을 늘리는 것을 가장 큰 동기로 삼습니다. 우리의 상주 천재들이 바라는 것은 단 두 가지입니다. 과학에 대한 공헌을 학술적으로 정당하게 인정받는 것, 그리고 모든 우주 비행사가 제발 부츠를 닦지 않은 채 연구실에 들어오지 말아 주는 것입니다.
		#autoLOC_500018 = Reaction Systems는 유일하게 성공한 제품인 Place-Anywhere Linear RCS Port로 상당한 성공을 거둔 소규모 회사입니다. 요즘 이들이 무엇을 개발하고 있는지는 아무도 확실히 알지 못합니다. Reaction Systems는 분명 업계에서 가장 큰 회사는 아니지만, 모든 개척적인 시도를 지원함으로써 이를 만회하려 합니다. 또한 과학 수집 계약을 적극적으로 제안하는 모습은 이들이 무언가를 꾸미고 있다는 추측에 힘을 실어 줍니다.
		#autoLOC_500019 = 명실상부 업계 최대의 로켓 부품 공급업체인 Rockomax의 제품은 우주로 가는 가장 손쉬운 방법으로 널리 알려져 있습니다. 이 때문에 고급스럽거나 전위적인 성향의 엔지니어들 사이에서는 다소 부정적인 명성을 얻었으며, 일부는 Rockomax 브랜드 제품을 사용한 적이 있다는 사실조차 대놓고 인정하지 않습니다. 그렇다 해도 업계에서 Rockomax가 차지하는 거대한 존재감은 부정할 수 없으며, 고급 로켓 브랜드 특유의 '세련된' 느낌은 없을지라도 이들의 제품은 실제로 가성비가 상당히 뛰어납니다. 워낙 거대한 기업이므로 특별한 할인은 기대하지 않는 것이 좋습니다. 이미 모든 고객에게 대량 구매 할인을 제공하고 있으며, 협력 브랜드의 제품을 함께 사용하면 '초특가' 혜택도 받을 수 있습니다. 물론 이 모든 혜택은 창고형 매장에서 쇼핑할 때 회원 카드를 지참했을 경우에 한합니다.
		#autoLOC_500020 = Rokea는 주로 '수직 이동성 향상 장치' 제품으로 알려져 있으며, 이 제품이 단순한 '사다리'로 오해받지 않도록 각별히 애쓰고 있습니다. 일각에서는 그 노력이 처참하게 실패하고 있다고 말하지만, Rokea 직원들은 하나같이 말이 들리는 거리에 있는 사람이라면 누구에게든 사다리와 수직 이동성 향상 장치의 차이점을 열성적으로 설명합니다. 어쩌면 이런 홍보 전략이 아무도 관심을 두지 않는 이유 중 하나일지도 모릅니다.
		#autoLOC_500021 = 매우 훌륭한 통조림 식품으로 유명한 Sean's Cannery가 왜 항공우주공학 분야에 뛰어들었는지 의문을 품는 이들이 많습니다. 이러한 비판에도 불구하고, 대표 제품인 Mk2 Lander Can이 신뢰할 수 있는 모듈임을 여러 차례 입증했으며, 어쩌면 당연하게도 오늘날 가장 밀폐성이 뛰어난 승무원 탑승 모듈 중 하나라는 사실에는 누구도 이의를 제기할 수 없습니다. Lander Can 승무원들은 보관해 둔 간식을 바삭하고 신선하게 유지해 준다며 이 모듈을 자주 칭찬하고, 다른 포드에서는 임무 시작 며칠 만에 간식이 눅눅해진다고 불평합니다.
		#autoLOC_500022 = STEADLER는 친절하거나 유연한 회사로 알려져 있지 않습니다. 오히려 군대식이고, 엄격하며, 타협을 모른다는 형용사가 훨씬 잘 어울립니다. 일각에서는 로켓과 극초음속 항공기의 제어 시스템을 주로 설계하는 회사로서 좋은 자질이라고 말하지만, 다른 이들은 이 회사가 사실 자아를 얻은 폭주 유도 모듈에 의해 운영되고 있다고 주장합니다. 확실히 알려진 것은 정문 경비가 너무 까다로워서 어떤 관찰도 허용하지 않는다는 것, 그리고 그들의 전기 충격기가 매우 빠르게 재충전된다는 것뿐입니다.
		#autoLOC_500023 = 온갖 용도의 구조 부품을 생산하는 최대 제조사 중 하나인 StrutCo는 어느 모로 보나 확고하게 자리 잡은 회사입니다. 이들이 끝내 받아들이지 못한 단 한 가지는, 전설적인 EAS-4 지지대 연결기가 사실 Kerlington Model Rockets의 발명품이라는 사실입니다.
		#autoLOC_500024 = Vac-Co는 업계에서 비교적 새로운 이름입니다. 그동안 가정용 청소 장비와 소형 가전 제조사로서의 경험치만 쌓아 온 탓에, 최근 항공우주 공학 분야 진출은 적지 않은 회의론에 부딪혔습니다. 그럼에도 이들은 자신들이 무엇을 하는지 잘 아는 듯하며, 우주비행기용 공기 흡입구 분야에서 상당히 혁신적인 제품을 선보이고 있습니다.
		#autoLOC_500025 = WinterOwl은 제공하는 제품의 수만 놓고 보면 다른 대형 항공기 회사들과 결코 비교할 수 없습니다. 하지만 현재 운영 중인 회사 가운데 가장 오래된 곳 중 하나이기 때문에 업계에서 가장 잘 알려진 이름 중 하나입니다. 덕분에 친근하고 믿을 수 있는 파트너라는 명성을 얻었고, 여러 다른 회사들과도 좋은 관계를 유지하고 있습니다. 항공우주 업계에서는 WinterOwl이나 그 제품을 험담하는 것을 매우 무례한 행동으로 여깁니다.
		#autoLOC_500026 = Zaltonics는 전자 부품 업계에서 강력한 선두 주자로 알려진 회사는 아닙니다. 오히려 야망이 다소 부족하고 실용성만 따지는 회사로 통합니다. 하지만 바로 이런 특성 덕분에 Zaltonics는 나름대로 없어서는 안 될 존재가 되었습니다. 남들이 꺼리는 재미없는 장치의 제조를 기꺼이 맡아 왔고, 이를 빠르고 비용 효율적으로 해내는 데 상당히 능숙해졌기 때문입니다. 이들의 제품이 크게 인기를 끌지는 않겠지만, 멋진 원격 유도 장치의 전력이 바닥나면 아마도 Zaltonics 배터리로 전원을 공급하게 될 것입니다.
