		#autoLOC_6002496 = 자기장은 우리 주변 어디에나 존재합니다. 커벌 과학자들은 천체의 자기장에 대해 배우는 것이 그 내부에서 무슨 일이 일어나고 있는지에 대한 흥미로운 통찰을 제공할 수 있다는 것을 알고 있습니다. 하지만 우주선 또한 전자 장치와 전기 기계식 액추에이터를 작동할 때 자기장을 방출합니다.\n\n어떤 이유에서인지 엔지니어들은 우주선 전체를 끄거나 플라스틱으로 제작하는 것을 원치 않았고, 이에 실험 공학 그룹은 이 민감한 자력계를 신축식 붐에 부착하여 문제를 해결했습니다.\n\n경고: 진공 상태의 우주 공간 이외의 장소에서 사용할 경우 붐에 대한 보증이 무효화됩니다.
