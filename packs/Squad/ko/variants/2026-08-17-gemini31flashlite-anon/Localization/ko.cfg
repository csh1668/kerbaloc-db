		#autoLOC_6002551 = 이 계약을 수락하면 추적소에서 로버를 볼 수 있습니다. 누락된 부품을 평가하고 목표 웨이포인트로 이동할 계획을 세우십시오. 로버에 부품을 부착하려면 엔지니어를 보내야 할 것입니다.
