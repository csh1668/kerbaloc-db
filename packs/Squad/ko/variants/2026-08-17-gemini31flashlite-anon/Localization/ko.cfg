		#autoLOC_900077 = 이 위성은 먼지가 많은 들판 근처에 설치된 망원경으로 관측할 때 마치 꽃가루 알갱이처럼 보여서 발견하기가 특히 어려웠습니다.\n\nPol은 누군가 얼룩을 없애려는 또 다른 시도가 실패로 돌아간 후, 포기하는 대신 꽃가루의 위치를 기록하기로 마음먹으면서 마침내 발견되었습니다.
		#autoLOC_900080 = Tylo는 커벌 천문학회에서 발견한 첫 번째 줄(Jool)의 위성입니다. 사무실 벽에 걸어둘 줄(Jool)의 완벽한 사진을 찍으려던 여러 번의 실패 끝에, 떠돌아다니던 하얀 얼룩이 사실은 위성이라는 사실이 밝혀졌습니다.\n\n과학자들은 지표면에서 레이테(Laythe), 발(Vall), 그리고 줄(Jool)이 머리 위에 떠 있는 광경은 "꽤 볼만할 것"이라고 추측합니다.
		#autoLOC_900082 = Vall은 Jool의 위성 중 마지막으로 발견된 위성 중 하나입니다. 좌절한 과학자들은 망원경 렌즈에서 그것을 닦아내려고 계속 시도했습니다. 결국 반품된 망원경이 쏟아지자, Advanced Optics Co.는 마침내 그것이 하늘에 있는 실제 물체라고 말해주기로 결정했습니다.
		#autoLOC_900084 = 레이테(Laythe)가 처음 발견되었을 때, 담당 과학자가 커빈(Kerbin)을 보고 있다고 착각하여 기록에 남기지 않았습니다.\n\n다행히 한 용기 있는 인턴이 "망원경은 그렇게 작동하지 않습니다"라고 알려주어 이 오류는 수정되었습니다.\n\n그 인턴은 얼마 지나지 않아 "승진"하여 실험용 로켓 테스트 프로그램으로 옮겨졌습니다.
		#autoLOC_900086 = Ike는 Duna 궤도를 도는 모습이 가끔 관측되는 비교적 크고 회색인 물체입니다. 과학자들은 Ike가 모행성 근처를 공전하려는 모든 물체를 교묘하게 방해하기에 완벽한 위치에 있다고 가정해 왔습니다.
		#autoLOC_900088 = 민무스(Minmus)는 커빈(Kerbin)을 공전하는 가장 작은 위성입니다. 날씨가 맑은 날 커빈의 지표면에서 하늘을 보면 아주 작은 푸른 점으로 보입니다.\n\n망원경 렌즈에 묻은 먼지나 죽은 픽셀로 오해받기도 하지만, 커벌 천문학회의 최고 두뇌들은 이것이 엄연한 실제 위성이라고 장담합니다.
		#autoLOC_900090 = 문(Mun)은 커빈(Kerbin)을 공전하는 거대한 위성입니다. 대체로 회색을 띠며, 매끄러운 표면 곳곳에 다양한 크기의 분화구가 흩어져 있습니다.\n\n문의 발견은 커벌 진화 과정에서 가장 중요한 돌파구 중 하나로 널리 인정받고 있습니다. 물론 그리 오래전 일은 아니지만, 지금의 커벌들이 그때보다 더 현명하고 진화했다는 점은 부정할 수 없습니다.
		#autoLOC_900092 = 길리(Gilly)는 이브(Eve)의 궤도를 떠도는 울퉁불퉁한 바위입니다. 커벌 천문학회가 발견한 자연 위성 중 단연코 가장 작습니다.\n\n발견 과정에서 눈을 가늘게 뜨고 집중하느라 눈의 피로가 심했기 때문에, 이제 안경을 쓰는 것은 유능한 천문학자의 상징이 되었습니다.
		#autoLOC_900094 = Eeloo가 적절한 행성인지 아니면 단지 "태양 주위를 도는 얼음 덩어리"인지에 대해 상당한 논란이 있었습니다. 이 문제를 해결하기 위해 열린 대부분의 학술 회의가 좋은 날에는 사소한 욕설로, 나쁜 날에는 전면적인 난투극으로 변질되었기 때문에 논쟁은 여전히 진행 중입니다.
		#autoLOC_900096 = 줄(Jool)은 주로 녹색을 띠는 상당히 거대한 행성으로 유명합니다. 커벌 종족은 하늘에서 처음 발견된 이후로 줄곧 이곳을 방문하기를 열망해 왔습니다. 철학자들은 이 소용돌이치는 녹색 행성이 건강한 색깔을 띠고 있으니 방문하기에 정말 좋은 곳일 것이라고 추론합니다.\n\n망원경으로 줄(Jool)을 보면 흐릿하게 보입니다.
		#autoLOC_900098 = 드레스는 매우 작은 행성입니다. 왜소행성으로 간주된 첫 번째 행성이었습니다. 궤도가 매우 불규칙하고 크기까지 작아 발견하는 데 오랜 시간이 걸렸는데, 과학자들이 행성이 있을 것으로 예상한 곳에 절반의 확률로 없었기 때문입니다.\n\n우주에서 좋지 않은 구역을 자주 드나드는 특성 때문에, 이 왜소행성은 과학계로부터 공식적으로 “믿을 수 없음”이라는 딱지가 붙었습니다.
		#autoLOC_900100 = 눈을 가늘게 뜨고 아주 열심히 보면 보이는 빨간 점으로도 알려진 Duna는 오랫동안 커벌 종족에게 경이로움의 대상이었습니다. 이 행성은 눈에 띄는 붉은색과 녹색과의 극명한 대비 때문에 많은 경외심을 불러일으켰습니다.
		#autoLOC_900101 = 커빈은 평평한 평원, 솟아오른 산맥, 넓고 푸른 바다를 가진 독특한 행성입니다. 커벌들의 고향인 이곳은 수많은 열정적인 녹색 생명체들이 살아가기에 딱 알맞은 환경을 갖추고 있습니다.\n\n커빈 주위의 안정적인 궤도에 진입하는 것은 신생 우주 프로그램이 가장 먼저 달성하고자 하는 목표 중 하나입니다. 우주선을 궤도에 올릴 수 있는 자는 어디든 갈 수 있는 절반의 준비를 마친 것이나 다름없다고들 합니다.
		#autoLOC_900103 = 이브(Eve)는 태양계에서 가장 보라색인 천체임이 확실합니다. 매우 강렬한 보라색을 띠고 있어 가장 크고 눈에 잘 띄는 천체 중 하나입니다.\n\n어떤 이들은 이브를 커빈(Kerbin)의 자매 행성으로 여기기도 합니다. 음, 보라색이라는 점과 독성 대기, 그리고 극심한 압력과 온도는 차치하고 말이죠. 사실, 전혀 비슷하지 않지 않나요? 도대체 그 사람들은 누구일까요?
		#autoLOC_900105 = 모호(Moho)는 커벌 신화에서 흐르는 용암의 바다가 있는 불타는 장소로 묘사됩니다. 하지만 실제로는 그보다 훨씬 덜 흥미롭습니다.\n\n과학자들은 모호를 "이야기 속처럼 멋지게" 만들 방법을 추측하고 있습니다. 그 아이디어 중 일부는 항공우주 기술의 새로운 돌파구로 이어지기도 했습니다.
		#autoLOC_900108 = 활주로에서는 Spaceplane Hangar에서 제작된 우주선이 이륙 속도에 도달할 수 있는 길고 평평한 표면을 제공합니다. 상상컨대, 그러한 항공기는 그곳에 다시 착륙할 수도 있을 것입니다.
		#autoLOC_900109 = 우주 비행기
