		#autoLOC_316043 = 좋습니다, 계속 진행하겠습니다. 이번 귀환 비행은 문 표면에서의 상승, 커빈 전이 분사, 문 귀환 재진입이라는 세 가지 뚜렷한 단계로 구성됩니다. 첫 번째 단계인 낮은 문 궤도를 확립하면 다음 단계에 대한 세부 사항을 다루겠습니다.\n \n지금은 여러분이 해야 할 일은 다음과 같습니다(항상 그렇듯이 조종을 돕기 위해 목표 마커를 추가하겠습니다):\n\t* 스로틀을 올린 다음 즉시 90도 방위선(동쪽)을 따라 마커를 따라 기수를 내리십시오.\n\t* 원점이 50km 이상이 되면 스로틀을 끄십시오.\n\t* 원점에서 궤도를 원형으로 만드십시오.\n \n이것은 '궤도 진입(Go For Orbit)' 튜토리얼에서 커빈을 상승할 때보다 훨씬 간단할 것입니다. 문은 커빈보다 중력 우물이 훨씬 얕기 때문에 단일 스테이지 하나만 있으면 되며, 그마저도 다 쓰지 않습니다. 기억하십시오, 이것은 문에 착륙할 때 사용했던 바로 그 스테이지이며, 집으로 돌아갈 때도 사용할 것입니다. 문의 중력은 커빈보다 훨씬 약하고 대기의 저항도 없기 때문에, 이 스테이지 하나만으로도 착륙 및 귀환 임무 전체를 수행할 연료 용량이 충분합니다.
