		#autoLOC_501210 = Thunderbird
		#autoLOC_501211 = Thunderbird는 항공기계의 머슬카입니다. Osprey와 성능 면에서 대체로 비슷하지만, 더 높은 최고 속도를 위해 Osprey의 우아한 라인(및 수상 비행기로서의 능력)을 포기했습니다. 사실 Thunderbird는 기본적으로 조종석과 날개를 볼트로 고정한 엔진에 불과하며, 따라서 테스트 조종사들에게 큰 성공을 거두었습니다. 최고의 속도를 내려면 연료가 떨어졌을 때 드롭 탱크를 반드시 분리하십시오!
		#autoLOC_501212 = Velociteze
		#autoLOC_501213 = 두 개의 소형 기본 제트 엔진을 사용하는 소형 인원 수송기입니다. 터보팬만큼 효율적이지는 않지만, 이 역할에서 훌륭한 서비스를 제공합니다(애프터버너나 터보램제트보다 연료 소모가 훨씬 적습니다). Velociteze는 Gull과 Aeris 3A에 숙달된 훈련생이 다발 엔진 항공기로 넘어가고자 할 때(그리고 승객을 수송하는 유용한 임무를 수행할 때) 적합한 다루기 쉬운 항공기입니다.
		#autoLOC_501214 = AeroEquus
		#autoLOC_501215 = 네 다리로 달리는 울음소리를 내는 육상 생물입니다.\n\n전설에 따르면 Equus는 용감한 커벌들이 탈 수 있다고 합니다. 우리가 아는 것은 이 네 개의 부스터가 달린 짐승을 타고 문을 지나거나, 정말 무모하다면 민무스까지 가는 데에는 용감한 커벌이 필요하다는 사실뿐입니다.
		#autoLOC_501216 = ComSat Lx
		#autoLOC_501217 = 안테나와 태양광 발전기가 달린 작은 위성인가요?\n우주로 보낼 발사체인가요?\n\n둘 다 준비되었습니다!
		#autoLOC_501218 = Dynawing
		#autoLOC_501219 = Dynawing은 Dynawing 궤도선(KS25 엔진 2기 탑재)과 이를 위한 외부 연료 탱크, 그리고 2기의 Kickback 부스터로 구성된 부분 재사용 셔틀입니다. 저렴한 우주 진출의 "차세대" 주자로 칭송받으며 최대 16톤의 탑재물(참조 탑재물 포함)을 운송할 수 있지만, 조종이 다소 까다롭고 일반 로켓만큼 비용이 많이 들며 상승 중 폭발이라도 발생하면 Kraken의 가호가 필요할 것입니다. 하지만 매우 미래지향적이고 멋진 외관을 자랑하여 비행 승무원들이 줄을 서서 기다리고 있습니다.\n\n주 엔진은 대략 질량 중심을 관통하여 분사합니다. 셔틀이 스택의 '아래쪽'에 오도록 뒤집어서 상승하고, 진행 방향 벡터를 약간 앞서 나가십시오. 첫 번째 분사에서 외부 탱크의 추진제를 모두 소모하고, 45 km 고도에서 수평을 유지하며 계속 분사하여 약 75 x 0 km의 "궤도"에 도달하도록 설계되었습니다. 그 후 탱크를 스테이지 분리하고, 6번 키를 눌러 주 엔진을 끄고, 다시 스테이지를 작동하여 OMS 엔진을 점화한 뒤, 이를 이용해 원 궤도화하고 나중에 궤도 이탈을 수행하십시오. 높은 받음각(AoA)으로 재진입하며 RCS로 제어하십시오.
		#autoLOC_501220 = GDLV3
		#autoLOC_501221 = Generally Designed Launch Vehicle 3(범용 설계 발사체 3)는 고객의 요구에 맞춰 조정할 수 있는 적응형 설계입니다. 사실 GDLV3는 너무 널리 사용되어 누구도 자신이 실제로 이 기체를 소유했다고 말할 수 없을 정도입니다.
		#autoLOC_501222 = 이온 추진 우주 탐사선
		#autoLOC_501223 = 이 작은 탐사선은 귀엽고 보잘것없어 보일지 모르지만, 장거리 안테나를 펼치면 여전히 똑같이 보입니다.\n\n이온 엔진은 이렇게 작은 우주선치고는 매우 효율적이어서, 누군가 궤도까지 올려주기만 한다면 정말 멀리까지 갈 수 있습니다.
		#autoLOC_501224 = Jumping Flea
		#autoLOC_501225 = Jumping Flea는 부품 대부분을 회수해 온 놀이공원 놀이기구의 이름을 따서 명명되었습니다. 우주 끝까지 갈 수는 없겠지만, 확실히 우주 탐사를 시작하는 데 큰 도움을 줄 것입니다!
		#autoLOC_501226 = Kerbal 1-5
