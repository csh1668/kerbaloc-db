		#autoLOC_6002509 = 장기 주기 혜성 샘플
		#autoLOC_6002510 = 성간 혜성 샘플
		#autoLOC_6002511 = 과거 어느 시점에 이 혜성은 태양 주위의 훨씬 좁은 궤도로 진입했습니다. 지금 이곳에 도착한 것은 다행입니다. 태양이 휘발성 물질을 증발시키고 있어 혜성으로서의 지위를 오래 유지하지 못할 수도 있기 때문입니다. 이 녹아가는 아이스크림 공을 잘 채취하여 보존하고 분석을 위해 가져오십시오.
		#autoLOC_6002512 = 이 태양 여행자는 줄의 거대한 중력장에 이끌려 주기적인 궤도를 돌며 내태양계를 정기적으로 방문하게 되었습니다. 이 샘플은 줄 궤도 너머의 원시 행성 원반이 무엇으로 구성되어 있었는지 과학자들이 더 잘 이해하는 데 도움을 줄 것입니다. 가져올 때 주의하십시오. 조금 녹고 있습니다.
		#autoLOC_6002513 = 이 혜성의 구성 성분은 초기 태양계의 독특한 흔적을 보여줍니다. 태양의 온기에 가까이 다가가는 일이 드문 길고 외로운 여정 속에서 변하지 않고 남아 있었기 때문입니다. 조심스럽게 포장한 샘플에 포함된 가장 작은 미세 먼지조차도 우리 행성 지질학자들에게는 정보의 보물창고와 같습니다.
		#autoLOC_6002514 = 가장 희귀한 천체 물질 중 하나인 태양계 외부 물질 조각을 채취하는 데 성공했습니다. 이 행성 간 여행자들은 별 사이의 공간을 여행하며, 태양 중력장에 뛰어드는 일은 극히 드뭅니다. 망원경으로 은하계 곳곳을 탐사하지만, 이렇게 먼 곳에서 온 물질을 실제로 손에 넣는 것은 독보적인 성과입니다.
