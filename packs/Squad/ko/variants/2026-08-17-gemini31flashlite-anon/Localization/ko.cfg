		#autoLOC_501186 = Gull
		#autoLOC_501187 = 작고 가벼운 수상 비행기인 Gull은 언제 어디서 착륙(또는 "착륙")할지 정확히 알 수 없는 커벌들을 위한 훌륭한 기본 훈련기입니다. 내측 날개 플랩 덕분에 놀라울 정도로 낮은 속도(일부 이름 없는 테스트 파일럿들이 KSC 주변에서 운전하는 튜닝된 로버보다 느림)로 이착륙할 수 있습니다.
		#autoLOC_501188 = Mallard
		#autoLOC_501189 = Mallard는 물보라를 피하기 위해 동체 상단에 고효율 터보팬 2기를 장착한 대형 수상 비행기입니다. 다소 느리지만 비행 중 매우 안정적입니다. 주 날개 뒷전의 플랩 세트는 뛰어난 저속 양력을 제공하며, 동체 바닥 양쪽에 장착된 소형 수상 활주 계단은 이륙 시 식수 밖으로 기체를 들어 올려 식수 저항을 줄여줍니다. 조종석 앞부분을 제외한 동체 전체가 긴 화물칸으로 되어 있으며, 꼬리 부분에는 램프가 있습니다. 이를 통해 Mallard가 착륙한 상태에서 로버(및 보트)가 탑승하거나 내릴 수 있습니다. 연료가 다소 부족하므로 장거리 비행을 위해 화물칸에 연료를 추가하거나 고고도에서 연료를 보급하는 것을 고려하십시오.
		#autoLOC_501190 = Osprey
		#autoLOC_501191 = 고성능(이자 고위험) 수상기인 Osprey는 성능을 포기하고 싶지 않으면서도 커빈의 육지나 물 어디든 착륙하고 싶은 무모한 조종사들을 위해 설계되었습니다. 애프터버너가 장착된 Panther 터보팬은 드라이 모드에서 높은 효율을, 웻 모드에서 높은 추력을 제공하여 산책과 전력 질주 모두에 완벽합니다.\n\n아웃리거 사이에는 수상 활주판이 있어 Osprey가 수상 이륙 활주 중에 "부상"할 수 있게 해주며, 항력을 대폭 낮춰줍니다. 부상에 성공하면 안전하게 이륙할 수 있습니다. 아웃리거는 분리 가능하지만 착륙 바퀴도 포함되어 있습니다. 따라서 마지막 수상 착륙을 계획하는 경우가 아니라면(혹은 아주 마지막이 될 육지 "착륙"을 계획하는 게 아니라면) 아웃리거를 스테이지 분리하지 마십시오.
		#autoLOC_501192 = Prospector Rover
		#autoLOC_501193 = 모든 탐사 요구를 충족하는 다목적 진공 탐사 로버입니다!\n연료 전지 전력 시스템으로 수 km를 주행할 수 있습니다.\n탐사 과학 패키지가 기본으로 포함되어 있으며, 평판에는 확장 장비를 장착할 공간이 충분합니다.\n제조사는 갈색 부품이 지면을 향하도록 유지할 것을 권장합니다.
		#autoLOC_501194 = Ravenspear Mk1
		#autoLOC_501195 = 고속 고고도 항공기 Ravenspear 시리즈의 첫 번째 모델인 Mk1은 세 개의 엔진을 갖추고 있습니다. 저속에서 가장 효율적인 중앙 엔진 하나와, 드라이 추력에서는 거의 비슷한 효율을 내지만 웻 모드에서는 (비용은 많이 들지만) 강력한 추진력을 제공하는 애프터버너 터보팬 두 개입니다.\n\n카나드 설계는 몇몇 유명 테스트 파일럿들로부터 "실제로 비행하기 매우 좋다"는 평가를 받았지만, 이륙 시 너무 급하게 기수를 올리면 꼬리날개가 지면에 닿을 수 있다는 경고도 덧붙였습니다. 또한 그들은 "가운데 엔진이 고장 나더라도 엔진이 더 있어서 다행이다"라고 언급하기도 했습니다.
		#autoLOC_501196 = Ravenspear Mk3
