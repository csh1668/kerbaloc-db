		#autoLOC_8005290 = Acapello 15, Walt입니다!\n\n조난당한 커벌이 Valentina Kerman이라고요? 이해할 수가 없군요, 그녀는 앞으로 2주 동안 휴가 중이어야 하지 않나요?\n\n생각해 보니, 최근 조립동에서 부품 몇 개가 사라졌었습니다. 믿을 수가 없군요!\n\n그녀를 커빈으로 데려오기만을 기다리고 있겠습니다. <b><i>임무를 중단하고 귀환하십시오.</b></i>
