		#autoLOC_8014134 = BepiColombo 단열 대화
		#autoLOC_8014135 = BepiColombo 열 차폐
		#autoLOC_8014136 = "실제 BepiColombo 우주선은 특수 설계된 고온 다층 단열재로 감싸여 있습니다. 여기에는 단열 폼으로 분리된 두 겹의 세라믹 기반 직물과 여러 겹의 티타늄 호일이 포함됩니다.\n\n이 단열재를 우주선에 맞게 조정하기 위해 절단 도구를 정기적으로 교체해야 했으며, 바느질 작업은 수작업으로 진행해야 했습니다.\n\n발사장에서 직접 수작업을 수행할 전문가들을 초빙해야 했으며, 이 작업을 위해 추가 시간을 확보해야 했습니다."\n\t<color=#e6752a>Ulli</color> (프로젝트 매니저)
		#autoLOC_8014137 = BepiColombo 태양 전지 대화
		#autoLOC_8014138 = BepiColombo 태양 전지
		#autoLOC_8014139 = 실제 BepiColombo 우주선의 태양 전지판은 고주파 및 고강도 자외선 복사와 고온에 동시에 노출되며, 이러한 조합은 태양 전지 성능의 예기치 않게 빠른 저하를 유발하는 것으로 알려져 있습니다.\n\n이 문제는 온도를 허용 최대치 이하로 유지하기 위한 복잡한 연속 태양 전지판 조향 제어 방식과 태양 전지의 특정 재설계를 통해 해결되었습니다.\n\n"제 관점에서 태양 전지판 개발은 가장 어렵고 위험한 기술적 도전이었으며, 질량, 일정, 비용에 가장 큰 영향을 미치는 요소였습니다. 특히 고온에서 고강도 자외선의 복합적인 촉매 효과로 인한 극적인 태양 전지 성능 저하를 뒤늦게 발견한 것은 해결하는 데 오랜 시간이 걸렸고 우주선 재설계에 심각한 영향을 미쳤습니다."\n\t<color=#e6752a>Daniele</color> (시스템 엔지니어)
		#autoLOC_8014140 = BepiColombo 추진 장치 대화
		#autoLOC_8014141 = BepiColombo 추진 장치
		#autoLOC_8014142 = "BepiColombo 우주선이 현재 우주선에서 찾아볼 수 있는 모든 추진 시스템의 살아있는 목록이라는 놀라운 사실에 주목해 주시기 바랍니다.\n\n실제로 수송 모듈에는 이온 추진과 이원 추진제 시스템이 있습니다. 하나의 궤도선에는 듀얼 모드라고 불리는 또 다른 이원 추진제 시스템과 일련의 단일 추진제 추력기가 있습니다. 마지막으로 다른 궤도선에는 냉가스 시스템이 장착되어 있습니다"\n\t<color=#e6752a>Daniele</color> (시스템 엔지니어)
		#autoLOC_8014143 = BepiColombo 명칭 대화
		#autoLOC_8014144 = BepiColombo 명칭
		#autoLOC_8014145 = BepiColombo는 수성의 독특한 '3:2 공명' 현상을 설명한 이탈리아의 공학자이자 수학자인 Giuseppe "Bepi" Colombo(1920 - 1984)의 이름을 땄습니다. 이 현상은 수성이 태양을 두 번 공전하는 동안 자전축을 중심으로 세 번 자전한다는 것을 의미합니다.\n\n그는 또한 NASA에 Mariner 10호를 1974년에서 1975년 사이에 수성을 세 번 근접 통과할 수 있는 궤도로 진입시키는 방법을 조언했습니다.
		#autoLOC_8014146 = BepiColombo MPO 탐색 대화
		#autoLOC_8014147 = BepiColombo MPO 목표
		#autoLOC_8014148 = 실제 BepiColombo 우주선이 조사할 항목 중 하나는 수성에 거주 가능한 구역이 존재할 가능성이 있는지 여부입니다.\n\n수성의 자전축은 행성의 궤도에 거의 수직으로 향해 있어 극지방에서는 햇빛이 지표면에 일정한 스침각으로 비칩니다. 극지방의 거대한 분화구 내부는 영구적으로 그늘져 있으며 60K(-210°C) 이하의 영하 상태를 유지합니다.\n\n1991년에 처음 얻은 극지방의 레이더 이미지는 거대한 분화구 내부가 레이더 파장에서 높은 반사율을 보인다는 것을 보여줍니다. 이러한 현상을 설명할 수 있는 가장 일반적인 물질은 바로... 얼음입니다!\n\n혜성과 운석이 떨어지면서 유입되는 소량의 얼음이 수십억 년 동안 이 수성 극관에 냉각 포획되었을 수 있으며, 수증기가 행성 내부에서 발생하여 극지방에서 얼어붙었을 수도 있습니다.
