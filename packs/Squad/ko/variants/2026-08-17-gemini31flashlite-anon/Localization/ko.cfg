		#autoLOC_6011123 = Kerbal Space Program 1.8: Moar Boosters!에 오신 것을 환영합니다.\n\n새로운 파트와 업데이트, 개선 사항으로 가득 찬 최신 버전 업데이트를 선보이게 되어 매우 기쁩니다!\n\n첫째, Unity를 2019.2.2f1으로 업그레이드했습니다. 이 엔진 업그레이드는 비주얼, 셰이더, VFX의 개선을 가져옵니다. 특히 모드 커뮤니티에 큰 혜택이 될 점진적 가비지 컬렉션(GC)을 활용하게 되었는데, 모드가 설치된 환경에서 발생하는 프레임 속도 저하의 주원인이 GC였기 때문입니다. Unity 업그레이드와 함께 다양한 성능 향상에도 집중했습니다! 예를 들어, 로켓이 무언가와 "우연히" 충돌할 때의 프레임 속도가 극적으로 개선되어, 여러분의 고통이 더 짧고 달콤해질 것입니다.\n\n시각적 개선은 엔진 업데이트에만 국한되지 않습니다. 새로운 파트와 행성 개편이 이루어졌습니다. Mun, Minmus, Duna, Ike, Eve, Gilly가 특히 근거리에서 훨씬 더 보기 좋아졌으며, 3.75m 탱크도 마찬가지입니다!\n\n다음으로, 비행 중 액션/축 그룹 편집기를 추가했습니다! 액션 그룹 앱으로 이동하여 새 버튼을 찾으십시오. 이제 발사 후에도 우주선의 제어 설정을 변경할 수 있어 1.7 버전 이후 추가된 모든 액션 그룹 기능을 더욱 유연하게 사용할 수 있습니다.\n\n이번 업그레이드의 이름에 걸맞게 5개의 새로운 고체 로켓 부스터를 추가했습니다! 스톡 게임용 4개와 Making History용 1개입니다. 이제 고체 모터가 한 가지 직경으로만 나오지 않으며, 0.625m, 1.25m, 2.5m, 그리고 DLC 포함 1.875m 부스터 중에서 선택할 수 있습니다. Making History에는 부스터를 마무리할 1.875m 노즈콘도 추가되었습니다. Breaking Ground에도 새로운 파트가 추가됩니다. 3개의 새로운 덕트 팬 블레이드와 그에 맞는 덕트 팬 슈라우드 파트가 추가되어 우주 탐사 드론을 만드는 재미가 더 커질 것입니다.\n\n최신 KSP 버전에는 이 외에도 수많은 개선 사항이 포함되어 있으므로, 자세한 내용은 1.8 변경 로그를 확인하십시오.
