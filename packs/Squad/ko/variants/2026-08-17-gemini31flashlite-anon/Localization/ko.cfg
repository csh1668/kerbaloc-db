		#autoLOC_315989 = From the Mun에 오신 것을 환영합니다!\n \n지난 수업에서는 이 우주선을 문에 착륙시켰습니다. 조종사가 다리를 펴고 주변을 둘러볼 기회가 있었기를 바랍니다. 그렇지 않았다면 거기서부터 시작하겠습니다. 그 후에는 커빈으로 돌아갈 것입니다!\n \n이번 수업에서는 문에서 이륙하여 안정적인 궤도에 진입하는 방법과 문(또는 다른 위성)에서 모행성으로 돌아오는 방법을 알려드리겠습니다. 사실, 같은 기술을 사용하여 커빈을 떠나 태양계 내측의 다른 행성으로 향할 수도 있습니다. 마지막으로, 고속으로 커빈에 재진입하는 방법을 다루겠습니다. (열 차폐막: 필수!)\n \n준비가 되면 비행 계획을 검토할 수 있습니다.
