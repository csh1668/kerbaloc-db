		#autoLOC_500000 = 옆으로 가도 똑같이 잘 추락할 수 있는데 왜 위로 올라가야 할까요? 이것이 C7 Aerospace Division의 오랜 모토입니다. 보잘것없는 시작에서 지금의 강자로 성장한 C7은 항상 수평선을 향해 똑바로 앞만 보고 달려왔습니다. 하지만 최근 그들은 하늘과 땅이 만나는 지점을 훨씬 더 잘 볼 수 있게 해주는 부품들을 제작하고 있습니다. 이로 인해 회사 내 원로들 사이에서 불평이 나오기도 했지만, 어떤 방향을 선택하든 그곳에 모험이 있다는 사실만큼은 그들도 부정할 수 없을 것입니다.
		#autoLOC_500001 = Dinkelstein Kerman은 우주선 업계에서 일종의 전설이 되었습니다. 그가 최초의 우주선이 조립된 것으로 기록되기 훨씬 전부터 우주선을 제작하고 비행했다고 강력히 주장하는 점은 특히 인상적입니다. 이로 인해 그와 커빈 세계 최초 기록 보존 협회(Kerbin World-Firsts Record-Keeping Society) 사이에는 논란과 어색한 상황이 많이 발생했습니다. 어쨌든 Dinkelstein's Emporium은 여전히 전통적이고 구식인 회사로 잘 알려져 있으며, 제품들은 회사 주인보다 훨씬 덜 녹슬어 있습니다.
		#autoLOC_500002 = Experimental Engineering Group은 전형적인 스타트업 기업입니다. 적은 예산과 불가능할 정도로 촉박한 마감 기한은 그들에게 일상입니다. 하지만 젊은 기업임에도 불구하고, Experimental Engineering은 SC-9001 Science Jr. 실험 키트가 교육적이고 재미있다는 평가를 받으며 업계에서 빠르게 이름을 알렸습니다. 그러나 대표들의 눈물겨운 노력에도 불구하고, 연구 개발 부서의 과학자 중 한 명이 애완용으로 기르던 작은 생물과 자사 제품이 연루된 사건의 영상이 유출되면서 발생한 악평을 완전히 떨쳐내지는 못했습니다. 일각에서는 이 사건 이후 그들이 자사 제품에 접근하는 모든 것의 안전에 극도로 민감해졌다고 말합니다. 심지어 회사 로고의 모서리까지 둥글게 다듬었을 정도입니다.
		#autoLOC_500003 = FLOOYD Labs는 한 가지 일에 집중하며, 그것을 상상할 수 있는 최선의 방식으로 수행하는 기업입니다. 바로 액체를 한 곳에서 다른 곳으로 옮기는 일입니다. 주력 제품인 FTX-2 연료 도관은 수년간의 연구 개발과 수많은 커벌의 노력이 집약된 결과물로, 아무리 차갑거나 밀도가 높거나 휘발성이 강한 물질이라도 원하는 만큼 펌프질할 수 있는 장치입니다. 이 회사는 업계에 기여한 공로를 인정받아 명성을 얻었으며, 오늘날에는 FTX-1 시리즈 리콜 사태의 당혹감을 기억하는 사람이 거의 없습니다. 당시 FTX-1은 유체를 완벽하게 펌프질했지만, 펌프질하는 방향이 반대였다는 작지만 치명적인 문제가 있었습니다.
		#autoLOC_500004 = Goliath National Products는 경쟁에서 앞서나가기 위해 무엇이 필요한지 잘 알고 있습니다. 바로 세부 사항에 대한 안목과 우리 용감한 엔지니어들에게 무엇이 필요한지 알아내는 감각입니다. 우리 시대의 위대한 우주선 다수가 Goliath의 노즈 콘을 장착하고 있으며, 이들은 우리 영웅들이 또 다른 모험을 떠날 때 우주선의 부드럽고 연약한 중요 부위에서 공기를 효과적으로 밀어내는 데 탁월합니다.
		#autoLOC_500005 = 이 작은 회사는 경험과 명성은 부족하지만, 프로젝트의 엄청난 야심으로 이를 보완합니다. 첫 번째 제품인 거대한 이동식 처리 연구소는 원래 현재 사용 가능한 추진제보다 훨씬 강력하고 독특한 푸른 빛을 띠는 실험적이고 불법적인 연료 혼합물을 비밀리에 제조하기 위한 이동식 처리 시설로 개발되었다는 소문이 있습니다. 하지만 그러한 소문은 증명된 적이 없으며, 이 신비로운 푸른 추진제는 신뢰할 만한 출처에서 목격된 적이 없습니다. 이러한 소문을 없애려는 반복적인 노력에도 불구하고, 회사는 여전히 (아마도 부당한) 나쁜 평판에 시달리고 있습니다. 그들은 비슷한 규모의 다른 회사보다 훨씬 더 많은 현금을 보상으로 제공하여 이러한 첫인상을 상쇄하려 하지만, 솔직히 현재의 이미지를 개선하는 데는 거의 도움이 되지 않고 있습니다.
		#autoLOC_500006 = 우주선 전자 장비 분야의 선두 주자 중 하나이며, 단순히 이름이 멋져서만은 아닙니다. Ionic Symphonic Protonic Electronics는 단순한 통신 장치부터 최첨단 장비에 이르기까지 방대한 부품 카탈로그를 보유하고 있습니다. 이로 인해 그들의 제품은 항공우주 엔지니어들 사이에서 매우 인기가 높으며, 동시에 Probodobodyne의 실용주의자들로부터 깊은 적대감을 사고 있습니다.
		#autoLOC_500007 = Jeb's Junkyard는 겉보기엔 극복 불가능해 보이는 난관 앞에서도 꺾이지 않는 동기 부여가 승리를 이끌어낸다는 것을 보여주는 가장 좋은 사례 중 하나라는 점에 모두가 동의합니다. 커벌 인류가 우주 깊은 곳을 향해 내디딘 첫걸음 중 일부가 시작되었다고 전해지는 이 소박한 고물상은, 이제 우주선 부품에 대한 끊임없이 증가하는 수요를 감당하기 위해 시설을 확장하면서 훨씬 더 거대한 고물상이 되었습니다. Jeb's Junkyard는 단순한 인기 브랜드를 넘어 커빈에서 가장 상징적인 이름 중 하나가 되었습니다. 이제 이곳은 상황의 심각성을 크게 과소평가하면서도 불가능에 도전하려는 커벌의 멈출 수 없는 추진력을 상징하는 자랑스러운 장소로 자리 잡았습니다.
		#autoLOC_500008 = Kerbal Motion LLC는 처음에는 사각형 바퀴를 만드는 바퀴 사업으로 시작했습니다. 그들은 더 구형에 가까운 형태가 될 때까지 계속해서 변을 추가했습니다. 집중적인 테스트 결과, 둥근 바퀴가 훨씬 더 부드러운 주행을 가능하게 한다는 그들의 의심이 사실로 확인되었습니다. 이 난관을 극복한 Kerbal Motion LLC의 두뇌들은 이제 자신들의 뛰어난 지적 능력을 어디에 더 활용할 수 있을지 고민하기 시작했습니다. 그들은 주로 음료수를 마실 때 손을 멀리 뻗지 않아도 된다는 이유로 그래버(grabber)를 선택했습니다.
		#autoLOC_500009 = 모든 사건의 최초 사례를 추적하고 관리하는 데 전념하는 기관인 Kerbin World-Firsts Record-Keeping Society는 이전에 한 번도 시도된 적 없는 일을 수행하는 것, 특히 우주 탐사 분야의 업적에 대해 보상하는 것을 목적으로 하는 비영리 단체입니다. 하지만 그들의 업무는 생각보다 훨씬 까다롭습니다. 어떤 행위의 최초 달성이라는 명예는 상업 기업들에게도 가치 있는 목표이기 때문입니다. 기업들은 그러한 행사의 공식 후원자가 될 기회를 절대 놓치지 않을 것입니다. 이 협회의 계약을 수락하는 것은 돈 때문이 아니라는 메시지를 확실히 전달할 수 있으며, 이는 언제나 좋은 메시지입니다. 어차피 상금은 대부분 상징적인 수준에 불과하므로, 이것이 유일한 보상이나 다름없습니다.
		#autoLOC_500010 = Kerbodyne은 항공우주 산업에서 비교적 새로운 이름이지만, K 시리즈 엔진과 연료 탱크는 짧은 시간 안에 상당한 명성을 얻었습니다. 사실 Kerbodyne은 작년 우주선 개발자 컨벤션에서 "최고의 데뷔" 상 후보에 오를 정도였습니다. 안타깝게도 그 상은 다른 회사에게 돌아갔지만, Kerbodyne의 팬들은 회사와 제품에 대한 애정을 공개적이고 열렬하게 표현하는 것으로 유명합니다.
		#autoLOC_500011 = Kerlington은 획기적인 신기술을 도입해 온 오랜 역사를 가지고 있으며, 그중 다수는 현재 로켓 공학 및 항공우주 공학에 없어서는 안 될 필수 요소로 간주됩니다. 이는 충성스러운 Kerlington 팬들의 강력한 커뮤니티를 형성함과 동시에, 그만큼 많은 불만을 품은 경쟁자 그룹을 만들어냈습니다.
		#autoLOC_500012 = Maxo Construction Toys의 엔지니어들은 항상 무언가를 만드는 것을 즐겼습니다. 특히 작은 플라스틱 블록으로 만드는 것을 좋아했죠. 그래서 그들은 머리를 맞대고 자금을 모아, 똑같은 일을 가벼운 금속 조각으로 해보기로 했습니다. Maxo의 금속 구조물은 내구성과 품질로 유명합니다. 사실 또 한 번의 화려한 "착륙" 후 잔해를 뒤져보면, 이들의 부품은 거의 항상 온전한 상태로 발견됩니다.
		#autoLOC_500013 = Moving Parts Experts Group은 우주선 제작을 위한 혁신적이고 획기적인 기술을 개발하고자 가장 뛰어난 인재들을 모으는 비영리적 성격의 이니셔티브로 시작되었습니다. 많은 기업이 그렇듯, 초기 투자 자금이 금방 바닥나면서 그들은 빠르게 판매할 수 있는 제품을 개발해야만 했습니다. 그 결과, 이 그룹은 항상 서두르고 자금이 부족하다는 평판을 얻게 되었습니다. 하지만 그들은 여전히 원래의 동기를 최대한 유지하려 노력하며, 기존의 한계를 뛰어넘는 모든 도전을 기꺼이 지원하고자 합니다.
		#autoLOC_500014 = 가능한 한 많은 파괴를 일으키는 것으로 명성을 쌓은 O.M.B.는 항공우주 산업에서 매우 불안정한 장치들을 위한 놀랍도록 적절한 자리를 찾았습니다. 우주선을 여러 개의 작은 우주선으로 분리해야 할 때, 이들의 정밀 분리 장치(Decouplers)는 타의 추종을 불허합니다. 하지만 이들의 다른 파괴용 제품들은 훨씬 강력한 분해 도구라고 대대적으로 광고했음에도 불구하고 그다지 성공적이지 못했습니다. O.M.B.는 왜 그 "분명히 더 나은" 제품들이 그렇게 환영받지 못했는지 아직도 의아해하고 있습니다.
		#autoLOC_500015 = Periapsis Rocket Supplies는 악명 높을 정도로 폐쇄적인 회사입니다. 이들이 만드는 소수의 부품 목록은 이 회사를 둘러싼 신비로움을 더할 뿐입니다. 많은 이들이 왜 더 많은 부품을 만들지 않는지 의문을 제기하지만, Periapsis는 "우리가 다음에 무엇을 할지 지켜보라!"는 말로 대응합니다. 하지만 이는 최소 3세대 동안 이어진 표준 응답이었기에, 많은 이들이 그 답을 꽤 오랫동안 기다리고 있습니다.
		#autoLOC_500016 = Probodobodyne은 한때 업계를 선도하는 (그리고 몇 안 되는) 이름 중 하나였습니다. 하지만 수년이 흐르면서 회사는 시대에 다소 뒤처지게 되었습니다. 그럼에도 이들은 우주 탐사가 최소한의 기술적 지원만으로 도전을 극복할 수 있는 소수만의 특권이어야 한다는 철학을 고수하고 있습니다. 이들의 제품은 주변에서 우주 여행을 "초창기"보다 훨씬 더 접근하기 쉽게 만드는 대안을 제시하는 많은 신생 기업들이 등장함에도 불구하고, 그러한 실용적이고 어쩌면 구식일 수도 있는 관점을 반영합니다. 이 모든 것에도 불구하고, 이 회사는 최고의 우주비행사와 엔지니어들만이 가득한 매우 선택적인 산업이라는 그들의 비전을 따르는 소수지만 충성스러운 팬층을 유지하고 있습니다.
		#autoLOC_500017 = 우주 프로그램의 자체 연구 개발 부서입니다. 유명한 로켓 과학자 Wernher von Kerman이 이끄는 이들은 전체 운영의 두뇌 역할을 합니다. 지식에 대한 끝없는 갈증으로 움직이며, 어떤 데이터도 너무 작거나 무의미한 것은 없다고 생각합니다. 커벌 인류의 축적된 지식을 늘리는 것이 그들의 주된 동기입니다. 우리 상주 천재들은 과학에 대한 기여를 인정받기를 원하며, 모든 우주비행사는 실험실에 들어가기 전에 반드시 신발을 닦아주시기 바랍니다.
		#autoLOC_500018 = Reaction Systems는 단 하나의 성공적인 제품인 Place-Anywhere Linear RCS Port로 적당한 성공을 거둔 소규모 회사입니다. 요즘 그들이 무엇을 연구하고 있는지는 아무도 확실히 알지 못합니다. Reaction Systems는 결코 가장 큰 회사는 아니지만, 모든 선구적인 노력을 지원함으로써 이를 보완하려 합니다. 또한, 과학 데이터 수집 계약을 적극적으로 제공하는 모습은 그들이 무언가를 꾸미고 있다는 추측에 신빙성을 더합니다.
		#autoLOC_500019 = 의심할 여지 없이 가장 큰 로켓 부품 공급업체인 Rockomax의 제품은 우주로 나가는 가장 접근하기 쉬운 방법으로 널리 알려져 있습니다. 이로 인해 더 고급스럽거나 아방가르드한 엔지니어들 사이에서는 다소 부정적인 평판을 얻었으며, 일부는 Rockomax 브랜드 제품을 사용했다는 사실조차 인정하지 않으려 합니다. 그럼에도 불구하고 업계에서 Rockomax의 거대한 존재감은 부정할 수 없으며, 더 고급 로켓 브랜드의 '트렌디한' 느낌은 부족할지라도 제품의 가치는 상당히 훌륭합니다. 그들은 매우 거대한 기업이므로 특별한 거래를 기대하지는 마십시오. 이미 모든 고객에게 대량 할인 혜택을 제공하고 있으며, 파트너 브랜드 제품을 함께 사용할 경우 '슈퍼 가치' 거래도 제공합니다. 물론, 창고에서 쇼핑할 때 멤버십 카드를 소지하고 있어야 한다는 전제하에 말입니다.
		#autoLOC_500020 = Rokea는 '수직 이동 강화 장치' 제품으로 주로 알려져 있으며, 이 제품들이 단순한 '사다리'로 오해받지 않도록 각고의 노력을 기울이고 있습니다. Rokea의 모든 담당자는 귀에 들리는 모든 사람에게 사다리와 수직 이동 강화 장치의 차이점을 열정적으로 설명하지만, 그 노력은 처참하게 실패하고 있다는 평이 지배적입니다. 아마도 이러한 소통 전략이 아무도 관심을 두지 않는 이유 중 하나일 것입니다.
		#autoLOC_500021 = 우수한 통조림 식품으로 유명한 Sean's Cannery가 왜 항공우주 공학 분야에 뛰어들었는지 의문을 갖는 사람이 많습니다. 비판에도 불구하고, 이들의 주력 제품인 Mk2 Lander Can이 신뢰할 수 있는 모듈이자 오늘날 이용 가능한 가장 기밀성이 뛰어난 승무원 탑승 모듈 중 하나라는 점은 누구도 부정할 수 없습니다. Lander Can의 승무원들은 이 모듈이 보관된 간식을 바삭하고 신선하게 유지해 준다고 자주 칭찬하며, 다른 포드에서는 임무 시작 며칠 만에 간식이 눅눅해진다고 불평하곤 합니다.
		#autoLOC_500022 = STEADLER는 친절하거나 유연한 회사로 알려져 있지 않습니다. 오히려 군사적이고 엄격하며 타협하지 않는다는 표현이 더 적합합니다. 로켓과 극초음속 항공기의 제어 시스템을 설계하는 회사로서는 좋은 자질이라는 의견도 있지만, 사실 자아를 가진 불량 유도 모듈이 회사를 운영하고 있다는 주장도 있습니다. 우리가 확실히 아는 것은 그들의 정문 보안이 너무 까다로워 관찰이 불가능하며, 그들의 전기 충격기는 매우 빠르게 재충전된다는 사실뿐입니다.
		#autoLOC_500023 = 모든 목적을 위한 구조 부품의 최대 제조사 중 하나인 StrutCo는 모든 면에서 매우 확고한 입지를 다진 회사입니다. 그들이 유일하게 극복하지 못한 사실은 전설적인 EAS-4 스트럿 커넥터 자체가 사실 Kerlington Model Rockets에 의해 발명되었다는 점입니다.
		#autoLOC_500024 = Vac-Co는 업계에서 비교적 새로운 이름입니다. 이전에는 청소 장비 및 소형 가전제품 제조 경험밖에 없었기에, 최근 항공우주 공학 분야로의 진출은 적지 않은 회의적인 시선을 받았습니다. 그럼에도 불구하고 그들은 우주비행기용 공기 흡입구 분야에서 혁신적인 제품을 선보이며 자신들이 무엇을 해야 하는지 잘 알고 있는 듯합니다.
		#autoLOC_500025 = WinterOwl은 제공하는 제품의 수만 놓고 보면 다른 대형 항공기 제조사들과 비교할 수준이 아닙니다. 하지만 이 회사는 업계에서 가장 오래된 기업 중 하나로서 가장 잘 알려진 이름 중 하나입니다. 이러한 명성 덕분에 친근하고 신뢰할 수 있는 파트너로 인정받고 있으며, 다른 많은 기업과도 좋은 관계를 유지하고 있습니다. 항공 우주 업계에서 WinterOwl이나 그 제품에 대해 무례하게 구는 것은 매우 예의 없는 행동으로 간주됩니다.
		#autoLOC_500026 = Zaltonics는 전자 부품 업계의 강력한 리더로 알려져 있지는 않지만, 야망은 다소 부족해도 실용적인 기업으로 통합니다. 하지만 이러한 특성 덕분에 Zaltonics는 나름대로 대체 불가능한 존재가 되었습니다. 이들은 다른 기업들이 꺼리는 덜 흥미로운 장치들의 제조를 기꺼이 맡으며, 이를 빠르고 비용 효율적으로 수행하는 데 매우 능숙해졌습니다. 이들의 제품이 큰 인기를 끄는 것은 아닐지 몰라도, 고급 원격 유도 장치의 전력이 다 떨어졌을 때 그 장치를 계속 작동하게 해줄 Zaltonics 배터리를 사용하게 될 가능성이 높습니다.
