		#autoLOC_8003234 = Kerbal Space Program: Breaking Ground Expansion은 비평가들의 찬사를 받은 우주 비행 시뮬레이터인 Kerbal Space Program의 PC 버전용 두 번째 확장팩입니다.\n\n이 기능이 풍부한 확장팩은 천체에 도달한 후 더 흥미로운 과학적 가능성을 추가하고 도구 세트를 확장하여 플레이어의 선택지를 늘리는 데 중점을 둡니다.\n\n천체에 착륙한 후, 이제 다양한 데이터 수집 장비를 배치하여 과학 실험을 수행할 수 있습니다. 데이터를 수집하는 동안 태양계 전역에 새로 추가된 지표면 특징들이 흩어져 있으며, 플레이어는 이를 찾아 스캔하거나 추가 조사를 위해 커빈으로 가져와야 합니다.\n\n또한, 로봇 파트가 추가됩니다! 다양한 크기의 힌지, 피스톤, 로터 및 회전 서보를 사용하여 플레이어의 기체 제작 가능성을 크게 바꿀 수 있습니다. 이 모든 파트는 실제 물리 법칙에 따라 실제 힘과 토크, 전력 소비, 심지어 모터 질량까지 고려하여 작동합니다.
