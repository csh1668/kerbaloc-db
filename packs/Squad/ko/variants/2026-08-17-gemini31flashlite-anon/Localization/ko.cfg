		#autoLOC_315613 = 재진입!
		#autoLOC_315621 = <color=<<1>>>경고</color>: 상세 정보! 필요하다면 <color=<<2>>>[<<3>>]</color>을(를) 눌러 일시 정지하십시오.\n\n이제 커빈의 대기권으로 재진입하고 있습니다. 항상 손과 발을 포드 안쪽에 두도록 하십시오. 타거나 다치는 일은 없어야 하니까요! 화염은 신경 쓰지 마십시오. Wernher는 어쨌든 \"세계적으로 유명한 로켓 과학자\"이며, 이 우주선을 화염을 견딜 수 있도록 제작했습니다.\n\n지난번에는 낙하산 아이콘을 보며 낙하산을 펼칠 적절한 시기를 기다렸습니다. 이번에는 조금 다른 방법을 사용할 것입니다. 제작 튜토리얼에서 이 우주선을 설계할 때, 낙하산이 0.75 기압이 되기 전까지는 반쯤 펼쳐지지 않도록 설정했던 것을 기억하십니까? 즉, 지금 스테이지를 활성화하더라도 낙하산은 그때까지 두 단계의 전개 과정 중 첫 번째 단계를 수행하지 않습니다. 커빈에서 0.75 기압은 해수면 기준 약 2000m 고도를 의미하며, 그때쯤이면 우주선이 충분히 감속되어 낙하산이 전개되어도 안전할 것입니다.\n\n그러니 지금 낙하산을 미리 작동시켜 두고, 적절한 고도에서 자동으로 펼쳐지도록 맡겨 봅시다.\n\n저를 믿으셔도 좋습니다! <color=<<4>>>[<<5>>]</color>을(를) 눌러 낙하산 스테이지를 작동시키십시오.
