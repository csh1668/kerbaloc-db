		#autoLOC_6005016 = KSP 1.6: To Vee or not to Vee!에 오신 것을 환영합니다. 여러분을 위한 멋진 새 기능들이 많이 준비되어 있습니다.\n\n첫째, 엄청난 항법 개선이 이루어졌습니다! 우선 스테이지 다이어그램에 델타-V 수치가 추가되었습니다! 이제 Jeb 외의 조종사들도 궤도에 도달할 연료와 추력이 충분한지 절대적으로 확신할 수 있게 되었습니다. 물론 Jeb은 의심 따위 하지 않지만요. 이 수치는 스테이지별로도 작동하여 스테이지 설정의 결함을 찾는 데 도움을 줍니다.\n\n둘째: KSC나 다른 착륙 지점으로 향하는 길을 안내하는 항법 아이콘이 추가되었습니다.\n\n마지막으로, 이제 많은 제어 파트에서 내비게이션 볼의 방향을 변경하여 비행하거나 주행할 때 올바른 방향을 가리키도록 할 수 있습니다. 이를 통해 동일한 파트를 주행 지향 구성과 착륙선 구성 모두에서 사용할 수 있습니다. 힌트: Mk2 Lander Can의 변형 모델을 확인해 보십시오!\n\n환상적인 시각적 개선 사항도 있습니다. 이제 커벌들이 마침내 헬멧을 벗을 수 있게 되었습니다. 하지만 우주로 비행하기 전에는 다시 쓰는 것이 좋을 겁니다. 아니면 더 좋은 방법으로, 캡슐 안으로 돌아가십시오, 이 무모한 분들.\n\n또한 지상이나 선외 활동 중에 즐길 수 있는 새로운 대기 애니메이션도 추가되었습니다. 동적 큐브 맵을 추가하여 반짝이는 파트가 주변 환경을 반사하도록 했으며, 그림자 효과도 조정했습니다. 마지막으로, 훨씬 더 아름다워진 파트 개편이 많이 이루어졌습니다!
