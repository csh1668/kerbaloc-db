		#autoLOC_6002507 = 보통 부품을 개선하고자 할 때, 자존심 강한 커벌 엔지니어가 가장 먼저 생각하는 것은 크기를 키우고 출력을 높이는 것입니다. 하지만 드물게도 그것이 이상적인 해결책이 아닐 때가 있습니다. 그렇게 AGU jr.가 탄생했습니다. Kerbal Motion은 더 큰 집게를 만드는 대신, 손이 닿기 어려운 곳에 무언가를 고정해야 할 때 사용할 수 있는 작은 집게를 설계했습니다.
