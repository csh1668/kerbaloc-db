		#autoLOC_501198 = Ravenspear Mk4
		#autoLOC_501199 = Mk4는 이전 Ravenspear 모델들과는 다소 다른 방향성을 보여줍니다.\n\n고고도 비행에 집중하는 대신, Mk4는 주로 4개의 애프터버너 터보팬을 최대한 활용하는 데 중점을 두었습니다. 하지만 드라이 모드에서는 상당한 항속 거리를 자랑합니다.\n\n저고도에서 매우 빠른 속도로 비행할 수 있어 가장 용감한 테스트 파일럿들이 선호하는 기체이지만, 그렇지 않은 파일럿들에게는 정반대의 평가를 받기도 합니다.
		#autoLOC_501200 = 로켓 추진 VTOL
