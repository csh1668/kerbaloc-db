		#autoLOC_8003447 = Kerbal Space Program 1.11의 새로운 기능: 재조립이 필요합니다\n\n또 다른 버전의 Kerbal Space Program을 선보이게 되어 기쁩니다. 이번 버전은 새로운 선외 활동(EVA) 활동을 추가하는 데 중점을 두었습니다!\n\n첫째, EVA 건설 모드를 추가했습니다. 이제 커벌 엔지니어가 밖으로 나가 새로운 레이저 용접기로 우주선을 수정할 수 있습니다. 각 부품의 무게에 따라 우주선의 부품을 이동, 제거 및 추가할 수 있으며, 저중력 환경에서 작업하면 더 크고 거대한 구조물을 만들 수 있습니다! EVA 건설 모드에는 전체 배치/이동/회전 도구 세트와 항상 유용한 중심 표시기(질량 중심, 양력 중심, 추력 중심)가 포함되어 있습니다.\n\nEVA 건설을 지원하기 위해 Breaking Ground 확장팩의 화물 시스템을 메인 게임으로 가져왔으며, 여러 가지 기능을 추가했습니다. 이제 많은 인기 부품을 화물로 운반할 수 있습니다. 다만 부피 제한이 있으므로 모든 것을 다 실을 수는 없을 것입니다. 하지만 새로운 화물 컨테이너 몇 가지와 일부 기존 부품에 저장 공간을 추가하여 이 문제를 해결했습니다.\n\n인벤토리와 관련하여, 이제 커벌 낙하산과 제트팩을 탈착할 수 있으며 커벌의 인벤토리에 보관됩니다. 따라서 다른 유용한 아이템으로 교체하거나 무게를 줄이기 위해 제거할 수 있습니다. 이제 커벌의 질량은 소지품의 영향을 받으며, 이는 우주선에도 영향을 미칩니다. 승무원실은 이를 보완하도록 수정되었지만, 이제 승무원을 일부만 태우고 발사하는 것이 차이를 만들 것입니다.\n\n부품 수리가 이제 핵심 게임의 일부가 되었습니다. 태양광 패널이나 안테나처럼 과거에는 영구적으로 손상되었던 부품을 이제 EVA 커벌이 하나 이상의 수리 키트를 사용하여 수리할 수 있습니다. 또한 위에서 언급한 각 새로운 기능에 대해 새로운 계약이 추가되었습니다.\n\n다음으로, 위에서 언급한 화물 컨테이너 외에도 게임에 여러 가지 새로운 부품을 추가했습니다! 부착형 및 전개형 조명과 새로운 조명 기능이 추가되어 우주선이나 야외 작업 영역을 밝히는 데 도움이 됩니다. 더 작은 RCS 및 RCS 블록 변형 구성도 추가되었습니다. 커벌의 EVA 지속 시간을 연장하기 위한 예비 EVA 연료 실린더도 있습니다. 또한 커벌이 밖에서 실험을 수행할 수 있는 새로운 EVA 과학 키트도 추가되었습니다.\n\n마지막으로, 태양계 개편을 마무리하는 막바지 단계에 있습니다. 이번에는 Tylo, Bop, Val이 개편되었습니다.\n\n언제나 그렇듯 변경 로그에서 자세한 내용을 확인하실 수 있습니다. Kerbal Space Program 1.11: 재조립이 필요합니다를 즐겨주시기 바랍니다.
