		#autoLOC_8005277 = 팀 여러분, 안녕하십니까! 드디어 우리의 두 번째 자연 위성을 탐사할 시간이 왔습니다.\n\n이번 임무는 탐사와 암석 추출에 중점을 둘 예정이므로, 무엇보다도 강력한 로버가 필요합니다.\n\n<b><i>로버를 민무스까지 운송하고 귀중한 화물을 커빈으로 가져올 수 있는 우주선을 제작하십시오.</b></i>
