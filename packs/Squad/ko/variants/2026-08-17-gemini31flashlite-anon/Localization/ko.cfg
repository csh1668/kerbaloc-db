		#autoLOC_8003363 = Kerbal Space Program 1.9의 새로운 기능: 집만한 곳은 없죠!\n\n최신 버전에서는 Kerbal Space Program의 경험을 지속적으로 개선하고 있으며, 여러분께 선보이게 되어 매우 기쁩니다. 추가된 기능 중 다수는 사용자 피드백을 직접 반영한 것이며, 버그 수정 및 성능 향상에도 중점을 두었습니다.\n\n가장 큰 변화는 커빈(Kerbin) 자체의 엄청난 개선으로, 텍스처와 셰이더가 향상되었습니다. 커빈이 그 어느 때보다 아름다워졌습니다! 또한 Skipper, Mainsail, Thumper 엔진을 개편했습니다.\n\n기타 새로운 기능으로는 일시 정지 상태에서도 모든 각도에서 스크린샷을 쉽게 찍을 수 있는 카메라 모드, 부품에서 자원을 배출하는 데 사용할 수 있는 새로운 배출 밸브 부품이 추가되었습니다. Breaking Ground 사용자를 위해서는 블레이드 부품에 주기 및 집합 편향 제어 기능이 추가되어 헬리콥터와 기타 회전익기를 더 쉽게 제작하고 조종할 수 있게 되었습니다.\n\n1.9 버전에는 사용자 피드백을 바탕으로 한 몇 가지 삶의 질 개선 사항도 포함되어 있습니다. 가장 마음에 드는 기능 중 하나는 행성 상공의 특정 고도에서 시간 가속을 제한하던 설정을 제거한 것입니다. 또 다른 기능은 우주선을 모든 천체의 지표면이나 대기 중에 착륙한 상태로 배치할 수 있는 새로운 치트입니다.\n\n또한 두 가지 큰 성능 향상도 추가되었습니다. 단일 카메라 시스템으로 DX11 렌더링 성능이 향상되었으며, KSPedia를 동적으로 로드하여 메모리 사용량이 감소했습니다.\n\n최신 버전의 Kerbal Space Program을 즐겨주십시오!\n
