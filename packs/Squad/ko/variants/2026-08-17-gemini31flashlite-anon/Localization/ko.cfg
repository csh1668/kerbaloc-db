		#autoLOC_6002522 = Kerbal Space Program 1.10: Shared Horizons의 새로운 점\n\nKerbal Space Program 1.10 업데이트에 오신 것을 환영합니다! 이번 업데이트는 유럽우주국(ESA)과 협력하여 환상적인 신규 콘텐츠와 KSP 태양계의 대규모 추가 요소를 선보이게 되어 더욱 특별합니다.\n\n우선 ESA와의 협력을 통해 실제 BepiColombo 및 Rosetta 미션을 KSP 버전으로 구현했습니다. Making History DLC 없이도 플레이할 수 있습니다!\n\n우주 상식을 아시는 분이라면 Rosetta 미션 추가와 함께 혜성을 게임에 추가해야 한다는 사실을 아실 겁니다! 혜성은 모든 게임 모드에 등장하며, 커리어 모드에는 혜성 기반의 새로운 계약이 추가되었습니다. 혜성은 사실적이고 가변적인 꼬리를 가지고 있으며 일반 소행성보다 훨씬 큽니다. 성간 우주에서 찾아온 방문자를 마주칠지도 모릅니다!\n\n게임에 여러 신규 파트가 추가되었고 기존 파트도 업데이트되었습니다. 첫째, 다중 미션이나 다중 기관 우주선을 위해 로켓을 다양한 깃발로 장식할 수 있는 깃발 파트 배열이 추가되었습니다. 둘째, 더 작은 버전의 Claw와 새로운 과학 실험 장비인 자력계가 추가되었습니다. 일부 연료 탱크, SRB, 분리 장치의 새로운 변형 모델도 추가되었으며, 페어링은 새로운 변형뿐만 아니라 기능도 업데이트되었으니 확인해 보십시오!\n\n4월 Jool의 날 게시물에서 눈치채셨겠지만, Jool이 개편되었습니다. 여전히 녹색이지만요. 더 좋은 점은 Jool의 구름이 이제 움직인다는 것입니다. 궤도 진입을 위해 시간 가속을 할 때 구름을 보는 것은 놀라운 경험이 될 것입니다. Laythe도 개편되어 비치 의자를 펴고 Jool을 감상할 수 있는 아름다운 장소가 마련되었습니다.\n\n다음으로, 새로운 EVA 슈트 선택기를 추가하여 다양한 슈트 유형과 색상을 선택할 수 있게 되었습니다. ESA 슈트 텍스처 옵션을 포함하여 커벌의 보호 슈트를 개성 있게 꾸며보십시오! 또한 모더들이 자신만의 슈트 텍스처를 게임에 추가하기가 훨씬 쉬워졌습니다.\n\n마지막으로, 변경 로그에서 확인할 수 있는 수많은 버그 수정, 성능 업데이트 및 편의성 개선 사항이 포함되어 있습니다. Kerbal Space Program 1.10: Shared Horizons를 즐겁게 플레이하시길 바랍니다.
