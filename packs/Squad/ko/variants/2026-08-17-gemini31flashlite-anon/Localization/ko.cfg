		#autoLOC_6005138 = Jebediah Kerman은 커벌 우주센터의 전속 스턴트 파일럿으로서 아침, 점심, 저녁 식사 대신 위험을 즐깁니다. 하지만 주말에 휴식을 취하고 싶을 때는 무엇을 할까요? 그는 최첨단 고물상 시설에서 불꽃놀이 통을 채웁니다.\n\nStarshot-8에는 짧은 쇼를 위한 충분한 불꽃놀이가 들어 있으며, 발사대의 거대한 폭발에 필적할 만한 쇼를 연출하기 위해 여러 개를 배열할 수도 있습니다. 원할 때 터지지 않으면 다음 제품은 반값에 제공합니다.
		#autoLOC_6005139 = Jebediah Kerman은 KSC의 전속 무모한 조종사로서 아침, 점심, 저녁 식사로 위험을 즐깁니다. 하지만 주말에 휴식을 취하고 싶을 때는 무엇을 할까요? 그는 최첨단 고물상 시설에서 불꽃놀이 통을 채웁니다.\n\nStarshot-32는 대형 불꽃놀이 발사기입니다. 만약 이것이 잘못된 시간에 터진다면 환불 이상의 것을 찾게 될지도 모릅니다.
		#autoLOC_6005140 = Kerbal Space Program 1.12: On Final Approach의 새로운 점\n\nKerbal Space Program의 10주년 업데이트를 선보이게 되어 매우 기쁩니다. 이번에는 그 어느 때보다 많은 콘텐츠를 추가했으며, 새로운 기능과 콘텐츠로 KSP의 기념일을 성대하게 축하할 예정입니다. 그럼 시작해 볼까요!\n\n첫째, 두 가지 주요 앱이 추가되었습니다. 새로운 기동 생성기(Maneuver Creator) 앱을 사용하면 다른 천체로의 전이 기동을 빠르게 생성하고, 다가오는 전이 창을 확인하며, 목적지와 그곳에 도달하는 데 필요한 델타-V를 쉽게 파악할 수 있습니다.\n\n이와 함께 알람 시계(Alarm Clock) 앱도 포함되었습니다. 전이 기동을 포함한 모든 기동에 대해 알람을 생성할 수 있으며, 수동 시간 알람 및 다양한 궤도 위치에 대한 알람도 설정할 수 있습니다. 알람을 놓치지 않도록 재미있는 알람 소리를 선택하는 것을 잊지 마십시오!\n\n다음으로, 10주년을 기념하여 다양한 콘텐츠를 추가했습니다. 포함된 내용은 다음과 같습니다:\n- 태양계 곳곳에 숨겨진 새로운 이스터 에그.\n- 방문하여 잠금 해제할 수 있는 커빈의 새로운 발사대.\n- 새로운 '슬림' 슈트.\n- 축하를 위한 새로운 불꽃놀이 발사기.\n\n그 외에도 KSP의 사용자 경험을 개선하기 위해 요청받은 많은 기능과 편의성 개선 사항이 추가되었습니다. 주요 내용은 다음과 같습니다:\n- 기체 및 게임 저장 파일 불러오기 기능의 대대적인 개편(검색, 폴더화, 기체 파일의 교차 저장 접근 추가).\n- 도킹 포트에 회전식 도킹 포트 칼라가 추가되어 도킹된 기체를 완벽하게 정렬할 수 있습니다.\n- 깃발 패널의 구조적 변형.\n- 필요에 따라 분리 가능한 스트럿.\n- 파트 도구 업데이트 및 모더들의 많은 요청 사항 반영.\n- 바퀴 및 착륙 다리의 수많은 수정 및 개선 사항.\n- 그 외 다수...\n\n또한 1.12 버전에서는 새로운 파트와 개편이 이루어집니다. 폴과 일루는 태양계 전체 업그레이드를 마무리하는 미화 작업을 거쳤습니다. 모든 도킹 포트가 개편되었습니다. 1.25m 엔진 플레이트와 다양한 새로운 태양광 패널도 추가되었습니다.\n\n물론 여기에 나열하기에는 너무 많은 버그 수정과 개선 사항이 있으므로, 자세한 내용은 변경 로그를 확인해 주십시오.\n\n이번 업데이트가 역대 최고 중 하나라고 생각하시길 바랍니다! 아쉽게도 모든 좋은 것에는 끝이 있습니다. On Final Approach는 Kerbal Space Program의 마지막 주요 계획된 릴리스입니다. 여러분 모두를 위해 이 놀라운 게임을 작업하게 되어 정말 영광이었고 즐거웠습니다. 이곳의 모든 사람에게 이 작업은 사랑의 결실이었으며, 모든 과정에서 이렇게 놀라운 커뮤니티와 함께할 수 있었던 것을 특권으로 생각합니다. 저희와 함께 이 여정에 참여해 주셔서 감사합니다.\n\n하지만 Squad가 사라지는 것은 아닙니다. 소셜 팀은 계속해서 이벤트를 운영할 것이며, 저희가 KSP2 작업을 돕는 동안에도 KSP와 커뮤니티는 오랫동안 지속될 것이라 기대합니다.\n\nKerbal Space Program 1.12: On Final Approach를 즐겨주시고, 2022년 Kerbal Space Program 2에서 더 많은 모험을 함께할 수 있기를 바랍니다!
