		#autoLOC_6005008 = KSP 1.5: Dressed for Success에 오신 것을 환영합니다. 이번 릴리스에는 게임에 대한 전반적인 개선 및 수정 사항과 몇 가지 놀라운 요소가 포함되어 있습니다.\n\n커벌을 조종석에 배치하는 기능, 우주선의 기동을 더 잘 계획하고 수행할 수 있도록 돕는 연소 시간 표시기(Burn Time Indicator)의 향상, 그리고 (잠재적으로) 다가올 불타는 파멸을 마주하는 커벌들을 가장 멋지게 보이게 할 새로운 슈트가 추가되었습니다.\n\n또한 여러 파트에 대한 수정, 조정 및 개정이 포함되었으며 게임 전반에 걸쳐 많은 작은 조정과 버그 수정이 이루어졌습니다. 이와 함께 4K 디스플레이에 대한 지원 향상과 소행성 물리 효과의 미세 조정이 포함되었습니다. 언제나 그렇듯, 변경 및 개선 사항의 전체 목록은 릴리스 노트에서 확인할 수 있습니다!\n\n플레이해 주셔서 감사합니다!
