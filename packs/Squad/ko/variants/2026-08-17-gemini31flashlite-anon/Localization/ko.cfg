		#autoLOC_8014131 = ESA와의 협력을 통해 BepiColombo 임무의 이 버전을 제작했습니다. 이 임무는 BepiColombo 우주선의 여러 탐사선을 Moho 주변에 배치하고 착륙선을 착륙시키는 도전 과제를 제공합니다.\n\n이 버전의 임무는 Moho 바로 앞까지 도달하도록 단축되었습니다.
