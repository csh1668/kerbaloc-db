		#autoLOC_6012030 = KSP 1.7: Room to Maneuver!에 오신 것을 환영합니다.\n\n이 버전 업데이트는 이름에서 알 수 있듯이, 우주에서 로켓을 안내하는 데 도움이 되는 새로운 기능과 개선 사항으로 가득 차 있습니다.\n\n두 가지 새로운 항법 도구 업그레이드가 있습니다. 비행 화면 상단에서 고도계 옆에 있는 신비로운 새 아이콘을 볼 수 있습니다. 고도계를 클릭하면 해수면 기준 고도에서 지표면 기준 고도로 전환되므로, 이제 Jeb이 계기만 보고도 우주선을 착륙시킬 수 있습니다. 이번에는 우주선이 산산조각 나지 않고 온전하게 유지될 것입니다.\n\n비행 화면 왼쪽 하단에는 다른 모드 전환 아이콘들과 함께 새로운 아이콘이 있습니다. 이를 클릭하면 '기동 모드'가 추가된 것을 확인할 수 있습니다. 이 모드는 지도 모드와 비행 모드 모두에서 원점, 근점, 이심률 등 궤도 정보에 접근할 수 있는 단일 패널을 엽니다. 더 좋은 점은 기동 노드를 배치하면 해당 기동을 조정할 수 있는 두 번째 패널이 나타나 행성 간 이동을 정밀하게 조정할 수 있다는 것입니다.\n\n시각적으로는 모든 소형 기동 모터를 업데이트했습니다. Ant, Twitch, Puff, Place-Anywhere 7, RV-105 Thruster Block, Vernor Engine 모두 향상된 아트 처리가 적용되었으며, Twitch, Ant, Spider에는 새로운 변형이 추가되었습니다. 또한 행성 사이를 항해하는 동안 즐길 수 있는 업그레이드된 은하계 지도도 준비했습니다.\n\n마지막으로, 파트 액션 창이 너무 커질 경우를 대비해 스크롤 바를 추가했습니다. 모드를 많이 사용하는 경우 매우 유용할 것입니다. 또한 일부 소형 기동 엔진의 튜닝 값을 조정했습니다. 더불어 Making History를 보유한 분들을 위해 새로운 3.75m 노즈콘과 5m 노즈콘도 추가되었습니다!\n\n1.7 Room to Maneuver 버전을 즐겁게 이용하시기 바랍니다!
