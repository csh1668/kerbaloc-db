		#autoLOC_8005293 = 잘했습니다, Acapello 15!\n\n흥미로운 암석 화물과 구조한 커벌을 태우고 <b><i>집으로 돌아올</b></i> 시간입니다.\n\n다음 버섯 스튜에 넣을 맛이 기대되는군요...\n\n...물론 커벌이 아니라 암석을 말하는 겁니다!\n\n아무튼 안전하게 돌아오십시오, 알겠습니까? 좋은 목표 지점을 업로드했습니다: <b><i>지정된 구역에 착륙해 보십시오</b></i>!
