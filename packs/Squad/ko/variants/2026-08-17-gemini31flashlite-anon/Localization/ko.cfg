		#autoLOC_8005298 = 여러분, 안녕하세요! Wernher von Kerman입니다! \n\n Acapello 15호는 정말 대단해 보입니다! 귀중한 암석들이 이곳으로 돌아오기를 손꼽아 기다리고 있습니다. 우리 전문가들은 그 암석들이 버섯 스튜에 훌륭한 풍미를 더해줄 것이라고 믿고 있습니다. 이 진미는 우리 우주 프로그램에 큰 수익을 가져다줄 수 있을 것입니다. \n\n <b><i>지정된 구역의 민무스에 착륙하십시오.</i></b>\n\n 아, 그리고 엔지니어를 한 명 태우는 것을 잊지 마십시오. 착륙 후에 로버 수리가 필요할지도 모릅니다...
