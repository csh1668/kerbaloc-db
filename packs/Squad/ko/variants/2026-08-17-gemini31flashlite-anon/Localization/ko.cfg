		#autoLOC_501202 = 위성 발사체
		#autoLOC_501203 = 고고도에서 로켓 발사의 타당성을 입증하기 위해 소형 로켓을 장착한 재래식 제트기입니다.
		#autoLOC_501204 = Skywinder AE1
		#autoLOC_501205 = Skywinder AE1은 원래 Green Kraken 에너지 스낵이 후원하는 에어 레이스와 스턴트 쇼에 사용되던 날렵하고 민첩한 비행기입니다. 전방 카나드, 추력 역분사 장치, 내장된 안전 낙하산 덕분에 스턴트 조종사들은 제정신인 조종사라면 절대 고려하지 않을 온갖 창의적인 기동을 수행할 수 있었습니다! \n\n일련의 불행한 사건 이후, 이 비행기는 레크리에이션 용도로 우주 센터에 기증되었습니다.
		#autoLOC_501206 = Stearwing A300
		#autoLOC_501207 = Stearwing A300은 무거운 화물과 많은 승객을 운송하기 위해 제작된 대형 항공기입니다. 하지만 인상적인 고도나 속도를 기대하지는 마십시오. 과도한 스트레스를 받으면 날개가 떨어져 나갈 수 있습니다. 보증 서비스는 곡예비행 시도로 인한 손상을 보장하지 않습니다.
		#autoLOC_501208 = Stratolauncher
