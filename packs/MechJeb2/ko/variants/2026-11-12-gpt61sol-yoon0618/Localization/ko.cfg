		#MechJeb_InstallCheckA_msg = MechJeb2가 잘못 설치되어 정상적으로 작동할 수 없습니다.\n모든 MechJeb2 파일은 KSP 내에서 다음과 같이 배치해야 합니다.\n<KSP>\n\tGameData\n\t\tMechJeb2\n\t\t\tParts\n\t\t\tPlugins\n\nMechJeb2 폴더 안의 파일을 다른 위치로 옮기지 마십시오.\n\n잘못된 경로:\n
