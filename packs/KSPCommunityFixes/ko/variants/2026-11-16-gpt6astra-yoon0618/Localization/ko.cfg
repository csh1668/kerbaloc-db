		#KSPCF_Agents_clampOTronDescription = 처음에는 스스로도 인정할 만큼 따분한 자석 회사였던 Clamp-O-Tron은 한 엔지니어가 자사 자석으로 "물건을 서로 붙이는 겁니다... 무려 우주에서!"라고 제안한 뒤 항공우주 산업에 진출했습니다. 유명한 Clamp-O-Tron 도킹 포트는 C7 Aerospace Division 같은 유명 대기업들과 수많은 협업을 거쳐, 여러분의 우주 개발 계획은 물론 그 너머까지 물건을 단단히 결합하는 즐거움을 전하고 있습니다. Clamp-O-Tron 관계자들은 대중에게 "제발 길가에 저희 제품을 버려두지 마십시오"라는 당부도 잊지 않습니다. 세계적으로 유명한 자사 도킹 포트를 구매하고 싶다면 대신 온라인 카탈로그를 살펴보시기 바랍니다.
		#KSPCF_Agents_clampOTronTitle = Clamp-O-Tron
		#KSPCF_Agents_freeFallDescription = 인생에서 자유 낙하 중이든, 고장 난 로켓에서 떨어져 자유 낙하 중이든, FreeFall Parachutes가 여러분을 든든하게 받쳐 드립니다. 물론 비유적인 의미입니다. 커빈에서 즐기는 스카이다이빙부터 먼 천체에 탐사선을 착륙시키는 일까지, 이 회사의 낙하산은 이제 막 시작하는 우주 개발 계획에서 가장 먼저 찾는 제품입니다. 낙하산에 100% 재활용 소재만 사용하겠다는 고집에도 불구하고, 이 회사 제품을 쓰는 편이 지면에 부딪혀 제동하는 것보다는 낫다는 것이 중론입니다. 이 회사는 모든 제품에 적용되는 후한 환불 정책을 자랑합니다. 비행 중 펼쳐지지 않은 낙하산은 착륙 후 반품하면 구매 금액의 일부를 환불받을 수 있습니다! 어째서인지 이 정책은 KSC 우주비행사들에게 놀라울 만큼 인기가 없습니다. FreeFall 경영진은 아직도 그 이유를 찾고 있습니다.
		#KSPCF_Agents_freeFallTitle = FreeFall Parachutes
		#KSPCF_Agents_lightYearDescription = "둥근 바퀴" 시장에서 Kerbal Motion LLC의 주요 경쟁사인 LightYear Tire Company는 Piston Cup 기준을 충족하는 고무 타이어를 우주센터에 공급합니다. 그것도 도매가로 말입니다. KSC의 포장도로에서 고무 타는 달콤하고도 달콤한 냄새를 맡아 보셨다면, LightYear 타이어에서 나는 냄새였을 가능성이 큽니다. 제품군에는 다양한 크기의 우주용 착륙 바퀴가 있으며, 홍보 책자에 따르면 충격 흡수 장치와 탐조등도 추가 비용 없이 제공됩니다. LightYear는 현재 자사를 거듭 인수하려는 거대 기업 C7 Aerospace와 힘겨루기를 벌이고 있습니다. LightYear는 항공우주 업계의 거인에게 흡수되지 않고 남아 있는 몇 안 되는 독립 제조업체 중 하나입니다.
		#KSPCF_Agents_stratusCorpDescription = 원래 Jebediah Kerman's Junkyard and Spacecraft Parts Co.의 일부였던 Stratus Corporation은 항공우주 업계에서 더 큰 목표를 추구하고자 최근에야 둥지를 떠났습니다. 시장에서 가장 큰 연료 공급업체는 아니지만, Stratus는 단일추진제를 실험하는 몇 안 되는 제조업체로 확고히 자리 잡으며 명성을 얻었습니다. 이 연료에 관심을 보이는 업체가 거의 없는 덕분에 사실상 시장을 독점했습니다. 어쨌든 현재는 KSC와 수익성 좋은 계약을 맺고 우리 우주비행사들의 EVA 팩과 사령선에 쓰이는 단일추진제를 전량 공급하고 있습니다. 대표 제품군인 'Stratus-V' 탱크 시리즈는 지난해 열린 제3회 연례 Fuel Tanks & Swimming Pools Expo에서 여러 상을 수상했습니다.
		#KSPCF_AltimeterHorizontalPosition_SettingsTitle = 고도계 위치(왼쪽<->오른쪽)
