		#KSPCF_KSPCFFastLoader_SettingsTooltip = KSP를 실행할 때마다 PNG 텍스처를 변환하는 대신 디스크에 캐시합니다.\n로딩 시간이 단축되지만 디스크 공간 사용량이 늘어납니다.\n<i>변경 사항은 KSP를 다시 실행하면 적용됩니다.</i>
		#KSPCF_KSPCommunityFixes_KSPCF_Title = KSP Community Fixes
		#KSPCF_LowerMinPhysicsDTPerFrame_SettingsTooltip = CPU 성능이 병목인 상황에서 게임이 지연을 처리하는 방식을 설정합니다.\n주로 부품 수가 많은 비행체에 영향을 줍니다.\n\n값이 낮을 때:\nFPS가 높아지고 화면이 부드러워지지만, 게임 시간이 실제 시간보다 느리게 흐를 수 있습니다.\n\n값이 높을 때:\nFPS가 낮아지고 화면이 더 끊기지만, 게임 시간이 실제 시간에 더 가깝게 흐릅니다.
