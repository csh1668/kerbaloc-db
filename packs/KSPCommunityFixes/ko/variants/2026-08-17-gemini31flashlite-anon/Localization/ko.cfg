		#KSPCF_DisableManeuverTool_SettingsTooltip = 기본 기동 도구는 심각한 렉과 끊김 현상을 유발할 수 있으며,\n특히 Kopernicus로 수정된 시스템에서 더욱 그렇습니다.\n이 옵션을 사용하여 완전히 비활성화할 수 있습니다.
		#KSPCF_KSPCFFastLoader_F_PopupL2 = 현재 설치 환경에서 향후 로딩 시간을 약 <b><color=#FF8000><<1>>초</color></b> 단축할 수 있습니다.
