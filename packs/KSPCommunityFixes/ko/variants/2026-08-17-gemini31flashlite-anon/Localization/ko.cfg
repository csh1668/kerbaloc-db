		#KSPCF_KSPCFFastLoader_SettingsTitle = 텍스처 캐싱 최적화
		#KSPCF_KSPCFFastLoader_SettingsTooltip = PNG 텍스처를 매번 KSP를 실행할 때마다 변환하지 않고 디스크에 캐시합니다.\n로딩 시간은 단축되지만 디스크 공간 사용량은 증가합니다.\n<i>변경 사항은 KSP를 재시작한 후에 적용됩니다.</i>
		#KSPCF_KSPCommunityFixes_KSPCF_Title = KSP Community Fixes
		#KSPCF_LowerMinPhysicsDTPerFrame_SettingsTooltip = CPU 부하가 큰 상황에서 게임이 렉을 처리하는 방식입니다.\n주로 부품 수가 많은 우주선에서 관련이 있습니다.\n\n낮은 값 :\nFPS가 높고 부드러워지지만, 게임 시간이 실제 시간보다 느리게 흐를 수 있습니다.\n\n높은 값 :\nFPS가 낮고 끊기지만, 게임 시간이 실제 시간과 비슷하게 흐릅니다.
