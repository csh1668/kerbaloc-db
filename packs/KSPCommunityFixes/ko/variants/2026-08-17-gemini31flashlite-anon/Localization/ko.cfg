		#KSPCF_Agents_clampOTronDescription = 본래는 지루한 자석 회사였던 Clamp-O-Tron은 한 엔지니어가 "물건을 서로 붙이는 데... 우주에서!" 자석을 사용하자고 제안한 후 항공우주 산업으로 확장했습니다. 유명한 Clamp-O-Tron 도킹 포트는 C7 Aerospace Division과 같은 유명 대기업들과 수많은 협업을 진행하여, 여러분의 우주 프로그램과 그 너머까지 물건을 서로 고정하는 즐거움을 선사하고 있습니다. Clamp-O-Tron의 대표들은 일반 대중에게 "제발 우리 제품을 길가에 버리지 마십시오"라고 당부하며, 세계적으로 유명한 도킹 포트를 구매하고 싶다면 온라인 카탈로그를 확인해 달라고 전했습니다.
		#KSPCF_Agents_clampOTronTitle = Clamp-O-Tron
		#KSPCF_Agents_freeFallDescription = 인생(혹은 오작동하는 로켓)에서 자유 낙하하는 상황에 처했을 때, FreeFall Parachutes가 여러분을 지켜드립니다. 비유적인 의미에서 말이죠. 커빈에서의 스카이다이빙부터 먼 행성에 탐사선을 착륙시키는 것까지, 이들의 낙하산은 모든 신생 우주 프로그램을 위한 최고의 선택입니다. 낙하산 제작에 100% 재활용 소재를 고집함에도 불구하고, 이 브랜드를 사용하는 것은 일반적으로 암석 제동(lithobraking)보다 나은 선택으로 인정받고 있습니다. 이들은 모든 제품에 대해 관대한 정책을 자랑합니다. 비행 중 펼쳐지지 않은 낙하산은 착륙 후 반납하면 부분 환불이 가능합니다! 어떤 이유에서인지 이 정책은 KSC 우주비행사들에게 놀라울 정도로 인기가 없습니다. FreeFall 경영진은 그 이유를 아직 파악 중입니다.
		#KSPCF_Agents_freeFallTitle = FreeFall Parachutes
		#KSPCF_Agents_lightYearDescription = "둥근 바퀴" 시장에서 Kerbal Motion LLC의 주요 경쟁사인 LightYear Tire Company는 Piston Cup 등급의 고무 타이어를 우주 센터에 도매가로 공급합니다. KSC 활주로에서 타는 고무의 달콤한 냄새를 맡아본 적이 있다면, 그 냄새는 LightYear 타이어에서 났을 가능성이 큽니다. 이들의 제품군에는 다양한 크기의 우주 등급 착륙 장치가 포함되어 있으며, 브로셔에 따르면 충격 흡수 장치와 스포트라이트가 추가 비용 없이 제공됩니다. LightYear는 현재 C7 Aerospace가 회사를 인수하려는 반복적인 시도와 맞서 싸우고 있습니다. LightYear는 항공우주 업계의 거물에게 흡수되지 않고 남은 몇 안 되는 독립 제조사 중 하나입니다.
		#KSPCF_Agents_stratusCorpDescription = 본래 Jebediah Kerman's Junkyard and Spacecraft Parts Co.의 일부였던 Stratus Corporation은 최근에야 항공우주 분야에서 더 큰 목표를 추구하기 위해 독립했습니다. 시장에서 가장 큰 연료 공급업체는 아니지만, Stratus는 모노프로펠런트(Monopropellant)를 실험하는 몇 안 되는 제조사 중 하나로 입지를 굳히며 명성을 얻었습니다. 이 연료 유형에 대한 관심이 부족한 상황을 이용해 사실상 시장을 독점하고 있습니다. 어쨌든 현재 KSC와 수익성 높은 계약을 맺고 우주비행사의 선외 활동(EVA) 팩과 사령선 포드에 필요한 모든 모노프로펠런트를 공급하고 있습니다. 이들의 주력 제품인 'Stratus-V' 탱크 시리즈는 작년에 열린 제3회 연례 연료 탱크 및 수영장 엑스포에서 여러 상을 받았습니다.
		#KSPCF_AltimeterHorizontalPosition_SettingsTitle = 고도계 위치 (좌<->우)
