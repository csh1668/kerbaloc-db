		#KSPCF_LowerMinPhysicsDTPerFrame_SettingsTooltip = CPU 부하가 큰 상황에서 게임이 렉을 처리하는 방식을 설정합니다.\n주로 파트 수가 많은 기체에서 영향이 있습니다.\n\n낮은 값:\nFPS가 높고 부드러워지지만, 게임 시간이 실제 시간보다 느리게 흐를 수 있습니다.\n\n높은 값:\nFPS가 낮고 끊기지만, 게임 시간이 실제 시간에 더 가깝게 흐릅니다.
