	{
		#KSPCF_Agents_clampOTronDescription = 원래는 솔직히 지루한 자석 회사였던 Clamp-O-Tron은 한 엔지니어가 자석으로 "물건을 서로 붙이자... 그런데 우주에서!"라고 제안한 뒤 항공우주 산업에 뛰어들었습니다. 명성 높은 Clamp-O-Tron Docking Port는 C7 Aerospace Division 등 유명 대기업과 수많은 협업을 거쳐, 무언가를 서로 붙이는 즐거움을 여러분의 우주 프로그램과 그 너머로 전하고 있습니다. 또한 Clamp-O-Tron 측은 일반 대중에게 "제발 저희 제품을 길가에 버리지 말아 주십시오"라고 당부하며, 세계적으로 유명한 도킹 포트를 구매하고 싶다면 온라인 카탈로그를 이용해 달라고 전합니다.
		#KSPCF_Agents_clampOTronTitle = Clamp-O-Tron
		#KSPCF_Agents_freeFallDescription = 인생에서 자유낙하 중일 때(또는 고장 난 로켓에서 떨어질 때), FreeFall Parachutes가 여러분을 감싸 드립니다. 비유적으로 말하자면 그렇습니다. 커빈에서의 스카이다이빙부터 머나먼 세계에 탐사선을 착륙시키는 일까지, 이들의 낙하산은 신생 우주 프로그램이라면 누구나 찾는 선택지입니다. 낙하산에 100% 재활용 소재만 쓰겠다는 고집에도 불구하고, 이 브랜드를 쓰는 편이 리소브레이킹보다는 낫다는 것이 일반적인 평가입니다. 이들은 모든 제품에 관대한 정책을 내세웁니다. 비행 중 펼쳐지지 않은 낙하산은 착륙 후 반품하면 일부 환불을 받을 수 있습니다! 어째서인지 이 정책은 커벌 우주센터 우주비행사들 사이에서 의외로 인기가 없습니다. FreeFall 경영진은 아직도 그 이유를 알아내는 중입니다.
		#KSPCF_Agents_freeFallTitle = FreeFall Parachutes
		#KSPCF_Agents_lightYearDescription = "둥근 바퀴" 시장에서 Kerbal Motion LLC의 최대 경쟁사인 LightYear Tire Company는 Piston Cup 인증 고무 타이어를 우주센터에 공급하며, 그것도 도매가로 제공합니다. 커벌 우주센터 활주로에서 타이어 타는 달콤한 냄새를 맡아 본 적이 있다면, 그건 LightYear 타이어였을 가능성이 높습니다. 이들의 제품군에는 다양한 크기의 우주용 착륙 바퀴가 있으며, 브로셔에 따르면 완충 장치와 스포트라이트가 추가 비용 없이 포함됩니다. LightYear는 현재 C7 Aerospace와 대립 중인데, 이 대기업이 회사를 인수하려고 거듭 시도하고 있기 때문입니다. LightYear는 항공우주 업계의 거인에게 흡수되지 않고 남은 몇 안 되는 독립 제조사 중 하나입니다.
		#KSPCF_Agents_stratusCorpDescription = 원래 Jebediah Kerman's Junkyard와 Spacecraft Parts Co.의 일부였던 Stratus Corporation은 최근에야 둥지를 떠나 항공우주 업계에서 더 큰 목표를 추구하기 시작했습니다. 시장 최대의 연료 공급업체는 아니지만, Stratus는 단일추진제를 실험하는 몇 안 되는 제조사 중 하나로 자리매김하며 명성을 쌓았습니다. 이 연료에 대한 관심이 워낙 없다 보니 사실상 시장을 독점하게 되었습니다. 어쨌든 현재 이들은 커벌 우주센터와 수익성 높은 계약을 맺고 우리 우주비행사들의 EVA 팩과 사령선에 들어가는 단일추진제 연료를 전량 공급하고 있습니다. 이들의 대표 제품군인 'Stratus-V' 시리즈 탱크는 작년에 열린 제3회 연료 탱크 & 수영장 박람회에서 여러 상을 휩쓸었습니다.
