		#KSPCF_Agents_clampOTronDescription = 원래는 스스로도 인정할 만큼 따분한 자석 회사였던 Clamp-O-Tron은 한 엔지니어가 자사 자석으로 "물건을 서로 붙여 보자... 우주에서!"라고 제안한 뒤 항공우주 산업에 진출했습니다. 유명한 Clamp-O-Tron 도킹 포트는 C7 Aerospace Division을 비롯한 여러 유명 대기업과의 협업을 거쳤으며, 여러분의 우주 개발 계획은 물론 그 너머까지 물건을 맞붙이는 즐거움을 전하고자 합니다. Clamp-O-Tron 관계자들은 일반 대중에게 "제발 저희 제품을 길가에 버려두지 마십시오"라고 다시 한번 당부하며, 세계적으로 유명한 자사 도킹 포트를 구매하고 싶다면 대신 온라인 카탈로그를 살펴보시기를 권합니다.
		#KSPCF_Agents_clampOTronTitle = Clamp-O-Tron
		#KSPCF_Agents_freeFallDescription = 인생에서 끝없이 추락하는 기분이 들 때도, 고장 난 로켓에서 실제로 추락할 때도 FreeFall Parachutes가 여러분을 감싸 드립니다. 물론 비유적인 표현입니다. 커빈에서 즐기는 스카이다이빙부터 머나먼 천체에 탐사선을 착륙시키는 일까지, 이 회사의 낙하산은 이제 막 시작하는 우주 개발 계획의 단골 선택지입니다. 낙하산에 100% 재생 소재만 사용하겠다고 고집하지만, 이 브랜드의 제품을 쓰는 편이 지면에 충돌해 제동하는 것보다는 낫다는 것이 일반적인 평가입니다. 회사는 모든 제품에 적용되는 관대한 정책을 자랑합니다. 비행 중 펼쳐지지 않은 낙하산은 착륙 후 반품하면 구매 금액의 일부를 환불받을 수 있습니다! 어찌 된 일인지 이 정책은 KSC 우주비행사들에게 놀라울 정도로 인기가 없습니다. FreeFall 경영진은 아직도 그 이유를 알아내고 있습니다.
		#KSPCF_Agents_freeFallTitle = FreeFall Parachutes
		#KSPCF_Agents_lightYearDescription = "둥근 바퀴" 시장에서 Kerbal Motion LLC의 주요 경쟁사인 LightYear Tire Company는 Piston Cup 규격의 고무 타이어를 우주센터에 공급하며, 심지어 도매가로 제공합니다. KSC 활주로에서 고무 타는 달콤하고도 달콤한 냄새를 맡아 보셨다면, LightYear 타이어에서 난 냄새였을 가능성이 큽니다. 제품군에는 다양한 크기의 우주용 착륙 바퀴가 있으며, 홍보 책자에 따르면 충격 흡수 장치와 조명도 추가 비용 없이 포함됩니다. 현재 LightYear는 자사를 거듭 인수하려는 대기업 C7 Aerospace와 힘겨루기를 벌이고 있습니다. LightYear는 항공우주 업계의 거인에게 흡수되지 않고 남아 있는 몇 안 되는 독립 제조업체 중 하나입니다.
		#KSPCF_Agents_stratusCorpDescription = 원래 Jebediah Kerman's Junkyard and Spacecraft Parts Co.의 일부였던 Stratus Corporation은 최근에야 둥지를 떠나 항공우주 업계에서 더 큰 목표를 추구하기 시작했습니다. 시장에서 가장 큰 연료 공급업체는 아니지만, Stratus는 단일추진제를 실험하는 몇 안 되는 제조업체 중 하나로 자리매김하며 명성을 얻었습니다. 이 연료에 대한 관심이 워낙 저조한 덕분에 사실상 시장을 독점했습니다. 어쨌든 현재는 KSC와 수익성 좋은 계약을 맺고 우주비행사들의 EVA 팩과 사령선 포드에 필요한 단일추진제 전량을 공급하고 있습니다. 주력 제품군인 'Stratus-V' 탱크 시리즈는 지난해 열린 제3회 연례 Fuel Tanks & Swimming Pools Expo에서 여러 상을 받았습니다.
		#KSPCF_AltimeterHorizontalPosition_SettingsTitle = 고도계 위치(왼쪽<->오른쪽)
