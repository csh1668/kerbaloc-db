		#LOC_OPLX_SciDef_mysteryGoo_TektoSrfLandedStraight = 구가 근처의 생물을 거의 동시에 알아챕니다. 창을 들고 일종의 가면을 쓴 그 생물은 기체에 다가와 호기심 어린 듯 무기로 구를 쿡 찌르고, 구는 공황에 빠집니다. 생물은 재빨리 물러갑니다.
		#LOC_OPLX_SciDef_surfaceSample_SlateSrfLandedTreeSamples = 석화된 나무가 자신을 붙잡을 것 같다는 본능을 무릅쓰고 샘플을 채취합니다. 확실히 규화목과 비슷한 무언가이지만, 내부 구조는 전혀 다릅니다. 이 생물은 죽기 훨씬 전부터 암석을 자기 몸의 일부로 받아들였던 것으로 보입니다.
		#LOC_OPLX_SciDef_surfaceSample_TektoSrfLandedGrass = '풀' 몇 가닥을 잘라 냅니다. 초록색이긴 하지만, Tekto의 다른 모든 것처럼 이는 우연일 뿐입니다. 이 생물들은 바람에서 유기물을 포집해 연료로 사용합니다. Tekto의 식물은 태양보다는 바람에 크게 의존합니다.
		#LOC_OPLX_SciDef_surfaceSample_TektoSrfLandedIslands = 이곳의 '식물'- 연구실 친구들이 꼭 '텍토조아'라고 불러 달라고 고집하는 그것- 을 채취해 보니 본토의 생물과 분명한 차이가 있습니다. 이 생태계들은 수백만 년 동안 본토와 단절된 채로 지내 온 것으로 보입니다.
		#LOC_OPLX_SciDef_surfaceSample_TektoSrfLandedMushwoods = 거대한 나무 하나에서 샘플을 잘라 냅니다. 연구실 친구들은 잠정적으로 이것을 '머시우드'라고 부르고 있습니다. Tekto의 다른 '식물'처럼 초록색인 것은 우연일 뿐인 듯합니다. 이들은 주름진 갓과 길게 늘어진 잎으로 대기 중의 유기 분자를 모아 에너지로 사용합니다. 갓은 부드럽지만 형태를 유지하며, 연골과 비슷합니다.
		#LOC_OPLX_SciDef_surfaceSample_TektoSrfLandedPolarRifts = 극지의 생물은 극지의 희미한 빛에 영향을 받지 않은 것 같습니다. 오히려 이곳의 기류가 더 큰 영향을 미치는데, 저위도 지역보다 상당히 잔잔합니다. 그래서 하늘 깃털은 바람에 실려 오는 먹이를 충분히 붙잡기 위해 엄청나게 높이 자라야 했습니다.
		#LOC_OPLX_SciDef_surfaceSample_TektoSrfLandedSkyFeathers = 키 크고 가느다란 가닥 하나를 얇게 깎아 냅니다. 이것들을 '하늘 깃털'이라고 부르기로 했습니다. 이렇게 높이 뻗을 수 있는 것은 끝부분이 날개 모양이기 때문인데, 이 부분이 바람을 받아 공기 중의 유기 분자를 모아 먹이로 삼습니다.
		#LOC_OPLX_SciDef_surfaceSample_TektoSrfLandedWindLilies = 주황색 꽃처럼 생긴 생물의 촉수 하나를 채취합니다. 이것들은 '바람 백합'이라고 불립니다. 커빈의 바다나리와 비슷하게, 공기 중의 유기물을 포집해 중앙의 덩굴손으로 부드럽게 옮기고, 덩굴손이 이를 흡수해 소화합니다.
	}
}
