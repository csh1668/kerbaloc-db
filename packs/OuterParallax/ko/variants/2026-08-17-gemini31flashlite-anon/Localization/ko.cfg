		#LOC_OPLX_SciDef_mysteryGoo_TektoSrfLandedSomething = Goo가 공기 중에서 유기 분자를 채취하는 것으로 보입니다.
		#LOC_OPLX_SciDef_mysteryGoo_TektoSrfLandedStraight = Goo가 당신과 거의 동시에 근처의 생명체를 발견합니다. 창을 들고 어떤 가면을 쓴 그 생명체는 우주선으로 다가와 호기심 어린 눈으로 무기로 Goo를 쿡 찌르더니, Goo가 당황하자 재빨리 물러납니다.
		#LOC_OPLX_SciDef_surfaceSample_SlateSrfLandedTreeSamples = 본능적으로는 무언가 당신을 낚아챌 것 같지만, 석화된 나무 중 하나를 샘플로 채취합니다. 확실히 석화된 나무와 비슷하지만 내부 구조는 완전히 다릅니다. 이 유기체는 죽기 훨씬 전부터 생물학적 구조에 암석을 통합했던 것으로 보입니다.
		#LOC_OPLX_SciDef_surfaceSample_TektoSrfLandedGrass = 몇 가닥의 '풀'을 잘라냈습니다. 녹색을 띠고 있지만, Tekto의 다른 모든 것과 마찬가지로 이는 우연일 뿐입니다. 이 유기체들은 바람에서 유기물을 포획하여 연료로 사용합니다. Tekto의 식물들은 태양보다는 바람에 크게 의존합니다.
		#LOC_OPLX_SciDef_surfaceSample_TektoSrfLandedIslands = 이곳의 '식물' 생명체, 혹은 연구소 친구들이 'Tektozoa'라고 부르라고 고집하는 것을 샘플링해 본 결과, 본토의 생명체와는 뚜렷한 차이가 있음을 알 수 있습니다. 이 생태계들은 수백만 년 동안 본토와 단절된 채로 유지된 것으로 보입니다.
		#LOC_OPLX_SciDef_surfaceSample_TektoSrfLandedMushwoods = 거대한 나무 중 하나에서 샘플을 잘라냈습니다. 연구소 사람들은 잠정적으로 이것들을 '머쉬우드(mushwoods)'라고 부르고 있습니다. Tekto의 다른 '식물'들과 마찬가지로 이것들이 녹색인 것은 우연일 뿐인 것 같습니다. 이들은 융기된 갓과 길게 늘어진 잎을 사용하여 대기 중의 유기 분자를 모아 에너지로 사용합니다. 갓은 부드럽지만 연골처럼 형태를 유지합니다.
		#LOC_OPLX_SciDef_surfaceSample_TektoSrfLandedPolarRifts = 극지의 생명체들은 극지방의 희미한 빛에 영향을 받지 않은 것으로 보입니다. 그보다 더 큰 영향을 주는 것은 이곳의 기류인데, 저위도 지역보다 훨씬 온화합니다. 하늘 깃털들은 바람을 타고 충분한 먹이를 얻기 위해 매우 높게 자라야 했습니다.
		#LOC_OPLX_SciDef_surfaceSample_TektoSrfLandedSkyFeathers = 길고 가느다란 가닥 중 하나를 깎아냈습니다. 당신은 이것들을 하늘 깃털이라 부르기로 했습니다. 이것들이 높이 솟아 있는 이유는 날개 모양의 끝부분 때문인데, 이 부분이 바람을 잡아 공기 중의 유기 분자를 모아 영양분을 섭취합니다.
		#LOC_OPLX_SciDef_surfaceSample_TektoSrfLandedWindLilies = 주황색 꽃 모양 유기체의 촉수 중 하나를 샘플링했습니다. 그들은 이것을 바람 백합이라 부릅니다. 커빈의 바다 백합과 비슷하게, 공기 중의 유기물을 포획하여 중앙 촉수로 부드럽게 가져와 소화를 위해 흡수합니다.
	}
}
