		#LOC_OPLX_DMagSciDef_dmReconScan_TektoInSpaceLowNorthernHemisphere = Tekto의 표면은 두꺼운 대기로 인해 사진 촬영이 어렵지만, 초기 분석 결과 표면에 거대한 원형 지형이 다수 존재하는 것으로 나타났습니다. 이는 일종의 기이한 암석 지형일 가능성이 높지만, 어떤 과정으로 이러한 형태가 만들어졌는지는 현재 알 수 없습니다.
		#LOC_OPLX_DMagSciDef_dmXRayDiffract_SlateSrfLandedContinentsAll = 토양 분석 결과 이곳에 화석화된 식물 물질이 존재함이 확인되었습니다. 주변을 한 번 둘러보는 것만으로도 알 수 있었을 테지만 말입니다.
		#LOC_OPLX_DMagSciDef_dmXRayDiffract_SlateSrfLandedSeabedsAll = 이곳 표면을 스캔한 결과 석영 화합물, 염분 퇴적물, 고운 모래가 발견되었습니다. 이는 해저에서 발견될 법한 물질들입니다. 또한 유기 화합물과 작은 굴처럼 보이는 흔적 등 과거의 생물학적 활동 징후도 발견되었습니다.
		#LOC_OPLX_DMagSciDef_dmXRayDiffract_TektoSrfLanded = Tekto의 표면은 복잡한 유기 화합물과 에탄으로 가득 차 있습니다. 아마도 이 위성에서 자생하는 생명체의 주된 용매일 것입니다.
		#LOC_OPLX_DMagSciDef_dmbathymetryscan_TektoSrfSplashedDeep = Tekto 호수의 가장 깊은 곳은 생명체로 들끓고 있습니다. 수많은 유기 화합물을 이용하는 다양한 생물들과 그들을 잡아먹는 생물들이 살아가고 있습니다.
		#LOC_OPLX_DMagSciDef_dmbathymetryscan_TektoSrfSplashedShallow = Tekto의 에탄 호수는 생명으로 가득합니다. 비교적 밀도가 높은 액체임에도 불구하고 거대한 생물들이 그 속을 헤엄쳐 다닙니다. 비록 아주 느릿느릿하지만 말입니다. 풍부한 유기 분자 덕분에 이들은 상당히 크게 자랄 수 있습니다.
		#LOC_OPLX_DMagSciDef_dmbiodrillscan_SlateSrfLandedContinentsAll = 샘플에는 커빈의 생물학적 활동과 흔히 연관되는 유기 화합물이 포함되어 있습니다. 이는 엄청난 발견이며 Slate에 과거 생명체가 존재했을지도 모른다는 강력한 암시이지만, 근처의 석화된 나무들이 훨씬 더 강력한 증거입니다.
		#LOC_OPLX_DMagSciDef_dmbiodrillscan_SlateSrfLandedSeabedsAll = 이 샘플에는 복잡한 유기 화합물과 해양 생물의 탄산칼슘 껍데기와 관련된 무기 화합물이 포함되어 있습니다.
		#LOC_OPLX_DMagSciDef_dmbiodrillscan_TektoSrfLandedGrass = 드릴로 외계 '풀' 줄기를 샘플링했습니다. 녹색을 띠고는 있지만, 분석 결과와 상식에 비추어 볼 때 이는 엽록소 때문이 아니라 자연적인 색소 침착 때문인 것으로 보입니다. 이 생물들, 즉 Tekto의 모든 '식물'은 공기 중에서 유기물을 수집하여 에너지원으로 사용하는 것으로 보입니다.
		#LOC_OPLX_DMagSciDef_dmbiodrillscan_TektoSrfLandedIslands = Tekto 섬의 생명체는 본토보다 훨씬 작지만 개체 수는 더 많은 것으로 보입니다. 이 토양 샘플로 판단하건대, 이곳은 지면에 뿌리를 내리기가 더 어려워 수직으로 자라는 것보다 수평으로 퍼지는 것이 생존에 더 유리하기 때문일 수 있습니다.
		#LOC_OPLX_DMagSciDef_dmbiodrillscan_TektoSrfLandedLakes = Tekto의 호수는 액체 에탄으로 젖어 있으며, 이는 이 위성의 생명체가 사용하는 주된 용매인 것으로 보입니다. Karter 박사가 내기에서 진 모양이군요!
		#LOC_OPLX_DMagSciDef_dmbiodrillscan_TektoSrfLandedNatives = 샘플 드릴이 작동하는 동안 작은 생물 무리가 이상한 가면을 쓰고 도구와 무기로 보이는 것을 들고 우주선으로 접근했습니다. 그들은 우주선을 조심스럽게 몇 번 찔러보다가 드릴이 움직이자 겁을 먹고 도망쳤습니다. 지적 생명체라니... 일이 복잡해질지도 모르겠습니다.
		#LOC_OPLX_DMagSciDef_dmbiodrillscan_TektoSrfLandedPolarRifts = 이곳의 토양은 Tekto의 다른 지역보다 영양분이 다소 부족하지만, 이는 온도보다는 기류와 더 관련이 있을 것입니다. 그럼에도 불구하고 생명체는 어떻게든 살아남습니다. 이곳의 거대한 하늘 깃털 종은 아마도 엄청난 높이를 이용해 바람으로부터 더 많은 영양분을 섭취하는 것 같습니다.
