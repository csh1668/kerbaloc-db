		#LOC_FFT_fft-antimatter-beam-1_description = 게임 후반부용 토치 드라이브인 Frisbee는 다량의 물질과 반물질을 반응시킵니다. 그 결과 생성되는 수 킬로미터 길이의 반응 생성물 빔은 뛰어난 충격량과 적절한 추력을 제공합니다. 불행히도, 방대한 양의 고에너지 감마선으로 인해 엔진이 크고 다루기 힘들며 과열되기 쉽습니다. 다행히도 통합된 방열판 트러스는 별도의 방열판 부품을 추가하지 않고도 상당한 양의 열을 방출하도록 확장할 수 있습니다. 110m 길이로 완전히 펼치면 엔진을 냉각하기 위해 추가적인 방열판이 필요하지 않습니다.
