		#autoLOC_SCANsat_settingsHelpGreyScale = 흑백 SCANsat 지도에 순수한 회색조 색상 스펙트럼을 사용합니다.\n고도 지도의 픽셀 색상은 검은색과 흰색 사이에서 보간됩니다.\n각 천체의 최소 및 최대 지형 높이가 양 끝값을 결정합니다.
		#autoLOC_SCANsat_settingsHelpGroundTracks = 지도 모드에서 스캔 활동을\n시각적 표시기로 나타냅니다.
		#autoLOC_SCANsat_settingsHelpGroundTracksActive = 지상 궤적 표시기를 현재 조종 중인\n우주선에만 표시하도록 제한할 수 있습니다.
		#autoLOC_SCANsat_settingsHelpLegendTooltips = 지도 범례에 툴팁을 표시합니다.\n비활성화하면 생태권 지도 범례도 비활성화됩니다.
		#autoLOC_SCANsat_settingsHelpMapGenSpeed = 모든 SCANsat 지도의 생성 속도를 조정합니다.\n값을 낮추면 CPU 자원을 절약하고 지도 생성이\n성능에 미치는 영향을 줄일 수 있습니다.
		#autoLOC_SCANsat_settingsHelpMechJeb = SCANsat 확대 지도와 대형 지도의 경유지 선택 모드를\n사용하여 MechJeb 착륙 지점을 선택할 수 있습니다.
		#autoLOC_SCANsat_settingsHelpMechJebLoad = 저장된 MechJeb 착륙 목표물을 불러옵니다.\n비행 화면에서 MechJeb을 사용할 수 있는 우주선에만 작동합니다.
		#autoLOC_SCANsat_settingsHelpOverlayHideZero = 현재 천체에 존재하지 않는 자원을 UI에서 숨깁니다.\n이 설정을 끄면 기본 스캔 임계값에 도달한 후에 해당 자원이 숨겨집니다.
		#autoLOC_SCANsat_settingsHelpOverlayTooltips = 행성 오버레이 지도가 활성화되면 현재 마우스 위치에 툴팁을 표시합니다.\n스캔 범위에 따라 커서 좌표, 지형 높이, 경사도, 생태권 이름,\n자원 함량이 툴팁에 표시됩니다.
		#autoLOC_SCANsat_settingsHelpResetAllData = 모든 천체에서 선택한 SCANsat 데이터를 초기화합니다.\n실행 전에 확인 창이 열립니다.\n되돌릴 수 없습니다.
		#autoLOC_SCANsat_settingsHelpResetPlanetData = 현재 천체에서 선택한 SCANsat 데이터를 초기화합니다.\n실행 전에 확인 창이 열립니다.\n되돌릴 수 없습니다.
		#autoLOC_SCANsat_settingsHelpResetWindows = 모든 창의 위치와 배율을 초기화합니다.\n창을 끌다가 화면 밖으로 완전히 벗어났거나\n창이 보이지 않을 때 사용하십시오.
		#autoLOC_SCANsat_settingsHelpScanningToggle = 모든 SCANsat 스캔을 켜거나 끕니다.
		#autoLOC_SCANsat_settingsHelpSetMapWidth = SCANsat 대형 지도 텍스처의 정확한 너비를 입력하십시오.\n너비는 550 - 8192 픽셀로 제한됩니다.\n설정 버튼을 눌러 값을 적용하십시오.
		#autoLOC_SCANsat_settingsHelpStockToolbar = 기본 도구 모음을 사용합니다.\nBlizzy78 Toolbar와 함께 사용할 수 있습니다.
		#autoLOC_SCANsat_settingsHelpStockUIStyle = 기본 KSP 스타일 UI 요소와 Unity 스타일 UI 요소 사이를 전환합니다.
		#autoLOC_SCANsat_settingsHelpTimeWarp = 시간 가속 중 스캔 빈도를 조정합니다.\n설정값을 높이면 지도의 빈틈이 줄어들지만\n높은 시간 가속 배율에서는 성능에 영향을 줄 수 있습니다.
		#autoLOC_SCANsat_settingsHelpToolbarMenu = 기본 도구 모음에 펼침 메뉴를 사용하여 사용 가능한 모든 창을 표시합니다.
		#autoLOC_SCANsat_settingsHelpVesselsSensorsPasses = 현재 작동 중인 SCANsat 센서에 관한 정보입니다.\n우주선은 작동 중인 센서가 있는 우주선의 수를 나타냅니다.\n센서는 센서의 총수를 나타내며,\n여러 유형의 센서를 갖춘 장비는 각 센서를 개별적으로 집계합니다.\n처리 횟수는 초당 수행되는 센서 갱신 횟수를 나타냅니다.\n이 값은 시간 가속 해상도 설정의 영향을 받습니다.
		#autoLOC_SCANsat_settingsHelpWindowScale = 모든 SCANsat 창의 배율을 조정합니다.
		#autoLOC_SCANsat_settingsHelpWindowTooltips = 일부 유형의 스캐너는 표면에\n햇빛이 비쳐야 합니다.
