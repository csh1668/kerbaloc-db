		#autoLOC_SCANsat_settingsHelpMechJeb = SCANsat 확대 지도와 큰 지도의 웨이포인트 선택 모드를\n사용하여 MechJeb 착륙 지점을 선택할 수 있습니다.
		#autoLOC_SCANsat_settingsHelpMechJebLoad = 저장된 MechJeb 착륙 목표를 불러옵니다.\n유효한 MechJeb 우주선이 있는 비행 장면에서만 작동합니다.
		#autoLOC_SCANsat_settingsHelpOverlayHideZero = 현재 천체에 자원이 없으면 UI에서 해당 자원을 숨깁니다.\n그렇지 않으면 기본 스캔 임계값에 도달한 후 자원이 숨겨집니다.
		#autoLOC_SCANsat_settingsHelpOverlayTooltips = 행성 오버레이 지도가 활성화되면 현재 마우스 위치에 대한 툴팁을 표시합니다.\n툴팁에는 스캔 범위에 따라 커서 좌표, 지형 높이, 경사, 생태권 이름,\n자원 매장량이 포함됩니다.
		#autoLOC_SCANsat_settingsHelpResetAllData = 모든 천체에 대해 선택한 SCANsat 데이터를 초기화합니다.\n실행 전에 확인 창이 열립니다.\n되돌릴 수 없습니다.
		#autoLOC_SCANsat_settingsHelpResetPlanetData = 현재 천체에 대해 선택한 SCANsat 데이터를 초기화합니다.\n실행 전에 확인 창이 열립니다.\n되돌릴 수 없습니다.
		#autoLOC_SCANsat_settingsHelpResetWindows = 모든 창의 위치와 크기를 초기화합니다.\n창이 화면 밖으로 완전히 끌려 나갔거나\n보이지 않는 창이 있을 때 사용하십시오.
		#autoLOC_SCANsat_settingsHelpScanningToggle = 모든 SCANsat 스캔을 켜거나 끕니다.
		#autoLOC_SCANsat_settingsHelpSetMapWidth = SCANsat 큰 지도 텍스처 너비의 정확한 값을 입력하십시오.\n값은 550 - 8192 픽셀 너비로 제한됩니다.\n설정 버튼을 눌러 값을 적용하십시오.
		#autoLOC_SCANsat_settingsHelpStockToolbar = 기본 툴바를 사용합니다.\nBlizzy78 Toolbar와 동시에 사용할 수 있습니다.
		#autoLOC_SCANsat_settingsHelpStockUIStyle = 기본 KSP 스타일 UI 요소와 Unity 스타일 요소 간에 전환합니다.
		#autoLOC_SCANsat_settingsHelpTimeWarp = 시간 가속 중 스캔 빈도를 조정합니다.\n설정값이 높을수록 지도의 빈틈이 줄어들지만\n높은 시간 가속에서 성능에 영향을 줄 수 있습니다.
		#autoLOC_SCANsat_settingsHelpToolbarMenu = 기본 툴바에서 팝아웃 메뉴를 사용하여 사용 가능한 모든 창을 표시합니다.
		#autoLOC_SCANsat_settingsHelpVesselsSensorsPasses = 현재 활성화된 SCANsat 센서에 대한 정보입니다.\n우주선은 센서가 활성화된 우주선의 수를 나타냅니다.\n센서는 전체 센서의 수를 나타냅니다.\n여러 센서 유형을 가진 장비는 개별 센서를 각각 따로 계산합니다.\n패스는 초당 수행되는 센서 업데이트 횟수를 나타냅니다.\n이 값은 시간 가속 해상도 설정의 영향을 받습니다.
		#autoLOC_SCANsat_settingsHelpWindowScale = 모든 SCANsat 창의 크기를 조절합니다.
		#autoLOC_SCANsat_settingsHelpWindowTooltips = 특정 스캐너 유형은 지표가\n낮 상태여야 합니다.
